    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        // Build the 20-cell tracks (each cell = 5%) synchronously
        for (let i = 1; i <= 4; i++) {
          ["#oe09-off" + i, "#oe09-on" + i].forEach((sel) => {
            const host = document.querySelector(sel);
            if (!host) return;
            let html = "";
            for (let c = 0; c < 20; c++) html += "<span></span>";
            host.innerHTML = html;
          });
        }

        const tl = gsap.timeline({ paused: true });
        const D = 13.269;
        const TRACK_W = 695;
        // right inset (px) that reveals n cells (cell 30px + 5px gap)
        const insetFor = (cells) => {
          const whole = Math.floor(cells);
          const frac = cells - whole;
          const w = whole * 35 + frac * 30 - (frac === 0 ? 5 : 0);
          return Math.max(0, TRACK_W - w);
        };
        const clipTo = (cells) => "inset(0px " + insetFor(cells).toFixed(1) + "px 0px 0px)";
        const EMPTY = "inset(0px " + TRACK_W + "px 0px 0px)";

        // Slow camera push under the whole shot
        tl.fromTo("#oe09-stage", { scale: 1 }, { scale: 1.025, duration: D, ease: "none", transformOrigin: "40% 45%" }, 0);

        // Scene 1 — kicker + empty tracks visible early; each bar fills on its cue
        tl.fromTo("#oe09-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.15);
        tl.fromTo(["#oe09-off1", "#oe09-off2", "#oe09-off3"], { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 }, 0.3);

        const BARS = [
          { n: 1, cells: 18, at: 1.7 },
          { n: 2, cells: 16, at: 3.4 },
          { n: 3, cells: 19, at: 4.6 },
        ];
        BARS.forEach(({ n, cells, at }) => {
          tl.fromTo("#oe09-l" + n, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at - 0.1);
          tl.fromTo("#oe09-on" + n, { clipPath: EMPTY }, { clipPath: clipTo(cells), duration: 0.8, ease: "power2.out" }, at);
          tl.fromTo("#oe09-v" + n, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, at + 0.55);
        });

        // Scene 2 — "Multiplicando": rule, formula types token by token, empty 4th bar
        tl.fromTo("#oe09-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 5.6);
        ["#oe09-k1", "#oe09-k2", "#oe09-k3", "#oe09-k4", "#oe09-k5"].forEach((el, i) => {
          tl.fromTo(el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 5.8 + i * 0.14);
        });
        tl.fromTo("#oe09-l4", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 5.95);
        tl.fromTo("#oe09-off4", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 6.05);
        tl.fromTo("#oe09-on4", { clipPath: EMPTY }, { clipPath: EMPTY, duration: 0.01 }, 0);
        tl.fromTo("#oe09-hatch", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 100% 0% 0%)", duration: 0.01 }, 0);
        tl.fromTo("#oe09-perdas", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        tl.fromTo("#oe09-fin", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

        // intermediate "= 0,72" flashes briefly
        tl.fromTo("#oe09-mid", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.2, ease: "power3.out" }, 6.6);
        tl.to("#oe09-mid", { opacity: 0.25, duration: 0.12, ease: "none" }, 7.0);
        tl.to("#oe09-mid", { opacity: 1, duration: 0.12, ease: "none" }, 7.15);
        tl.to("#oe09-mid", { opacity: 0, duration: 0.3, ease: "power2.in" }, 7.7);

        // Scene 3 — "68,4%": OEE bar fills, cobalt block lands, number counts with scale growth
        const COUNT_AT = 8.5;
        const COUNT_DUR = 1.3;
        const COUNT_EASE = "power3.out";
        tl.fromTo("#oe09-block", { opacity: 0, clipPath: "inset(0% 0% 100% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power3.out" }, COUNT_AT - 0.2);
        tl.fromTo("#oe09-fin", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, COUNT_AT);
        tl.fromTo("#oe09-on4", { clipPath: EMPTY }, { clipPath: clipTo(13.68), duration: COUNT_DUR, ease: COUNT_EASE, immediateRender: false }, COUNT_AT);

        const counter = document.getElementById("oe09-counter");
        const state = { v: 0 };
        tl.fromTo(state, { v: 0 }, {
          v: 68.4,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: () => { counter.textContent = (Math.round(state.v * 10) / 10).toFixed(1).replace(".", ","); },
        }, COUNT_AT);
        tl.fromTo("#oe09-counter", { scale: 0.5 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
        tl.fromTo("#oe09-suffix", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.7)" }, COUNT_AT + COUNT_DUR);
        tl.fromTo("#oe09-block-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, COUNT_AT + COUNT_DUR);

        // Scene 4 — "juntos revelam as perdas": hatch the remaining ~32%, label it, hold
        tl.fromTo("#oe09-hatch", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power2.out", immediateRender: false }, 11.8);
        tl.fromTo("#oe09-perdas", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 12.1);

        window.__timelines["09-oee-exemplo"] = tl;
