    <script>
      (function () {
        var GROUPS = [{"start": 0.15, "end": 2.176, "text": "Quando o seu programa chama uma função,"}, {"start": 2.176, "end": 3.685, "text": "onde ficam as variáveis dela?"}, {"start": 4.005, "end": 5.96, "text": "E quando a função chama ela mesma,"}, {"start": 5.96, "end": 7.963, "text": "cem vezes, como a memória dá conta?"}, {"start": 8.283, "end": 10.292, "text": "Quem responde é o ambiente de execução:"}, {"start": 10.292, "end": 12.686, "text": "como a memória é organizada enquanto o programa"}, {"start": 12.686, "end": 12.985, "text": "roda."}, {"start": 13.305, "end": 15.675, "text": "Bora entender, com desenhos de memória e macetes"}, {"start": 15.675, "end": 16.382, "text": "para a prova."}, {"start": 16.882, "end": 19.936, "text": "As análises léxica, sintática e semântica dependem"}, {"start": 19.936, "end": 21.148, "text": "da linguagem fonte."}, {"start": 21.468, "end": 24.178, "text": "Já a geração de código depende da máquina alvo."}, {"start": 24.178, "end": 25.367, "text": "E para gerar código,"}, {"start": 25.367, "end": 28.268, "text": "o compilador precisa saber como a memória vai estar"}, {"start": 28.268, "end": 28.886, "text": "organizada."}, {"start": 29.206, "end": 31.845, "text": "Quase toda linguagem usa um de três ambientes:"}, {"start": 31.845, "end": 34.005, "text": "totalmente estático, baseado em pilhas,"}, {"start": 34.005, "end": 35.301, "text": "ou totalmente dinâmico."}, {"start": 35.621, "end": 36.914, "text": "Também dá para misturar:"}, {"start": 36.914, "end": 38.296, "text": "são os ambientes híbridos."}, {"start": 38.616, "end": 40.574, "text": "Macete: estático, pilha, dinâmico."}, {"start": 40.574, "end": 42.833, "text": "Do mais simples para o mais flexível."}, {"start": 43.333, "end": 46.35, "text": "A memória de um computador típico tem duas partes:"}, {"start": 46.35, "end": 48.461, "text": "os registradores, rápidos, e a RAM,"}, {"start": 48.461, "end": 49.165, "text": "mais lenta."}, {"start": 49.485, "end": 51.648, "text": "A RAM se divide em área de código e"}, {"start": 51.648, "end": 52.513, "text": "área de dados."}, {"start": 52.833, "end": 54.963, "text": "O código é fixado antes da execução."}, {"start": 54.963, "end": 57.721, "text": "Então o endereço de entrada de cada procedimento"}, {"start": 57.721, "end": 59.415, "text": "já é conhecido na compilação."}, {"start": 59.735, "end": 62.577, "text": "Dados globais e estáticos também ganham endereços"}, {"start": 62.577, "end": 62.976, "text": "fixos."}, {"start": 63.296, "end": 65.39, "text": "Constantes pequenas, como zero e um,"}, {"start": 65.39, "end": 67.046, "text": "vão direto dentro do código."}, {"start": 67.046, "end": 69.92, "text": "Números grandes e textos ficam numa área estática."}, {"start": 70.42, "end": 72.385, "text": "Uma organização típica fica assim."}, {"start": 72.705, "end": 74.478, "text": "Em cima, a área de código."}, {"start": 74.478, "end": 76.627, "text": "Depois, a área global e estática."}, {"start": 76.947, "end": 77.857, "text": "Então vem a pilha,"}, {"start": 77.857, "end": 79.954, "text": "para dados que entram e saem em ordem LIFO:"}, {"start": 79.954, "end": 81.854, "text": "o último a entrar é o primeiro a sair."}, {"start": 82.174, "end": 83.451, "text": "E lá embaixo, o heap,"}, {"start": 83.451, "end": 85.627, "text": "para alocação dinâmica, sem ordem fixa."}, {"start": 85.947, "end": 88.027, "text": "Os dois crescem um em direção ao outro,"}, {"start": 88.027, "end": 89.327, "text": "dividindo o espaço livre."}, {"start": 89.647, "end": 91.764, "text": "Macete: pilha é uma pilha de pratos."}, {"start": 91.764, "end": 93.207, "text": "Heap é um estacionamento:"}, {"start": 93.207, "end": 94.891, "text": "cada carro sai quando quiser."}, {"start": 95.391, "end": 98.196, "text": "A peça mais importante é o registro de ativação."}, {"start": 98.516, "end": 100.717, "text": "É a memória de uma chamada de procedimento:"}, {"start": 100.717, "end": 102.156, "text": "criada quando ele é ativado."}, {"start": 102.476, "end": 104.369, "text": "No mínimo, ele tem quatro partes:"}, {"start": 104.369, "end": 106.687, "text": "os argumentos, as informações de controle,"}, {"start": 106.687, "end": 108.248, "text": "como o endereço de retorno,"}, {"start": 108.248, "end": 110.141, "text": "os dados locais e os temporários."}, {"start": 110.461, "end": 112.158, "text": "Macete: é a mochila da função."}, {"start": 112.158, "end": 113.259, "text": "Leva o que recebeu,"}, {"start": 113.259, "end": 114.36, "text": "o caminho de volta,"}, {"start": 114.36, "end": 116.011, "text": "as coisas dela e um rascunho."}, {"start": 116.331, "end": 118.189, "text": "E quando os registros ficam na pilha,"}, {"start": 118.189, "end": 119.8, "text": "eles se chamam quadros de pilha."}, {"start": 120.3, "end": 123.237, "text": "Alguns registradores ajudam a acompanhar a execução."}, {"start": 123.557, "end": 125.201, "text": "O pc, contador de programa,"}, {"start": 125.201, "end": 127.095, "text": "aponta para a próxima instrução."}, {"start": 127.415, "end": 128.934, "text": "O sp, ponteiro de pilha,"}, {"start": 128.934, "end": 130.706, "text": "aponta para o topo da pilha."}, {"start": 131.026, "end": 132.569, "text": "O fp, ponteiro de quadro,"}, {"start": 132.569, "end": 135.008, "text": "aponta para o registro de ativação atual."}, {"start": 135.328, "end": 137.174, "text": "E o ap, ponteiro de argumentos,"}, {"start": 137.174, "end": 139.165, "text": "aponta para a área dos argumentos."}, {"start": 139.665, "end": 141.215, "text": "Toda chamada segue um roteiro:"}, {"start": 141.215, "end": 142.464, "text": "a sequência de ativação."}, {"start": 142.784, "end": 144.98, "text": "Na ida: aloca o registro de ativação,"}, {"start": 144.98, "end": 146.786, "text": "calcula e guarda os argumentos,"}, {"start": 146.786, "end": 148.299, "text": "e ajusta os registradores."}, {"start": 148.619, "end": 150.529, "text": "Na volta, a sequência de retorno:"}, {"start": 150.529, "end": 153.443, "text": "coloca o valor de retorno onde quem chamou consegue"}, {"start": 153.443, "end": 153.729, "text": "ler."}, {"start": 154.049, "end": 156.57, "text": "Reajusta os registradores e libera a memória do"}, {"start": 156.57, "end": 157.065, "text": "registro."}, {"start": 157.385, "end": 159.45, "text": "Macete: na ida, monta a mochila."}, {"start": 159.45, "end": 162.626, "text": "Na volta, entrega o resultado e esvazia a mochila."}, {"start": 163.126, "end": 165.329, "text": "Primeiro ambiente: o totalmente estático."}, {"start": 165.329, "end": 166.219, "text": "O mais simples."}, {"start": 166.539, "end": 168.146, "text": "Todos os dados são estáticos:"}, {"start": 168.146, "end": 170.303, "text": "ficam no mesmo lugar do começo ao fim."}, {"start": 170.623, "end": 173.319, "text": "O exemplo clássico é FORTRAN77."}, {"start": 173.639, "end": 177.006, "text": "Até as variáveis locais são alocadas antes da execução."}, {"start": 177.006, "end": 180.166, "text": "Cada procedimento tem um único registro de ativação."}, {"start": 180.486, "end": 181.706, "text": "A memória fica assim:"}, {"start": 181.706, "end": 183.395, "text": "o código de cada procedimento,"}, {"start": 183.395, "end": 186.116, "text": "os dados globais, e um registro de ativação fixo"}, {"start": 186.116, "end": 186.913, "text": "para cada um."}, {"start": 187.413, "end": 190.176, "text": "Na chamada, cada argumento é calculado e guardado"}, {"start": 190.176, "end": 191.509, "text": "no espaço do parâmetro,"}, {"start": 191.509, "end": 193.51, "text": "no registro do procedimento chamado."}, {"start": 193.83, "end": 195.652, "text": "O endereço de retorno é gravado,"}, {"start": 195.652, "end": 198.409, "text": "e o programa salta para o código do procedimento."}, {"start": 198.729, "end": 200.995, "text": "No retorno, um salto simples de volta."}, {"start": 201.315, "end": 203.853, "text": "Pegadinha: esse ambiente não permite recursão."}, {"start": 204.173, "end": 206.384, "text": "Macete: é um hotel com um quarto só por"}, {"start": 206.384, "end": 208.685, "text": "pessoa. Se o mesmo hóspede chegar de novo,"}, {"start": 208.685, "end": 209.767, "text": "não tem onde ficar:"}, {"start": 209.767, "end": 211.798, "text": "a nova chamada atropelaria a anterior."}, {"start": 212.298, "end": 215.013, "text": "Com recursão, cada chamada precisa de variáveis"}, {"start": 215.013, "end": 215.803, "text": "locais novas."}, {"start": 216.123, "end": 218.997, "text": "Então os registros de ativação não podem ser estáticos:"}, {"start": 218.997, "end": 220.324, "text": "eles vão para uma pilha."}, {"start": 220.644, "end": 223.324, "text": "A cada chamada, um novo registro é empilhado no"}, {"start": 223.324, "end": 223.653, "text": "topo."}, {"start": 223.973, "end": 225.705, "text": "No retorno, ele é desempilhado."}, {"start": 225.705, "end": 228.186, "text": "A pilha de ativação cresce e diminui com as"}, {"start": 228.186, "end": 228.701, "text": "chamadas."}, {"start": 229.021, "end": 231.745, "text": "E o mesmo procedimento pode ter vários registros"}, {"start": 231.745, "end": 233.178, "text": "na pilha ao mesmo tempo,"}, {"start": 233.178, "end": 234.469, "text": "um para cada ativação."}, {"start": 234.969, "end": 236.24, "text": "Em linguagens como C,"}, {"start": 236.24, "end": 238.537, "text": "onde todos os procedimentos são globais,"}, {"start": 238.537, "end": 240.394, "text": "a pilha precisa de duas coisas."}, {"start": 240.714, "end": 243.132, "text": "Primeiro, um ponteiro para o registro atual,"}, {"start": 243.132, "end": 244.946, "text": "para acessar as variáveis locais:"}, {"start": 244.946, "end": 246.155, "text": "o ponteiro de quadro,"}, {"start": 246.155, "end": 246.388, "text": "fp."}, {"start": 246.708, "end": 249.753, "text": "Segundo, um jeito de voltar para o registro anterior:"}, {"start": 249.753, "end": 251.203, "text": "a vinculação de controle,"}, {"start": 251.203, "end": 254.103, "text": "ou vinculação dinâmica. Também chamada de fp velho."}, {"start": 254.423, "end": 255.568, "text": "E pode haver o sp,"}, {"start": 255.568, "end": 257.38, "text": "apontando para o topo da pilha."}, {"start": 257.7, "end": 260.233, "text": "Macete: a vinculação de controle é a migalha de"}, {"start": 260.233, "end": 261.878, "text": "pão para voltar a quem chamou."}, {"start": 262.378, "end": 264.395, "text": "Exemplo: o máximo divisor comum,"}, {"start": 264.395, "end": 266.465, "text": "recursivo, com entradas 15 e 10."}, {"start": 266.785, "end": 269.195, "text": "Na área global: x vale 15 e y vale"}, {"start": 269.195, "end": 271.386, "text": "10. Em cima, o registro do main."}, {"start": 271.706, "end": 273.447, "text": "main chama gcd de 15 e 10."}, {"start": 273.447, "end": 275.136, "text": "Empilha um registro, com u,"}, {"start": 275.136, "end": 277.849, "text": "v, a vinculação de controle e o endereço de"}, {"start": 277.849, "end": 278.361, "text": "retorno."}, {"start": 278.681, "end": 280.138, "text": "Como v não é zero,"}, {"start": 280.138, "end": 281.778, "text": "chama gcd de 10 e 5."}, {"start": 281.778, "end": 284.692, "text": "Mais um registro. Depois gcd de 5 e 0."}, {"start": 285.012, "end": 286.033, "text": "Agora v é zero:"}, {"start": 286.033, "end": 288.739, "text": "retorna 5, e a pilha vai sendo desempilhada,"}, {"start": 288.739, "end": 290.066, "text": "registro por registro."}, {"start": 290.566, "end": 292.526, "text": "Para analisar chamadas complicadas,"}, {"start": 292.526, "end": 294.193, "text": "usamos a árvore de ativação."}, {"start": 294.513, "end": 295.849, "text": "Cada ativação vira um nó,"}, {"start": 295.849, "end": 298.307, "text": "e os filhos são as chamadas feitas durante ela."}, {"start": 298.627, "end": 300.693, "text": "No gcd, é uma linha reta:"}, {"start": 300.693, "end": 302.501, "text": "main, gcd de 15 e 10,"}, {"start": 302.501, "end": 303.793, "text": "gcd de 10 e 5,"}, {"start": 303.793, "end": 305.02, "text": "gcd de 5 e 0."}, {"start": 305.34, "end": 307.577, "text": "No segundo exemplo, main chama g de 2."}, {"start": 307.577, "end": 308.91, "text": "g de 2 chama f de 1,"}, {"start": 308.91, "end": 310.004, "text": "que chama g de 1."}, {"start": 310.004, "end": 311.813, "text": "E depois g de 2 chama g de 1"}, {"start": 311.813, "end": 312.337, "text": "de novo."}, {"start": 312.657, "end": 314.606, "text": "Dica: a pilha, num instante qualquer,"}, {"start": 314.606, "end": 316.777, "text": "é exatamente o caminho da raiz até o nó"}, {"start": 316.777, "end": 317.841, "text": "que está executando."}, {"start": 318.341, "end": 321.062, "text": "Todo registro de ativação de um mesmo procedimento"}, {"start": 321.062, "end": 322.215, "text": "tem o mesmo formato."}, {"start": 322.535, "end": 325.133, "text": "Na função g, o parâmetro m e a variável"}, {"start": 325.133, "end": 327.731, "text": "y estão sempre na mesma posição relativa."}, {"start": 328.051, "end": 331.011, "text": "Então m fica num deslocamento fixo a partir do"}, {"start": 331.011, "end": 332.226, "text": "fp, e y em outro."}, {"start": 332.546, "end": 335.472, "text": "Por isso o compilador acessa variáveis locais assim:"}, {"start": 335.472, "end": 338.157, "text": "deslocamento mais fp. Sem precisar saber onde a"}, {"start": 338.157, "end": 338.829, "text": "pilha está."}, {"start": 339.329, "end": 341.524, "text": "Vamos calcular os deslocamentos de f,"}, {"start": 341.524, "end": 342.871, "text": "com parâmetros x e c,"}, {"start": 342.871, "end": 345.215, "text": "um vetor a de 10 inteiros e um double"}, {"start": 345.215, "end": 345.415, "text": "y."}, {"start": 345.735, "end": 347.567, "text": "Suponha: inteiro com 2 bytes,"}, {"start": 347.567, "end": 349.609, "text": "endereço com 4, caractere com 1,"}, {"start": 349.609, "end": 351.18, "text": "e ponto flutuante com 8."}, {"start": 351.5, "end": 353.756, "text": "Os parâmetros ficam acima do fp:"}, {"start": 353.756, "end": 354.739, "text": "x em mais 5,"}, {"start": 354.739, "end": 355.722, "text": "c em mais 4."}, {"start": 356.042, "end": 357.844, "text": "Os locais ficam abaixo:"}, {"start": 357.844, "end": 360.419, "text": "a em menos 24 e y em menos 32."}, {"start": 360.739, "end": 362.922, "text": "E a de i fica em menos 24 mais"}, {"start": 362.922, "end": 364.778, "text": "2 vezes i, a partir do fp."}, {"start": 364.778, "end": 366.524, "text": "O 2 é o fator de escala,"}, {"start": 366.524, "end": 367.943, "text": "o tamanho do inteiro."}, {"start": 368.443, "end": 370.187, "text": "A sequência de ativação na pilha,"}, {"start": 370.187, "end": 370.972, "text": "passo a passo."}, {"start": 371.292, "end": 374.324, "text": "Calcula os argumentos e guarda no novo registro."}, {"start": 374.324, "end": 377.304, "text": "Empilha o fp atual como vinculação de controle."}, {"start": 377.624, "end": 379.772, "text": "Faz o fp apontar para o novo registro,"}, {"start": 379.772, "end": 382.195, "text": "guarda o endereço de retorno e salta para o"}, {"start": 382.195, "end": 382.881, "text": "procedimento."}, {"start": 383.201, "end": 384.984, "text": "No retorno: copia o fp no sp,"}, {"start": 384.984, "end": 387.78, "text": "carrega a vinculação de controle de volta no fp,"}, {"start": 387.78, "end": 390.287, "text": "salta para o endereço de retorno e tira os"}, {"start": 390.287, "end": 391.444, "text": "argumentos da pilha."}, {"start": 391.764, "end": 394.536, "text": "A ordem exata depende da convenção de chamada da"}, {"start": 394.536, "end": 395.205, "text": "arquitetura."}, {"start": 395.705, "end": 398.428, "text": "E quando um procedimento é declarado dentro de outro,"}, {"start": 398.428, "end": 399.249, "text": "como em Pascal?"}, {"start": 399.569, "end": 401.162, "text": "Aqui, q está dentro de p,"}, {"start": 401.162, "end": 402.406, "text": "e usa a variável n,"}, {"start": 402.406, "end": 403.203, "text": "que é de p."}, {"start": 403.203, "end": 404.646, "text": "Não é local nem global."}, {"start": 404.966, "end": 406.51, "text": "p chama r, que chama q."}, {"start": 406.51, "end": 408.362, "text": "Pela regra de escopo estático,"}, {"start": 408.362, "end": 409.905, "text": "o n de q é o n de p,"}, {"start": 409.905, "end": 411.037, "text": "e não o n de r."}, {"start": 411.357, "end": 414.312, "text": "A vinculação de controle aponta para quem chamou:"}, {"start": 414.312, "end": 416.096, "text": "r. Isso levaria ao n errado."}, {"start": 416.416, "end": 418.35, "text": "A solução é a vinculação de acesso,"}, {"start": 418.35, "end": 421.005, "text": "ou vinculação estática: ela aponta para o registro"}, {"start": 421.005, "end": 422.759, "text": "do ambiente onde q foi definido,"}, {"start": 422.759, "end": 423.299, "text": "que é p."}, {"start": 423.619, "end": 425.69, "text": "Macete: controle é quem me chamou."}, {"start": 425.69, "end": 427.154, "text": "Acesso é onde eu nasci."}, {"start": 427.654, "end": 429.707, "text": "A pilha é o ambiente mais comum,"}, {"start": 429.707, "end": 430.989, "text": "em C, Pascal e Ada."}, {"start": 430.989, "end": 432.016, "text": "Mas tem limites."}, {"start": 432.336, "end": 435.129, "text": "Veja: a função proc devolve o endereço da sua"}, {"start": 435.129, "end": 436.195, "text": "variável local x."}, {"start": 436.515, "end": 439.223, "text": "Quando proc retorna, o registro dela sai da pilha."}, {"start": 439.223, "end": 441.254, "text": "O endereço devolvido aponta para lixo."}, {"start": 441.574, "end": 442.807, "text": "Em C isso é um erro,"}, {"start": 442.807, "end": 445.181, "text": "mas os compiladores no máximo dão um aviso."}, {"start": 445.501, "end": 447.908, "text": "Linguagens como LISP e ML permitem isso."}, {"start": 447.908, "end": 450.766, "text": "Elas precisam de um ambiente totalmente dinâmico."}, {"start": 451.086, "end": 453.734, "text": "Lá, um registro só é liberado quando ninguém mais"}, {"start": 453.734, "end": 456.608, "text": "aponta para ele. E quem encontra a memória inacessível"}, {"start": 456.608, "end": 457.73, "text": "é a coleta de lixo."}, {"start": 458.23, "end": 459.586, "text": "Em orientação a objetos,"}, {"start": 459.586, "end": 461.691, "text": "um objeto é parecido com um registro:"}, {"start": 461.691, "end": 463.937, "text": "os campos são as variáveis de instância."}, {"start": 464.257, "end": 467.019, "text": "A estrutura de cada classe fica guardada na memória,"}, {"start": 467.019, "end": 468.802, "text": "com os ponteiros para os métodos."}, {"start": 469.122, "end": 471.682, "text": "Cada objeto guarda só um ponteiro para a sua"}, {"start": 471.682, "end": 474.575, "text": "classe. Os métodos não são copiados em cada objeto."}, {"start": 474.895, "end": 477.122, "text": "E cada classe aponta para a superclasse."}, {"start": 477.122, "end": 478.328, "text": "Para achar um método,"}, {"start": 478.328, "end": 479.952, "text": "a busca sobe pela hierarquia."}, {"start": 479.952, "end": 482.689, "text": "Isso implementa a herança e a vinculação dinâmica."}, {"start": 483.189, "end": 484.76, "text": "Mesmo num ambiente de pilha,"}, {"start": 484.76, "end": 486.839, "text": "ponteiros precisam de memória dinâmica:"}, {"start": 486.839, "end": 487.301, "text": "o heap."}, {"start": 487.621, "end": 489.15, "text": "Ele tem duas operações."}, {"start": 489.47, "end": 491.976, "text": "Alocar: recebe um tamanho e devolve um ponteiro"}, {"start": 491.976, "end": 493.095, "text": "para um bloco livre."}, {"start": 493.415, "end": 496.006, "text": "Liberar: recebe o ponteiro e marca o bloco como"}, {"start": 496.006, "end": 496.824, "text": "livre de novo."}, {"start": 497.144, "end": 498.989, "text": "Em Pascal, new e dispose."}, {"start": 498.989, "end": 500.595, "text": "Em C++, new e delete."}, {"start": 500.595, "end": 502.143, "text": "Em C, malloc e free."}, {"start": 502.643, "end": 505.336, "text": "Os parâmetros são espaços no registro de ativação,"}, {"start": 505.336, "end": 507.619, "text": "preenchidos por quem chama antes do salto."}, {"start": 507.939, "end": 510.886, "text": "Ligar parâmetros e argumentos também é uma amarração."}, {"start": 511.206, "end": 513.269, "text": "Existem quatro mecanismos: por valor,"}, {"start": 513.269, "end": 515.907, "text": "por referência, por valor-resultado e por nome."}, {"start": 516.227, "end": 518.354, "text": "E cuidado com a ordem de avaliação:"}, {"start": 518.354, "end": 520.431, "text": "em C, f de mais mais x vírgula x"}, {"start": 520.431, "end": 522.211, "text": "pode dar resultados diferentes,"}, {"start": 522.211, "end": 525.03, "text": "dependendo de qual argumento é avaliado primeiro."}, {"start": 525.53, "end": 527.844, "text": "Passagem por valor: o argumento é avaliado,"}, {"start": 527.844, "end": 529.931, "text": "e o valor é copiado para o parâmetro."}, {"start": 530.251, "end": 531.762, "text": "É o único mecanismo de C,"}, {"start": 531.762, "end": 533.415, "text": "e o básico em Pascal e Ada."}, {"start": 533.735, "end": 534.65, "text": "Em C e Pascal,"}, {"start": 534.65, "end": 537.73, "text": "o parâmetro vira uma variável local com valor inicial."}, {"start": 537.73, "end": 539.992, "text": "Mudar o parâmetro não muda o argumento."}, {"start": 539.992, "end": 542.11, "text": "Em Ada, nem dá para atribuir a ele."}, {"start": 542.43, "end": 544.682, "text": "Exemplo: uma troca de a e b por valor"}, {"start": 544.682, "end": 546.072, "text": "não troca nada lá fora."}, {"start": 546.072, "end": 547.557, "text": "E é fácil de implementar."}, {"start": 547.877, "end": 550.006, "text": "Macete: por valor é uma fotocópia."}, {"start": 550.006, "end": 552.341, "text": "Rabiscar a cópia não muda o original."}, {"start": 552.841, "end": 555.412, "text": "Passagem por referência: passa a localização da"}, {"start": 555.412, "end": 558.451, "text": "variável. O parâmetro vira outro nome para o argumento."}, {"start": 558.771, "end": 561.412, "text": "Qualquer mudança no parâmetro acontece também no"}, {"start": 561.412, "end": 561.978, "text": "argumento."}, {"start": 562.298, "end": 564.617, "text": "É o único mecanismo do FORTRAN77."}, {"start": 564.617, "end": 566.646, "text": "Em Pascal usa a palavra var,"}, {"start": 566.646, "end": 568.385, "text": "e em C++ o e comercial."}, {"start": 568.705, "end": 571.217, "text": "O compilador calcula o endereço do argumento,"}, {"start": 571.217, "end": 572.971, "text": "guarda no registro de ativação,"}, {"start": 572.971, "end": 575.672, "text": "e transforma cada acesso ao parâmetro num acesso"}, {"start": 575.672, "end": 576.194, "text": "indireto."}, {"start": 576.514, "end": 579.273, "text": "Macete: por referência é dar a chave da casa."}, {"start": 579.273, "end": 581.329, "text": "Mexeu lá dentro, mudou de verdade."}, {"start": 581.829, "end": 584.569, "text": "Passagem por valor-resultado: parece a referência,"}, {"start": 584.569, "end": 586.059, "text": "mas sem criar outro nome."}, {"start": 586.379, "end": 588.265, "text": "Na entrada, o valor é copiado."}, {"start": 588.265, "end": 590.253, "text": "O procedimento trabalha na cópia."}, {"start": 590.573, "end": 593.092, "text": "Na saída, o valor final é copiado de volta"}, {"start": 593.092, "end": 594.109, "text": "para o argumento."}, {"start": 594.429, "end": 596.831, "text": "Por isso, o registro de ativação não pode ser"}, {"start": 596.831, "end": 598.402, "text": "liberado por quem foi chamado:"}, {"start": 598.402, "end": 600.542, "text": "quem chamou ainda precisa ler os valores."}, {"start": 600.862, "end": 603.444, "text": "Macete: é pegar emprestado e devolver no fim."}, {"start": 603.944, "end": 607.036, "text": "Passagem por nome, também chamada de avaliação atrasada."}, {"start": 607.356, "end": 609.561, "text": "O argumento não é avaliado na chamada."}, {"start": 609.561, "end": 612.006, "text": "O texto do argumento substitui o parâmetro,"}, {"start": 612.006, "end": 613.875, "text": "e só é avaliado quando é usado."}, {"start": 614.195, "end": 615.942, "text": "Exemplo: proc faz mais mais x."}, {"start": 615.942, "end": 617.406, "text": "Chamando proc de a de i,"}, {"start": 617.406, "end": 619.153, "text": "o efeito é mais mais a de i."}, {"start": 619.473, "end": 621.212, "text": "E se o i mudar antes do uso,"}, {"start": 621.212, "end": 622.904, "text": "o elemento afetado muda junto."}, {"start": 623.224, "end": 625.351, "text": "Macete: por nome é mandar a receita,"}, {"start": 625.351, "end": 626.512, "text": "não o prato pronto."}, {"start": 626.512, "end": 627.479, "text": "Cozinha na hora."}, {"start": 627.979, "end": 630.286, "text": "Resumo dos quatro, com x valendo 1 e a"}, {"start": 630.286, "end": 631.248, "text": "chamada p de x,"}, {"start": 631.248, "end": 632.882, "text": "onde p soma 1 ao parâmetro."}, {"start": 633.202, "end": 634.725, "text": "Por valor, x continua 1."}, {"start": 635.045, "end": 637.192, "text": "Por referência, x vira 2 na hora."}, {"start": 637.512, "end": 639.38, "text": "Por valor-resultado, x vira 2,"}, {"start": 639.38, "end": 640.936, "text": "mas só quando p termina."}, {"start": 641.256, "end": 642.683, "text": "E por nome, x vira 2,"}, {"start": 642.683, "end": 645.335, "text": "porque o próprio x é avaliado dentro de p."}, {"start": 645.835, "end": 648.262, "text": "Para fechar, o ambiente da linguagem TINY."}, {"start": 648.262, "end": 649.572, "text": "É extremamente simples."}, {"start": 649.892, "end": 651.484, "text": "TINY não tem procedimentos,"}, {"start": 651.484, "end": 653.473, "text": "e todas as variáveis são globais."}, {"start": 653.473, "end": 656.556, "text": "Então não precisa de pilha de registros de ativação."}, {"start": 656.876, "end": 660.081, "text": "As variáveis ficam em endereços absolutos no fim"}, {"start": 660.081, "end": 661.319, "text": "da memória: x, y,"}, {"start": 661.319, "end": 662.668, "text": "z e w, de 0 a 3."}, {"start": 662.988, "end": 665.396, "text": "E os temporários ficam numa pilha no início da"}, {"start": 665.396, "end": 665.826, "text": "memória."}, {"start": 666.146, "end": 668.652, "text": "Registradores apontam para o início e o fim,"}, {"start": 668.652, "end": 671.347, "text": "e os endereços das variáveis viram deslocamentos."}, {"start": 671.347, "end": 673.805, "text": "A tabela de símbolos guarda esses endereços,"}, {"start": 673.805, "end": 675.271, "text": "com st_insert e st_lookup."}, {"start": 675.771, "end": 676.886, "text": "Revisão relâmpago."}, {"start": 677.206, "end": 679.638, "text": "Três ambientes: estático, pilha e dinâmico."}, {"start": 679.958, "end": 682.44, "text": "Memória: código, globais, pilha para baixo,"}, {"start": 682.44, "end": 683.384, "text": "heap para cima."}, {"start": 683.704, "end": 685.797, "text": "Registro de ativação: argumentos,"}, {"start": 685.797, "end": 687.779, "text": "controle, locais e temporários."}, {"start": 688.099, "end": 689.689, "text": "Estático não tem recursão."}, {"start": 689.689, "end": 692.202, "text": "Pilha usa fp e a vinculação de controle."}, {"start": 692.522, "end": 694.008, "text": "Controle é quem me chamou."}, {"start": 694.008, "end": 695.355, "text": "Acesso é onde eu nasci."}, {"start": 695.675, "end": 697.849, "text": "Valor é fotocópia, referência é a chave,"}, {"start": 697.849, "end": 700.43, "text": "valor-resultado é empréstimo e nome é a receita."}, {"start": 700.75, "end": 702.049, "text": "Agora é com você."}, {"start": 702.049, "end": 702.817, "text": "Boa prova!"}];
