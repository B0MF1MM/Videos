<style>

</style>
<div id="@code" class="k-win" style="left:120px;top:150px;width:620px;height:360px">

    f(y); x--; g(y);

}</div>
</div>

</div>
<div id="@rec" style="position:absolute;left:1000px;top:200px;width:820px;height:400px">

  <div class="ml" style="top:152px">endereço de retorno</div>
  <div class="ml k-c-green" style="top:228px">y</div>

  <div class="k-code" style="left:28px;top:86px;font-size:34px"><span class="k-c-green">y</span> = yDeslocamento(fp)</div>

<script>

K.rise(tl, $("same"), C.a + 1.6);

tl.set([$("om"), $("oy"), $("lm"), $("ly"), $("fp")], { opacity: 0 }, 0);
tl.to($("fp"), { opacity: 1, duration: 0.3 }, C.c);
K.draw(tl, $("om"), C.c + 1.0, { d: 0.4 });
tl.to($("lm"), { opacity: 1, duration: 0.3 }, C.c + 1.2);
K.draw(tl, $("oy"), C.c + 2.6, { d: 0.5 });
tl.to($("ly"), { opacity: 1, duration: 0.3 }, C.c + 2.9);
K.rise(tl, $("acc"), C.d);
</script>
