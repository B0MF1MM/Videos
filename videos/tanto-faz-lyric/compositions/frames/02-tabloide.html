      <div class="t2-body">“Tanto Faz” é uma carta aberta sobre entrega e medo de errar de novo. A faixa atravessa o refrão como quem repete uma promessa em voz baixa, entre o desejo de ficar e o receio de se arrepender. Nas estrofes, o amor aparece como resgate: alguém que chega do nada, tira do sufoco e cura as feridas sem esforço. O que sobra é a vontade de construir um plano, uma vida inteira, com a pessoa certa ao lado. Gravada entre madrugadas, a música aposta num grave arrastado e numa voz que conversa mais do que canta. Cada verso parece escrito no verso de um papel qualquer — um bilhete, um recado, uma confissão. É sobre escolher e ser escolhido, e sobre pedir, por favor, que essa escolha não vire arrependimento.</div>
