    <script>
      (function () {
        var C = {"a": 0.15, "b": 2.879, "c": 9.677, "d": 16.175}, D = 24.735;
        var S = K.scene("18-enderecos", D, 35), tl = S.tl, $ = S.$;
        // fita de memória: 12 células de 2 bytes a partir de &x
        var strip = $("strip"), cells = [];
        for (var i = 0; i < 12; i++) {
          var c = document.createElement("div");
          c.id = "s18-enderecos-cell" + i;
          c.className = "k-cell";
          c.style.left = (i * 122) + "px"; c.style.top = "0px"; c.style.width = "118px";
          c.textContent = i === 0 ? "x" : "";
          strip.appendChild(c);
          var l = document.createElement("div");
          l.id = "s18-enderecos-lab" + i;
          l.className = "k-code k-mute";
          l.style.left = (i * 122) + "px"; l.style.top = "86px"; l.style.width = "118px"; l.style.fontSize = "22px"; l.style.textAlign = "center";
          l.textContent = i === 0 ? "&x" : "+" + (i * 2);
          strip.appendChild(l);
          cells.push(c);
        }
        var two = document.createElement("div");
        two.id = "s18-enderecos-two";
        two.className = "k-code k-c-yel";
        two.style.left = (5 * 122) + "px"; two.style.top = "-6px"; two.style.width = "118px"; two.style.textAlign = "center"; two.style.fontSize = "52px";
        two.textContent = "2";
        strip.appendChild(two);
        var arrow = document.createElement("div");
        arrow.id = "s18-enderecos-arrow";
        arrow.className = "k-anno k-c-cyan";
        arrow.style.left = (5 * 122 - 40) + "px"; arrow.style.top = "150px";
        arrow.textContent = "↑ t1 = &x + 10";
        strip.appendChild(arrow);

        K.rise(tl, $("title"), C.a);
        K.rise(tl, $("k1"), C.b + 0.6, { y: 60 });
        K.rise(tl, $("k2"), C.b + 2.4, { y: 60 });
        K.rise(tl, $("k3"), C.b + 4.4, { y: 60 });
        K.out(tl, [$("k1"), $("k2"), $("k3"), $("title")], C.c - 0.3);
        K.pop(tl, $("amp"), C.c + 2.6);
        K.pop(tl, $("ast"), C.c + 4.6);
        K.out(tl, [$("amp"), $("ast")], C.d - 0.3);
        K.fade(tl, cells, C.d, { s: 0.04 });
        K.fade(tl, strip, C.d);
        K.wipe(tl, $("l1"), C.d + 0.4);
        K.hl(tl, $("l1"), C.d + 3.0, C.d + 5.0);
        K.pulse(tl, cells[0], C.d + 3.2);
        tl.to(cells[5], { borderColor: "#4FD6EE", duration: 0.3 }, C.d + 4.0);
        K.rise(tl, arrow, C.d + 4.0);
        K.wipe(tl, $("l2"), C.d + 5.0);
        K.hl(tl, $("l2"), C.d + 5.0);
        K.pop(tl, two, C.d + 5.8, { from: 2.5 });
      })();
