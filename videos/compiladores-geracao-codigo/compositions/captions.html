    <script>
      (function () {
        var GROUPS = [{"start": 0.15, "end": 2.614, "text": "Você escreve um programa numa linguagem que você"}, {"start": 2.614, "end": 3.046, "text": "entende."}, {"start": 3.366, "end": 6.215, "text": "Mas o processador só entende instruções de máquina."}, {"start": 6.535, "end": 8.397, "text": "Quem faz essa ponte é o compilador,"}, {"start": 8.397, "end": 10.389, "text": "e a última etapa dele é a geração de"}, {"start": 10.389, "end": 10.779, "text": "código."}, {"start": 11.099, "end": 12.562, "text": "Bora entender passo a passo,"}, {"start": 12.562, "end": 13.895, "text": "com macetes para a prova."}, {"start": 14.395, "end": 17.072, "text": "Gerar código não depende só da linguagem fonte."}, {"start": 17.392, "end": 18.888, "text": "Depende da arquitetura alvo,"}, {"start": 18.888, "end": 21.516, "text": "do ambiente de execução e do sistema operacional."}, {"start": 21.836, "end": 23.401, "text": "Macete: pense num tradutor."}, {"start": 23.401, "end": 25.796, "text": "Ele precisa conhecer a língua de destino,"}, {"start": 25.796, "end": 27.458, "text": "o lugar e as regras locais."}, {"start": 27.778, "end": 29.175, "text": "E ainda tenta otimizar:"}, {"start": 29.175, "end": 30.871, "text": "deixar o código mais rápido,"}, {"start": 30.871, "end": 31.469, "text": "ou menor."}, {"start": 31.969, "end": 34.913, "text": "Como é complexo, o compilador quebra essa fase em"}, {"start": 34.913, "end": 35.362, "text": "passos."}, {"start": 35.682, "end": 38.495, "text": "A árvore sintática abstrata descreve bem o programa,"}, {"start": 38.495, "end": 40.847, "text": "mas não se parece nada com o código alvo."}, {"start": 41.167, "end": 43.07, "text": "Então ele cria uma ponte no meio:"}, {"start": 43.07, "end": 45.948, "text": "o código intermediário, uma representação intermediária"}, {"start": 45.948, "end": 47.479, "text": "parecida com o código alvo."}, {"start": 47.799, "end": 49.168, "text": "Bônus: com essa ponte,"}, {"start": 49.168, "end": 51.247, "text": "fica fácil trocar de máquina alvo."}, {"start": 51.247, "end": 53.073, "text": "É só refazer o último trecho."}, {"start": 53.573, "end": 56.311, "text": "A forma mais famosa de código intermediário é o"}, {"start": 56.311, "end": 57.752, "text": "código de três endereços."}, {"start": 58.072, "end": 59.803, "text": "x = y op z."}, {"start": 60.123, "end": 61.95, "text": "Um resultado e dois operandos:"}, {"start": 61.95, "end": 62.864, "text": "três endereços."}, {"start": 63.184, "end": 65.57, "text": "Macete: no máximo um operador por linha."}, {"start": 65.57, "end": 66.862, "text": "Se a conta é grande,"}, {"start": 66.862, "end": 68.254, "text": "ela vira várias linhas."}, {"start": 68.754, "end": 72.053, "text": "Vamos montar na prática a expressão 2 * a"}, {"start": 72.053, "end": 73.024, "text": "+ (b - 3)."}, {"start": 73.344, "end": 75.908, "text": "Primeiro, a árvore. A raiz é o operador que"}, {"start": 75.908, "end": 77.552, "text": "acontece por último: o mais."}, {"start": 77.872, "end": 79.832, "text": "Do lado esquerdo, dois vezes a."}, {"start": 80.152, "end": 82.236, "text": "Do lado direito, b menos três."}, {"start": 82.556, "end": 85.0, "text": "Os números e as variáveis ficam nas folhas."}, {"start": 85.5, "end": 87.772, "text": "Agora percorra a árvore de baixo para cima,"}, {"start": 87.772, "end": 89.213, "text": "da esquerda para a direita."}, {"start": 89.533, "end": 92.019, "text": "Cada nó interior ganha um temporário."}, {"start": 92.019, "end": 92.979, "text": "t1 = 2 * a."}, {"start": 93.299, "end": 95.221, "text": "t2 = b - 3."}, {"start": 95.541, "end": 97.481, "text": "E a raiz junta tudo:"}, {"start": 97.481, "end": 98.898, "text": "t3 = t1 + t2."}, {"start": 99.218, "end": 100.469, "text": "Macete: folha é nome,"}, {"start": 100.469, "end": 101.912, "text": "nó interior é temporário."}, {"start": 102.412, "end": 105.216, "text": "Esses temporários normalmente vão para registradores."}, {"start": 105.536, "end": 107.443, "text": "Mas também podem ficar na memória,"}, {"start": 107.443, "end": 109.071, "text": "ou até sumir numa otimização."}, {"start": 109.391, "end": 111.459, "text": "E operador de um operando só,"}, {"start": 111.459, "end": 114.331, "text": "como a negação, usa apenas dois endereços:"}, {"start": 114.331, "end": 115.078, "text": "t2 = -t1."}, {"start": 115.578, "end": 118.036, "text": "Veja um programa inteiro na linguagem TINY:"}, {"start": 118.036, "end": 118.711, "text": "o fatorial."}, {"start": 119.031, "end": 120.605, "text": "O if vira um teste,"}, {"start": 120.605, "end": 121.676, "text": "t1 = x > 0,"}, {"start": 121.676, "end": 123.691, "text": "e um if_false t1 goto L1."}, {"start": 124.011, "end": 126.78, "text": "O repeat vira um label L2 no começo do"}, {"start": 126.78, "end": 127.184, "text": "laço."}, {"start": 127.504, "end": 130.55, "text": "E no fim, if_false t4 goto L2 volta para"}, {"start": 130.55, "end": 131.281, "text": "o começo."}, {"start": 131.601, "end": 133.481, "text": "Macete: o if pula para frente;"}, {"start": 133.481, "end": 135.057, "text": "o repeat volta para trás."}, {"start": 135.557, "end": 138.335, "text": "Na memória, o código de três endereços não fica"}, {"start": 138.335, "end": 139.018, "text": "como texto."}, {"start": 139.338, "end": 142.192, "text": "Cada instrução vira um registro com quatro campos:"}, {"start": 142.192, "end": 142.918, "text": "a quádrupla."}, {"start": 143.238, "end": 144.633, "text": "Um campo para a operação,"}, {"start": 144.633, "end": 146.029, "text": "e três para os endereços."}, {"start": 146.349, "end": 147.599, "text": "fact = 1 vira:"}, {"start": 147.599, "end": 149.243, "text": "asn, 1, fact, vazio."}, {"start": 149.563, "end": 151.373, "text": "Campo que sobra fica com um traço."}, {"start": 151.873, "end": 153.666, "text": "Agora, o ponto mais cobrado:"}, {"start": 153.666, "end": 156.04, "text": "gerar código como atributo sintetizado."}, {"start": 156.36, "end": 158.578, "text": "A gramática tem só soma e atribuição."}, {"start": 158.898, "end": 160.38, "text": "exp vai em id = exp,"}, {"start": 160.38, "end": 161.204, "text": "ou em aexp."}, {"start": 161.524, "end": 163.135, "text": "aexp vai em aexp + fator,"}, {"start": 163.135, "end": 163.94, "text": "ou em fator."}, {"start": 164.26, "end": 166.422, "text": "E fator é uma expressão entre parênteses,"}, {"start": 166.422, "end": 167.57, "text": "um número, ou um id."}, {"start": 168.07, "end": 170.455, "text": "Cada nó da árvore carrega dois atributos."}, {"start": 170.775, "end": 172.468, "text": "name: onde fica o resultado."}, {"start": 172.788, "end": 175.448, "text": "tacode: o código que calcula esse resultado."}, {"start": 175.768, "end": 178.157, "text": "Duas mais concatenam com quebra de linha."}, {"start": 178.157, "end": 180.106, "text": "Duas barras concatenam com espaço."}, {"start": 180.426, "end": 182.436, "text": "E newtemp cria um temporário novinho."}, {"start": 182.936, "end": 185.263, "text": "Vamos ler a tabela de regras semânticas,"}, {"start": 185.263, "end": 186.571, "text": "em linguagem de gente."}, {"start": 186.891, "end": 188.367, "text": "Folhas: fator vai em num,"}, {"start": 188.367, "end": 188.986, "text": "ou em id."}, {"start": 189.306, "end": 191.097, "text": "O name é o próprio número ou nome,"}, {"start": 191.097, "end": 192.139, "text": "e o tacode é vazio."}, {"start": 192.459, "end": 194.536, "text": "Regras de cópia, como exp vai em aexp:"}, {"start": 194.536, "end": 196.348, "text": "só copiam name e tacode do filho."}, {"start": 196.848, "end": 198.601, "text": "A soma é a regra que trabalha."}, {"start": 198.921, "end": 200.838, "text": "Primeiro, newtemp cria o temporário."}, {"start": 201.158, "end": 203.523, "text": "Depois junta o código do filho da esquerda,"}, {"start": 203.523, "end": 205.161, "text": "o código do filho da direita,"}, {"start": 205.481, "end": 206.659, "text": "e acrescenta a linha:"}, {"start": 206.659, "end": 208.835, "text": "temporário igual a esquerda mais direita."}, {"start": 209.155, "end": 211.121, "text": "Na atribuição, o name é o do filho,"}, {"start": 211.121, "end": 212.149, "text": "e a linha nova é:"}, {"start": 212.149, "end": 213.623, "text": "id igual ao name do filho."}, {"start": 214.123, "end": 219.761, "text": "Agora resolvemos (x = x + 3) + 4."}, {"start": 220.081, "end": 221.678, "text": "Comece pelas folhas: x,"}, {"start": 221.678, "end": 223.79, "text": "3 e 4. O name é elas mesmas,"}, {"start": 223.79, "end": 225.217, "text": "e o tacode é vazio."}, {"start": 225.537, "end": 228.037, "text": "Suba um nível: x + 3 ganha o temporário"}, {"start": 228.037, "end": 228.292, "text": "T1."}, {"start": 228.612, "end": 230.275, "text": "E o código dele é:"}, {"start": 230.275, "end": 231.453, "text": "T1 = x + 3."}, {"start": 231.953, "end": 233.668, "text": "Mais um nível: a atribuição."}, {"start": 233.988, "end": 235.241, "text": "O name continua T1,"}, {"start": 235.241, "end": 236.912, "text": "e o código ganha a linha:"}, {"start": 236.912, "end": 237.487, "text": "x = T1."}, {"start": 237.807, "end": 240.442, "text": "Na raiz, a soma com 4 cria T2."}, {"start": 240.762, "end": 243.398, "text": "Código final: T1 = x + 3,"}, {"start": 243.398, "end": 245.715, "text": "x = T1, T2 = T1 + 4."}, {"start": 246.035, "end": 248.97, "text": "Macete: o código sobe pela árvore como bola de"}, {"start": 248.97, "end": 251.485, "text": "neve. Por isso o atributo é sintetizado."}, {"start": 251.985, "end": 254.756, "text": "Funciona, mas na prática não é usado assim."}, {"start": 254.756, "end": 255.608, "text": "Três motivos."}, {"start": 255.928, "end": 258.729, "text": "Um: copia muitas cadeias e desperdiça memória."}, {"start": 259.049, "end": 261.88, "text": "Dois: é melhor emitir pedaços pequenos direto num"}, {"start": 261.88, "end": 263.979, "text": "arquivo, ou numa estrutura de dados."}, {"start": 264.299, "end": 267.18, "text": "Três: geração de código depende muito de atributos"}, {"start": 267.18, "end": 269.377, "text": "herdados, e isso complica a gramática."}, {"start": 269.877, "end": 272.341, "text": "Do código intermediário para o código alvo,"}, {"start": 272.341, "end": 273.742, "text": "ainda falta uma passada."}, {"start": 274.062, "end": 277.021, "text": "Ela define onde ficam as variáveis e os temporários,"}, {"start": 277.021, "end": 278.501, "text": "e cuida dos registradores."}, {"start": 278.821, "end": 280.717, "text": "Duas técnicas: expansão de macros,"}, {"start": 280.717, "end": 283.513, "text": "que troca cada instrução por uma sequência pronta."}, {"start": 283.833, "end": 286.799, "text": "E simulação estática, que simula os efeitos do código"}, {"start": 286.799, "end": 288.023, "text": "e gera o equivalente."}, {"start": 288.343, "end": 289.929, "text": "Macete: macro é carimbo."}, {"start": 289.929, "end": 292.337, "text": "Simulação é pensar antes de escrever."}, {"start": 292.837, "end": 295.246, "text": "No código alvo, nomes viram endereços."}, {"start": 295.566, "end": 296.947, "text": "Pode ser um registrador,"}, {"start": 296.947, "end": 298.9, "text": "um endereço absoluto, para globais,"}, {"start": 298.9, "end": 301.329, "text": "ou um deslocamento no registro de ativação,"}, {"start": 301.329, "end": 302.044, "text": "para locais."}, {"start": 302.364, "end": 305.323, "text": "Para calcular endereços, usamos dois modos do C:"}, {"start": 305.323, "end": 307.037, "text": "o e comercial, endereço de,"}, {"start": 307.037, "end": 308.542, "text": "e o asterisco, indireto."}, {"start": 308.862, "end": 313.09, "text": "Guardar 2 no endereço de x mais 10 bytes:"}, {"start": 313.09, "end": 314.665, "text": "t1 = &x + 10,"}, {"start": 314.665, "end": 316.572, "text": "e depois *t1 = 2."}, {"start": 317.072, "end": 319.286, "text": "Matrizes ficam em sequência na memória."}, {"start": 319.606, "end": 321.163, "text": "Endereço do elemento: base,"}, {"start": 321.163, "end": 323.108, "text": "mais índice menos limite inferior,"}, {"start": 323.108, "end": 324.762, "text": "vezes o tamanho do elemento."}, {"start": 325.082, "end": 326.405, "text": "Macete: B, I, T."}, {"start": 326.405, "end": 328.862, "text": "Base, mais Índice, vezes Tamanho."}, {"start": 329.182, "end": 331.76, "text": "Em C o limite inferior é zero."}, {"start": 331.76, "end": 335.56, "text": "Então a[i+1] fica em &a + (i+1) * sizeof(int)."}, {"start": 336.06, "end": 340.113, "text": "Traduzindo a[i+1] = a[j*2] + 3."}, {"start": 340.433, "end": 341.763, "text": "Primeiro o lado direito:"}, {"start": 341.763, "end": 344.377, "text": "calcula o índice, multiplica pelo tamanho e soma"}, {"start": 344.377, "end": 344.836, "text": "à base."}, {"start": 345.156, "end": 347.793, "text": "Depois lê o conteúdo com asterisco e soma três."}, {"start": 348.113, "end": 349.401, "text": "Agora o lado esquerdo:"}, {"start": 349.401, "end": 351.023, "text": "o mesmo cálculo de endereço,"}, {"start": 351.023, "end": 351.739, "text": "com i + 1."}, {"start": 352.059, "end": 354.893, "text": "E por fim, *t8 = t5."}, {"start": 355.213, "end": 357.114, "text": "Macete: asterisco à direita lê;"}, {"start": 357.114, "end": 358.861, "text": "asterisco à esquerda escreve."}, {"start": 358.861, "end": 360.505, "text": "Matriz de várias dimensões?"}, {"start": 360.505, "end": 362.509, "text": "A mesma ideia, aplicada de novo."}, {"start": 363.009, "end": 365.664, "text": "Registros, ou structs, seguem a mesma lógica."}, {"start": 365.984, "end": 367.868, "text": "Os campos ficam um depois do outro,"}, {"start": 367.868, "end": 369.708, "text": "e o primeiro tem deslocamento zero."}, {"start": 370.028, "end": 372.29, "text": "O deslocamento de cada campo é constante,"}, {"start": 372.29, "end": 373.953, "text": "e quem informa é field_offset,"}, {"start": 373.953, "end": 375.707, "text": "a partir da tabela de símbolos."}, {"start": 376.027, "end": 378.943, "text": "Então x.j = x.i vira:"}, {"start": 378.943, "end": 382.615, "text": "t1 = &x + field_offset(x,j),"}, {"start": 382.615, "end": 386.286, "text": "t2 = &x + field_offset(x,i),"}, {"start": 386.286, "end": 388.122, "text": "e *t1 = *t2."}, {"start": 388.622, "end": 391.029, "text": "Ponteiro é só um nível a mais de indireção."}, {"start": 391.349, "end": 392.774, "text": "Na árvore em C,"}, {"start": 392.774, "end": 394.484, "text": "p->lchild = p vira:"}, {"start": 394.484, "end": 396.693, "text": "t1 = p + field_offset(*p,"}, {"start": 396.693, "end": 398.474, "text": "lchild), e *t1 = p."}, {"start": 398.794, "end": 400.854, "text": "E p = p->rchild vira:"}, {"start": 400.854, "end": 403.22, "text": "t2 = p + field_offset(*p,"}, {"start": 403.22, "end": 405.127, "text": "rchild), e p = *t2."}, {"start": 405.447, "end": 407.409, "text": "Repare: aqui não tem e comercial."}, {"start": 407.409, "end": 409.273, "text": "O ponteiro p já é um endereço."}, {"start": 409.773, "end": 411.112, "text": "Para controle de fluxo,"}, {"start": 411.112, "end": 414.078, "text": "precisamos de rótulos: os lugares para onde o código"}, {"start": 414.078, "end": 414.461, "text": "salta."}, {"start": 414.781, "end": 416.728, "text": "if (E) S1 else S2 vira:"}, {"start": 416.728, "end": 418.025, "text": "avalia E em t1,"}, {"start": 418.025, "end": 419.842, "text": "e if_false t1 goto L1."}, {"start": 420.162, "end": 421.835, "text": "Depois o código de S1,"}, {"start": 421.835, "end": 423.985, "text": "e goto L2 para pular o else."}, {"start": 424.305, "end": 426.377, "text": "label L1, código de S2,"}, {"start": 426.377, "end": 428.234, "text": "e label L2 na saída."}, {"start": 428.554, "end": 431.245, "text": "Macete: falso pula; verdadeiro segue reto."}, {"start": 431.745, "end": 434.004, "text": "O while começa com label L1 no topo."}, {"start": 434.324, "end": 436.304, "text": "Avalia E, e se for falso,"}, {"start": 436.304, "end": 437.975, "text": "goto L2: sai do laço."}, {"start": 438.295, "end": 440.376, "text": "Senão executa o corpo e goto L1:"}, {"start": 440.376, "end": 441.573, "text": "volta para o topo."}, {"start": 441.893, "end": 443.842, "text": "Macete: o while é um if que volta."}, {"start": 444.342, "end": 446.883, "text": "Só que às vezes o salto aparece antes do"}, {"start": 446.883, "end": 447.798, "text": "rótulo existir."}, {"start": 448.118, "end": 450.641, "text": "O compilador ainda não sabe para onde pular."}, {"start": 450.961, "end": 452.912, "text": "Então ele deixa um espaço em branco,"}, {"start": 452.912, "end": 454.154, "text": "ou um salto provisório."}, {"start": 454.474, "end": 455.968, "text": "Quando descobre o destino,"}, {"start": 455.968, "end": 458.137, "text": "volta e preenche. Isso é backpatching:"}, {"start": 458.137, "end": 459.149, "text": "ajuste retroativo."}, {"start": 459.469, "end": 461.778, "text": "Macete: é como mandar um convite com a data"}, {"start": 461.778, "end": 463.303, "text": "em branco e preencher depois."}, {"start": 463.803, "end": 465.617, "text": "Expressões lógicas viram números:"}, {"start": 465.617, "end": 467.383, "text": "falso é zero, verdadeiro é um."}, {"start": 467.703, "end": 469.832, "text": "Em C, and e or são de curto-circuito:"}, {"start": 469.832, "end": 472.655, "text": "o segundo operando só é avaliado se for necessário."}, {"start": 472.975, "end": 474.539, "text": "a and b é o mesmo que:"}, {"start": 474.539, "end": 476.102, "text": "if a then b else false."}, {"start": 476.422, "end": 477.898, "text": "a or b é o mesmo que:"}, {"start": 477.898, "end": 479.375, "text": "if a then true else b."}, {"start": 479.695, "end": 482.342, "text": "Por isso p != NULL && p->val == 0"}, {"start": 482.342, "end": 484.251, "text": "é seguro: se p for nulo,"}, {"start": 484.251, "end": 486.159, "text": "a segunda parte nem roda."}, {"start": 486.659, "end": 488.245, "text": "Funções têm dois momentos:"}, {"start": 488.245, "end": 489.832, "text": "a definição e a ativação."}, {"start": 490.152, "end": 491.58, "text": "A definição cria o nome,"}, {"start": 491.58, "end": 493.057, "text": "os parâmetros e o código,"}, {"start": 493.057, "end": 494.295, "text": "mas não executa nada."}, {"start": 494.615, "end": 496.778, "text": "Em três endereços: entry marca o início,"}, {"start": 496.778, "end": 497.995, "text": "e return marca o fim."}, {"start": 498.315, "end": 501.476, "text": "int f(int x, int y) { return x+y+1;"}, {"start": 501.476, "end": 502.984, "text": "} vira: entry f,"}, {"start": 502.984, "end": 504.205, "text": "t1 = x + y,"}, {"start": 504.205, "end": 505.498, "text": "t2 = t1 + 1,"}, {"start": 505.498, "end": 506.432, "text": "return t2."}, {"start": 506.932, "end": 509.137, "text": "A ativação usa três instruções."}, {"start": 509.457, "end": 512.169, "text": "begin_args avisa que os argumentos vão começar."}, {"start": 512.489, "end": 514.199, "text": "arg entrega cada argumento."}, {"start": 514.519, "end": 515.961, "text": "E call salta para a função."}, {"start": 516.281, "end": 519.0, "text": "f(2+3, 4) vira: begin_args,"}, {"start": 519.0, "end": 520.445, "text": "t1 = 2 + 3,"}, {"start": 520.445, "end": 522.059, "text": "arg t1, arg 4,"}, {"start": 522.059, "end": 522.909, "text": "call f."}, {"start": 523.229, "end": 525.34, "text": "Macete: abre, entrega, chama."}, {"start": 525.84, "end": 527.277, "text": "Agora a máquina alvo:"}, {"start": 527.277, "end": 528.768, "text": "a TM, a máquina TINY."}, {"start": 529.088, "end": 531.04, "text": "Ela tem uma memória de instruções,"}, {"start": 531.04, "end": 533.135, "text": "só de leitura, uma memória de dados,"}, {"start": 533.135, "end": 534.325, "text": "e oito registradores."}, {"start": 534.645, "end": 537.191, "text": "O registrador sete é o contador de programa,"}, {"start": 537.191, "end": 537.575, "text": "o PC."}, {"start": 537.895, "end": 540.737, "text": "O ciclo: busca a instrução apontada pelo PC,"}, {"start": 540.737, "end": 542.345, "text": "incrementa o PC, executa."}, {"start": 542.345, "end": 543.954, "text": "Até um HALT ou um erro."}, {"start": 544.274, "end": 545.869, "text": "Ao iniciar, tudo é zerado,"}, {"start": 545.869, "end": 548.311, "text": "e dMem[0] recebe o maior endereço válido:"}, {"start": 548.311, "end": 549.358, "text": "o topo da pilha."}, {"start": 549.858, "end": 551.854, "text": "As instruções têm dois formatos."}, {"start": 552.174, "end": 554.605, "text": "RO, só registradores: opcode r,"}, {"start": 554.605, "end": 555.919, "text": "s, t. Como ADD:"}, {"start": 555.919, "end": 558.284, "text": "reg[r] recebe reg[s] + reg[t]."}, {"start": 558.604, "end": 561.16, "text": "RM, registrador e memória:"}, {"start": 561.16, "end": 564.789, "text": "opcode r, d(s). O endereço é a = d"}, {"start": 564.789, "end": 565.778, "text": "+ reg[s]."}, {"start": 566.098, "end": 567.906, "text": "LD carrega, ST armazena,"}, {"start": 567.906, "end": 569.651, "text": "LDA carrega o endereço,"}, {"start": 569.651, "end": 572.019, "text": "LDC uma constante. E os saltos:"}, {"start": 572.019, "end": 574.014, "text": "JLT, JEQ, JNE e companhia."}, {"start": 574.334, "end": 576.884, "text": "Macete: RO tem três registradores;"}, {"start": 576.884, "end": 578.286, "text": "RM tem parênteses."}, {"start": 578.786, "end": 580.966, "text": "Não existe salto incondicional na TM,"}, {"start": 580.966, "end": 582.155, "text": "mas dá para imitar."}, {"start": 582.475, "end": 585.838, "text": "LD 7, 0(1) carrega no PC um endereço guardado"}, {"start": 585.838, "end": 586.695, "text": "na memória."}, {"start": 587.015, "end": 590.461, "text": "E JEQ 0, 4(7) pula cinco instruções para frente,"}, {"start": 590.461, "end": 592.718, "text": "se o registrador zero for zero."}, {"start": 593.038, "end": 594.886, "text": "Pegadinha: são cinco, não quatro,"}, {"start": 594.886, "end": 596.733, "text": "porque o PC já foi incrementado."}, {"start": 597.053, "end": 599.642, "text": "No simulador, linha com asterisco é comentário,"}, {"start": 599.642, "end": 601.337, "text": "e o comando g manda executar."}, {"start": 601.837, "end": 603.492, "text": "No gerador de código TINY,"}, {"start": 603.492, "end": 605.457, "text": "cada registrador tem papel fixo."}, {"start": 605.777, "end": 606.657, "text": "pc é o sete."}, {"start": 606.657, "end": 609.349, "text": "mp, o seis, aponta para o topo da memória,"}, {"start": 609.349, "end": 610.954, "text": "onde ficam os temporários."}, {"start": 611.274, "end": 613.345, "text": "gp, o cinco, aponta para o fundo,"}, {"start": 613.345, "end": 614.81, "text": "onde ficam as variáveis."}, {"start": 615.13, "end": 617.427, "text": "Assim t1 está em 0(mp),"}, {"start": 617.427, "end": 620.675, "text": "t2 em -1(mp), x em 0(gp) e y em"}, {"start": 620.675, "end": 621.309, "text": "1(gp)."}, {"start": 621.629, "end": 623.533, "text": "Zero e um são os acumuladores,"}, {"start": 623.533, "end": 625.952, "text": "ac e ac1, e o resultado vai sempre em"}, {"start": 625.952, "end": 628.526, "text": "ac. Dois, três e quatro nunca são usados."}, {"start": 629.026, "end": 630.317, "text": "Para escrever o código,"}, {"start": 630.317, "end": 632.07, "text": "existem sete funções de emissão."}, {"start": 632.39, "end": 635.633, "text": "emitComment escreve comentário; emitRO e emitRM"}, {"start": 635.633, "end": 637.135, "text": "emitem as instruções."}, {"start": 637.455, "end": 639.522, "text": "E quatro servem ao backpatching:"}, {"start": 639.522, "end": 642.133, "text": "emitSkip reserva espaço, emitBackup volta,"}, {"start": 642.133, "end": 645.505, "text": "emitRestore retorna, e emitRM_Abs converte um endereço"}, {"start": 645.505, "end": 647.3, "text": "absoluto em relativo ao PC."}, {"start": 647.8, "end": 649.703, "text": "O gerador fica em cgen.c."}, {"start": 649.703, "end": 651.237, "text": "A entrada é codeGen."}, {"start": 651.557, "end": 652.739, "text": "Ela emite o prólogo,"}, {"start": 652.739, "end": 654.678, "text": "chama cGen com a árvore sintática,"}, {"start": 654.678, "end": 655.814, "text": "e termina com HALT."}, {"start": 656.134, "end": 657.255, "text": "cGen olha o nó:"}, {"start": 657.255, "end": 659.442, "text": "se for declaração, chama genStmt;"}, {"start": 659.442, "end": 661.516, "text": "se for expressão, chama genExp."}, {"start": 661.836, "end": 664.306, "text": "Depois chama a si mesma para os irmãos."}, {"start": 664.306, "end": 665.18, "text": "Recursão pura."}, {"start": 665.68, "end": 666.814, "text": "Revisão relâmpago."}, {"start": 667.134, "end": 669.748, "text": "Árvore, código intermediário, código alvo."}, {"start": 670.068, "end": 672.294, "text": "Folha é nome; nó interior é temporário."}, {"start": 672.614, "end": 674.714, "text": "O código sobe como bola de neve:"}, {"start": 674.714, "end": 675.975, "text": "atributo sintetizado."}, {"start": 676.295, "end": 678.89, "text": "Matriz: base mais índice vezes tamanho."}, {"start": 679.21, "end": 681.307, "text": "Falso pula; o while é um if que volta."}, {"start": 681.627, "end": 683.51, "text": "begin_args, arg, call. RO:"}, {"start": 683.51, "end": 685.939, "text": "três registradores. RM: parênteses."}, {"start": 686.259, "end": 687.541, "text": "Agora é com você."}, {"start": 687.541, "end": 688.299, "text": "Boa prova!"}];
