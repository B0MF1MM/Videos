<div id="@title" class="k-title" style="left:120px;top:126px;font-size:68px">Funciona… mas <em>não é prático</em></div>
<div id="@c1" class="k-card" style="left:120px;top:270px;width:540px;height:560px;border-color:#FF6F9C">
  <div class="k-h2 k-c-pink" style="left:30px;top:24px;font-size:56px">1</div>
  <div class="k-body" style="left:90px;top:36px;font-size:32px">cópias demais</div>
  <div id="@cp0" class="k-code" style="left:40px;top:130px;font-size:28px">"T1 = x + 3"</div>
  <div id="@cp1" class="k-code" style="left:60px;top:180px;font-size:28px">"T1 = x + 3 x = T1"</div>
  <div id="@cp2" class="k-code" style="left:80px;top:230px;font-size:28px">"T1 = x + 3 x = T1 T2…"</div>
  <div id="@cp3" class="k-code" style="left:100px;top:280px;font-size:28px">"T1 = x + 3 x = T1 T2…"</div>
  <div class="k-body k-mute" style="left:40px;top:380px;font-size:26px">memória</div>
  <div style="position:absolute;left:40px;top:430px;width:460px;height:30px;border-radius:15px;background:#2A3656"></div>
  <div id="@mem" style="position:absolute;left:40px;top:430px;width:460px;height:30px;border-radius:15px;background:#FF6F9C;transform-origin:0 50%"></div>
</div>
<div id="@c2" class="k-card" style="left:690px;top:270px;width:540px;height:560px;border-color:#7FE39A">
  <div class="k-h2 k-c-green" style="left:30px;top:24px;font-size:56px">2</div>
  <div class="k-body" style="left:90px;top:36px;font-size:32px">melhor emitir aos pedaços</div>
  <div id="@file" style="position:absolute;left:330px;top:200px;width:150px;height:190px;border:4px solid #7FE39A;border-radius:10px;background:#13241A"></div>
  <div style="position:absolute;left:345px;top:400px;width:140px;font-family:'DM Mono',monospace;font-size:22px;color:#7FE39A">arquivo</div>
  <div id="@pc0" class="k-chip k-c-green" style="left:40px;top:180px;font-size:22px">t1 = …</div>
  <div id="@pc1" class="k-chip k-c-green" style="left:40px;top:250px;font-size:22px">x = t1</div>
  <div id="@pc2" class="k-chip k-c-green" style="left:40px;top:320px;font-size:22px">t2 = …</div>
</div>
<div id="@c3" class="k-card" style="left:1260px;top:270px;width:540px;height:560px;border-color:#B49BFF">
  <div class="k-h2 k-c-violet" style="left:30px;top:24px;font-size:56px">3</div>
  <div class="k-body" style="left:90px;top:36px;font-size:32px">atributos herdados</div>
  <svg width="540" height="400" style="position:absolute;left:0;top:120px">
    <g stroke="#8C97B5" stroke-width="3"><line x1="270" y1="60" x2="150" y2="200"/><line x1="270" y1="60" x2="390" y2="200"/></g>
    <circle cx="270" cy="60" r="34" fill="#182238" stroke="#B49BFF" stroke-width="4"/>
    <circle cx="150" cy="200" r="34" fill="#182238" stroke="#B49BFF" stroke-width="4"/>
    <circle cx="390" cy="200" r="34" fill="#182238" stroke="#B49BFF" stroke-width="4"/>
    <path id="@down" d="M 300 100 L 380 160 M 362 160 L 380 160 L 374 142" stroke="#FF6F9C" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path id="@up" d="M 120 160 L 240 80 M 222 80 L 240 80 L 232 97" stroke="#7FE39A" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="k-body" style="left:40px;top:400px;font-size:28px;line-height:1.4"><span class="k-c-green">sintetizado ↑</span> simples<br><span class="k-c-pink">herdado ↓</span> complica a gramática</div>
</div>

<script>
K.rise(tl, $("title"), C.a);
K.rise(tl, $("c1"), C.b - 0.3, { y: 60 });
K.fade(tl, [$("cp0"), $("cp1"), $("cp2"), $("cp3")], C.b + 0.3, { s: 0.45 });
tl.fromTo($("mem"), { scaleX: 0.05 }, { scaleX: 1, duration: 2.2, ease: "power1.in" }, C.b + 0.3);
K.rise(tl, $("c2"), C.c - 0.3, { y: 60 });
[$("pc0"), $("pc1"), $("pc2")].forEach(function (el, i) {
  K.pop(tl, el, C.c + 0.6 + i * 0.6);
  K.fly(tl, el, C.c + 1.0 + i * 0.6, 300, 60 - i * 60, { scale: 0.5, d: 0.5 });
  tl.to(el, { opacity: 0, duration: 0.15 }, C.c + 1.45 + i * 0.6);
});
K.pulse(tl, $("file"), C.c + 2.6, { k: 1.1 });
K.rise(tl, $("c3"), C.d - 0.3, { y: 60 });
K.draw(tl, $("up"), C.d + 0.8, { d: 0.5 });
K.draw(tl, $("down"), C.d + 1.6, { d: 0.5 });
</script>
