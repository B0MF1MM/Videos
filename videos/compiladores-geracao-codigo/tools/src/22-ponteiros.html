<style>
  .pf { position: absolute; top: 0; height: 100px; border: 2px solid #2A3656; background: #182238; font-family: "DM Mono", monospace; font-size: 30px; line-height: 96px; text-align: center; }
</style>
<div id="@pbox" class="k-card" style="left:140px;top:210px;width:200px;height:120px;border-color:#4FD6EE">
  <div class="k-code k-c-cyan" style="left:0;top:28px;width:200px;text-align:center;font-size:46px">p</div>
</div>
<div class="k-code k-mute" style="left:140px;top:340px;width:200px;text-align:center;font-size:22px">TreeNode *p</div>
<div id="@n1" style="position:absolute;left:620px;top:220px;width:600px;height:100px">
  <div class="pf" style="left:0;width:200px">val</div>
  <div id="@fl" class="pf" style="left:200px;width:200px">lchild</div>
  <div id="@fr" class="pf" style="left:400px;width:200px">rchild</div>
</div>
<div id="@n2" style="position:absolute;left:1330px;top:400px;width:480px;height:100px">
  <div class="pf" style="left:0;width:160px">val</div><div class="pf" style="left:160px;width:160px">lchild</div><div class="pf" style="left:320px;width:160px">rchild</div>
</div>
<svg class="k-svg">
  <path id="@ap" class="arrow" d="M 345 270 L 605 270 M 587 254 L 605 270 L 587 286" stroke="#4FD6EE" />
  <path id="@al" class="arrow" d="M 820 325 C 820 420, 660 420, 640 330 M 630 350 L 640 330 L 656 346" stroke="#FFD24A" />
  <path id="@ar" class="arrow" d="M 1120 325 C 1120 450, 1250 450, 1320 450 M 1302 434 L 1320 450 L 1302 466" stroke="#FFD24A" />
  <path id="@ap2" class="arrow" d="M 345 300 C 700 520, 1100 560, 1400 510 M 1380 500 L 1400 510 L 1384 526" stroke="#4FD6EE" />
</svg>
<div id="@ind" class="k-anno k-c-cyan" style="left:370px;top:190px">+1 nível de indireção</div>

<div id="@b1" class="k-card" style="left:120px;top:560px;width:830px;height:300px">
  <div class="k-code k-c-yel" style="left:30px;top:22px;font-size:34px">p-&gt;lchild = p;</div>
  <div class="k-code" style="left:30px;top:90px;font-size:28px;line-height:1.6"><span class="ln" id="@x1">t1 = p + field_offset(*p, lchild)</span><span class="ln" id="@x2"><span class="k-c-pink">*</span>t1 = p</span></div>
</div>
<div id="@b2" class="k-card" style="left:980px;top:560px;width:820px;height:300px">
  <div class="k-code k-c-yel" style="left:30px;top:22px;font-size:34px">p = p-&gt;rchild;</div>
  <div class="k-code" style="left:30px;top:90px;font-size:28px;line-height:1.6"><span class="ln" id="@y1">t2 = p + field_offset(*p, rchild)</span><span class="ln" id="@y2">p = <span class="k-c-pink">*</span>t2</span></div>
</div>
<div id="@noamp" class="k-macete k-alert" style="left:560px;top:100px;width:800px;font-size:34px">Sem &amp;: o ponteiro <u>p já é um endereço</u>.</div>

<script>
K.pop(tl, $("pbox"), C.a);
K.fade(tl, $("n1"), C.a + 0.4);
K.draw(tl, $("ap"), C.a + 0.8, { d: 0.5 });
K.wipe(tl, $("ind"), C.a + 1.2);
K.rise(tl, $("b1"), C.b);
K.wipe(tl, $("x1"), C.b + 2.6);
tl.to($("fl"), { borderColor: "#FFD24A", color: "#FFD24A", duration: 0.3 }, C.b + 3.4);
K.wipe(tl, $("x2"), C.b + 5.5);
K.draw(tl, $("al"), C.b + 5.8, { d: 0.6 });
K.rise(tl, $("b2"), C.c);
K.fade(tl, $("n2"), C.c + 0.4);
K.wipe(tl, $("y1"), C.c + 1.6);
tl.to($("fr"), { borderColor: "#FFD24A", color: "#FFD24A", duration: 0.3 }, C.c + 2.4);
K.draw(tl, $("ar"), C.c + 2.6, { d: 0.6 });
K.wipe(tl, $("y2"), C.c + 4.6);
tl.to($("ap"), { opacity: 0.15, duration: 0.3 }, C.c + 5.0);
K.draw(tl, $("ap2"), C.c + 5.0, { d: 0.8 });
K.out(tl, $("ind"), C.d - 0.3);
K.macete(tl, $("noamp"), C.d);
</script>
