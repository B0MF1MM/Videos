<!--sfx: c:pop@0.4*0.25, d:click-soft@2.0*0.35-->
<div id="@d" class="k-card" style="left:120px;top:140px;width:820px;height:250px;border-color:#7FE39A">
  <div class="k-h2 k-c-green" style="left:30px;top:24px;font-size:46px">1 · Definição</div>
  <div id="@dl" class="k-body" style="left:30px;top:100px;font-size:32px">cria <b>nome</b>, <b>parâmetros</b> e <b>código</b></div>
  <div id="@dn" class="k-chip k-c-pink" style="left:30px;top:166px;font-size:26px">❚❚ não executa nada (ainda)</div>
</div>
<div id="@a" class="k-card" style="left:980px;top:140px;width:820px;height:250px;border-color:#2A3656;opacity:0.45">
  <div class="k-h2 k-mute" style="left:30px;top:24px;font-size:46px">2 · Ativação (chamada)</div>
  <div class="k-body k-mute" style="left:30px;top:100px;font-size:32px">próxima cena →</div>
</div>

<div id="@sch" style="position:absolute;left:120px;top:440px;width:600px;height:420px">
  <div id="@s1" class="k-chip k-c-green" style="left:0;top:0;font-size:36px;background:#13241A">entry f</div>
  <div class="k-body k-mute" style="left:250px;top:8px;font-size:26px">← início</div>
  <div id="@s2" style="position:absolute;left:0;top:90px;width:560px;height:200px;border:3px dashed #2A3656;border-radius:16px;font-family:'DM Mono',monospace;font-size:30px;line-height:196px;text-align:center;color:#8C97B5">&lt;corpo da função&gt;</div>
  <div id="@s3" class="k-chip k-c-pink" style="left:0;top:320px;font-size:36px;background:#2A0E17">return t</div>
  <div class="k-body k-mute" style="left:260px;top:328px;font-size:26px">← fim + valor</div>
</div>

<div id="@src" class="k-code" style="left:780px;top:450px;font-size:34px"><span class="k-c-violet">int</span> f(<span class="k-c-violet">int</span> x, <span class="k-c-violet">int</span> y) { <span class="k-c-pink">return</span> x+y+1; }</div>
<div id="@win" class="k-win" style="left:780px;top:530px;width:1020px;height:330px">
  <div class="k-win-bar"><i style="left:22px;background:#FF6F9C"></i><i style="left:46px;background:#FFD24A"></i><i style="left:70px;background:#7FE39A"></i><span>três endereços</span></div>
  <div class="k-code" style="left:10px;top:66px;font-size:38px;line-height:1.45"><span class="ln" id="@c0"><span class="k-c-green">entry</span> f</span><span class="ln" id="@c1">t1 = x + y</span><span class="ln" id="@c2">t2 = t1 + 1</span><span class="ln" id="@c3"><span class="k-c-pink">return</span> t2</span></div>
</div>

<script>
K.rise(tl, $("d"), C.a);
tl.fromTo($("a"), { opacity: 0, y: 30 }, { opacity: 0.45, y: 0, duration: 0.5, ease: "power3.out" }, C.a + 1.2);
K.wipe(tl, $("dl"), C.b);
K.pop(tl, $("dn"), C.b + 2.6);
K.pop(tl, $("s1"), C.c + 1.6);
K.fade(tl, $("s2"), C.c + 1.0);
K.pop(tl, $("s3"), C.c + 2.6);
K.fade(tl, $("sch"), C.c);
K.rise(tl, $("src"), C.d);
K.rise(tl, $("win"), C.d + 2.2);
K.wipe(tl, [$("c0"), $("c1"), $("c2"), $("c3")], C.d + 3.0, { s: 1.0 });
K.pulse(tl, $("s1"), C.d + 3.0);
K.pulse(tl, $("s3"), C.d + 6.0);
</script>
