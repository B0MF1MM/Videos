<!--sfx: c:whoosh-short@0.4*0.2, e:whoosh-short@0.4*0.2, f:pop*0.3-->
<style>
  .ml { position: absolute; left: 0; width: 460px; height: 64px; border: 2px solid #2A3656; background: #182238; font-family: "Hanken Grotesk", sans-serif; font-size: 24px; line-height: 60px; text-align: center; color: #EEF1F8; }
</style>
<div id="@t" class="k-title" style="left:120px;top:124px;font-size:60px">Uma <em>chamada</em> na pilha</div>
<div id="@code" class="k-code" style="left:120px;top:260px;font-size:36px;line-height:1.5"><span class="ln" id="@l1">main() {</span><span class="ln">  int x;</span><span class="ln" id="@l3">  f(x);</span><span class="ln">}</span></div>
<div id="@stk" style="position:absolute;left:1000px;top:200px;width:820px;height:640px">
  <div class="k-body k-mute" style="left:0;top:0;font-size:24px">pilha (cresce para baixo)</div>
  <div id="@m" class="ml" style="top:50px;border-color:#8C97B5">registro de main · x</div>
  <div id="@f" style="position:absolute;left:0;top:114px;width:460px;height:256px">
    <div class="ml k-c-cyan" style="top:0;border-color:#FFD24A">parâmetro</div>
    <div class="ml k-c-pink" style="top:64px;border-color:#FFD24A">vinculação de controle</div>
    <div class="ml k-c-yel" style="top:128px;border-color:#FFD24A">endereço de retorno</div>
    <div class="ml k-c-green" style="top:192px;border-color:#FFD24A">locais de f</div>
  </div>
  <svg width="820" height="640" style="position:absolute;left:0;top:0;overflow:visible">
    <path id="@vc" d="M 464 210 C 560 200, 560 90, 464 82 M 482 72 L 464 82 L 482 94" stroke="#FF6F9C" stroke-width="5" fill="none"/>
  </svg>
  <div id="@vcl" class="k-anno k-c-pink" style="left:560px;top:120px">aponta para main</div>
  <div id="@sp" class="k-code k-c-cyan" style="left:0;top:380px;font-size:28px">sp →</div>
</div>
<div id="@mac" class="k-macete" style="left:120px;top:700px;width:820px;font-size:30px">Sempre desenhe a <u>seta da vinculação de controle</u>: chamado → quem chamou.</div>

<script>
K.rise(tl, $("code"), C.a);
K.fade(tl, $("stk"), C.a + 0.6);
tl.set([$("m"), $("f"), $("vc"), $("vcl"), $("sp")], { opacity: 0 }, 0);
K.hl(tl, $("l1"), C.b, C.c);
tl.to($("m"), { opacity: 1, duration: 0.3 }, C.b + 0.4);
K.hl(tl, $("l3"), C.c, C.e);
tl.fromTo($("f"), { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, immediateRender: false }, C.c + 0.6);
tl.to($("sp"), { opacity: 1, duration: 0.3 }, C.c + 1.2);
K.draw(tl, $("vc"), C.d + 0.6, { d: 0.6 });
tl.to($("vcl"), { opacity: 1, duration: 0.3 }, C.d + 1.0);
tl.to([$("f"), $("vc"), $("vcl")], { opacity: 0, duration: 0.4 }, C.e + 1.4);
tl.to($("sp"), { y: -256, duration: 0.4 }, C.e + 1.6);
tl.to([$("f"), $("vc"), $("vcl")], { opacity: 1, duration: 0.3 }, C.f);
tl.to($("sp"), { y: 0, duration: 0.3 }, C.f);
K.macete(tl, $("mac"), C.f + 0.2);
</script>
