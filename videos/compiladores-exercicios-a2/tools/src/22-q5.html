<script>
K.pop(tl, $("band"), C.a);
K.rise(tl, $("ex"), C.a + 0.5);

K.pulse(tl, [$("m2"), $("nm2")], C.d, { k: 1.2 });
K.pop(tl, $("g2"), C.d + 0.4);
tl.to($("c1"), { opacity: 1, duration: 0.4 }, C.d + 0.6);
K.pulse(tl, $("np"), C.e, { k: 1.2 });
K.pop(tl, $("g3"), C.e + 0.4);
tl.to($("c2"), { opacity: 1, duration: 0.4 }, C.e + 0.6);
K.pop(tl, $("ok"), C.e + 1.6);
K.macete(tl, $("mac"), C.b + 4.6);
</script>
