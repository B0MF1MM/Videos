    <script>
      (function () {
        var GROUPS = [{"start": 0.15, "end": 2.786, "text": "São seis questões para a A2 de Compiladores."}, {"start": 3.106, "end": 4.806, "text": "Uma de gramática de atributos,"}, {"start": 4.806, "end": 6.458, "text": "duas de ambiente de execução,"}, {"start": 6.458, "end": 9.101, "text": "uma de passagem de parâmetros e duas de código"}, {"start": 9.101, "end": 10.139, "text": "de três endereços."}, {"start": 10.459, "end": 12.935, "text": "Primeiro, a matéria que você precisa saber para"}, {"start": 12.935, "end": 13.466, "text": "cada uma."}, {"start": 13.786, "end": 15.451, "text": "Depois, cada questão resolvida,"}, {"start": 15.451, "end": 18.041, "text": "passo a passo, do jeito que o gabarito espera."}, {"start": 18.541, "end": 20.845, "text": "Questão um pede uma gramática de atributos."}, {"start": 20.845, "end": 22.787, "text": "Então vamos relembrar o que é isso."}, {"start": 23.107, "end": 25.792, "text": "Uma gramática de atributos é uma tabela com duas"}, {"start": 25.792, "end": 27.32, "text": "colunas: a regra gramatical,"}, {"start": 27.32, "end": 29.265, "text": "e as regras semânticas dessa regra."}, {"start": 29.585, "end": 31.487, "text": "Cada regra semântica é uma equação:"}, {"start": 31.487, "end": 33.887, "text": "um atributo de um símbolo recebe o valor de"}, {"start": 33.887, "end": 36.287, "text": "atributos dos outros símbolos da mesma regra."}, {"start": 36.607, "end": 38.065, "text": "A notação é símbolo,"}, {"start": 38.065, "end": 40.048, "text": "ponto, atributo. Por exemplo,"}, {"start": 40.048, "end": 41.272, "text": "tipo ponto dtipo."}, {"start": 41.592, "end": 44.26, "text": "E quando o mesmo símbolo aparece duas vezes na"}, {"start": 44.26, "end": 45.546, "text": "regra, a gente numera:"}, {"start": 45.546, "end": 47.261, "text": "var-lista um e var-lista dois."}, {"start": 47.761, "end": 49.742, "text": "Os atributos são de dois tipos."}, {"start": 50.062, "end": 52.727, "text": "Sintetizado: o valor vem dos filhos e sobe para"}, {"start": 52.727, "end": 54.878, "text": "o pai. Como o valor de uma expressão."}, {"start": 55.198, "end": 56.871, "text": "Herdado: o valor vem do pai,"}, {"start": 56.871, "end": 57.827, "text": "ou de um irmão,"}, {"start": 57.827, "end": 60.695, "text": "e desce. Como o tipo numa declaração de variáveis."}, {"start": 61.015, "end": 63.403, "text": "Numa declaração, o tipo aparece num lugar,"}, {"start": 63.403, "end": 65.935, "text": "e precisa chegar até cada variável da lista."}, {"start": 65.935, "end": 67.558, "text": "Por isso o dtipo é herdado."}, {"start": 67.878, "end": 70.387, "text": "Macete: sintetizado sobe como fumaça."}, {"start": 70.387, "end": 72.253, "text": "Herdado desce como herança."}, {"start": 72.753, "end": 75.113, "text": "Uma receita para montar a tabela na prova."}, {"start": 75.433, "end": 77.122, "text": "Passo um: escolha o atributo."}, {"start": 77.122, "end": 78.811, "text": "Para o tipo de uma variável,"}, {"start": 78.811, "end": 79.487, "text": "é o dtipo."}, {"start": 79.807, "end": 82.189, "text": "Passo dois: nas regras que definem o tipo,"}, {"start": 82.189, "end": 83.59, "text": "o valor é uma constante."}, {"start": 83.59, "end": 86.16, "text": "Tipo vai em integer dá dtipo igual a inteiro."}, {"start": 86.48, "end": 88.193, "text": "Passo três: na regra de cima,"}, {"start": 88.193, "end": 90.001, "text": "o tipo é passado para a lista."}, {"start": 90.321, "end": 91.651, "text": "Passo quatro: na lista,"}, {"start": 91.651, "end": 93.503, "text": "cada id recebe o tipo da lista,"}, {"start": 93.503, "end": 94.69, "text": "e a sublista também."}, {"start": 94.69, "end": 97.206, "text": "Escreva uma linha para cada regra gramatical."}, {"start": 97.706, "end": 100.243, "text": "Questões dois e três são de ambiente de execução:"}, {"start": 100.243, "end": 102.781, "text": "como a memória fica organizada enquanto o programa"}, {"start": 102.781, "end": 103.082, "text": "roda."}, {"start": 103.402, "end": 105.112, "text": "A memória tem a área de código,"}, {"start": 105.112, "end": 106.472, "text": "a área global e estática,"}, {"start": 106.472, "end": 107.525, "text": "a pilha, e o heap."}, {"start": 107.845, "end": 110.06, "text": "Variáveis globais, e textos constantes,"}, {"start": 110.06, "end": 112.324, "text": "como uma string, ficam na área global."}, {"start": 112.644, "end": 115.349, "text": "Cada chamada de função ganha um registro de ativação,"}, {"start": 115.349, "end": 116.679, "text": "que é empilhado na pilha."}, {"start": 116.999, "end": 119.188, "text": "Macete: global fica fixa lá em cima."}, {"start": 119.188, "end": 121.228, "text": "O que é de função vive na pilha."}, {"start": 121.728, "end": 124.327, "text": "O registro de ativação de uma função guarda,"}, {"start": 124.327, "end": 125.455, "text": "nesta ordem típica:"}, {"start": 125.775, "end": 128.147, "text": "os parâmetros, que recebem os argumentos,"}, {"start": 128.467, "end": 129.774, "text": "a vinculação de controle,"}, {"start": 129.774, "end": 131.995, "text": "que aponta para o registro de quem chamou,"}, {"start": 132.315, "end": 133.578, "text": "o endereço de retorno,"}, {"start": 133.578, "end": 134.561, "text": "para onde voltar,"}, {"start": 134.881, "end": 136.969, "text": "e as variáveis locais e temporários."}, {"start": 137.289, "end": 138.949, "text": "E o sp, ponteiro de pilha,"}, {"start": 138.949, "end": 141.665, "text": "marca o topo, logo depois do último registro."}, {"start": 142.165, "end": 144.082, "text": "Veja o que acontece numa chamada."}, {"start": 144.402, "end": 146.73, "text": "O main começa: o registro dele é criado,"}, {"start": 146.73, "end": 148.584, "text": "com as variáveis locais do main."}, {"start": 148.904, "end": 150.479, "text": "O main chama outra função."}, {"start": 150.479, "end": 152.694, "text": "Um novo registro é empilhado em cima."}, {"start": 153.014, "end": 155.662, "text": "A vinculação de controle desse novo registro aponta"}, {"start": 155.662, "end": 156.986, "text": "para o registro do main,"}, {"start": 156.986, "end": 158.09, "text": "que foi quem chamou."}, {"start": 158.41, "end": 159.678, "text": "Quando a função retorna,"}, {"start": 159.678, "end": 161.734, "text": "o registro sai, e a pilha volta a ser"}, {"start": 161.734, "end": 162.346, "text": "só o main."}, {"start": 162.666, "end": 165.339, "text": "Dica de prova: sempre desenhe a seta da vinculação"}, {"start": 165.339, "end": 167.878, "text": "de controle, do registro chamado para o registro"}, {"start": 167.878, "end": 168.725, "text": "de quem chamou."}, {"start": 169.225, "end": 171.385, "text": "Três detalhes que caem nessas questões."}, {"start": 171.705, "end": 174.499, "text": "Um: um vetor ocupa uma posição para cada elemento."}, {"start": 174.499, "end": 176.874, "text": "Um vetor de cinco inteiros vira a de zero"}, {"start": 176.874, "end": 177.853, "text": "até a de quatro."}, {"start": 178.173, "end": 180.178, "text": "Dois: um ponteiro guarda um endereço."}, {"start": 180.178, "end": 181.818, "text": "Se o parâmetro é um ponteiro,"}, {"start": 181.818, "end": 184.37, "text": "ele recebe o endereço base do que foi passado."}, {"start": 184.69, "end": 187.27, "text": "Três: uma variável declarada num bloco dentro da"}, {"start": 187.27, "end": 189.76, "text": "função fica no registro de ativação da função,"}, {"start": 189.76, "end": 191.118, "text": "depois das outras locais."}, {"start": 191.118, "end": 193.291, "text": "E se tiver o mesmo nome de uma global,"}, {"start": 193.291, "end": 195.056, "text": "ela esconde a global ali dentro."}, {"start": 195.556, "end": 198.442, "text": "Questão quatro: passagem por valor e por referência."}, {"start": 198.762, "end": 200.114, "text": "Na passagem por valor,"}, {"start": 200.114, "end": 202.268, "text": "a função recebe uma cópia do valor."}, {"start": 202.268, "end": 204.372, "text": "Mudar o parâmetro só muda a cópia."}, {"start": 204.372, "end": 206.326, "text": "A variável original fica intacta."}, {"start": 206.646, "end": 208.217, "text": "Na passagem por referência,"}, {"start": 208.217, "end": 211.017, "text": "a função recebe o endereço da variável original."}, {"start": 211.017, "end": 213.031, "text": "Mudar o parâmetro muda a original."}, {"start": 213.351, "end": 214.314, "text": "Em C mais mais,"}, {"start": 214.314, "end": 217.009, "text": "o e comercial na declaração do parâmetro indica"}, {"start": 217.009, "end": 217.635, "text": "referência."}, {"start": 217.955, "end": 219.846, "text": "Macete: valor é uma fotocópia."}, {"start": 219.846, "end": 221.738, "text": "Referência é a chave da casa."}, {"start": 222.238, "end": 225.267, "text": "Questões cinco e seis pedem código de três endereços."}, {"start": 225.587, "end": 227.404, "text": "Cada instrução tem, no máximo,"}, {"start": 227.404, "end": 229.776, "text": "um operador: resultado igual a operando,"}, {"start": 229.776, "end": 230.887, "text": "operador, operando."}, {"start": 231.207, "end": 233.647, "text": "Contas grandes são quebradas em várias linhas,"}, {"start": 233.647, "end": 234.913, "text": "com temporários: tê um,"}, {"start": 234.913, "end": 235.907, "text": "tê dois, tê três."}, {"start": 236.227, "end": 237.819, "text": "A ordem segue a precedência:"}, {"start": 237.819, "end": 239.364, "text": "multiplicação antes da soma."}, {"start": 239.364, "end": 241.939, "text": "É o mesmo que percorrer a árvore da expressão"}, {"start": 241.939, "end": 243.062, "text": "de baixo para cima."}, {"start": 243.382, "end": 246.202, "text": "Macete: cada operação da árvore vira um temporário."}, {"start": 246.702, "end": 248.227, "text": "Para comandos de controle,"}, {"start": 248.227, "end": 249.654, "text": "usamos rótulos e saltos."}, {"start": 249.974, "end": 251.324, "text": "Label marca um lugar."}, {"start": 251.324, "end": 252.623, "text": "Goto salta para ele."}, {"start": 252.623, "end": 255.531, "text": "E if_false salta só quando a condição é falsa."}, {"start": 255.851, "end": 256.941, "text": "O if com else vira:"}, {"start": 256.941, "end": 258.684, "text": "calcula a condição num temporário,"}, {"start": 258.684, "end": 260.254, "text": "e if_false salta para o else."}, {"start": 260.574, "end": 262.344, "text": "Depois vem a parte verdadeira,"}, {"start": 262.344, "end": 264.015, "text": "e um goto que pula o else."}, {"start": 264.015, "end": 265.392, "text": "Então o label do else,"}, {"start": 265.392, "end": 266.424, "text": "a parte do else,"}, {"start": 266.424, "end": 267.555, "text": "e o label do fim."}, {"start": 267.875, "end": 270.438, "text": "Macete: falso pula; verdadeiro segue reto."}, {"start": 270.938, "end": 272.026, "text": "O laço while vira:"}, {"start": 272.026, "end": 274.06, "text": "label no início, calcula a condição,"}, {"start": 274.06, "end": 275.81, "text": "e if_false salta para a saída."}, {"start": 276.13, "end": 277.317, "text": "Depois vem o corpo,"}, {"start": 277.317, "end": 279.394, "text": "e um goto de volta para o início."}, {"start": 279.394, "end": 281.174, "text": "E por fim, o label da saída."}, {"start": 281.494, "end": 283.343, "text": "E o for? O for é só um while"}, {"start": 283.343, "end": 283.975, "text": "disfarçado."}, {"start": 284.295, "end": 286.339, "text": "Primeiro a inicialização, uma vez só."}, {"start": 286.339, "end": 288.057, "text": "Depois o while com a condição,"}, {"start": 288.057, "end": 289.869, "text": "e o incremento no fim do corpo."}, {"start": 290.189, "end": 292.301, "text": "Macete: for é igual a inicialização,"}, {"start": 292.301, "end": 294.462, "text": "mais while, mais incremento no final."}, {"start": 294.962, "end": 297.093, "text": "Agora, as questões. Questão um."}, {"start": 297.413, "end": 299.606, "text": "A gramática é de declarações em Pascal:"}, {"start": 299.606, "end": 301.798, "text": "decl vai em var-lista dois pontos tipo."}, {"start": 301.798, "end": 303.897, "text": "var-lista vai em var-lista vírgula id,"}, {"start": 303.897, "end": 306.09, "text": "ou id. E tipo vai em integer ou real."}, {"start": 306.41, "end": 308.789, "text": "Pede a gramática de atributos para o tipo de"}, {"start": 308.789, "end": 309.494, "text": "uma variável."}, {"start": 309.814, "end": 311.838, "text": "Repare: aqui o tipo vem no fim,"}, {"start": 311.838, "end": 313.811, "text": "como em x, y dois pontos real."}, {"start": 313.811, "end": 315.316, "text": "Mas a ideia é a mesma:"}, {"start": 315.316, "end": 317.808, "text": "o tipo precisa chegar até cada variável."}, {"start": 318.308, "end": 320.006, "text": "Veja na árvore de x,"}, {"start": 320.006, "end": 321.573, "text": "y dois pontos real."}, {"start": 321.893, "end": 324.5, "text": "O tipo real define dtipo igual a real."}, {"start": 324.82, "end": 326.362, "text": "Esse valor vai para o irmão,"}, {"start": 326.362, "end": 327.023, "text": "a var-lista."}, {"start": 327.343, "end": 329.521, "text": "A var-lista passa para o id da direita,"}, {"start": 329.521, "end": 330.201, "text": "que é o y,"}, {"start": 330.201, "end": 331.245, "text": "e para a sublista."}, {"start": 331.565, "end": 333.422, "text": "E a sublista passa para o x."}, {"start": 333.422, "end": 335.951, "text": "Assim, todas as variáveis recebem o tipo."}, {"start": 336.451, "end": 338.228, "text": "Agora, a resposta em tabela."}, {"start": 338.548, "end": 341.399, "text": "decl vai em var-lista dois pontos tipo:"}, {"start": 341.399, "end": 343.826, "text": "var-lista.dtipo igual a tipo.dtipo."}, {"start": 344.146, "end": 347.399, "text": "var-lista um vai em var-lista dois vírgula id:"}, {"start": 347.399, "end": 349.882, "text": "id.dtipo igual a var-lista um.dtipo,"}, {"start": 349.882, "end": 353.312, "text": "e var-lista dois.dtipo igual a var-lista um.dtipo."}, {"start": 353.632, "end": 355.371, "text": "var-lista vai em id:"}, {"start": 355.371, "end": 358.014, "text": "id.dtipo igual a var-lista.dtipo."}, {"start": 358.334, "end": 359.783, "text": "E tipo vai em integer:"}, {"start": 359.783, "end": 361.18, "text": "dtipo igual a inteiro."}, {"start": 361.18, "end": 362.318, "text": "Tipo vai em real:"}, {"start": 362.318, "end": 363.559, "text": "dtipo igual a real."}, {"start": 364.059, "end": 366.912, "text": "Questão dois: o ambiente de execução depois de entrar"}, {"start": 366.912, "end": 368.27, "text": "no bloco A da função g."}, {"start": 368.59, "end": 370.599, "text": "Globais: um vetor a de dez inteiros,"}, {"start": 370.599, "end": 373.157, "text": "e um ponteiro s apontando para a string hello."}, {"start": 373.477, "end": 374.57, "text": "O main chama g,"}, {"start": 374.57, "end": 375.336, "text": "passando s."}, {"start": 375.656, "end": 376.972, "text": "Em g, o parâmetro s,"}, {"start": 376.972, "end": 378.187, "text": "a variável local c,"}, {"start": 378.187, "end": 380.111, "text": "que recebe o primeiro caractere,"}, {"start": 380.111, "end": 381.377, "text": "o h. E no bloco A,"}, {"start": 381.377, "end": 382.44, "text": "um novo vetor a,"}, {"start": 382.44, "end": 383.554, "text": "de cinco inteiros."}, {"start": 383.874, "end": 385.423, "text": "Plano: primeiro a área global,"}, {"start": 385.423, "end": 386.8, "text": "depois o registro do main,"}, {"start": 386.8, "end": 388.048, "text": "depois o registro de g."}, {"start": 388.548, "end": 390.55, "text": "Na área global, primeiro o vetor a:"}, {"start": 390.55, "end": 392.599, "text": "dez posições, de a zero até a nove."}, {"start": 392.919, "end": 394.933, "text": "Depois o s, com a string hello:"}, {"start": 394.933, "end": 395.759, "text": "h, e, l, l,"}, {"start": 395.759, "end": 397.204, "text": "o, e o caractere nulo,"}, {"start": 397.204, "end": 398.908, "text": "que marca o fim da string."}, {"start": 399.228, "end": 401.34, "text": "Pegadinha: a string tem seis posições,"}, {"start": 401.34, "end": 404.062, "text": "não cinco, por causa do caractere nulo no final."}, {"start": 404.562, "end": 407.495, "text": "Agora a pilha. O main não tem variáveis locais,"}, {"start": 407.495, "end": 409.708, "text": "então o registro dele aparece vazio."}, {"start": 410.028, "end": 411.606, "text": "Em cima, o registro de g."}, {"start": 411.606, "end": 412.987, "text": "Primeiro o parâmetro s,"}, {"start": 412.987, "end": 415.354, "text": "que contém o endereço base do s global,"}, {"start": 415.354, "end": 416.537, "text": "apontando para o h."}, {"start": 416.857, "end": 418.478, "text": "Depois a vinculação de controle,"}, {"start": 418.478, "end": 420.228, "text": "apontando para o registro do main,"}, {"start": 420.228, "end": 421.508, "text": "e o endereço de retorno."}, {"start": 421.828, "end": 422.945, "text": "Depois a local c,"}, {"start": 422.945, "end": 423.909, "text": "com o valor h."}, {"start": 424.229, "end": 426.04, "text": "E, como estamos dentro do bloco A,"}, {"start": 426.04, "end": 426.945, "text": "o vetor a local:"}, {"start": 426.945, "end": 428.238, "text": "de a zero até a quatro."}, {"start": 428.238, "end": 430.308, "text": "Ele esconde o a global dentro do bloco."}, {"start": 430.628, "end": 432.936, "text": "Por fim, o sp marca o topo da pilha."}, {"start": 433.436, "end": 435.995, "text": "Questão três: a pilha durante a instrução b igual"}, {"start": 435.995, "end": 436.689, "text": "a c mais c,"}, {"start": 436.689, "end": 438.294, "text": "com as vinculações de controle."}, {"start": 438.614, "end": 439.595, "text": "Há uma global a,"}, {"start": 439.595, "end": 441.043, "text": "que não aparece na pilha."}, {"start": 441.043, "end": 442.351, "text": "O main tem a local b,"}, {"start": 442.351, "end": 443.191, "text": "que vale três."}, {"start": 443.511, "end": 444.89, "text": "O main chama duplica,"}, {"start": 444.89, "end": 447.701, "text": "passando b. Então o parâmetro c recebe três."}, {"start": 448.021, "end": 450.788, "text": "Dentro de duplica, a local b recebe c mais"}, {"start": 450.788, "end": 452.013, "text": "c: três mais três,"}, {"start": 452.013, "end": 452.385, "text": "seis."}, {"start": 452.705, "end": 454.899, "text": "Atenção: existem dois b diferentes."}, {"start": 454.899, "end": 456.451, "text": "O b do main vale três;"}, {"start": 456.451, "end": 458.164, "text": "o b de duplica vale seis."}, {"start": 458.664, "end": 459.711, "text": "Montando a pilha."}, {"start": 460.031, "end": 461.632, "text": "Primeiro, o registro do main,"}, {"start": 461.632, "end": 462.775, "text": "com b igual a três."}, {"start": 463.095, "end": 464.73, "text": "Depois, empilhado sobre ele,"}, {"start": 464.73, "end": 466.068, "text": "o registro de duplica:"}, {"start": 466.068, "end": 467.753, "text": "o parâmetro c igual a três."}, {"start": 468.073, "end": 469.492, "text": "A vinculação de controle,"}, {"start": 469.492, "end": 471.433, "text": "apontando para o registro do main."}, {"start": 471.433, "end": 472.852, "text": "E o endereço de retorno."}, {"start": 473.172, "end": 474.077, "text": "E a local b,"}, {"start": 474.077, "end": 475.3, "text": "com seis. Por fim,"}, {"start": 475.3, "end": 477.162, "text": "o sp marca o topo da pilha."}, {"start": 477.662, "end": 480.384, "text": "Questão quatro: diferenciar passagem por valor e"}, {"start": 480.384, "end": 482.037, "text": "por referência, com exemplos."}, {"start": 482.357, "end": 485.419, "text": "Por valor: a função somarDez recebe uma cópia de"}, {"start": 485.419, "end": 487.108, "text": "x. Ela soma dez na cópia."}, {"start": 487.108, "end": 489.114, "text": "Dentro da função aparece quinze,"}, {"start": 489.114, "end": 491.067, "text": "mas no main, x continua cinco."}, {"start": 491.387, "end": 493.293, "text": "Por referência: com o e comercial,"}, {"start": 493.293, "end": 495.153, "text": "a função recebe o endereço de x."}, {"start": 495.153, "end": 496.734, "text": "Somar dez muda o próprio x,"}, {"start": 496.734, "end": 499.012, "text": "que passa a valer quinze também no main."}, {"start": 499.332, "end": 502.054, "text": "Na resposta, escreva as duas definições e mostre"}, {"start": 502.054, "end": 504.633, "text": "os dois exemplos com o resultado final de x."}, {"start": 505.133, "end": 508.096, "text": "Questão cinco: código de três endereços para x igual"}, {"start": 508.096, "end": 509.195, "text": "a dois vezes três,"}, {"start": 509.195, "end": 510.581, "text": "mais quatro vezes cinco."}, {"start": 510.901, "end": 513.639, "text": "Pela precedência, as multiplicações vêm primeiro."}, {"start": 513.639, "end": 515.545, "text": "Na árvore, o mais fica na raiz,"}, {"start": 515.545, "end": 517.55, "text": "com as duas multiplicações embaixo."}, {"start": 517.87, "end": 520.898, "text": "Primeira multiplicação: T1 igual a dois vezes três."}, {"start": 521.218, "end": 523.946, "text": "Segunda: T2 igual a quatro vezes cinco."}, {"start": 524.266, "end": 526.722, "text": "E a raiz: x igual a T1 mais T2."}, {"start": 526.722, "end": 527.86, "text": "Três instruções."}, {"start": 528.36, "end": 530.538, "text": "Questão seis: um for com um if e else"}, {"start": 530.538, "end": 530.955, "text": "dentro."}, {"start": 531.275, "end": 533.099, "text": "Primeiro, reescreva o for como while:"}, {"start": 533.099, "end": 533.929, "text": "i igual a zero;"}, {"start": 533.929, "end": 535.338, "text": "enquanto i menor que quatro;"}, {"start": 535.338, "end": 537.08, "text": "e o i mais mais no fim do corpo."}, {"start": 537.4, "end": 538.769, "text": "Dentro do laço, o if:"}, {"start": 538.769, "end": 540.089, "text": "se i menor que dois,"}, {"start": 540.089, "end": 541.357, "text": "a recebe a mais um."}, {"start": 541.357, "end": 543.133, "text": "Senão, a recebe a mais dois."}, {"start": 543.453, "end": 545.609, "text": "Vamos precisar de quatro rótulos:"}, {"start": 545.609, "end": 547.101, "text": "L1 no início do laço,"}, {"start": 547.101, "end": 548.815, "text": "L2 na saída, L3 no else,"}, {"start": 548.815, "end": 550.197, "text": "e L4 no fim do if."}, {"start": 550.697, "end": 553.177, "text": "Montando o código. Primeiro a inicialização:"}, {"start": 553.177, "end": 554.149, "text": "i igual a zero."}, {"start": 554.469, "end": 557.052, "text": "Depois, label L1, o início do laço."}, {"start": 557.372, "end": 558.736, "text": "A condição do laço:"}, {"start": 558.736, "end": 560.895, "text": "t1 igual a i menor que quatro."}, {"start": 560.895, "end": 562.487, "text": "E if_false t1 goto L2:"}, {"start": 562.487, "end": 564.362, "text": "se for falsa, sai do laço."}, {"start": 564.682, "end": 567.289, "text": "Agora o if: t2 igual a i menor que"}, {"start": 567.289, "end": 569.362, "text": "dois. E if_false t2 goto L3:"}, {"start": 569.362, "end": 571.613, "text": "se for falso, vai para o else."}, {"start": 572.113, "end": 575.08, "text": "A parte verdadeira: t3 igual a a mais um,"}, {"start": 575.08, "end": 576.301, "text": "e a igual a t3."}, {"start": 576.301, "end": 578.57, "text": "Depois, goto L4, pulando o else."}, {"start": 578.89, "end": 580.226, "text": "O else: label L3,"}, {"start": 580.226, "end": 582.05, "text": "t4 igual a a mais dois,"}, {"start": 582.05, "end": 583.326, "text": "e a igual a t4."}, {"start": 583.646, "end": 584.586, "text": "O fim do if:"}, {"start": 584.586, "end": 586.688, "text": "label L4. E então o incremento:"}, {"start": 586.688, "end": 588.238, "text": "t5 igual a i mais um,"}, {"start": 588.238, "end": 589.399, "text": "e i igual a t5."}, {"start": 589.719, "end": 592.606, "text": "Goto L1, voltando para o início do laço."}, {"start": 592.606, "end": 594.137, "text": "E por fim, label L2,"}, {"start": 594.137, "end": 594.785, "text": "a saída."}, {"start": 595.105, "end": 597.261, "text": "Conferindo: com i igual a zero e um,"}, {"start": 597.261, "end": 599.416, "text": "soma um; com i igual a dois e três,"}, {"start": 599.416, "end": 600.613, "text": "soma dois. No total,"}, {"start": 600.613, "end": 601.523, "text": "a aumenta seis."}, {"start": 602.023, "end": 603.194, "text": "Revisão para a prova."}, {"start": 603.514, "end": 605.949, "text": "Gramática de atributos: uma linha por regra,"}, {"start": 605.949, "end": 607.12, "text": "e o tipo é herdado:"}, {"start": 607.12, "end": 608.759, "text": "passa da lista para cada id."}, {"start": 609.079, "end": 610.693, "text": "Ambiente: globais lá em cima,"}, {"start": 610.693, "end": 612.536, "text": "um registro por chamada na pilha,"}, {"start": 612.536, "end": 615.21, "text": "vinculação de controle apontando para quem chamou,"}, {"start": 615.21, "end": 616.178, "text": "e o sp no topo."}, {"start": 616.498, "end": 617.963, "text": "Parâmetros: valor é cópia,"}, {"start": 617.963, "end": 619.334, "text": "referência é o endereço."}, {"start": 619.654, "end": 621.871, "text": "Três endereços: um operador por linha,"}, {"start": 621.871, "end": 624.286, "text": "com temporários. E for vira inicialização,"}, {"start": 624.286, "end": 626.208, "text": "while e incremento, com if_false,"}, {"start": 626.208, "end": 627.095, "text": "goto e labels."}, {"start": 627.415, "end": 628.709, "text": "Agora é com você."}, {"start": 628.709, "end": 629.473, "text": "Boa prova!"}];
