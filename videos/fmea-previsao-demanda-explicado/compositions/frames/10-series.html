    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var FID = "10-series";
        var scope = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        function $(id) { return scope.querySelector("#" + id); }

        // ---- deterministic data: series = level + trend + seasonal (stepped) + noise (stepped)
        var N = 24;
        var level = [], trend = [], season = [], noise = [], series = [];
        var NOISE = [0.04, -0.05, 0.02, 0.06, -0.03, 0.01, -0.06, 0.03, 0.05, -0.02, -0.05, 0.04,
                     0.00, 0.06, -0.04, 0.02, -0.06, 0.05, 0.01, -0.03, 0.04, -0.05, 0.03, -0.01];
        for (var i = 0; i < N; i++) {
          level.push(0.35);
          trend.push(0.28 * i / (N - 1));
          season.push((i % 8) < 4 ? 0.13 : -0.13);
          noise.push(NOISE[i]);
          series.push(level[i] + trend[i] + season[i] + noise[i]);
        }

        function range(arr) {
          var mn = Infinity, mx = -Infinity;
          arr.forEach(function (v) { if (v < mn) mn = v; if (v > mx) mx = v; });
          return [mn, mx];
        }

        // main chart: x 140..1212, y 170..420
        (function () {
          var r = range(series), x0 = 140, x1 = 1212, yTop = 170, yBot = 420;
          var dx = (x1 - x0) / (N - 1);
          var d = "";
          series.forEach(function (v, k) {
            var y = yBot - (v - r[0]) / (r[1] - r[0]) * (yBot - yTop);
            d += (k === 0 ? "M " : " L ") + (x0 + k * dx).toFixed(1) + " " + y.toFixed(1);
          });
          $("s10-series").setAttribute("d", d);
        })();

        // band paths: plot area x 400..1212, band k spans top (480+100k+12) .. (480+100k+68)
        var BX0 = 400, BX1 = 1212, BDX = (BX1 - BX0) / (N - 1);
        function bandY(k, t) { var top = 480 + 100 * k + 14, bot = 480 + 100 * k + 66; return bot - t * (bot - top); }

        // 0 level: straight horizontal
        $("s10-comp-0").setAttribute("d", "M " + BX0 + " " + bandY(0, 0.5) + " L " + BX1 + " " + bandY(0, 0.5));
        // 1 trend: inclined line
        $("s10-comp-1").setAttribute("d", "M " + BX0 + " " + bandY(1, 0.05) + " L " + BX1 + " " + bandY(1, 0.95));
        // stepped builder (square steps, straight segments only)
        function stepped(k, arr) {
          var r = range(arr), d = "";
          var norm = function (v) { return (v - r[0]) / (r[1] - r[0]); };
          d = "M " + BX0 + " " + bandY(k, norm(arr[0])).toFixed(1);
          for (var j = 1; j < arr.length; j++) {
            var x = BX0 + j * BDX;
            d += " H " + x.toFixed(1) + " V " + bandY(k, norm(arr[j])).toFixed(1);
          }
          d += " H " + (BX1 + BDX * 0).toFixed(1);
          return d;
        }
        $("s10-comp-2").setAttribute("d", stepped(2, season));
        $("s10-comp-3").setAttribute("d", stepped(3, noise));

        // ---- dash setup (measured, svg-path-draw)
        var drawIds = ["s10-axis-y", "s10-axis-xl", "s10-series", "s10-spine",
                       "s10-base-0", "s10-base-1", "s10-base-2", "s10-base-3",
                       "s10-comp-0", "s10-comp-1", "s10-comp-2", "s10-comp-3"];
        var LEN = {};
        drawIds.forEach(function (id) {
          var p = $(id);
          var len = Math.ceil(p.getTotalLength() * 1.02) + 2;
          LEN[id] = len;
          p.style.strokeDasharray = len + " " + len;
          p.style.strokeDashoffset = len;
        });
        function draw(tl, id, dur, at, ease) {
          tl.fromTo($(id), { strokeDashoffset: LEN[id] },
            { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" }, at);
        }

        var tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0–2.4): axes + label, series draws on "séries temporais" (1.2s)
        draw(tl, "s10-axis-y", 0.45, 0.1);
        draw(tl, "s10-axis-xl", 0.6, 0.25);
        tl.fromTo($("s10-chart-label"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 0.2);
        tl.fromTo($("s10-axis-x"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.6);
        tl.fromTo($("s10-glitch-wrap").children, { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power2.out", stagger: 0.07 }, 0.3);
        tl.fromTo($("s10-glitch-wrap"), { opacity: 0 }, { opacity: 0.55, duration: 0.3, ease: "power1.out" }, 0.3);
        draw(tl, "s10-series", 1.2, 1.0, "none");

        // ---- Scene 2 (2.4–5.6): the series splits into stacked layers below
        draw(tl, "s10-spine", 0.6, 2.4, "power2.inOut");
        draw(tl, "s10-base-0", 0.5, 2.6);
        draw(tl, "s10-base-1", 0.5, 2.72);
        draw(tl, "s10-base-2", 0.5, 2.84);
        draw(tl, "s10-base-3", 0.5, 2.96);

        var cues = [3.4, 4.0, 4.7, 6.2];
        var durs = [0.45, 0.5, 0.7, 0.6];
        cues.forEach(function (t, k) {
          tl.fromTo($("s10-lab-" + k), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, t - 0.1);
          draw(tl, "s10-comp-" + k, durs[k], t, k >= 2 ? "none" : "power2.out");
          tl.fromTo($("s10-ord-" + k), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, t + durs[k] - 0.1);
        });

        // ---- Scene 3 (5.6–7.06): random layer lands (6.2), all layers + series hold together
        // quiet settle: series stroke firms up as the decomposition completes
        tl.fromTo($("s10-series"), { strokeWidth: 5 }, { strokeWidth: 6, duration: 0.5, ease: "power1.out" }, 6.5);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
