        tl.fromTo($("e12-base"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0);

        tl.fromTo($("e12-bar-real"), { scaleY: 0 }, { scaleY: 1, duration: 1.0, ease: "power2.out" }, 1.1);
        tl.fromTo($("e12-val-real"), { y: 520, opacity: 0 }, { y: 0, opacity: 1, duration: 1.0, ease: "power2.out" }, 1.1);
        tl.fromTo(count, { v: 0 }, {

        tl.fromTo($("e12-val-real"), { scale: 0.85 }, { scale: 1, duration: 1.0, ease: "power2.out" }, 1.1);

        // ---- Scene 2 (2.3–5.0): formula at "Erro" (2.3s); gap marked +80 at 4.3s

          { opacity: 1, x: 220, y: 300, scale: 1.1, duration: 0.5, ease: "power3.out" }, 2.3);
