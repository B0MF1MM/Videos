    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var qa = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

        // Build 10 cells per row
        var VALUES = { s: 8, o: 7, d: 6 };
        ["s", "o", "d"].forEach(function (k) {
          var host = q("#r06-cells-" + k);
          for (var i = 0; i < 10; i++) {
            var c = document.createElement("div");
            c.className = "r06-cell";
            if (i < VALUES[k]) {
              var on = document.createElement("div");
              on.className = "r06-on r06-on-" + k;
              on.setAttribute("data-i", String(i));
              c.appendChild(on);
            }
            host.appendChild(c);
          }
        });

        var tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0–2.4): chrome, bars fill, numbers + NPR count up ----
        tl.fromTo(["#r06-hair-top", "#r06-hair-bot"].map(q), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0);
        tl.fromTo([q("#r06-chrome-l"), q("#r06-chrome-r")], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.05);
        tl.fromTo(qa(".r06-letter, .r06-word"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", stagger: 0.06 }, 0.1);

        var COUNT_AT = 0.2, COUNT_DUR = 1.4, COUNT_EASE = "power3.out";
        var nums = {};
        ["s", "o", "d"].forEach(function (k, r) {
          var el = q("#r06-num-" + k);

          nums[k] = { el: el, st: st };
          tl.fromTo(qa(".r06-on-" + k), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out", stagger: (COUNT_DUR - 0.35) / VALUES[k] }, COUNT_AT + r * 0.08);
          tl.fromTo(st, { v: 0 }, {
            v: VALUES[k], duration: COUNT_DUR, ease: COUNT_EASE,
            onUpdate: function () { el.textContent = String(Math.round(st.v)); }
          }, COUNT_AT + r * 0.08);
          tl.fromTo(el, { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT + r * 0.08);
        });

        var nprEl = q("#r06-npr-val");
        var npr = { v: 0 };
        tl.fromTo(q("#r06-npr-label"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);
        tl.fromTo(npr, { v: 0 }, {
          v: 336, duration: 1.8, ease: COUNT_EASE,
          onUpdate: function () { nprEl.textContent = String(Math.round(npr.v)); }
        }, 0.3);
        tl.fromTo(nprEl, { scale: 0.5 }, { scale: 1, duration: 1.8, ease: COUNT_EASE }, 0.3);

        // ---- Scene 2 (2.4–5.0): action tags ----
        [["#r06-tag1", 2.4], ["#r06-tag2", 3.8]].forEach(function (p) {
          tl.fromTo(q(p[0]), { clipPath: "inset(0 100% 0 0)", y: -14 }, { clipPath: "inset(0 0% 0 0)", y: 0, duration: 0.55, ease: "power3.out" }, p[1]);
        });

        // ---- Scene 3 (5.0–7.6): O 7→3, D 6→2 ----
        function recede(k, from, to, at) {
          var dropping = qa(".r06-on-" + k).filter(function (n) { return Number(n.getAttribute("data-i")) >= to; }).reverse();
          var D = 1.0;
          tl.fromTo(dropping, { scaleX: 1 }, { scaleX: 0, duration: 0.3, ease: "power2.in", stagger: (D - 0.3) / Math.max(1, dropping.length - 1), immediateRender: false }, at);
          var n = nums[k];
          tl.fromTo(n.st, { v: from }, {
            v: to, duration: D, ease: "power2.inOut", immediateRender: false,
            onUpdate: function () { n.el.textContent = String(Math.round(n.st.v)); }
          }, at);
          tl.fromTo(n.el, { scale: 1.25 }, { scale: 1, duration: D, ease: "power2.out", immediateRender: false }, at);
        }
        recede("o", 7, 3, 5.6);
        recede("d", 6, 2, 6.8);

        // ---- Scene 4 (7.6–11.4): S holds, gets locked mark ----
        tl.fromTo(q("#r06-mark-a"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 7.8);
        tl.fromTo(q("#r06-lock"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power2.inOut" }, 8.1);
