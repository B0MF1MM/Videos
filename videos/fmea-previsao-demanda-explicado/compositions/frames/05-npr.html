  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // formula starts centered (x = -350 → true center), slides right at "Exemplo"
      var FORMULA_SHIFT = -350;

      // slow ambient camera drift underneath the whole shot
      tl.fromTo("#f05-cam", { scale: 1 }, { scale: 1.012, duration: 12.3, ease: "none" }, 0);

      // ---- Scene 1 (0.0–2.0): formula assembles term by term ----
      // the three factors arrive first ("as três"), then the × signs, then "NPR =" lands on "NPR" (1.3s)
      tl.set("#f05-formula", { x: FORMULA_SHIFT }, 0);
      tl.fromTo(["#f05-s-l", "#f05-o-l", "#f05-d-l"],
        { opacity: 0, y: 46 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.14 }, 0.25);
      tl.fromTo(["#f05-x1", "#f05-x2"],
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)", stagger: 0.1 }, 0.8);
      tl.fromTo("#f05-t-eq",
        { opacity: 0, x: 30 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.15);
      tl.fromTo("#f05-t-npr",
        { opacity: 0, x: -60 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.25);

      // ---- Scene 2 (2.0–4.1): spelled-out caption under NPR ----
      tl.fromTo("#f05-npr-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 2.15);
      tl.fromTo("#f05-npr-cap",
        { opacity: 0, y: 14, x: FORMULA_SHIFT },
        { opacity: 1, y: 0, x: FORMULA_SHIFT, duration: 0.5, ease: "power2.out" }, 2.25);
      tl.set("#f05-npr-rule", { x: FORMULA_SHIFT }, 0);

      // ---- Scene 3 (4.1–8.5): example card enters left, formula slides right ----
      var SLIDE_AT = 4.15;
      tl.to(["#f05-formula", "#f05-npr-rule", "#f05-npr-cap"],
        { x: 0, duration: 0.9, ease: "power3.inOut" }, SLIDE_AT);
      tl.fromTo("#f05-card",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: "power3.inOut" }, SLIDE_AT + 0.1);
      tl.fromTo("#f05-card-tag", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 4.6);
      tl.fromTo("#f05-card-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 4.7);
      tl.fromTo(["#f05-cl1", "#f05-cl2", "#f05-cl3"],
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.35 }, 5.1);
      tl.fromTo("#f05-qr", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 6.2);
      // "vazamento" at 7.6s
      tl.fromTo("#f05-arrow", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 7.45);
      tl.fromTo("#f05-leak", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 7.6);

      // ---- Scene 4 (8.5–11.8): letters swap to numbers in place (scale-swap) ----
      var EXIT_DUR = 0.3, ENTER_DUR = 0.55, OVERLAP = 0.12, EXIT_SCALE = 0.7;
      function swap(letter, digit, tick, label, cue) {
        var trig = cue - EXIT_DUR + OVERLAP; // the digit starts arriving right on the spoken cue
        tl.to(letter, { scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in" }, trig);
        tl.fromTo(digit,
          { scale: EXIT_SCALE, opacity: 0 },
          { scale: 1, opacity: 1, duration: ENTER_DUR, ease: "back.out(1.8)" }, trig + EXIT_DUR - OVERLAP);
        tl.fromTo(tick, { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power2.out" }, cue + 0.25);
        tl.fromTo(label, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, cue + 0.3);
      }
      swap("#f05-s-l", "#f05-s-n", "#f05-s-tick", "#f05-s-lab", 9.3);
      swap("#f05-o-l", "#f05-o-n", "#f05-o-tick", "#f05-o-lab", 10.4);
      swap("#f05-d-l", "#f05-d-n", "#f05-d-tick", "#f05-d-lab", 11.3);

      // ---- Scene 5 (11.8–14.27): "igual a" → 336 counts up in inverted block, camera push ----
      tl.fromTo("#f05-eq2", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 11.95);
      tl.fromTo("#f05-block",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "power3.out" }, 12.05);
      tl.fromTo("#f05-block-tag", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 12.3);

      var COUNT_AT = 12.1, COUNT_DUR = 0.8, COUNT_EASE = "power3.out";
      var counter = document.getElementById("f05-count");
      var state = { value: 0 };
      tl.fromTo(state, { value: 0 }, {
        value: 336, duration: COUNT_DUR, ease: COUNT_EASE,
        onUpdate: function () { counter.textContent = String(Math.round(state.value)); }
      }, COUNT_AT);
      tl.fromTo("#f05-count", { scale: 0.55 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);

      // camera pushes gently toward the right of the formula, then holds
      tl.to("#f05-cam", { scale: 1.06, duration: 1.3, ease: "power2.inOut" }, 12.4);

      // hold still to the end of the frame
      tl.set({}, {}, 14.272);

      window.__timelines["05-npr"] = tl;
    })();
  </script>
