      (function () {
        const ID = "09-horizontes";
        const tl = gsap.timeline({ paused: true });
        const scope = document.querySelector('[data-composition-id="' + ID + '"]') || document;
        const q = (s) => scope.querySelector(s);

        // Content-driven schedule (dynamic-content-sequencing): every reveal is
        // pre-computed once from a flat array keyed to the voiceover cues.
        const BANDS = [
          { n: 1, cue: 1.2 },  // "curto"
          { n: 2, cue: 1.7 },  // "médio"
          { n: 3, cue: 2.2 },  // "longo prazo"
        ];
        const DECISIONS = [
          { n: 1, cue: 4.3 },  // "operacional"
          { n: 2, cue: 5.1 },  // "tática"
          { n: 3, cue: 5.8 },  // "estratégica"
        ];
        const CARDS = [
          { n: 1, cue: 10.6 }, // "Delphi com especialistas"
          { n: 2, cue: 12.5 }, // "pesquisa de mercado"
          { n: 3, cue: 13.7 }, // "força de vendas"
        ];
        const SHRINK_AT = 6.8;
        const PIVOT_AT = 9.2;

        // Furniture: present from frame 0
        tl.fromTo([q("#h09-hair-top"), q("#h09-hair-bot")], { scaleX: 0, transformOrigin: "0 50%" },
          { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0);
        tl.fromTo([q("#h09-chrome-l"), q("#h09-chrome-r")], { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);
        tl.fromTo([q("#h09-colhead-a")], { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.3);

        // Scene 1 — the time ruler: bands grow left→right, widening like a scale
        BANDS.forEach((b) => {
          const t = b.cue - 0.25;
          tl.fromTo(q("#h09-fill-" + b.n), { scaleX: 0 },
            { scaleX: 1, duration: 0.55, ease: "power3.out" }, t);
          tl.fromTo(q("#h09-lab-" + b.n), { opacity: 0, x: -16 },
            { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, t + 0.18);
        });

        // Scene 2 — straight connectors draw out to each decision type
        scope.querySelectorAll(".h09-wires path").forEach((p) => {
          const len = p.getTotalLength();
          p.style.strokeDasharray = len + "";
          p.style.strokeDashoffset = len + "";
        });
        tl.fromTo(q("#h09-colhead-b"), { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, DECISIONS[0].cue - 0.5);
        DECISIONS.forEach((d) => {
          const t = d.cue - 0.35;
          tl.to(q("#h09-wire-" + d.n), { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, t);
          tl.fromTo(q("#h09-mark-" + d.n), { scale: 0 },
            { scale: 1, duration: 0.2, ease: "power2.out" }, t + 0.32);
          tl.fromTo(q("#h09-dec-" + d.n), { opacity: 0, x: -20 },
            { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, t + 0.36);
        });

        // Scene 3 — ruler rises and shrinks to the top; pivot rule + label
        tl.fromTo(q("#h09-group"), { scale: 1, y: 0 },
          { scale: 0.68, y: -80, duration: 0.9, ease: "power3.inOut" }, SHRINK_AT);
        const pl = q("#h09-pivot-line");
        const plen = pl.getTotalLength();
        pl.style.strokeDasharray = plen + "";
        pl.style.strokeDashoffset = plen + "";
        tl.to(pl, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, PIVOT_AT - 0.6);
        tl.fromTo(q("#h09-pivot"), { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, PIVOT_AT);

        // Scene 4 — triptych assembles card by card into its slot, then holds

          const t = c.cue - 0.2;
          tl.fromTo(q("#h09-card-" + c.n), { opacity: 0, y: 36 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
          tl.fromTo(q("#h09-nr-" + c.n), { scaleX: 0 },
            { scaleX: 1, duration: 0.5, ease: "power2.out" }, t + 0.15);
        });

        // Quiet hold to the end (no exit — the root transition owns it)
        tl.to({}, { duration: 0.01 }, 14.689);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
