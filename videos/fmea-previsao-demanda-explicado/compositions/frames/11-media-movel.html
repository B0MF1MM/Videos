    .m11-pl1, .m11-pw1 { left: 58px; } .m11-pl2, .m11-pw2 { left: 207px; } .m11-pl3, .m11-pw3 { left: 356px; }
  </style>

  <div id="root" data-composition-id="11-media-movel" data-width="1920" data-height="1080">
    <div class="m11-ground clip" id="m11-ground" data-start="0" data-duration="13.76" data-track-index="0"></div>

    <div class="m11-layer clip" id="m11-content" data-start="0" data-duration="13.76" data-track-index="1">
      <div class="m11-chrome m11-chrome-l" id="m11-tag">AULAS 4–5 · OPERAÇÕES</div>
      <div class="m11-chrome m11-chrome-r" id="m11-num">11 / 13</div>
      <div class="m11-hair m11-hair-top" id="m11-hair-top"></div>
      <div class="m11-hair m11-hair-bot" id="m11-hair-bot"></div>

      <div class="m11-cam" id="m11-cam">

        <div class="m11-pw m11-pw2" id="m11-pw2"><span>0,3</span></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const tl = gsap.timeline({ paused: true });
        const INK = "#1F2BE0", PAPER = "#F0EBDE";
        const CLIP_HIDDEN = "inset(100% 0% 0% 0%)", CLIP_SHOWN = "inset(0% 0% 0% 0%)";

        // ── camera: slow continuous push toward the forecast column (full duration)
        tl.fromTo($("m11-cam"), { scale: 1 }, { scale: 1.03, duration: 13.76, ease: "none" }, 0);

        // ── Scene 1 (0.0–3.4): chrome, headline, axis + labels
        tl.fromTo([$("m11-hair-top"), $("m11-hair-bot")], { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0);
        tl.fromTo([$("m11-tag"), $("m11-num")], { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.05);
        tl.fromTo("#m11-headline .m11-w", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.12 }, 0.1);
        tl.fromTo($("m11-baseline"), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 0.7);
        tl.fromTo([$("m11-tr1"), $("m11-tr2"), $("m11-tr3"), $("m11-tr4")], { clipPath: CLIP_HIDDEN }, { clipPath: CLIP_SHOWN, duration: 0.8, ease: "power2.out", stagger: 0.12 }, 1.2);
        tl.fromTo([$("m11-l1"), $("m11-l2"), $("m11-l3")], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.18 }, 1.5);
        tl.fromTo($("m11-l4"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.3);

        // ── Scene 2 (3.4–5.9): bars grow on each value cue
        const bars = [["m11-f1", "m11-v1", 4.1], ["m11-f2", "m11-v2", 4.7], ["m11-f3", "m11-v3", 5.1]];
        bars.forEach(([f, v, at]) => {
          tl.fromTo($(f), { clipPath: CLIP_HIDDEN }, { clipPath: CLIP_SHOWN, duration: 0.6, ease: "power3.out" }, at - 0.4);
          tl.fromTo($(v), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at - 0.05);
        });

        // ── Scene 3 (5.9–8.8): formula writes term by term, "÷ 3" highlights
        const terms = [["m11-t1", 5.9], ["m11-t2", 6.2], ["m11-t3", 6.5], ["m11-div", 6.8]];
        terms.forEach(([id, at]) => {
          tl.fromTo($(id), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, at);
        });
        tl.fromTo($("m11-div"), { backgroundColor: "rgba(31,43,224,0)", color: INK }, { backgroundColor: INK, color: PAPER, duration: 0.25, ease: "power2.out" }, 7.0);
        tl.fromTo($("m11-div"), { scale: 1 }, { scale: 1.08, duration: 0.25, ease: "power2.out" }, 7.0);
        tl.to($("m11-div"), { scale: 1, duration: 0.4, ease: "power2.inOut" }, 7.25);

        // ── Scene 4 (8.8–10.0): forecast bar grows solid, number counts to 1.000
        const COUNT_AT = 8.8, COUNT_DUR = 1.2, COUNT_EASE = "power3.out";
        tl.fromTo($("m11-f4"), { clipPath: CLIP_HIDDEN }, { clipPath: CLIP_SHOWN, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
        const hero = $("m11-hero");
        const state = { v: 0 };
        const fmt = (n) => { const r = Math.round(n); return r >= 1000 ? Math.floor(r / 1000) + "." + String(r % 1000).padStart(3, "0") : String(r); };
        tl.fromTo(state, { v: 0 }, { v: 1000, duration: COUNT_DUR, ease: COUNT_EASE, onUpdate: () => { hero.textContent = fmt(state.v); } }, COUNT_AT);
        tl.fromTo(hero, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);

        // ── Scene 5 (10.0–13.76): weighted panel (30%), weights, 0,5 inverts — hold
        tl.fromTo($("m11-panel"), { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.out" }, 10.6);
        tl.fromTo($("m11-ptitle"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 10.8);
        tl.fromTo([$("m11-prule"), $("m11-pbase")], { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 10.85);
        tl.fromTo([$("m11-pf1"), $("m11-pf2"), $("m11-pf3")], { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out", stagger: 0.15 }, 11.0);
        tl.fromTo([$("m11-pl1"), $("m11-pl2"), $("m11-pl3")], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.15 }, 11.05);
        tl.fromTo([$("m11-pw1"), $("m11-pw2"), $("m11-pw3")], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.15 }, 11.2);
        tl.fromTo($("m11-pw3s"), { backgroundColor: "rgba(31,43,224,0)", color: INK }, { backgroundColor: INK, color: PAPER, duration: 0.25, ease: "power2.out" }, 12.1);
        tl.fromTo($("m11-pw3s"), { scale: 1 }, { scale: 1.12, duration: 0.25, ease: "power2.out" }, 12.1);
        tl.to($("m11-pw3s"), { scale: 1, duration: 0.45, ease: "power2.inOut" }, 12.35);

        // pad to full duration (hold)
        tl.set({}, {}, 13.76);

        window.__timelines = window.__timelines || {};
        window.__timelines["11-media-movel"] = tl;
      })();
    </script>
