<style>
  .tb { position: absolute; width: 420px; height: 240px; border-radius: 18px; background: #182238; border: 3px solid #2A3656; }
  .tb .h { position: absolute; left: 22px; top: 16px; font-family: "DM Mono", monospace; font-size: 24px; color: #8C97B5; }
  .tb .r { position: absolute; left: 22px; font-family: "DM Mono", monospace; font-size: 28px; color: #EEF1F8; }
</style>
<div id="@t" class="k-title" style="left:120px;top:124px;font-size:60px">Uma tabela <em>por escopo</em></div>
<div id="@g" class="tb" style="left:120px;top:300px"><div class="h">global</div><div class="r" style="top:70px">i : int</div><div class="r" style="top:116px">j : int</div><div class="r" style="top:162px">f : função</div></div>
<div id="@f" class="tb" style="left:720px;top:300px;border-color:#FFD24A"><div class="h">f</div><div class="r" style="top:70px">tamanho : int</div><div class="r" style="top:116px">i : char</div><div class="r" style="top:162px">temp : char</div></div>
<div id="@b" class="tb" style="left:1320px;top:300px;border-color:#7FE39A"><div class="h">bloco interno</div><div class="r" style="top:70px">j : double</div></div>
<svg class="k-svg">
  <path id="@l1" class="arrow" d="M 1316 420 L 1150 420 M 1168 406 L 1150 420 L 1168 434" stroke="#8C97B5" />
  <path id="@l2" class="arrow" d="M 716 420 L 550 420 M 568 406 L 550 420 L 568 434" stroke="#8C97B5" />
</svg>
<div id="@q" class="k-chip k-c-cyan" style="left:1340px;top:590px;font-size:30px;background:#0D1322">procura "j"? acha aqui</div>
<div id="@q2" class="k-chip k-c-cyan" style="left:1060px;top:650px;font-size:30px;background:#0D1322">procura "i"? não está → sobe para f ✓</div>
<div id="@ptr" class="k-chip k-c-green" style="left:120px;top:590px;font-size:28px;background:#13241A">sair do escopo = mover o ponteiro (sem remover nada)</div>
<div id="@mac" class="k-macete" style="left:120px;top:730px;width:1680px;font-size:32px">Como procurar algo em casa: <u>seu quarto</u> → <u>a sala</u> → <u>a casa toda</u>.</div>

<script>
K.rise(tl, $("t"), C.a);
K.rise(tl, [$("g"), $("f"), $("b")], C.a + 1.0, { s: 0.5 });

K.out(tl, [$("q"), $("q2")], C.c);
tl.to($("b"), { opacity: 0.2, duration: 0.4 }, C.c + 1.6);
tl.to($("l1"), { opacity: 0.2, duration: 0.4 }, C.c + 1.6);
K.pop(tl, $("ptr"), C.c + 1.0);
K.macete(tl, $("mac"), C.d);
</script>
