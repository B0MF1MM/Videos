<div id="@t" class="k-title" style="left:120px;top:130px;font-size:72px"><em>Amarração</em></div>
<div id="@def" class="k-body" style="left:120px;top:236px;font-size:34px">calcular o atributo e <b>associar</b> o valor à construção</div>
<div id="@tie" style="position:absolute;left:300px;top:320px;width:1320px;height:140px">
  <div class="k-chip k-c-cyan" style="left:0;top:40px;font-size:38px;background:#0D1322">x</div>
  <div id="@rope" style="position:absolute;left:90px;top:68px;width:380px;height:6px;background:#FFD24A;transform-origin:0 50%"></div>
  <div class="k-chip k-c-yel" style="left:480px;top:40px;font-size:38px;background:#2A2410">tipo = int</div>
</div>
<div id="@tline" style="position:absolute;left:200px;top:560px;width:1520px;height:260px">
  <div style="position:absolute;left:0;top:100px;width:1520px;height:6px;background:#2A3656"></div>
  <div class="k-chip k-mute" style="left:620px;top:20px;font-size:26px">tempo de amarração ↓</div>
  <div id="@mid" style="position:absolute;left:756px;top:80px;width:8px;height:46px;background:#EEF1F8"></div>
  <div class="k-body k-mute" style="left:600px;top:140px;width:320px;text-align:center;font-size:26px">execução começa</div>
  <div id="@st" class="k-card" style="left:0;top:150px;width:560px;height:110px;border-color:#7FE39A">
    <div class="k-h2 k-c-green" style="left:24px;top:16px;font-size:36px">ESTÁTICO</div>
    <div class="k-body" style="left:24px;top:64px;font-size:24px">antes de executar · ex.: tipo declarado em C</div>
  </div>
  <div id="@dy" class="k-card" style="left:960px;top:150px;width:560px;height:110px;border-color:#FF6F9C">
    <div class="k-h2 k-c-pink" style="left:24px;top:16px;font-size:36px">DINÂMICO</div>
    <div class="k-body" style="left:24px;top:64px;font-size:24px">só ao executar · ex.: valor digitado</div>
  </div>
</div>

<script>
K.rise(tl, $("t"), C.a);
K.wipe(tl, $("def"), C.a + 0.8);
K.fade(tl, $("tie"), C.a + 1.2);
tl.fromTo($("rope"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, C.a + 1.6);
K.fade(tl, $("tline"), C.b);
K.pop(tl, $("mid"), C.b + 0.6);
K.rise(tl, $("st"), C.c);
K.rise(tl, $("dy"), C.d);
</script>
