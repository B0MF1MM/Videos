    <script>
      (function () {
        var GROUPS = [{"start": 0.15, "end": 1.797, "text": "Olha essa palavra: planta."}, {"start": 2.117, "end": 3.838, "text": "Pra uma pessoa, é uma fábrica."}, {"start": 3.838, "end": 5.234, "text": "Pra outra, é um vegetal."}, {"start": 5.554, "end": 7.306, "text": "A frase está escrita certinho."}, {"start": 7.306, "end": 8.961, "text": "O que muda é o significado."}, {"start": 9.281, "end": 12.133, "text": "E é exatamente disso que trata a análise semântica:"}, {"start": 12.133, "end": 13.583, "text": "o significado do programa."}, {"start": 14.083, "end": 16.755, "text": "No compilador, ela vem depois da análise léxica"}, {"start": 16.755, "end": 17.662, "text": "e da sintática."}, {"start": 17.982, "end": 20.448, "text": "A sintática pergunta: está bem escrito?"}, {"start": 20.448, "end": 22.592, "text": "A semântica pergunta: faz sentido?"}, {"start": 22.912, "end": 25.295, "text": "Por exemplo, x = \"olá\" * 3 está bem"}, {"start": 25.295, "end": 27.149, "text": "escrito, mas não faz sentido:"}, {"start": 27.149, "end": 28.95, "text": "multiplicar texto por número."}, {"start": 29.27, "end": 31.355, "text": "Macete: a sintática olha a forma;"}, {"start": 31.355, "end": 33.284, "text": "a semântica olha o significado."}, {"start": 33.784, "end": 36.573, "text": "A análise semântica calcula informações extras quando"}, {"start": 36.573, "end": 38.722, "text": "a estrutura do programa já é conhecida."}, {"start": 39.042, "end": 41.097, "text": "Numa linguagem com tipagem estática,"}, {"start": 41.097, "end": 43.055, "text": "como C, ela faz quatro trabalhos."}, {"start": 43.375, "end": 45.187, "text": "Resolve nomes, verifica tipos,"}, {"start": 45.187, "end": 48.138, "text": "verifica declarações e checa se as operações são"}, {"start": 48.138, "end": 48.863, "text": "compatíveis."}, {"start": 49.183, "end": 51.741, "text": "E para tudo isso ela precisa de uma ferramenta:"}, {"start": 51.741, "end": 52.908, "text": "a tabela de símbolos."}, {"start": 53.408, "end": 55.277, "text": "O conceito central é o atributo."}, {"start": 55.597, "end": 58.065, "text": "Atributo é qualquer propriedade de uma construção"}, {"start": 58.065, "end": 58.757, "text": "da linguagem."}, {"start": 59.077, "end": 61.067, "text": "Por exemplo: o tipo de uma expressão,"}, {"start": 61.067, "end": 62.438, "text": "o valor de uma constante,"}, {"start": 62.438, "end": 63.764, "text": "a localização na memória,"}, {"start": 63.764, "end": 65.488, "text": "o escopo, o tamanho de um tipo."}, {"start": 65.808, "end": 68.559, "text": "Macete: atributo é uma etiqueta grudada no nó da"}, {"start": 68.559, "end": 68.986, "text": "árvore."}, {"start": 69.486, "end": 72.336, "text": "Calcular um atributo e associar o valor à construção"}, {"start": 72.336, "end": 73.393, "text": "se chama amarração."}, {"start": 73.713, "end": 75.817, "text": "O momento em que isso acontece é o tempo"}, {"start": 75.817, "end": 76.491, "text": "de amarração."}, {"start": 76.811, "end": 79.336, "text": "Se o atributo é conhecido antes da execução,"}, {"start": 79.336, "end": 80.957, "text": "ele é estático. Por exemplo,"}, {"start": 80.957, "end": 83.196, "text": "o tipo declarado de uma variável em C."}, {"start": 83.516, "end": 85.627, "text": "Se só dá pra saber durante a execução,"}, {"start": 85.627, "end": 87.154, "text": "ele é dinâmico. Por exemplo,"}, {"start": 87.154, "end": 89.04, "text": "o valor que o usuário vai digitar."}, {"start": 89.54, "end": 92.539, "text": "Uma gramática de atributos junta cada regra gramatical"}, {"start": 92.539, "end": 94.252, "text": "com as suas regras semânticas."}, {"start": 94.572, "end": 95.865, "text": "A notação é X.a:"}, {"start": 95.865, "end": 97.897, "text": "o atributo a do símbolo X."}, {"start": 98.217, "end": 100.13, "text": "Cada regra semântica é uma equação:"}, {"start": 100.13, "end": 102.682, "text": "um atributo é igual a uma função dos atributos"}, {"start": 102.682, "end": 104.595, "text": "dos outros símbolos da mesma regra."}, {"start": 104.915, "end": 107.194, "text": "Se o mesmo símbolo aparece duas vezes,"}, {"start": 107.194, "end": 108.78, "text": "a gente numera: número um,"}, {"start": 108.78, "end": 109.523, "text": "número dois."}, {"start": 109.843, "end": 111.67, "text": "E tudo é organizado numa tabela:"}, {"start": 111.67, "end": 113.263, "text": "regra gramatical de um lado,"}, {"start": 113.263, "end": 114.762, "text": "regras semânticas do outro."}, {"start": 115.262, "end": 117.128, "text": "Primeiro exemplo: números sem sinal,"}, {"start": 117.128, "end": 118.195, "text": "com o atributo val,"}, {"start": 118.195, "end": 118.684, "text": "o valor."}, {"start": 119.004, "end": 121.775, "text": "Regra mais fácil: dígito vai em zero."}, {"start": 121.775, "end": 123.377, "text": "Então dígito.val = 0."}, {"start": 123.377, "end": 124.732, "text": "E assim até nove."}, {"start": 125.052, "end": 127.411, "text": "Se o número tem um dígito só:"}, {"start": 127.411, "end": 129.196, "text": "número.val = dígito.val."}, {"start": 129.516, "end": 131.225, "text": "E se tem vários:"}, {"start": 131.225, "end": 135.459, "text": "número1.val = número2.val * 10 + dígito.val."}, {"start": 135.779, "end": 138.219, "text": "Macete: vezes dez empurra o que já existe uma"}, {"start": 138.219, "end": 139.372, "text": "casa para a esquerda,"}, {"start": 139.372, "end": 141.767, "text": "e o novo dígito entra no lugar das unidades."}, {"start": 142.267, "end": 145.499, "text": "Agora monte a árvore do número 345."}, {"start": 145.819, "end": 148.102, "text": "Comece pelas folhas: os dígitos 3,"}, {"start": 148.102, "end": 150.72, "text": "4 e 5 ganham val igual a eles mesmos."}, {"start": 151.04, "end": 152.985, "text": "O número mais embaixo vale 3."}, {"start": 153.305, "end": 156.986, "text": "Subindo: 3 vezes 10 mais 4 dá 34."}, {"start": 157.306, "end": 160.547, "text": "E na raiz: 34 vezes 10 mais 5 dá"}, {"start": 160.547, "end": 163.401, "text": "345. O valor sobe pela árvore."}, {"start": 163.901, "end": 166.763, "text": "Segundo exemplo: expressões aritméticas com soma,"}, {"start": 166.763, "end": 168.297, "text": "subtração e multiplicação."}, {"start": 168.617, "end": 173.158, "text": "Na soma: exp1.val = exp2.val + termo.val."}, {"start": 173.478, "end": 175.281, "text": "Na subtração e na multiplicação,"}, {"start": 175.281, "end": 177.273, "text": "a mesma ideia, trocando o operador."}, {"start": 177.593, "end": 179.582, "text": "Nas regras de um filho só,"}, {"start": 179.582, "end": 181.21, "text": "o valor é só copiado:"}, {"start": 181.21, "end": 182.657, "text": "exp.val = termo.val."}, {"start": 182.977, "end": 186.061, "text": "E no fim, fator.val = número.val."}, {"start": 186.561, "end": 192.15, "text": "Aplicando em (34 - 3) * 42."}, {"start": 192.47, "end": 194.718, "text": "Nas folhas, os números:"}, {"start": 194.718, "end": 196.003, "text": "34, 3 e 42."}, {"start": 196.323, "end": 199.609, "text": "Os valores sobem pelas cópias até a subtração:"}, {"start": 199.609, "end": 200.982, "text": "34 menos 3 dá 31."}, {"start": 201.302, "end": 204.4, "text": "Depois os parênteses repassam o 31,"}, {"start": 204.4, "end": 207.498, "text": "e a multiplicação faz 31 vezes 42:"}, {"start": 207.498, "end": 208.014, "text": "1302."}, {"start": 208.514, "end": 210.763, "text": "Terceiro exemplo, o mais importante:"}, {"start": 210.763, "end": 213.173, "text": "declaração de variáveis, como float x,"}, {"start": 213.173, "end": 213.388, "text": "y."}, {"start": 213.708, "end": 215.267, "text": "O atributo agora é dtipo,"}, {"start": 215.267, "end": 216.273, "text": "o tipo de dado."}, {"start": 216.593, "end": 218.508, "text": "tipo vai em int dá dtipo inteiro;"}, {"start": 218.508, "end": 220.376, "text": "tipo vai em float dá dtipo real."}, {"start": 220.696, "end": 223.0, "text": "decl vai em tipo var-lista:"}, {"start": 223.0, "end": 225.303, "text": "var-lista.dtipo = tipo.dtipo."}, {"start": 225.623, "end": 227.674, "text": "E na lista, cada id e o resto da"}, {"start": 227.674, "end": 229.53, "text": "lista recebem o dtipo da lista."}, {"start": 230.03, "end": 232.108, "text": "Veja na árvore de float x,"}, {"start": 232.108, "end": 232.36, "text": "y."}, {"start": 232.68, "end": 234.961, "text": "O tipo float define dtipo real."}, {"start": 235.281, "end": 236.829, "text": "Esse real passa para o irmão,"}, {"start": 236.829, "end": 237.474, "text": "a var-lista."}, {"start": 237.794, "end": 238.757, "text": "Desce para o x,"}, {"start": 238.757, "end": 240.587, "text": "e desce para a lista de baixo,"}, {"start": 240.587, "end": 241.165, "text": "até o y."}, {"start": 241.485, "end": 243.301, "text": "Repare: aqui o atributo não sobe."}, {"start": 243.301, "end": 244.936, "text": "Ele vai para o lado e desce."}, {"start": 244.936, "end": 247.434, "text": "Guarde isso: daqui a pouco ele ganha um nome."}, {"start": 247.934, "end": 250.852, "text": "Quarto exemplo: números decimais ou octais,"}, {"start": 250.852, "end": 253.594, "text": "como 345o. A letra no fim diz a base."}, {"start": 253.914, "end": 254.86, "text": "o é base 8;"}, {"start": 254.86, "end": 255.866, "text": "d é base 10."}, {"start": 256.186, "end": 257.779, "text": "Agora são dois atributos:"}, {"start": 257.779, "end": 259.319, "text": "base, que desce, e val,"}, {"start": 259.319, "end": 259.957, "text": "que sobe."}, {"start": 260.277, "end": 264.033, "text": "Em 345o: 3, depois 3 vezes 8 mais 4"}, {"start": 264.033, "end": 267.705, "text": "dá 28, depois 28 vezes 8 mais 5 dá"}, {"start": 267.705, "end": 268.206, "text": "229."}, {"start": 268.526, "end": 271.06, "text": "Pegadinha: 189o está certo na sintaxe,"}, {"start": 271.06, "end": 273.313, "text": "mas 8 e 9 não existem em octal."}, {"start": 273.313, "end": 274.495, "text": "O val vira erro."}, {"start": 274.995, "end": 277.216, "text": "As equações podem usar if then else."}, {"start": 277.216, "end": 280.648, "text": "O conjunto de expressões permitidas se chama metalinguagem."}, {"start": 280.968, "end": 282.143, "text": "E dá para simplificar:"}, {"start": 282.143, "end": 284.145, "text": "como o parser já resolveu a estrutura,"}, {"start": 284.145, "end": 286.408, "text": "a semântica pode usar uma gramática ambígua."}, {"start": 286.728, "end": 287.61, "text": "Em vez de exp,"}, {"start": 287.61, "end": 288.817, "text": "termo e fator, basta:"}, {"start": 288.817, "end": 290.256, "text": "exp vai em exp mais exp,"}, {"start": 290.256, "end": 291.927, "text": "exp menos exp, exp vezes exp."}, {"start": 292.247, "end": 294.652, "text": "Ou usar direto a árvore sintática abstrata,"}, {"start": 294.652, "end": 295.877, "text": "sem os nós de cópia."}, {"start": 296.377, "end": 298.952, "text": "Agora, em que ordem calcular os atributos?"}, {"start": 299.272, "end": 301.42, "text": "Cada equação vira uma regra de cálculo,"}, {"start": 301.42, "end": 303.888, "text": "e tudo do lado direito precisa existir antes."}, {"start": 304.208, "end": 306.848, "text": "Para enxergar isso, usamos o grafo de dependências:"}, {"start": 306.848, "end": 308.213, "text": "um nó para cada atributo."}, {"start": 308.533, "end": 310.215, "text": "Se um atributo depende de outro,"}, {"start": 310.215, "end": 312.243, "text": "existe uma seta do que é usado para o"}, {"start": 312.243, "end": 313.106, "text": "que é calculado."}, {"start": 313.426, "end": 315.412, "text": "E o grafo da cadeia inteira é a união"}, {"start": 315.412, "end": 317.524, "text": "dos grafos de cada regra usada na árvore."}, {"start": 318.024, "end": 319.507, "text": "O grafo de float x,"}, {"start": 319.507, "end": 320.515, "text": "y fica assim."}, {"start": 320.835, "end": 323.197, "text": "O dtipo do tipo aponta para o dtipo da"}, {"start": 323.197, "end": 323.787, "text": "var-lista."}, {"start": 324.107, "end": 326.493, "text": "Da var-lista, sai uma seta para o dtipo do"}, {"start": 326.493, "end": 328.419, "text": "x, e outra para a lista de baixo."}, {"start": 328.739, "end": 330.524, "text": "E de lá, para o dtipo do y."}, {"start": 330.524, "end": 333.449, "text": "Repare: dá para seguir as setas sem nunca voltar."}, {"start": 333.949, "end": 336.654, "text": "Calcular cada atributo depois de todos de que ele"}, {"start": 336.654, "end": 338.534, "text": "depende é uma ordenação topológica."}, {"start": 338.854, "end": 341.21, "text": "Ela só existe se o grafo não tiver ciclo:"}, {"start": 341.21, "end": 342.827, "text": "um grafo direcionado acíclico,"}, {"start": 342.827, "end": 343.243, "text": "o DAG."}, {"start": 343.563, "end": 346.182, "text": "Os nós sem predecessores são as raízes do grafo:"}, {"start": 346.182, "end": 347.582, "text": "o valor deles sai direto,"}, {"start": 347.582, "end": 348.892, "text": "sem depender de ninguém."}, {"start": 349.212, "end": 352.097, "text": "E pode haver mais de uma ordem válida."}, {"start": 352.097, "end": 354.613, "text": "Para 345o, os slides mostram duas."}, {"start": 354.933, "end": 356.772, "text": "Macete: é como vestir a roupa."}, {"start": 356.772, "end": 358.462, "text": "A meia vem antes do sapato,"}, {"start": 358.462, "end": 360.749, "text": "mas a camisa pode ir antes ou depois."}, {"start": 361.249, "end": 363.507, "text": "Existem dois jeitos de achar essa ordem."}, {"start": 363.827, "end": 366.51, "text": "O método da árvore de análise sintática monta o"}, {"start": 366.51, "end": 368.016, "text": "grafo durante a compilação."}, {"start": 368.016, "end": 369.099, "text": "É geral, mas caro,"}, {"start": 369.099, "end": 370.84, "text": "e precisa testar se há ciclos."}, {"start": 371.16, "end": 372.673, "text": "O método baseado em regras:"}, {"start": 372.673, "end": 375.286, "text": "o projetista analisa a gramática e fixa a ordem"}, {"start": 375.286, "end": 376.707, "text": "ao construir o compilador."}, {"start": 377.027, "end": 380.228, "text": "É o método usado em praticamente todos os compiladores."}, {"start": 380.728, "end": 381.958, "text": "Para fixar a ordem,"}, {"start": 381.958, "end": 383.546, "text": "classificamos os atributos."}, {"start": 383.866, "end": 386.687, "text": "Um atributo é sintetizado quando todas as dependências"}, {"start": 386.687, "end": 388.075, "text": "vão do filho para o pai."}, {"start": 388.395, "end": 390.889, "text": "Se todos os atributos são sintetizados,"}, {"start": 390.889, "end": 392.57, "text": "a gramática é S-atribuída."}, {"start": 392.89, "end": 394.703, "text": "E basta uma passada em pós-ordem:"}, {"start": 394.703, "end": 396.924, "text": "visita os filhos e depois calcula o pai."}, {"start": 397.244, "end": 400.525, "text": "Foi o que aconteceu no 345 e no 1302:"}, {"start": 400.525, "end": 401.782, "text": "o valor subiu."}, {"start": 402.282, "end": 404.981, "text": "Todo atributo que não é sintetizado é herdado."}, {"start": 405.301, "end": 406.691, "text": "Ele vem do pai para o filho,"}, {"start": 406.691, "end": 408.08, "text": "ou de um irmão para o outro."}, {"start": 408.4, "end": 410.891, "text": "Calcula-se em pré-ordem: primeiro o atributo do"}, {"start": 410.891, "end": 412.476, "text": "filho, depois visita o filho."}, {"start": 412.796, "end": 415.044, "text": "E a ordem em que os filhos são visitados"}, {"start": 415.044, "end": 415.493, "text": "importa."}, {"start": 415.813, "end": 418.236, "text": "Macete: sintetizado sobe, como fumaça."}, {"start": 418.236, "end": 421.265, "text": "Herdado desce, como herança de pai para filho."}, {"start": 421.765, "end": 423.226, "text": "O dtipo do float x,"}, {"start": 423.226, "end": 426.733, "text": "y é herdado. O procedimento AvalTipo calcula assim."}, {"start": 427.053, "end": 428.764, "text": "Em decl, primeiro avalia o tipo,"}, {"start": 428.764, "end": 429.554, "text": "que vira real."}, {"start": 429.874, "end": 432.169, "text": "Depois entrega esse dtipo para a var-lista,"}, {"start": 432.169, "end": 433.429, "text": "e só então desce nela."}, {"start": 433.749, "end": 436.104, "text": "Na var-lista, entrega o dtipo ao id e,"}, {"start": 436.104, "end": 438.259, "text": "se houver resto, ao resto da lista,"}, {"start": 438.259, "end": 438.96, "text": "e continua."}, {"start": 439.28, "end": 441.334, "text": "É uma mistura de pré-ordem e in-ordem."}, {"start": 441.834, "end": 443.654, "text": "E quando há os dois tipos juntos?"}, {"start": 443.974, "end": 446.025, "text": "Se o sintetizado depende do herdado,"}, {"start": 446.025, "end": 448.361, "text": "mas o herdado não depende do sintetizado,"}, {"start": 448.361, "end": 449.41, "text": "uma passada basta."}, {"start": 449.73, "end": 450.774, "text": "É o caso do octal:"}, {"start": 450.774, "end": 452.86, "text": "a base desce em pré-ordem e o val sobe"}, {"start": 452.86, "end": 454.425, "text": "em pós-ordem, na mesma visita."}, {"start": 454.425, "end": 456.86, "text": "Só que os filhos são visitados da direita para"}, {"start": 456.86, "end": 458.903, "text": "a esquerda, porque a base está no fim."}, {"start": 459.223, "end": 461.497, "text": "Se o herdado depende do sintetizado,"}, {"start": 461.497, "end": 463.349, "text": "são necessárias duas passadas."}, {"start": 463.669, "end": 466.29, "text": "Exemplo: 5/2/2.0 vale 1,25,"}, {"start": 466.29, "end": 468.093, "text": "mas 5/2/2 vale 1."}, {"start": 468.093, "end": 472.845, "text": "Primeiro, uma passada descobre se há algum float,"}, {"start": 472.845, "end": 477.433, "text": "o éFlut. Depois, outra passada desce o etipo e"}, {"start": 477.433, "end": 478.908, "text": "calcula o val."}, {"start": 479.408, "end": 482.167, "text": "Um teorema importante: todo atributo herdado pode"}, {"start": 482.167, "end": 484.781, "text": "virar sintetizado, só reescrevendo a gramática."}, {"start": 485.101, "end": 487.265, "text": "E a linguagem aceita continua a mesma."}, {"start": 487.585, "end": 489.52, "text": "Exemplo: decl vai em var-lista id;"}, {"start": 489.52, "end": 491.644, "text": "var-lista vai em var-lista id vírgula,"}, {"start": 491.644, "end": 492.351, "text": "ou em tipo."}, {"start": 492.671, "end": 494.33, "text": "Agora o tipo fica embaixo,"}, {"start": 494.33, "end": 495.574, "text": "no fundo da árvore,"}, {"start": 495.574, "end": 496.611, "text": "e o dtipo sobe."}, {"start": 496.611, "end": 497.699, "text": "Virou sintetizado."}, {"start": 498.199, "end": 499.786, "text": "Agora a tabela de símbolos:"}, {"start": 499.786, "end": 502.48, "text": "a principal estrutura de dados depois da árvore"}, {"start": 502.48, "end": 503.057, "text": "sintática."}, {"start": 503.377, "end": 504.826, "text": "Ela tem três operações."}, {"start": 505.146, "end": 507.721, "text": "Inserir: guarda o que a declaração informa."}, {"start": 508.041, "end": 510.482, "text": "Verificar: busca a informação de um nome quando"}, {"start": 510.482, "end": 511.179, "text": "ele é usado."}, {"start": 511.499, "end": 514.314, "text": "Remover: apaga uma declaração que deixou de valer."}, {"start": 514.314, "end": 515.554, "text": "E ela guarda o tipo,"}, {"start": 515.554, "end": 517.653, "text": "o escopo e a localização na memória."}, {"start": 518.153, "end": 520.944, "text": "Como implementar? Listas lineares são simples,"}, {"start": 520.944, "end": 523.525, "text": "boas para protótipos e programas pequenos."}, {"start": 523.845, "end": 525.826, "text": "Árvores de busca são pouco usadas:"}, {"start": 525.826, "end": 528.34, "text": "o pior caso é ruim e remover é complicado."}, {"start": 528.66, "end": 530.512, "text": "A campeã é a tabela de hashing:"}, {"start": 530.512, "end": 533.265, "text": "busca e inserção com custo médio quase constante."}, {"start": 533.585, "end": 536.335, "text": "A função de hashing transforma o nome num índice."}, {"start": 536.335, "end": 538.526, "text": "Quando dois nomes caem no mesmo índice,"}, {"start": 538.526, "end": 539.364, "text": "é uma colisão."}, {"start": 539.684, "end": 542.495, "text": "Endereçamento aberto joga o item na próxima casa"}, {"start": 542.495, "end": 544.764, "text": "livre, mas degrada e dificulta remover."}, {"start": 544.764, "end": 547.772, "text": "O encadeamento separado põe uma lista em cada casa."}, {"start": 547.772, "end": 549.498, "text": "É o melhor para compiladores."}, {"start": 549.998, "end": 552.038, "text": "A função de hashing tem três passos."}, {"start": 552.358, "end": 554.254, "text": "Cada caractere vira um número inteiro."}, {"start": 554.574, "end": 556.501, "text": "Os números são combinados num só:"}, {"start": 556.501, "end": 558.428, "text": "a cada caractere, desloca e soma."}, {"start": 558.748, "end": 561.295, "text": "E o resultado é ajustado para caber no tamanho"}, {"start": 561.295, "end": 563.206, "text": "da tabela, com o resto da divisão."}, {"start": 563.526, "end": 565.513, "text": "Dica: use um tamanho primo."}, {"start": 565.513, "end": 567.32, "text": "Para 200 casas, use 211,"}, {"start": 567.32, "end": 569.427, "text": "o menor primo maior que 200."}, {"start": 569.927, "end": 572.606, "text": "Existem quatro tipos básicos de declaração:"}, {"start": 572.606, "end": 574.214, "text": "de variáveis, de funções,"}, {"start": 574.214, "end": 575.875, "text": "de constantes e de tipos."}, {"start": 576.195, "end": 578.149, "text": "Constantes ligam nomes a valores."}, {"start": 578.149, "end": 579.752, "text": "Tipos ligam nomes a tipos."}, {"start": 579.752, "end": 581.556, "text": "Variáveis ligam nomes a tipos,"}, {"start": 581.556, "end": 582.708, "text": "e também a escopo,"}, {"start": 582.708, "end": 584.211, "text": "memória e tempo de vida."}, {"start": 584.531, "end": 586.806, "text": "Regra comum: declarar antes de usar."}, {"start": 587.126, "end": 590.106, "text": "Ela permite montar a tabela durante a análise sintática"}, {"start": 590.106, "end": 591.756, "text": "e compilar em uma passada só."}, {"start": 592.256, "end": 594.143, "text": "Outra regra: estrutura de blocos."}, {"start": 594.143, "end": 596.997, "text": "Bloco é qualquer construção que contém declarações,"}, {"start": 596.997, "end": 598.255, "text": "como as chaves em C."}, {"start": 598.575, "end": 600.854, "text": "E vale a regra do aninhamento mais próximo:"}, {"start": 600.854, "end": 603.002, "text": "a declaração que vale é a do bloco mais"}, {"start": 603.002, "end": 603.44, "text": "interno."}, {"start": 603.76, "end": 605.13, "text": "Veja: i é int fora,"}, {"start": 605.13, "end": 606.281, "text": "mas dentro de f,"}, {"start": 606.281, "end": 607.87, "text": "i é char. Dentro de f,"}, {"start": 607.87, "end": 609.24, "text": "quem vale é o char."}, {"start": 609.56, "end": 611.529, "text": "Por isso, inserir não sobrescreve:"}, {"start": 611.529, "end": 613.252, "text": "esconde a declaração anterior."}, {"start": 613.252, "end": 615.319, "text": "E remover apaga só a mais recente."}, {"start": 615.639, "end": 616.754, "text": "Ao sair do bloco,"}, {"start": 616.754, "end": 618.528, "text": "a declaração antiga reaparece."}, {"start": 619.028, "end": 622.021, "text": "Uma alternativa: uma tabela de símbolos para cada"}, {"start": 622.021, "end": 623.62, "text": "escopo, ligadas em cadeia."}, {"start": 623.94, "end": 625.956, "text": "Se o nome não está na tabela atual,"}, {"start": 625.956, "end": 627.926, "text": "a busca continua na tabela de fora."}, {"start": 628.246, "end": 629.512, "text": "E para sair do escopo,"}, {"start": 629.512, "end": 630.869, "text": "nem precisa remover nada:"}, {"start": 630.869, "end": 633.356, "text": "basta mover o ponteiro para a tabela de fora."}, {"start": 633.676, "end": 635.864, "text": "Macete: é como procurar algo em casa."}, {"start": 635.864, "end": 637.226, "text": "Primeiro no seu quarto,"}, {"start": 637.226, "end": 639.365, "text": "depois na sala, depois na casa toda."}, {"start": 639.865, "end": 642.573, "text": "Uma das principais tarefas é cuidar dos tipos de"}, {"start": 642.573, "end": 642.946, "text": "dados."}, {"start": 643.266, "end": 645.44, "text": "Tipo de dado é um conjunto de valores,"}, {"start": 645.44, "end": 647.013, "text": "com as operações sobre eles."}, {"start": 647.333, "end": 650.042, "text": "Com tipos estáticos, o compilador já sabe quanta"}, {"start": 650.042, "end": 652.561, "text": "memória cada variável ocupa e como acessá-la."}, {"start": 652.881, "end": 655.264, "text": "Exemplo: a[i], com a do tipo array de 1"}, {"start": 655.264, "end": 656.14, "text": "a 10 de real,"}, {"start": 656.14, "end": 658.329, "text": "e i inteiro. O tipo de a[i] é real."}, {"start": 658.649, "end": 660.249, "text": "Mas se i está entre 1 e 10 é"}, {"start": 660.249, "end": 662.732, "text": "verificação de intervalo, e isso não dá pra saber"}, {"start": 662.732, "end": 663.658, "text": "antes de executar."}, {"start": 664.158, "end": 665.603, "text": "Tipos simples, como int,"}, {"start": 665.603, "end": 666.848, "text": "double, char e bool,"}, {"start": 666.848, "end": 668.393, "text": "não têm estrutura interna."}, {"start": 668.393, "end": 670.984, "text": "Também dá pra criar intervalos e enumerados."}, {"start": 671.304, "end": 673.576, "text": "Construtores criam tipos estruturados."}, {"start": 673.576, "end": 676.589, "text": "A matriz ocupa n vezes o tamanho do componente."}, {"start": 676.909, "end": 679.234, "text": "O struct guarda os campos em sequência:"}, {"start": 679.234, "end": 681.263, "text": "double de 8 mais int de 4 dá 12"}, {"start": 681.263, "end": 681.658, "text": "bytes."}, {"start": 681.978, "end": 683.747, "text": "A union sobrepõe os campos:"}, {"start": 683.747, "end": 684.925, "text": "ocupa só o maior,"}, {"start": 684.925, "end": 685.515, "text": "8 bytes."}, {"start": 685.835, "end": 688.176, "text": "Macete: struct soma, union pega o maior."}, {"start": 688.176, "end": 690.079, "text": "E o ponteiro guarda um endereço;"}, {"start": 690.079, "end": 692.713, "text": "acessar o valor apontado é a derreferenciação."}, {"start": 693.213, "end": 695.825, "text": "Declarações de tipo dão nome a uma expressão de"}, {"start": 695.825, "end": 697.199, "text": "tipo, como typedef em C,"}, {"start": 697.199, "end": 699.674, "text": "e esses nomes vão para a tabela de símbolos."}, {"start": 699.994, "end": 702.09, "text": "E um tipo pode usar o próprio nome:"}, {"start": 702.09, "end": 703.234, "text": "é o tipo recursivo."}, {"start": 703.554, "end": 706.133, "text": "Como struct no, que tem um ponteiro para outro"}, {"start": 706.133, "end": 708.482, "text": "struct no. É assim que se montam listas e"}, {"start": 708.482, "end": 708.943, "text": "árvores."}, {"start": 709.443, "end": 711.198, "text": "Agora o verificador de tipos,"}, {"start": 711.198, "end": 712.201, "text": "regra por regra."}, {"start": 712.521, "end": 715.398, "text": "Declaração: var-decl vai em id dois pontos tipo."}, {"start": 715.398, "end": 717.517, "text": "A ação é inserir o nome e o tipo"}, {"start": 717.517, "end": 718.173, "text": "na tabela."}, {"start": 718.493, "end": 720.644, "text": "No if, a condição tem que ser booleana."}, {"start": 720.644, "end": 723.153, "text": "Na atribuição, o tipo da expressão tem que ser"}, {"start": 723.153, "end": 724.319, "text": "igual ao da variável."}, {"start": 724.639, "end": 727.129, "text": "Na soma, os dois lados têm que ser inteiros,"}, {"start": 727.129, "end": 728.512, "text": "e o resultado é inteiro."}, {"start": 728.512, "end": 730.633, "text": "No or, os dois têm que ser booleanos."}, {"start": 730.953, "end": 732.21, "text": "E no índice de matriz:"}, {"start": 732.21, "end": 734.049, "text": "se a base é matriz e o índice é"}, {"start": 734.049, "end": 735.844, "text": "inteiro, o tipo é o do elemento."}, {"start": 735.844, "end": 736.966, "text": "Senão, erro de tipo."}, {"start": 737.466, "end": 740.372, "text": "Sobrecarga: o mesmo operador para operações diferentes,"}, {"start": 740.372, "end": 742.586, "text": "como o mais para inteiros e para reais."}, {"start": 742.906, "end": 744.521, "text": "E com tipos misturados,"}, {"start": 744.521, "end": 745.56, "text": "como 2.1 + 3,"}, {"start": 745.56, "end": 747.291, "text": "é preciso um tipo comum."}, {"start": 747.611, "end": 749.872, "text": "Ou o programador converte na mão,"}, {"start": 749.872, "end": 751.512, "text": "como em 2.1 + FLOAT(3)."}, {"start": 751.832, "end": 753.778, "text": "Ou o compilador converte sozinho."}, {"start": 753.778, "end": 755.973, "text": "Essa conversão automática é a coação."}, {"start": 756.473, "end": 759.173, "text": "Para fechar, o analisador semântico da linguagem"}, {"start": 759.173, "end": 759.511, "text": "TINY."}, {"start": 759.831, "end": 761.239, "text": "TINY não tem declarações:"}, {"start": 761.239, "end": 763.35, "text": "as variáveis surgem quando são usadas,"}, {"start": 763.35, "end": 764.57, "text": "e todas são inteiras."}, {"start": 764.57, "end": 767.01, "text": "Os booleanos só aparecem no teste do if ou"}, {"start": 767.01, "end": 767.62, "text": "do repeat."}, {"start": 767.94, "end": 770.27, "text": "A tabela de símbolos é um hashing encadeado,"}, {"start": 770.27, "end": 772.511, "text": "e guarda a posição na memória e as linhas"}, {"start": 772.511, "end": 773.918, "text": "onde cada variável aparece."}, {"start": 774.238, "end": 776.993, "text": "buildSymtab percorre a árvore em pré-ordem e insere"}, {"start": 776.993, "end": 779.841, "text": "as variáveis, porque a tabela é um atributo herdado."}, {"start": 780.161, "end": 783.017, "text": "typeCheck percorre em pós-ordem e calcula os tipos,"}, {"start": 783.017, "end": 784.635, "text": "porque o tipo é sintetizado."}, {"start": 785.135, "end": 786.224, "text": "Revisão relâmpago."}, {"start": 786.544, "end": 789.453, "text": "Semântica é significado: a sintática olha a forma."}, {"start": 789.773, "end": 792.898, "text": "Gramática de atributos: regra gramatical mais regras"}, {"start": 792.898, "end": 793.575, "text": "semânticas."}, {"start": 793.895, "end": 796.122, "text": "Sintetizado sobe, em pós-ordem."}, {"start": 796.122, "end": 798.165, "text": "Herdado desce, em pré-ordem."}, {"start": 798.485, "end": 801.783, "text": "Grafo de dependências sem ciclo permite ordem topológica."}, {"start": 802.103, "end": 803.745, "text": "Tabela de símbolos: inserir,"}, {"start": 803.745, "end": 806.431, "text": "verificar, remover, com hashing e encadeamento."}, {"start": 806.751, "end": 808.626, "text": "Vale o aninhamento mais próximo."}, {"start": 808.626, "end": 810.55, "text": "Struct soma, union pega o maior."}, {"start": 810.87, "end": 812.16, "text": "Agora é com você."}, {"start": 812.16, "end": 812.922, "text": "Boa prova!"}];
