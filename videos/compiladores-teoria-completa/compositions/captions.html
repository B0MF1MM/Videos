    <script>
      (function () {
        var GROUPS = [{"start": 0.15, "end": 2.643, "text": "Um compilador traduz um programa de uma linguagem"}, {"start": 2.643, "end": 4.191, "text": "fonte para uma linguagem alvo."}, {"start": 4.511, "end": 5.965, "text": "Primeiro vêm as análises:"}, {"start": 5.965, "end": 8.097, "text": "a léxica, a sintática e a semântica."}, {"start": 8.417, "end": 11.042, "text": "Depois, o compilador precisa saber como o programa"}, {"start": 11.042, "end": 12.733, "text": "vai usar a memória ao executar:"}, {"start": 12.733, "end": 14.112, "text": "é o ambiente de execução."}, {"start": 14.432, "end": 15.969, "text": "E por fim vem a síntese:"}, {"start": 15.969, "end": 17.208, "text": "a geração de código."}, {"start": 17.528, "end": 19.95, "text": "Neste vídeo, a teoria desses três temas:"}, {"start": 19.95, "end": 22.876, "text": "análise semântica, ambientes de execução e geração"}, {"start": 22.876, "end": 23.532, "text": "de código."}, {"start": 24.032, "end": 26.941, "text": "A análise semântica começa quando a estrutura sintática"}, {"start": 26.941, "end": 28.441, "text": "do programa já é conhecida."}, {"start": 28.761, "end": 30.829, "text": "Ela calcula informações adicionais,"}, {"start": 30.829, "end": 33.519, "text": "ligadas ao significado do programa traduzido."}, {"start": 33.839, "end": 35.878, "text": "Numa linguagem com tipagem estática,"}, {"start": 35.878, "end": 38.209, "text": "ela usa informações sobre identificadores,"}, {"start": 38.209, "end": 39.375, "text": "declarações e tipos."}, {"start": 39.695, "end": 41.237, "text": "Com isso, resolve nomes,"}, {"start": 41.237, "end": 44.215, "text": "verifica tipos, verifica declarações e confere a"}, {"start": 44.215, "end": 46.024, "text": "compatibilidade das operações."}, {"start": 46.344, "end": 49.009, "text": "E, para isso, ela constrói uma estrutura central:"}, {"start": 49.009, "end": 50.204, "text": "a tabela de símbolos."}, {"start": 50.704, "end": 52.376, "text": "O conceito básico é o atributo:"}, {"start": 52.376, "end": 55.015, "text": "qualquer propriedade de uma construção da linguagem."}, {"start": 55.335, "end": 57.622, "text": "Exemplos: o tipo de uma expressão ou de um"}, {"start": 57.622, "end": 59.688, "text": "identificador, o valor de uma constante,"}, {"start": 59.688, "end": 61.007, "text": "a localização na memória,"}, {"start": 61.007, "end": 62.809, "text": "o escopo e o tamanho de um tipo."}, {"start": 63.129, "end": 65.709, "text": "Calcular um atributo e associá-lo à construção se"}, {"start": 65.709, "end": 68.199, "text": "chama amarração. O momento em que isso acontece"}, {"start": 68.199, "end": 69.489, "text": "é o tempo de amarração."}, {"start": 69.809, "end": 72.945, "text": "Atributos que podem ser determinados antes da execução"}, {"start": 72.945, "end": 75.733, "text": "são estáticos. Os que só podem ser determinados"}, {"start": 75.733, "end": 77.675, "text": "durante a execução são dinâmicos."}, {"start": 78.175, "end": 80.258, "text": "Uma gramática de atributos associa,"}, {"start": 80.258, "end": 81.732, "text": "a cada regra gramatical,"}, {"start": 81.732, "end": 83.713, "text": "um conjunto de regras semânticas."}, {"start": 84.033, "end": 86.016, "text": "Cada regra semântica é uma equação:"}, {"start": 86.016, "end": 88.753, "text": "um atributo de um símbolo é função dos atributos"}, {"start": 88.753, "end": 90.736, "text": "dos outros símbolos da mesma regra."}, {"start": 91.056, "end": 93.761, "text": "É o princípio da semântica dirigida pela sintaxe."}, {"start": 93.761, "end": 95.859, "text": "Quando um símbolo se repete na regra,"}, {"start": 95.859, "end": 98.284, "text": "as ocorrências são diferenciadas por índices."}, {"start": 98.604, "end": 101.195, "text": "O conjunto de expressões permitidas nas equações"}, {"start": 101.195, "end": 102.444, "text": "se chama metalinguagem."}, {"start": 102.764, "end": 104.833, "text": "A especificação pode ser simplificada:"}, {"start": 104.833, "end": 106.996, "text": "como o parser já resolveu a estrutura,"}, {"start": 106.996, "end": 108.923, "text": "pode-se usar uma gramática ambígua,"}, {"start": 108.923, "end": 110.663, "text": "ou a árvore sintática abstrata."}, {"start": 111.163, "end": 112.779, "text": "Para calcular os atributos,"}, {"start": 112.779, "end": 115.151, "text": "cada equação vira uma regra de cálculo."}, {"start": 115.151, "end": 118.079, "text": "E todos os valores usados precisam existir antes."}, {"start": 118.399, "end": 121.805, "text": "Essas restrições de ordem aparecem no grafo de dependências."}, {"start": 122.125, "end": 123.925, "text": "Ele tem um nó para cada atributo,"}, {"start": 123.925, "end": 126.076, "text": "e um arco de cada atributo usado para o"}, {"start": 126.076, "end": 127.436, "text": "atributo que depende dele."}, {"start": 127.756, "end": 129.73, "text": "O grafo de uma cadeia é a união dos"}, {"start": 129.73, "end": 132.142, "text": "grafos das regras usadas em cada nó da árvore"}, {"start": 132.142, "end": 132.668, "text": "sintática."}, {"start": 133.168, "end": 136.309, "text": "Uma ordem de cálculo que respeita todas as dependências"}, {"start": 136.309, "end": 137.855, "text": "é uma ordenação topológica."}, {"start": 138.175, "end": 139.876, "text": "Ela existe se, e somente se,"}, {"start": 139.876, "end": 141.14, "text": "o grafo for acíclico:"}, {"start": 141.14, "end": 142.841, "text": "um grafo direcionado acíclico,"}, {"start": 142.841, "end": 143.327, "text": "ou DAG."}, {"start": 143.647, "end": 145.818, "text": "Os nós sem predecessores são as raízes:"}, {"start": 145.818, "end": 148.681, "text": "seus valores dependem só de informação já disponível."}, {"start": 149.001, "end": 151.398, "text": "No método da árvore de análise sintática,"}, {"start": 151.398, "end": 153.697, "text": "o grafo é montado durante a compilação."}, {"start": 153.697, "end": 154.822, "text": "É geral, mas caro,"}, {"start": 154.822, "end": 156.974, "text": "e exige testar a ausência de ciclos."}, {"start": 157.294, "end": 160.182, "text": "Por isso, quase todos os compiladores usam o método"}, {"start": 160.182, "end": 162.882, "text": "baseado em regras: o projetista fixa a ordem de"}, {"start": 162.882, "end": 164.87, "text": "avaliação ao construir o compilador."}, {"start": 165.37, "end": 166.655, "text": "Para fixar essa ordem,"}, {"start": 166.655, "end": 169.749, "text": "os atributos são classificados pelo tipo de dependência."}, {"start": 170.069, "end": 173.04, "text": "Um atributo é sintetizado quando todas as suas dependências"}, {"start": 173.04, "end": 174.978, "text": "vão dos filhos para o pai na árvore."}, {"start": 175.298, "end": 178.503, "text": "Uma gramática em que todos os atributos são sintetizados"}, {"start": 178.503, "end": 179.959, "text": "é chamada de S-atribuída."}, {"start": 180.279, "end": 183.218, "text": "Seus atributos podem ser calculados num único percurso"}, {"start": 183.218, "end": 185.037, "text": "em pós-ordem: primeiro os filhos,"}, {"start": 185.037, "end": 185.83, "text": "depois o pai."}, {"start": 186.33, "end": 189.018, "text": "Um atributo que não é sintetizado é herdado."}, {"start": 189.338, "end": 191.774, "text": "Suas dependências vão do pai para os filhos,"}, {"start": 191.774, "end": 192.693, "text": "ou entre irmãos."}, {"start": 193.013, "end": 194.588, "text": "Ele é calculado em pré-ordem,"}, {"start": 194.588, "end": 196.883, "text": "ou numa combinação de pré-ordem e in-ordem."}, {"start": 197.203, "end": 199.505, "text": "E a ordem em que os filhos são visitados"}, {"start": 199.505, "end": 201.899, "text": "precisa respeitar as dependências entre eles."}, {"start": 202.399, "end": 204.362, "text": "Quando os dois tipos aparecem juntos,"}, {"start": 204.362, "end": 206.726, "text": "a questão é quantas passadas são necessárias."}, {"start": 207.046, "end": 209.461, "text": "Se os sintetizados dependem dos herdados,"}, {"start": 209.461, "end": 212.178, "text": "mas os herdados não dependem dos sintetizados,"}, {"start": 212.178, "end": 213.638, "text": "uma única passada basta."}, {"start": 213.958, "end": 216.406, "text": "Se os herdados dependem dos sintetizados,"}, {"start": 216.406, "end": 218.191, "text": "são necessárias mais passadas."}, {"start": 218.511, "end": 219.689, "text": "E existe um teorema:"}, {"start": 219.689, "end": 222.893, "text": "todo atributo herdado pode ser transformado em sintetizado,"}, {"start": 222.893, "end": 225.531, "text": "reescrevendo a gramática, sem mudar a linguagem."}, {"start": 226.031, "end": 228.951, "text": "A tabela de símbolos fornece informações de contexto"}, {"start": 228.951, "end": 231.009, "text": "para as etapas da análise semântica."}, {"start": 231.009, "end": 233.833, "text": "É a principal estrutura de dados depois da árvore"}, {"start": 233.833, "end": 234.407, "text": "sintática."}, {"start": 234.727, "end": 236.15, "text": "Ela tem três operações:"}, {"start": 236.15, "end": 237.878, "text": "inserir, verificar e remover."}, {"start": 238.198, "end": 240.653, "text": "Inserir guarda a informação das declarações."}, {"start": 240.653, "end": 243.396, "text": "Verificar recupera a informação quando um nome é"}, {"start": 243.396, "end": 246.14, "text": "usado. Remover descarta uma declaração que deixou"}, {"start": 246.14, "end": 246.717, "text": "de valer."}, {"start": 247.037, "end": 249.141, "text": "Ela normalmente guarda o tipo de dado,"}, {"start": 249.141, "end": 251.154, "text": "o escopo e a localização na memória."}, {"start": 251.474, "end": 253.775, "text": "Pode ser implementada com listas lineares,"}, {"start": 253.775, "end": 255.982, "text": "árvores de busca ou tabelas de hashing."}, {"start": 255.982, "end": 257.814, "text": "As listas servem para protótipos;"}, {"start": 257.814, "end": 259.41, "text": "as árvores são pouco usadas;"}, {"start": 259.41, "end": 261.054, "text": "e o hashing é o mais comum."}, {"start": 261.554, "end": 264.393, "text": "Uma tabela de hashing é um vetor de repositórios,"}, {"start": 264.393, "end": 265.644, "text": "indexado por inteiros."}, {"start": 265.964, "end": 268.318, "text": "A função de hashing transforma o nome em um"}, {"start": 268.318, "end": 269.561, "text": "índice, em três passos:"}, {"start": 269.561, "end": 271.204, "text": "cada caractere vira um inteiro,"}, {"start": 271.204, "end": 272.625, "text": "os inteiros são combinados,"}, {"start": 272.625, "end": 275.112, "text": "e o resultado é ajustado ao tamanho da tabela."}, {"start": 275.432, "end": 277.544, "text": "Quando dois nomes caem no mesmo índice,"}, {"start": 277.544, "end": 278.578, "text": "ocorre uma colisão."}, {"start": 278.898, "end": 281.518, "text": "No endereçamento aberto, o item vai para o próximo"}, {"start": 281.518, "end": 283.964, "text": "repositório livre. O desempenho degrada quando a"}, {"start": 283.964, "end": 285.754, "text": "tabela enche, e remover é difícil."}, {"start": 286.074, "end": 288.675, "text": "No encadeamento separado, cada repositório é uma"}, {"start": 288.675, "end": 291.089, "text": "lista. É o melhor esquema para compiladores."}, {"start": 291.089, "end": 293.829, "text": "E costuma-se usar um tamanho primo para a tabela."}, {"start": 294.329, "end": 296.584, "text": "Há quatro tipos básicos de declaração:"}, {"start": 296.584, "end": 298.99, "text": "de variáveis, de procedimentos e funções,"}, {"start": 298.99, "end": 300.544, "text": "de constantes e de tipos."}, {"start": 300.864, "end": 303.48, "text": "A regra de declarar antes de usar permite montar"}, {"start": 303.48, "end": 305.465, "text": "a tabela durante a análise sintática,"}, {"start": 305.465, "end": 306.909, "text": "e compilar em uma passada."}, {"start": 307.229, "end": 308.468, "text": "Na estrutura de blocos,"}, {"start": 308.468, "end": 310.636, "text": "vale a regra do aninhamento mais próximo:"}, {"start": 310.636, "end": 312.805, "text": "a declaração que se aplica é a do bloco"}, {"start": 312.805, "end": 313.513, "text": "mais interno."}, {"start": 313.833, "end": 316.479, "text": "Para isso, inserir não sobrescreve a declaração"}, {"start": 316.479, "end": 317.97, "text": "anterior: apenas a oculta."}, {"start": 317.97, "end": 320.665, "text": "E remover elimina só a declaração mais recente."}, {"start": 320.985, "end": 323.521, "text": "Uma alternativa é ter uma tabela por escopo,"}, {"start": 323.521, "end": 326.154, "text": "encadeadas. A busca continua na tabela externa,"}, {"start": 326.154, "end": 328.547, "text": "e sair do escopo é só mover um ponteiro."}, {"start": 329.047, "end": 331.349, "text": "Um tipo de dado é um conjunto de valores"}, {"start": 331.349, "end": 333.19, "text": "com operações sobre esses valores."}, {"start": 333.51, "end": 335.402, "text": "Com informação estática de tipos,"}, {"start": 335.402, "end": 338.12, "text": "o compilador sabe a memória de cada variável e"}, {"start": 338.12, "end": 338.993, "text": "como acessá-la."}, {"start": 339.313, "end": 341.753, "text": "Os tipos simples não têm estrutura interna,"}, {"start": 341.753, "end": 344.241, "text": "como inteiros, reais, caracteres e booleanos,"}, {"start": 344.241, "end": 346.059, "text": "além de intervalos e enumerados."}, {"start": 346.379, "end": 349.18, "text": "Construtores de tipos criam tipos estruturados."}, {"start": 349.18, "end": 351.15, "text": "A matriz ocupa memória contígua."}, {"start": 351.15, "end": 353.64, "text": "O registro aloca os campos em sequência."}, {"start": 353.64, "end": 355.351, "text": "A união sobrepõe os campos."}, {"start": 355.351, "end": 357.373, "text": "E o ponteiro guarda um endereço,"}, {"start": 357.373, "end": 359.137, "text": "acessado por derreferenciação."}, {"start": 359.457, "end": 362.411, "text": "Declarações de tipo dão nome a expressões de tipo."}, {"start": 362.411, "end": 363.74, "text": "E os tipos recursivos,"}, {"start": 363.74, "end": 365.217, "text": "que usam o próprio nome,"}, {"start": 365.217, "end": 366.743, "text": "permitem listas e árvores."}, {"start": 367.243, "end": 370.245, "text": "O verificador de tipos é descrito por ações semânticas,"}, {"start": 370.245, "end": 372.923, "text": "com uma representação de tipos e uma operação de"}, {"start": 372.923, "end": 373.985, "text": "igualdade de tipos."}, {"start": 374.305, "end": 377.081, "text": "Declarações inserem o tipo de cada identificador"}, {"start": 377.081, "end": 379.559, "text": "na tabela. Constantes têm tipos implícitos,"}, {"start": 379.559, "end": 382.187, "text": "e variáveis têm o tipo consultado na tabela."}, {"start": 382.507, "end": 385.604, "text": "A condição de um comando condicional deve ser booleana."}, {"start": 385.604, "end": 388.653, "text": "Na atribuição, o tipo da expressão deve ser compatível"}, {"start": 388.653, "end": 389.701, "text": "com o do destino."}, {"start": 389.701, "end": 392.322, "text": "E cada operador exige operandos do tipo certo."}, {"start": 392.642, "end": 395.421, "text": "Sobrecarga é usar o mesmo operador para operações"}, {"start": 395.421, "end": 396.044, "text": "diferentes."}, {"start": 396.364, "end": 398.283, "text": "Em expressões de tipos misturados,"}, {"start": 398.283, "end": 400.059, "text": "a conversão pode ser explícita,"}, {"start": 400.059, "end": 402.266, "text": "escrita pelo programador, ou automática,"}, {"start": 402.266, "end": 404.953, "text": "feita pelo compilador. A conversão automática se"}, {"start": 404.953, "end": 405.721, "text": "chama coação."}, {"start": 406.221, "end": 408.443, "text": "As análises dependem da linguagem fonte."}, {"start": 408.443, "end": 411.138, "text": "Já a geração de código depende da máquina alvo."}, {"start": 411.458, "end": 413.96, "text": "Para gerar código, o compilador precisa conhecer"}, {"start": 413.96, "end": 415.211, "text": "o ambiente de execução:"}, {"start": 415.211, "end": 417.668, "text": "a forma como a memória é organizada durante a"}, {"start": 417.668, "end": 418.159, "text": "execução."}, {"start": 418.479, "end": 421.39, "text": "Quase todas as linguagens usam um de três ambientes:"}, {"start": 421.39, "end": 424.206, "text": "totalmente estático, baseado em pilhas ou totalmente"}, {"start": 424.206, "end": 424.723, "text": "dinâmico."}, {"start": 425.043, "end": 426.892, "text": "Também existem ambientes híbridos,"}, {"start": 426.892, "end": 429.121, "text": "que combinam características desses três."}, {"start": 429.621, "end": 432.049, "text": "A memória se divide em registradores e na RAM,"}, {"start": 432.049, "end": 434.13, "text": "que por sua vez tem uma área de código"}, {"start": 434.13, "end": 435.257, "text": "e uma área de dados."}, {"start": 435.577, "end": 438.228, "text": "A área de código é fixada antes da execução,"}, {"start": 438.228, "end": 441.567, "text": "então os endereços de código são conhecidos na compilação."}, {"start": 441.567, "end": 444.415, "text": "Dados globais e estáticos também recebem endereços"}, {"start": 444.415, "end": 444.807, "text": "fixos."}, {"start": 445.127, "end": 448.101, "text": "Constantes pequenas costumam ficar dentro do próprio"}, {"start": 448.101, "end": 450.876, "text": "código. Valores grandes e textos ficam em áreas"}, {"start": 450.876, "end": 451.471, "text": "estáticas."}, {"start": 451.791, "end": 453.741, "text": "A área de dados ainda tem a pilha,"}, {"start": 453.741, "end": 455.602, "text": "para dados alocados em ordem LIFO,"}, {"start": 455.602, "end": 458.233, "text": "e o heap, para alocação dinâmica sem essa ordem."}, {"start": 458.553, "end": 461.154, "text": "Os dois costumam crescer um em direção ao outro,"}, {"start": 461.154, "end": 462.499, "text": "dividindo o espaço livre."}, {"start": 462.999, "end": 465.643, "text": "A unidade principal de alocação é o registro de"}, {"start": 465.643, "end": 468.659, "text": "ativação: a memória dos dados locais de um procedimento"}, {"start": 468.659, "end": 469.865, "text": "quando ele é ativado."}, {"start": 470.185, "end": 472.582, "text": "No mínimo, ele contém espaço para os argumentos,"}, {"start": 472.582, "end": 474.012, "text": "para informações de controle,"}, {"start": 474.012, "end": 475.4, "text": "como o endereço de retorno,"}, {"start": 475.4, "end": 477.586, "text": "para os dados locais e para os temporários."}, {"start": 477.906, "end": 479.669, "text": "Quando os registros ficam na pilha,"}, {"start": 479.669, "end": 481.599, "text": "eles são chamados de quadros de pilha."}, {"start": 481.919, "end": 484.102, "text": "Alguns registradores acompanham a execução:"}, {"start": 484.102, "end": 485.35, "text": "o contador de programa,"}, {"start": 485.35, "end": 486.463, "text": "o ponteiro de pilha,"}, {"start": 486.463, "end": 487.621, "text": "o ponteiro de quadro,"}, {"start": 487.621, "end": 489.403, "text": "que aponta para o registro atual,"}, {"start": 489.403, "end": 490.873, "text": "e o ponteiro de argumentos."}, {"start": 491.373, "end": 494.008, "text": "Toda ativação segue uma sequência de operações."}, {"start": 494.328, "end": 496.705, "text": "A sequência de ativação aloca o registro,"}, {"start": 496.705, "end": 498.597, "text": "calcula e armazena os argumentos,"}, {"start": 498.597, "end": 500.101, "text": "e ajusta os registradores."}, {"start": 500.421, "end": 503.07, "text": "A sequência de retorno coloca o valor de retorno"}, {"start": 503.07, "end": 504.76, "text": "onde o chamador pode acessá-lo,"}, {"start": 504.76, "end": 507.364, "text": "reajusta os registradores e libera o registro de"}, {"start": 507.364, "end": 507.866, "text": "ativação."}, {"start": 508.366, "end": 511.174, "text": "O ambiente totalmente estático é o mais simples."}, {"start": 511.174, "end": 514.08, "text": "Todos os dados permanecem fixos na memória durante"}, {"start": 514.08, "end": 515.065, "text": "toda a execução."}, {"start": 515.385, "end": 516.656, "text": "Não só as globais:"}, {"start": 516.656, "end": 519.916, "text": "até as variáveis locais são alocadas estaticamente."}, {"start": 519.916, "end": 521.961, "text": "O exemplo clássico é FORTRAN77."}, {"start": 522.281, "end": 525.313, "text": "Cada procedimento tem um único registro de ativação,"}, {"start": 525.313, "end": 526.854, "text": "alocado antes da execução."}, {"start": 527.174, "end": 530.059, "text": "Na chamada, os argumentos são guardados nos espaços"}, {"start": 530.059, "end": 532.752, "text": "dos parâmetros, o endereço de retorno é gravado"}, {"start": 532.752, "end": 533.666, "text": "e há um salto."}, {"start": 533.666, "end": 535.878, "text": "No retorno, um salto simples de volta."}, {"start": 536.198, "end": 538.556, "text": "Como cada procedimento tem um só registro,"}, {"start": 538.556, "end": 540.49, "text": "esse ambiente não permite recursão."}, {"start": 540.99, "end": 543.991, "text": "Com recursão, cada ativação precisa de novas posições"}, {"start": 543.991, "end": 545.443, "text": "para as variáveis locais."}, {"start": 545.443, "end": 548.396, "text": "Os registros de ativação passam a ser alocados numa"}, {"start": 548.396, "end": 548.783, "text": "pilha."}, {"start": 549.103, "end": 551.958, "text": "A cada ativação, um novo registro é colocado no"}, {"start": 551.958, "end": 553.961, "text": "topo. No retorno, ele é retirado."}, {"start": 553.961, "end": 556.716, "text": "Um mesmo procedimento pode ter vários registros"}, {"start": 556.716, "end": 557.668, "text": "ao mesmo tempo."}, {"start": 557.988, "end": 560.137, "text": "Quando todos os procedimentos são globais,"}, {"start": 560.137, "end": 562.505, "text": "como em C, o ambiente precisa de um ponteiro"}, {"start": 562.505, "end": 563.689, "text": "para o registro atual,"}, {"start": 563.689, "end": 564.829, "text": "o ponteiro de quadro."}, {"start": 565.149, "end": 567.492, "text": "E de uma ligação para o registro anterior:"}, {"start": 567.492, "end": 568.871, "text": "a vinculação de controle,"}, {"start": 568.871, "end": 571.674, "text": "ou vinculação dinâmica. Também pode haver o ponteiro"}, {"start": 571.674, "end": 573.466, "text": "de pilha, apontando para o topo."}, {"start": 573.786, "end": 575.284, "text": "Para analisar as ativações,"}, {"start": 575.284, "end": 576.875, "text": "usa-se a árvore de ativação:"}, {"start": 576.875, "end": 578.186, "text": "cada ativação é um nó,"}, {"start": 578.186, "end": 580.995, "text": "e seus filhos são as ativações feitas durante ela."}, {"start": 581.495, "end": 584.516, "text": "Todos os registros de ativação de um mesmo procedimento"}, {"start": 584.516, "end": 585.678, "text": "têm o mesmo formato."}, {"start": 585.998, "end": 588.707, "text": "Por isso, cada parâmetro e cada variável local fica"}, {"start": 588.707, "end": 591.194, "text": "num deslocamento fixo em relação ao ponteiro de"}, {"start": 591.194, "end": 591.594, "text": "quadro."}, {"start": 591.914, "end": 594.522, "text": "Parâmetros e variáveis locais são acessados somando"}, {"start": 594.522, "end": 596.6, "text": "esse deslocamento ao ponteiro de quadro."}, {"start": 596.92, "end": 600.27, "text": "Em vetores, o deslocamento do elemento ainda é multiplicado"}, {"start": 600.27, "end": 601.727, "text": "pelo tamanho do elemento:"}, {"start": 601.727, "end": 602.844, "text": "o fator de escala."}, {"start": 603.344, "end": 606.129, "text": "Em linguagens com procedimentos declarados dentro"}, {"start": 606.129, "end": 607.522, "text": "de outros, como Pascal,"}, {"start": 607.522, "end": 608.616, "text": "surge um problema."}, {"start": 608.936, "end": 611.467, "text": "Um procedimento interno pode usar uma variável do"}, {"start": 611.467, "end": 612.82, "text": "procedimento que o contém:"}, {"start": 612.82, "end": 614.959, "text": "uma variável que não é local nem global."}, {"start": 615.279, "end": 616.807, "text": "Pela regra de escopo estático,"}, {"start": 616.807, "end": 619.269, "text": "essa variável vem do ambiente onde o procedimento"}, {"start": 619.269, "end": 621.222, "text": "foi definido, e não de quem o chamou."}, {"start": 621.542, "end": 623.666, "text": "A solução é a vinculação de acesso,"}, {"start": 623.666, "end": 625.0, "text": "ou vinculação estática."}, {"start": 625.32, "end": 627.791, "text": "A vinculação de controle aponta para o registro"}, {"start": 627.791, "end": 630.439, "text": "de quem chamou. A vinculação de acesso aponta para"}, {"start": 630.439, "end": 632.337, "text": "o registro do ambiente de definição."}, {"start": 632.837, "end": 634.932, "text": "O ambiente de pilha é o mais comum em"}, {"start": 634.932, "end": 637.116, "text": "linguagens imperativas, mas tem um limite."}, {"start": 637.436, "end": 639.793, "text": "Se um procedimento devolve uma referência a uma"}, {"start": 639.793, "end": 642.317, "text": "variável local, essa referência fica inválida quando"}, {"start": 642.317, "end": 643.579, "text": "o registro sai da pilha."}, {"start": 643.899, "end": 646.702, "text": "Linguagens como LISP e ML permitem esse tipo de"}, {"start": 646.702, "end": 649.653, "text": "uso, e precisam de um ambiente totalmente dinâmico."}, {"start": 649.973, "end": 652.466, "text": "Nele, um registro só é liberado quando não há"}, {"start": 652.466, "end": 653.735, "text": "mais referências a ele."}, {"start": 653.735, "end": 656.319, "text": "Isso exige acompanhar as referências e liberar a"}, {"start": 656.319, "end": 658.358, "text": "memória inacessível: a coleta de lixo."}, {"start": 658.858, "end": 660.247, "text": "Em orientação a objetos,"}, {"start": 660.247, "end": 662.882, "text": "um objeto é como um registro cujos campos são"}, {"start": 662.882, "end": 664.367, "text": "as variáveis de instância."}, {"start": 664.687, "end": 666.787, "text": "A estrutura das classes fica na memória,"}, {"start": 666.787, "end": 669.019, "text": "com os ponteiros para os métodos e para a"}, {"start": 669.019, "end": 671.645, "text": "superclasse. Cada objeto guarda só um ponteiro para"}, {"start": 671.645, "end": 672.257, "text": "sua classe."}, {"start": 672.577, "end": 675.22, "text": "Os métodos são encontrados buscando pela hierarquia"}, {"start": 675.22, "end": 677.55, "text": "de classes, o que implementa a herança e a"}, {"start": 677.55, "end": 678.58, "text": "vinculação dinâmica."}, {"start": 678.9, "end": 680.536, "text": "Mesmo num ambiente de pilha,"}, {"start": 680.536, "end": 682.702, "text": "ponteiros precisam de memória dinâmica:"}, {"start": 682.702, "end": 684.29, "text": "o heap, com duas operações,"}, {"start": 684.29, "end": 685.3, "text": "alocar e liberar."}, {"start": 685.8, "end": 688.429, "text": "Parâmetros são espaços no registro de ativação,"}, {"start": 688.429, "end": 691.489, "text": "preenchidos pelo chamador. Ligar parâmetros e argumentos"}, {"start": 691.489, "end": 692.828, "text": "também é uma amarração."}, {"start": 693.148, "end": 694.461, "text": "Na passagem por valor,"}, {"start": 694.461, "end": 697.136, "text": "o argumento é avaliado e seu valor é copiado."}, {"start": 697.136, "end": 699.714, "text": "Mudanças no parâmetro não afetam o argumento."}, {"start": 700.034, "end": 701.593, "text": "Na passagem por referência,"}, {"start": 701.593, "end": 704.372, "text": "passa-se a localização: o parâmetro vira um nome"}, {"start": 704.372, "end": 707.296, "text": "substituto do argumento, e o compilador usa acessos"}, {"start": 707.296, "end": 707.881, "text": "indiretos."}, {"start": 708.201, "end": 709.952, "text": "Na passagem por valor-resultado,"}, {"start": 709.952, "end": 712.365, "text": "o valor é copiado na entrada e copiado de"}, {"start": 712.365, "end": 714.92, "text": "volta na saída, sem criar um nome substituto."}, {"start": 715.24, "end": 716.447, "text": "Na passagem por nome,"}, {"start": 716.447, "end": 719.093, "text": "ou avaliação atrasada, o argumento só é avaliado"}, {"start": 719.093, "end": 721.506, "text": "quando é usado. E a ordem de avaliação dos"}, {"start": 721.506, "end": 724.385, "text": "argumentos pode alterar o resultado quando há efeitos"}, {"start": 724.385, "end": 724.988, "text": "colaterais."}, {"start": 725.488, "end": 728.079, "text": "A geração de código depende da linguagem fonte,"}, {"start": 728.079, "end": 730.81, "text": "da arquitetura alvo, do ambiente de execução e do"}, {"start": 730.81, "end": 731.874, "text": "sistema operacional."}, {"start": 732.194, "end": 735.012, "text": "Ela também procura otimizar a velocidade ou o tamanho"}, {"start": 735.012, "end": 735.951, "text": "do código gerado."}, {"start": 736.271, "end": 738.54, "text": "Por ser complexa, é dividida em passos,"}, {"start": 738.54, "end": 740.713, "text": "com estruturas de dados intermediárias."}, {"start": 741.033, "end": 743.572, "text": "Uma estrutura que representa o programa durante"}, {"start": 743.572, "end": 745.972, "text": "a tradução é uma representação intermediária."}, {"start": 745.972, "end": 747.357, "text": "A árvore sintática serve,"}, {"start": 747.357, "end": 749.434, "text": "mas não se parece com o código alvo."}, {"start": 749.754, "end": 752.067, "text": "Por isso, gera-se um código intermediário,"}, {"start": 752.067, "end": 753.625, "text": "parecido com o código alvo."}, {"start": 753.625, "end": 756.221, "text": "E ele também facilita redirecionar o compilador"}, {"start": 756.221, "end": 757.401, "text": "para outras máquinas."}, {"start": 757.901, "end": 760.553, "text": "A forma mais comum de código intermediário é o"}, {"start": 760.553, "end": 761.974, "text": "código de três endereços."}, {"start": 762.294, "end": 765.014, "text": "Cada instrução aplica um operador a dois operandos"}, {"start": 765.014, "end": 766.212, "text": "e guarda o resultado:"}, {"start": 766.212, "end": 767.872, "text": "um resultado e dois operandos,"}, {"start": 767.872, "end": 768.701, "text": "três endereços."}, {"start": 769.021, "end": 771.626, "text": "Os valores intermediários ficam em temporários,"}, {"start": 771.626, "end": 774.76, "text": "que correspondem aos nós interiores da árvore sintática."}, {"start": 775.08, "end": 777.576, "text": "Os temporários podem ir para registradores,"}, {"start": 777.576, "end": 780.472, "text": "para a memória, ou ser eliminados por otimização."}, {"start": 780.472, "end": 783.068, "text": "E operadores unários usam só dois endereços."}, {"start": 783.568, "end": 786.529, "text": "O código de três endereços normalmente não é guardado"}, {"start": 786.529, "end": 787.187, "text": "como texto."}, {"start": 787.507, "end": 789.646, "text": "Cada instrução é um registro com campos,"}, {"start": 789.646, "end": 791.964, "text": "e a sequência fica num vetor ou numa lista"}, {"start": 791.964, "end": 792.365, "text": "ligada."}, {"start": 792.685, "end": 794.295, "text": "A forma clássica é a quádrupla:"}, {"start": 794.295, "end": 796.371, "text": "um campo para a operação e três para os"}, {"start": 796.371, "end": 796.88, "text": "endereços."}, {"start": 797.2, "end": 798.926, "text": "Os endereços podem ser vazios,"}, {"start": 798.926, "end": 801.611, "text": "constantes ou nomes. E podem ser estendidos com"}, {"start": 801.611, "end": 802.906, "text": "modos de endereçamento."}, {"start": 803.406, "end": 806.06, "text": "A geração de código intermediário pode ser vista"}, {"start": 806.06, "end": 808.389, "text": "como o cálculo de um atributo sintetizado."}, {"start": 808.709, "end": 810.94, "text": "Cada nó recebe o nome do lugar onde fica"}, {"start": 810.94, "end": 813.751, "text": "seu resultado, e o código que calcula esse resultado."}, {"start": 814.071, "end": 816.132, "text": "O código de um nó é a concatenação do"}, {"start": 816.132, "end": 818.719, "text": "código dos filhos com a nova instrução do próprio"}, {"start": 818.719, "end": 820.999, "text": "nó. Assim, o código sobe pela árvore até a"}, {"start": 820.999, "end": 821.306, "text": "raiz."}, {"start": 821.626, "end": 823.0, "text": "Mas isso não é prático:"}, {"start": 823.0, "end": 824.706, "text": "gera muitas cópias de cadeias,"}, {"start": 824.706, "end": 827.598, "text": "é melhor emitir pequenos trechos direto num arquivo,"}, {"start": 827.598, "end": 830.299, "text": "e a geração depende muito de atributos herdados."}, {"start": 830.799, "end": 833.196, "text": "Do código intermediário para o código alvo,"}, {"start": 833.196, "end": 834.371, "text": "há mais uma passada."}, {"start": 834.691, "end": 837.834, "text": "Ela define as localizações das variáveis e dos temporários,"}, {"start": 837.834, "end": 840.477, "text": "gera o código que mantém o ambiente de execução,"}, {"start": 840.477, "end": 841.844, "text": "e aloca os registradores."}, {"start": 842.164, "end": 843.631, "text": "Duas técnicas são usadas."}, {"start": 843.631, "end": 844.951, "text": "Na expansão de macros,"}, {"start": 844.951, "end": 847.787, "text": "cada instrução intermediária é substituída por uma"}, {"start": 847.787, "end": 849.743, "text": "sequência fixa de instruções alvo."}, {"start": 850.063, "end": 852.851, "text": "Na simulação estática, o gerador simula os efeitos"}, {"start": 852.851, "end": 856.016, "text": "do código intermediário e gera o código alvo equivalente."}, {"start": 856.516, "end": 859.003, "text": "No código alvo, os nomes viram endereços:"}, {"start": 859.003, "end": 861.744, "text": "registradores, endereços absolutos para globais,"}, {"start": 861.744, "end": 864.891, "text": "ou deslocamentos no registro de ativação para locais."}, {"start": 865.211, "end": 867.458, "text": "Alguns acessos exigem cálculo de endereço,"}, {"start": 867.458, "end": 869.981, "text": "usando dois modos: o endereço de uma variável,"}, {"start": 869.981, "end": 872.688, "text": "e o acesso indireto pelo conteúdo de um endereço."}, {"start": 873.008, "end": 875.741, "text": "Numa matriz, o endereço do elemento é a base,"}, {"start": 875.741, "end": 878.326, "text": "mais o índice ajustado pelo limite inferior,"}, {"start": 878.326, "end": 880.513, "text": "multiplicado pelo tamanho do elemento."}, {"start": 880.513, "end": 883.743, "text": "Matrizes de várias dimensões aplicam isso recursivamente."}, {"start": 884.063, "end": 886.546, "text": "Num registro, o endereço do campo é a base"}, {"start": 886.546, "end": 888.216, "text": "mais o deslocamento do campo,"}, {"start": 888.216, "end": 890.889, "text": "uma constante fornecida pela tabela de símbolos."}, {"start": 891.209, "end": 893.702, "text": "E um ponteiro acrescenta um nível de indireção."}, {"start": 894.202, "end": 896.21, "text": "Comandos de controle exigem rótulos:"}, {"start": 896.21, "end": 898.122, "text": "os destinos dos saltos no código."}, {"start": 898.442, "end": 900.996, "text": "No comando condicional, a condição é avaliada;"}, {"start": 900.996, "end": 903.455, "text": "se for falsa, salta para a parte do senão."}, {"start": 903.455, "end": 905.015, "text": "Ao fim da parte verdadeira,"}, {"start": 905.015, "end": 906.34, "text": "um salto pula o senão."}, {"start": 906.66, "end": 907.918, "text": "No laço de repetição,"}, {"start": 907.918, "end": 909.419, "text": "um rótulo marca o início."}, {"start": 909.419, "end": 910.871, "text": "Se a condição for falsa,"}, {"start": 910.871, "end": 912.033, "text": "salta para a saída."}, {"start": 912.033, "end": 913.049, "text": "Ao fim do corpo,"}, {"start": 913.049, "end": 914.792, "text": "salta de volta para o início."}, {"start": 915.112, "end": 917.298, "text": "Às vezes o salto é gerado antes de o"}, {"start": 917.298, "end": 919.246, "text": "rótulo existir. Deixa-se um espaço,"}, {"start": 919.246, "end": 920.577, "text": "ou um salto provisório,"}, {"start": 920.577, "end": 922.097, "text": "e ele é preenchido depois:"}, {"start": 922.097, "end": 923.38, "text": "é o ajuste retroativo,"}, {"start": 923.38, "end": 924.235, "text": "o backpatching."}, {"start": 924.735, "end": 927.496, "text": "Valores booleanos geralmente são representados como"}, {"start": 927.496, "end": 928.782, "text": "números: falso é zero,"}, {"start": 928.782, "end": 929.877, "text": "e verdadeiro é um."}, {"start": 930.197, "end": 931.872, "text": "Em operações de curto-circuito,"}, {"start": 931.872, "end": 934.71, "text": "o segundo operando só é avaliado se for necessário."}, {"start": 935.03, "end": 936.311, "text": "O e lógico equivale a:"}, {"start": 936.311, "end": 937.913, "text": "se o primeiro for verdadeiro,"}, {"start": 937.913, "end": 939.286, "text": "o resultado é o segundo;"}, {"start": 939.286, "end": 940.018, "text": "senão, falso."}, {"start": 940.338, "end": 941.722, "text": "O ou lógico equivale a:"}, {"start": 941.722, "end": 943.393, "text": "se o primeiro for verdadeiro,"}, {"start": 943.393, "end": 944.825, "text": "o resultado é verdadeiro;"}, {"start": 944.825, "end": 946.4, "text": "senão, o segundo. Por isso,"}, {"start": 946.4, "end": 947.593, "text": "o código usa saltos,"}, {"start": 947.593, "end": 948.835, "text": "como nos condicionais."}, {"start": 949.335, "end": 951.591, "text": "Procedimentos envolvem dois mecanismos:"}, {"start": 951.591, "end": 953.181, "text": "a definição e a ativação."}, {"start": 953.501, "end": 954.925, "text": "A definição cria o nome,"}, {"start": 954.925, "end": 956.396, "text": "os parâmetros e o código,"}, {"start": 956.396, "end": 957.629, "text": "mas não executa nada."}, {"start": 957.949, "end": 960.516, "text": "No código intermediário, ela tem uma instrução de"}, {"start": 960.516, "end": 962.021, "text": "entrada, que marca o início,"}, {"start": 962.021, "end": 963.482, "text": "e uma instrução de retorno,"}, {"start": 963.482, "end": 965.872, "text": "que marca o fim e informa o valor devolvido."}, {"start": 966.192, "end": 968.703, "text": "A ativação tem uma instrução que indica o início"}, {"start": 968.703, "end": 971.215, "text": "dos argumentos, uma instrução para cada argumento,"}, {"start": 971.215, "end": 972.558, "text": "e a instrução de chamada,"}, {"start": 972.558, "end": 974.117, "text": "que salta para o procedimento."}, {"start": 974.437, "end": 976.856, "text": "Representar isso de forma geral é difícil,"}, {"start": 976.856, "end": 979.76, "text": "porque as máquinas e os ambientes de execução usam"}, {"start": 979.76, "end": 981.987, "text": "mecanismos de ativação muito diferentes."}, {"start": 982.487, "end": 985.184, "text": "A máquina alvo do compilador TINY é a TM."}, {"start": 985.504, "end": 988.116, "text": "Ela tem uma memória de instruções só de leitura,"}, {"start": 988.116, "end": 990.368, "text": "uma memória de dados e oito registradores."}, {"start": 990.368, "end": 992.755, "text": "O registrador sete é o contador de programa."}, {"start": 993.075, "end": 994.239, "text": "Ela repete o ciclo:"}, {"start": 994.239, "end": 996.569, "text": "busca a instrução, incrementa o contador,"}, {"start": 996.569, "end": 998.656, "text": "executa. Até uma parada ou um erro."}, {"start": 998.976, "end": 1000.736, "text": "As instruções têm dois formatos:"}, {"start": 1000.736, "end": 1003.516, "text": "só com registradores, ou com registrador e memória,"}, {"start": 1003.516, "end": 1006.342, "text": "cujo endereço é um deslocamento mais um registrador."}, {"start": 1006.662, "end": 1009.522, "text": "Os saltos condicionais podem ser relativos ao contador"}, {"start": 1009.522, "end": 1011.519, "text": "de programa, que já foi incrementado."}, {"start": 1012.019, "end": 1013.577, "text": "No gerador de código TINY,"}, {"start": 1013.577, "end": 1015.33, "text": "cada registrador tem um papel."}, {"start": 1015.65, "end": 1017.498, "text": "O sete é o contador de programa."}, {"start": 1017.498, "end": 1019.623, "text": "O seis aponta para o topo da memória,"}, {"start": 1019.623, "end": 1021.056, "text": "onde ficam os temporários."}, {"start": 1021.056, "end": 1022.719, "text": "O cinco aponta para o início,"}, {"start": 1022.719, "end": 1024.059, "text": "onde ficam as variáveis."}, {"start": 1024.059, "end": 1026.184, "text": "E o zero e o um são os acumuladores."}, {"start": 1026.504, "end": 1029.462, "text": "Funções de emissão escrevem comentários e instruções,"}, {"start": 1029.462, "end": 1031.886, "text": "e outras dão suporte ao ajuste retroativo."}, {"start": 1032.206, "end": 1033.687, "text": "O gerador emite um prólogo,"}, {"start": 1033.687, "end": 1036.603, "text": "percorre a árvore sintática e termina com uma instrução"}, {"start": 1036.603, "end": 1037.186, "text": "de parada."}, {"start": 1037.506, "end": 1039.966, "text": "Em cada nó, gera o código de uma declaração"}, {"start": 1039.966, "end": 1041.126, "text": "ou de uma expressão,"}, {"start": 1041.126, "end": 1042.472, "text": "e continua pelos irmãos."}, {"start": 1042.972, "end": 1044.017, "text": "Resumindo o caminho."}, {"start": 1044.337, "end": 1047.812, "text": "A análise semântica garante que o programa tem significado:"}, {"start": 1047.812, "end": 1049.575, "text": "atributos, tabela de símbolos,"}, {"start": 1049.575, "end": 1050.532, "text": "escopo e tipos."}, {"start": 1050.852, "end": 1053.525, "text": "O ambiente de execução define como a memória é"}, {"start": 1053.525, "end": 1055.672, "text": "usada: estático, de pilha ou dinâmico,"}, {"start": 1055.672, "end": 1058.536, "text": "com registros de ativação e passagem de parâmetros."}, {"start": 1058.856, "end": 1061.182, "text": "E a geração de código traduz tudo isso:"}, {"start": 1061.182, "end": 1063.46, "text": "código intermediário, endereços, controle,"}, {"start": 1063.46, "end": 1065.253, "text": "procedimentos e a máquina alvo."}, {"start": 1065.573, "end": 1066.991, "text": "São três etapas ligadas:"}, {"start": 1066.991, "end": 1069.142, "text": "o significado, a memória e o código."}];
        var DURATION = 1071.292;
        var stage = document.getElementById("cap-stage");
        var tl = gsap.timeline({ paused: true });
        GROUPS.forEach(function (g, i) {

          tl.set(el, { opacity: 1 }, g.start);
          tl.fromTo(pill, { y: 8 }, { y: 0, duration: 0.18, ease: "power2.out" }, g.start);
          tl.set(el, { opacity: 0 }, Math.max(g.start + 0.05, end));
        });
        tl.to({}, { duration: DURATION }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["captions"] = tl;
      })();
    </script>
  </div>
