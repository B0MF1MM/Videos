<!--sfx: b:pop@1.0*0.25, c:pop@0.4*0.25, d:pop*0.3-->
<style>
  .row { position: absolute; left: 120px; width: 1100px; height: 90px; }
  .ca { position: absolute; left: 0; top: 0; font-family: "DM Mono", monospace; font-size: 44px; line-height: 90px; color: #EEF1F8; }
  .st { position: absolute; top: 18px; font-family: "DM Mono", monospace; font-size: 28px; padding: 10px 18px; border-radius: 12px; }
  .s1 { left: 420px; background: #0F2A30; border: 2px solid #4FD6EE; color: #4FD6EE; }
  .s2 { left: 760px; background: #13241A; border: 2px solid #7FE39A; color: #7FE39A; }
</style>
<div id="@hd" class="k-chip k-c-cyan" style="left:120px;top:120px;font-size:26px">POR VALOR · o argumento pode ser qualquer expressão</div>
<div id="@ctx" class="k-anno k-mute" style="left:1300px;top:200px;font-size:28px">a = 5   b = 4</div>
<div id="@r1" class="row" style="top:220px"><div class="ca">inc(3)</div><div id="@a1" class="st s1">calcula: 3</div><div id="@b1" class="st s2">copia: x = 3</div></div>
<div id="@r2" class="row" style="top:340px"><div class="ca">inc(a + 1)</div><div id="@a2" class="st s1">calcula: 6</div><div id="@b2" class="st s2">copia: x = 6</div></div>
<div id="@r3" class="row" style="top:460px"><div class="ca">inc(b * 2)</div><div id="@a3" class="st s1">calcula: 8</div><div id="@b3" class="st s2">copia: x = 8</div></div>
<div id="@ord" class="k-anno k-c-yel" style="left:1300px;top:350px">1º calcula
2º copia</div>
<div id="@cp" class="k-card" style="left:120px;top:600px;width:820px;height:120px;border-color:#4FD6EE">
  <div class="k-body" style="left:30px;top:40px;font-size:30px">compilador: <b class="k-c-cyan">calcular + copiar</b> · o mais fácil</div>
</div>
<div id="@mac" class="k-macete" style="left:980px;top:600px;width:820px;font-size:30px">Fotocópia: rabisque a cópia à vontade, o <u>original</u> continua limpo.</div>
<script>
K.fade(tl, $("hd"), C.a);
K.fade(tl, $("ctx"), C.a + 0.4);
K.rise(tl, [$("r1"), $("r2"), $("r3")], C.a + 0.8, { s: 0.4 });
tl.set([$("a1"), $("a2"), $("a3"), $("b1"), $("b2"), $("b3")], { opacity: 0 }, 0);
K.pop(tl, [$("a1"), $("a2"), $("a3")], C.b + 1.0, { s: 0.8 });
K.pop(tl, [$("b1"), $("b2"), $("b3")], C.b + 3.4, { s: 0.6 });
K.wipe(tl, $("ord"), C.b + 4.6);
K.rise(tl, $("cp"), C.c + 0.2);
K.macete(tl, $("mac"), C.d);
</script>
