      (function () {
        var GROUPS = [{"start": 0.15, "end": 2.895, "text": "Passagem de parâmetros: o que acontece quando uma"}, {"start": 2.895, "end": 4.219, "text": "função recebe um valor."}, {"start": 4.539, "end": 6.618, "text": "Existem quatro mecanismos: por valor,"}, {"start": 6.618, "end": 8.6, "text": "por referência, por valor-resultado,"}, {"start": 8.6, "end": 9.325, "text": "e por nome."}, {"start": 9.645, "end": 11.513, "text": "Para cada um, você vai ver a ideia,"}, {"start": 11.513, "end": 13.042, "text": "um exemplo animado na memória,"}, {"start": 13.042, "end": 14.613, "text": "e um macete para não esquecer."}, {"start": 15.113, "end": 17.169, "text": "Primeiro, dois nomes que a prova adora."}, {"start": 17.489, "end": 20.246, "text": "Parâmetro é o nome que aparece na definição da"}, {"start": 20.246, "end": 21.378, "text": "função. Aqui, o x."}, {"start": 21.698, "end": 23.992, "text": "Argumento é o que você passa na chamada."}, {"start": 23.992, "end": 24.975, "text": "Aqui, a mais um."}, {"start": 25.295, "end": 28.299, "text": "Ligar cada argumento ao seu parâmetro se chama amarração."}, {"start": 28.619, "end": 30.915, "text": "Macete: parâmetro mora na definição."}, {"start": 30.915, "end": 32.665, "text": "Argumento chega na chamada."}, {"start": 33.165, "end": 34.538, "text": "Onde o parâmetro fica?"}, {"start": 34.538, "end": 37.742, "text": "Numa caixa do registro de ativação da função chamada."}, {"start": 38.062, "end": 40.673, "text": "Quem chama preenche essa caixa antes de saltar para"}, {"start": 40.673, "end": 41.7, "text": "o código da função."}, {"start": 42.02, "end": 44.374, "text": "Dentro da função, o parâmetro é só o endereço"}, {"start": 44.374, "end": 46.643, "text": "dessa caixa: é lá que o código vai procurar"}, {"start": 46.643, "end": 47.113, "text": "o valor."}, {"start": 47.433, "end": 48.741, "text": "A grande pergunta é:"}, {"start": 48.741, "end": 50.468, "text": "o que vai dentro da caixa?"}, {"start": 50.468, "end": 51.88, "text": "Um valor? Um endereço?"}, {"start": 51.88, "end": 52.508, "text": "Um texto?"}, {"start": 52.828, "end": 55.424, "text": "A resposta depende do mecanismo de passagem."}, {"start": 55.924, "end": 57.949, "text": "Os quatro mecanismos, numa imagem."}, {"start": 58.269, "end": 59.827, "text": "Por valor: vai uma cópia."}, {"start": 59.827, "end": 60.983, "text": "Como uma fotocópia."}, {"start": 61.303, "end": 62.998, "text": "Por referência: vai o endereço."}, {"start": 62.998, "end": 64.693, "text": "Como entregar a chave da casa."}, {"start": 65.013, "end": 66.962, "text": "Por valor-resultado: vai uma cópia,"}, {"start": 66.962, "end": 68.244, "text": "e no final ela volta."}, {"start": 68.244, "end": 69.717, "text": "Como emprestar e devolver."}, {"start": 70.037, "end": 72.284, "text": "Por nome: vai o próprio texto do argumento,"}, {"start": 72.284, "end": 74.099, "text": "que só é calculado quando é usado."}, {"start": 74.599, "end": 75.769, "text": "Passagem por valor."}, {"start": 76.089, "end": 77.912, "text": "O argumento é avaliado na chamada,"}, {"start": 77.912, "end": 80.224, "text": "e o valor dele é copiado para o parâmetro."}, {"start": 80.544, "end": 83.081, "text": "Dentro da função, o parâmetro funciona como uma"}, {"start": 83.081, "end": 85.482, "text": "variável local que já começa com esse valor."}, {"start": 85.802, "end": 87.003, "text": "Pode mudar à vontade:"}, {"start": 87.003, "end": 88.574, "text": "a mudança fica só na cópia,"}, {"start": 88.574, "end": 90.468, "text": "e não altera nada fora da função."}, {"start": 90.788, "end": 92.34, "text": "É o único mecanismo de C,"}, {"start": 92.34, "end": 94.037, "text": "e o básico de Pascal e Ada."}, {"start": 94.037, "end": 96.753, "text": "Em Ada, o parâmetro por valor nem pode receber"}, {"start": 96.753, "end": 97.384, "text": "atribuição."}, {"start": 97.884, "end": 99.218, "text": "Vamos ver na memória."}, {"start": 99.218, "end": 100.655, "text": "No main, a vale cinco."}, {"start": 100.975, "end": 102.364, "text": "O main chama inc de a."}, {"start": 102.364, "end": 104.903, "text": "O valor cinco é copiado para o parâmetro x,"}, {"start": 104.903, "end": 106.053, "text": "no registro de inc."}, {"start": 106.373, "end": 108.28, "text": "Dentro de inc, x mais mais:"}, {"start": 108.28, "end": 109.345, "text": "o x vira seis."}, {"start": 109.345, "end": 110.243, "text": "Mas só o x."}, {"start": 110.563, "end": 112.93, "text": "A função termina, e o registro de inc é"}, {"start": 112.93, "end": 114.282, "text": "desempilhado. O x some."}, {"start": 114.602, "end": 115.661, "text": "De volta ao main,"}, {"start": 115.661, "end": 116.671, "text": "a continua cinco."}, {"start": 117.171, "end": 118.307, "text": "Como só vai o valor,"}, {"start": 118.307, "end": 120.362, "text": "o argumento pode ser qualquer expressão."}, {"start": 120.682, "end": 122.503, "text": "Inc de três, inc de a mais um,"}, {"start": 122.503, "end": 123.718, "text": "inc de b vezes dois:"}, {"start": 123.718, "end": 125.82, "text": "tudo vale, porque primeiro se calcula,"}, {"start": 125.82, "end": 126.754, "text": "depois se copia."}, {"start": 127.074, "end": 129.695, "text": "E para o compilador é o mecanismo mais fácil:"}, {"start": 129.695, "end": 131.077, "text": "basta calcular e copiar."}, {"start": 131.397, "end": 134.177, "text": "Macete da fotocópia: você pode rabiscar a cópia"}, {"start": 134.177, "end": 136.361, "text": "à vontade. O original continua limpo."}, {"start": 136.861, "end": 137.994, "text": "Mas e quando, em C,"}, {"start": 137.994, "end": 140.759, "text": "a função precisa alterar a variável de quem chamou?"}, {"start": 141.079, "end": 142.767, "text": "A saída é passar o endereço,"}, {"start": 142.767, "end": 143.876, "text": "com o e comercial."}, {"start": 143.876, "end": 145.274, "text": "Troca de e comercial a,"}, {"start": 145.274, "end": 146.142, "text": "e comercial b."}, {"start": 146.462, "end": 148.615, "text": "O endereço também é passado por valor:"}, {"start": 148.615, "end": 150.767, "text": "a função recebe uma cópia do endereço."}, {"start": 151.087, "end": 153.465, "text": "Mas com a cópia do endereço,"}, {"start": 153.465, "end": 155.979, "text": "ela chega na variável original,"}, {"start": 155.979, "end": 157.542, "text": "usando o asterisco."}, {"start": 157.862, "end": 160.089, "text": "Foi isso que aconteceu na questão do hello:"}, {"start": 160.089, "end": 162.487, "text": "o parâmetro s recebeu uma cópia do endereço da"}, {"start": 162.487, "end": 162.873, "text": "string."}, {"start": 163.373, "end": 164.742, "text": "Passagem por referência."}, {"start": 165.062, "end": 166.466, "text": "Agora, em vez do valor,"}, {"start": 166.466, "end": 168.208, "text": "vai a localização da variável:"}, {"start": 168.208, "end": 169.176, "text": "o endereço dela."}, {"start": 169.496, "end": 171.485, "text": "O parâmetro vira um nome substituto,"}, {"start": 171.485, "end": 173.104, "text": "um apelido, para o argumento."}, {"start": 173.424, "end": 175.999, "text": "Por isso, qualquer alteração no parâmetro acontece"}, {"start": 175.999, "end": 177.065, "text": "também no argumento."}, {"start": 177.385, "end": 179.345, "text": "Em Pascal, se usa a palavra var."}, {"start": 179.345, "end": 180.325, "text": "Em C mais mais,"}, {"start": 180.325, "end": 181.942, "text": "o e comercial no parâmetro."}, {"start": 181.942, "end": 183.657, "text": "E em Fortran setenta e sete,"}, {"start": 183.657, "end": 184.98, "text": "era o único mecanismo."}, {"start": 185.48, "end": 187.654, "text": "O mesmo exemplo, agora por referência."}, {"start": 187.654, "end": 189.006, "text": "No main, a vale cinco."}, {"start": 189.326, "end": 192.064, "text": "Na chamada, o parâmetro x não recebe cinco."}, {"start": 192.064, "end": 193.854, "text": "Ele recebe o endereço de a."}, {"start": 194.174, "end": 196.534, "text": "Dentro de inc, x mais mais segue a seta"}, {"start": 196.534, "end": 197.979, "text": "e soma um no próprio a."}, {"start": 197.979, "end": 199.087, "text": "Agora a vale seis."}, {"start": 199.407, "end": 201.229, "text": "A função termina e o x some."}, {"start": 201.229, "end": 203.305, "text": "Mas a mudança já foi feita em a."}, {"start": 203.625, "end": 204.663, "text": "De volta ao main,"}, {"start": 204.663, "end": 205.418, "text": "a vale seis."}, {"start": 205.918, "end": 208.847, "text": "O que o compilador precisa fazer para isso funcionar?"}, {"start": 209.167, "end": 211.873, "text": "Primeiro: calcular o endereço do argumento e guardar"}, {"start": 211.873, "end": 213.869, "text": "esse endereço no registro de ativação."}, {"start": 214.189, "end": 217.089, "text": "Segundo: transformar todo uso do parâmetro num acesso"}, {"start": 217.089, "end": 218.772, "text": "indireto. O x mais mais vira:"}, {"start": 218.772, "end": 220.222, "text": "pega o valor no endereço,"}, {"start": 220.222, "end": 222.467, "text": "soma um, e guarda de volta no endereço."}, {"start": 222.787, "end": 225.275, "text": "Por isso o argumento precisa ser uma variável,"}, {"start": 225.275, "end": 226.632, "text": "com um lugar na memória."}, {"start": 226.632, "end": 228.576, "text": "Inc de três, ou inc de a mais um,"}, {"start": 228.576, "end": 230.069, "text": "não funciona por referência."}, {"start": 230.389, "end": 232.628, "text": "Macete da chave: quem tem a chave entra na"}, {"start": 232.628, "end": 234.825, "text": "casa de verdade, e o que mexer lá dentro,"}, {"start": 234.825, "end": 235.471, "text": "fica mexido."}, {"start": 235.971, "end": 237.73, "text": "Passagem por valor-resultado."}, {"start": 238.05, "end": 240.508, "text": "Na chamada, o valor do argumento é copiado para"}, {"start": 240.508, "end": 242.621, "text": "o parâmetro, igual na passagem por valor."}, {"start": 242.941, "end": 244.999, "text": "A função trabalha só com a cópia."}, {"start": 244.999, "end": 246.154, "text": "Não existe apelido."}, {"start": 246.474, "end": 248.389, "text": "E no final, quando a função termina,"}, {"start": 248.389, "end": 250.783, "text": "o valor final do parâmetro é copiado de volta"}, {"start": 250.783, "end": 251.697, "text": "para o argumento."}, {"start": 252.017, "end": 254.434, "text": "Por isso, o registro de ativação não pode ser"}, {"start": 254.434, "end": 256.982, "text": "liberado pela função chamada antes dessa cópia de"}, {"start": 256.982, "end": 259.619, "text": "volta: quem chamou ainda precisa ler esses valores."}, {"start": 260.119, "end": 263.122, "text": "Então, valor-resultado e referência dão sempre o"}, {"start": 263.122, "end": 265.589, "text": "mesmo resultado? Quase. Veja este caso."}, {"start": 265.909, "end": 267.795, "text": "A função p soma um em x e soma"}, {"start": 267.795, "end": 269.586, "text": "um em y. E o main chama p de"}, {"start": 269.586, "end": 271.047, "text": "a, a, com a igual a um."}, {"start": 271.367, "end": 273.918, "text": "Por referência: x e y são dois apelidos do"}, {"start": 273.918, "end": 274.997, "text": "mesmo a. Soma um,"}, {"start": 274.997, "end": 276.028, "text": "soma um de novo:"}, {"start": 276.028, "end": 277.205, "text": "a termina com três."}, {"start": 277.525, "end": 279.894, "text": "Por valor-resultado: x e y são cópias,"}, {"start": 279.894, "end": 281.387, "text": "os dois começam com um."}, {"start": 281.387, "end": 282.571, "text": "Cada um vira dois."}, {"start": 282.891, "end": 285.781, "text": "No final, os dois copiam dois de volta para"}, {"start": 285.781, "end": 287.963, "text": "a. Resultado: a termina com dois."}, {"start": 287.963, "end": 289.326, "text": "Resultados diferentes!"}, {"start": 289.826, "end": 290.974, "text": "Passagem por nome."}, {"start": 291.294, "end": 294.036, "text": "Aqui, o argumento não é calculado na chamada."}, {"start": 294.036, "end": 297.235, "text": "Por isso, ela também é chamada de avaliação atrasada."}, {"start": 297.555, "end": 300.414, "text": "O texto do argumento substitui o nome do parâmetro"}, {"start": 300.414, "end": 302.796, "text": "dentro da função, como um copiar e colar."}, {"start": 303.116, "end": 305.598, "text": "E ele é recalculado toda vez que o parâmetro"}, {"start": 305.598, "end": 306.103, "text": "é usado."}, {"start": 306.423, "end": 308.781, "text": "Exemplo do slide: proc faz mais mais x."}, {"start": 308.781, "end": 310.303, "text": "Chamando proc de a de i,"}, {"start": 310.303, "end": 312.12, "text": "o efeito é mais mais a de i."}, {"start": 312.62, "end": 313.933, "text": "Onde isso faz diferença?"}, {"start": 313.933, "end": 316.061, "text": "Quando algo muda entre um uso e outro."}, {"start": 316.381, "end": 318.288, "text": "A função p primeiro soma um em i,"}, {"start": 318.288, "end": 319.605, "text": "e depois soma um em x."}, {"start": 319.605, "end": 321.149, "text": "Começamos com i igual a um,"}, {"start": 321.149, "end": 322.783, "text": "a de um igual a dez e a de"}, {"start": 322.783, "end": 323.873, "text": "dois igual a vinte."}, {"start": 324.193, "end": 326.391, "text": "Por referência: x já é o endereço de a"}, {"start": 326.391, "end": 327.947, "text": "de um, calculado na chamada."}, {"start": 327.947, "end": 329.366, "text": "Então a de um vira onze."}, {"start": 329.686, "end": 331.509, "text": "Por nome: x é o texto a de i."}, {"start": 331.509, "end": 332.911, "text": "Quando chega a vez dele,"}, {"start": 332.911, "end": 333.846, "text": "i já vale dois."}, {"start": 333.846, "end": 335.809, "text": "Então quem vira vinte e um é o a"}, {"start": 335.809, "end": 336.323, "text": "de dois!"}, {"start": 336.643, "end": 339.118, "text": "Macete: por nome é copiar e colar o texto,"}, {"start": 339.118, "end": 340.451, "text": "e calcular só na hora."}, {"start": 340.951, "end": 343.935, "text": "Um cuidado extra: a ordem de avaliação dos argumentos."}, {"start": 344.255, "end": 346.693, "text": "Na maioria das vezes ela não importa."}, {"start": 346.693, "end": 348.48, "text": "Mas, com efeitos colaterais,"}, {"start": 348.48, "end": 349.022, "text": "importa."}, {"start": 349.342, "end": 351.612, "text": "Em C, a chamada f de mais mais x,"}, {"start": 351.612, "end": 353.513, "text": "vírgula x, com x igual a um."}, {"start": 353.833, "end": 355.512, "text": "Da esquerda para a direita:"}, {"start": 355.512, "end": 357.344, "text": "primeiro mais mais x dá dois,"}, {"start": 357.344, "end": 358.972, "text": "e depois x também é dois."}, {"start": 358.972, "end": 359.99, "text": "Fica f de dois,"}, {"start": 359.99, "end": 360.346, "text": "dois."}, {"start": 360.666, "end": 362.325, "text": "Da direita para a esquerda:"}, {"start": 362.325, "end": 363.38, "text": "primeiro x é um,"}, {"start": 363.38, "end": 365.24, "text": "e depois mais mais x dá dois."}, {"start": 365.24, "end": 366.246, "text": "Fica f de dois,"}, {"start": 366.246, "end": 367.753, "text": "um. Resultados diferentes!"}, {"start": 368.253, "end": 369.405, "text": "Comparando os quatro."}, {"start": 369.725, "end": 371.098, "text": "Por valor: vai uma cópia."}, {"start": 371.098, "end": 373.668, "text": "Aceita qualquer expressão, e o original não muda."}, {"start": 373.988, "end": 375.742, "text": "Por referência: vai o endereço."}, {"start": 375.742, "end": 377.165, "text": "Precisa ser uma variável,"}, {"start": 377.165, "end": 378.729, "text": "e o original muda na hora."}, {"start": 379.049, "end": 380.962, "text": "Por valor-resultado: vai uma cópia,"}, {"start": 380.962, "end": 382.082, "text": "que volta no final."}, {"start": 382.082, "end": 383.482, "text": "Precisa ser uma variável,"}, {"start": 383.482, "end": 385.348, "text": "e o original só muda no retorno."}, {"start": 385.668, "end": 387.055, "text": "Por nome: vai o texto."}, {"start": 387.055, "end": 388.838, "text": "Ele é recalculado a cada uso."}, {"start": 389.338, "end": 392.002, "text": "Como responder uma questão de passagem de parâmetros"}, {"start": 392.002, "end": 392.527, "text": "na prova."}, {"start": 392.847, "end": 395.148, "text": "Um: escreva a definição de cada mecanismo,"}, {"start": 395.148, "end": 395.93, "text": "em uma frase."}, {"start": 396.25, "end": 398.292, "text": "Dois: mostre um exemplo de código,"}, {"start": 398.292, "end": 399.487, "text": "com a mesma função,"}, {"start": 399.487, "end": 400.682, "text": "nos dois mecanismos."}, {"start": 401.002, "end": 403.789, "text": "Três: diga o valor final da variável depois da"}, {"start": 403.789, "end": 405.681, "text": "chamada. Por exemplo, por valor,"}, {"start": 405.681, "end": 407.622, "text": "x continua cinco. Por referência,"}, {"start": 407.622, "end": 408.518, "text": "x vira quinze."}, {"start": 408.838, "end": 410.773, "text": "E se pedirem o registro de ativação:"}, {"start": 410.773, "end": 413.367, "text": "o parâmetro ocupa uma caixa no início do registro"}, {"start": 413.367, "end": 414.906, "text": "da função chamada. Por valor,"}, {"start": 414.906, "end": 416.401, "text": "com o valor; por referência,"}, {"start": 416.401, "end": 417.281, "text": "com um endereço."}, {"start": 417.781, "end": 419.021, "text": "Para levar para a prova."}, {"start": 419.341, "end": 420.565, "text": "Valor é fotocópia."}, {"start": 420.885, "end": 422.591, "text": "Referência é a chave da casa."}, {"start": 422.911, "end": 425.844, "text": "Valor-resultado é empréstimo: leva uma cópia e devolve"}, {"start": 425.844, "end": 426.403, "text": "no final."}, {"start": 426.723, "end": 428.471, "text": "Nome é copiar e colar o texto,"}, {"start": 428.471, "end": 430.126, "text": "calculando só na hora do uso."}, {"start": 430.446, "end": 431.708, "text": "Agora é com você."}, {"start": 431.708, "end": 432.454, "text": "Boa prova!"}];
