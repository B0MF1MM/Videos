          <div class="f15-abs" id="f15-q-gfx" style="left:0; top:0; width:750px; height:200px;"></div>
        </div>

      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var D = 17.579;
        var tl = gsap.timeline({ paused: true });
        var SHOW = "inset(-30% -4% -15% -4%)";
        var HIDE = "inset(-30% 104% -15% -4%)";
        var BELT_V = 200;          // px / s — belt and pieces share it
        var ON = 4.25;             // machine switches on

        function $(id) { return document.getElementById(id); }

        // ---------- build-time DOM (deterministic) ----------
        // ruler ticks every 5 units (14 px / unit)
        var tks = $("f15-ticks");
        for (var v = 0; v <= 35; v += 5) {
          var t = document.createElement("div");
          t.className = "f15-fill";
          t.style.left = (490 + v * 14 - 1) + "px";
          t.style.top = "572px";
          t.style.width = "3px";
          t.style.height = (v % 10 === 0 ? 14 : 8) + "px";
          tks.appendChild(t);
        }
        // Q card: 5×4 cell grid, 19 on + 1 off
        var qg = $("f15-q-gfx");
        var qCells = [];
        for (var qi = 0; qi < 20; qi++) {
          var qc = document.createElement("div");
          qc.className = qi < 19 ? "f15-qcell" : "f15-qoff";
          qc.style.left = (598 + (qi % 5) * 25) + "px";
          qc.style.top = (61 + Math.floor(qi / 5) * 25) + "px";
          qg.appendChild(qc);
          qCells.push(qc);
        }
        // basket cell coordinates (5 × 2)
        var CELL = [];
        for (var bc = 0; bc < 10; bc++) CELL.push({ x: 621 + (bc % 5) * 42, y: 790 + Math.floor(bc / 5) * 42 });

        // slow camera push under the whole shot
        tl.fromTo("#f15-content", { scale: 1 }, { scale: 1.02, duration: D, ease: "none" }, 0);

        // ================= Scene 1 (0.0–4.0) =================
        // compact "P · E · Q" → each letter unfolds into its word
        tl.set("#f15-d1", { x: -410 }, 0);
        tl.set("#f15-hE", { x: -400 }, 0);
        tl.set("#f15-d2", { x: -715 }, 0);
        tl.set("#f15-hQ", { x: -710 }, 0);
        ["P", "E", "Q"].forEach(function (L) { tl.set("#f15-h" + L + "-r", { opacity: 0, clipPath: HIDE }, 0); });
        tl.fromTo(["#f15-hP-l", "#f15-d1", "#f15-hE-l", "#f15-d2", "#f15-hQ-l"], { y: 40, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.06 }, 0.05);

        function unfold(L, t) {
          tl.to("#f15-h" + L + "-l", { keyframes: { scale: [1, 1.12, 1] }, duration: 0.35, ease: "none" }, t);
          tl.set("#f15-h" + L + "-r", { opacity: 1 }, t);
          tl.fromTo("#f15-h" + L + "-r", { clipPath: HIDE, x: -24 }, { clipPath: SHOW, x: 0, duration: 0.55, ease: "power3.out", immediateRender: false }, t);
        }
        unfold("P", 0.9);
        tl.to(["#f15-d1", "#f15-hE"], { x: 0, duration: 0.55, ease: "power3.out" }, 0.9);
        tl.to("#f15-d2", { x: -315, duration: 0.55, ease: "power3.out" }, 0.9);
        tl.to("#f15-hQ", { x: -310, duration: 0.55, ease: "power3.out" }, 0.9);
        unfold("E", 1.7);
        tl.to(["#f15-d2", "#f15-hQ"], { x: 0, duration: 0.55, ease: "power3.out" }, 1.7);
        unfold("Q", 2.5);

        // machine slides in, conveyor rolls out
        tl.fromTo("#f15-machine", { x: -460, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 0.25);
        tl.fromTo("#f15-conv", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 1.0);
        tl.set("#f15-btn", { scale: 0 }, 0);
        tl.set("#f15-lamp", { opacity: 0.2 }, 0);
        // standby blink on the square button
        tl.to("#f15-btn", { keyframes: { scale: [0, 0.45, 0, 0.45, 0, 0.45, 0] }, duration: 2.2, ease: "none" }, 1.6);

        // empty counter cards arrive with their letters
        ["P", "E", "Q"].forEach(function (L, i) {
          var t0 = 2.9 + i * 0.2;
          tl.set("#f15-c" + L + "-on", { opacity: 0 }, 0);
          tl.fromTo("#f15-c" + L, { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, t0);
          tl.fromTo("#f15-c" + L + "-sq", { scale: 0.3 }, { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, t0 + 0.12);
        });
        // hide all card contents until their cue
        ["#f15-p-expr", "#f15-p-lab", "#f15-e-lab", "#f15-q-lab"].forEach(function (s) { tl.set(s, { clipPath: HIDE }, 0); });
        ["#f15-p-big", "#f15-e-big", "#f15-q-big", "#f15-p-suf", "#f15-e-vs", "#f15-e-30", "#f15-q-suf"].forEach(function (s) { tl.set(s, { opacity: 0 }, 0); });
        for (var pb = 0; pb < 8; pb++) tl.set("#f15-pb" + pb, { scaleY: 0 }, 0);
        tl.set(["#f15-pbase", "#f15-e-base"], { scaleX: 0 }, 0);
        tl.set(["#f15-e-real", "#f15-e-pad"], { scaleY: 0 }, 0);
        tl.set(qCells, { scale: 0 }, 0);

        // scene objects hidden until their cue
        tl.set(["#f15-peca", "#f15-clock"], { opacity: 0 }, 0);
        tl.set("#f15-8h", { clipPath: HIDE }, 0);
        tl.set(["#f15-padlab", "#f15-real-t"], { clipPath: HIDE }, 0);
        tl.set("#f15-axis", { scaleX: 0 }, 0);
        tl.set("#f15-real", { scaleX: 0 }, 0);
        tl.set(["#f15-ticks", "#f15-t0", "#f15-t10", "#f15-t20", "#f15-t30", "#f15-gap"], { opacity: 0 }, 0);
        tl.set("#f15-mark", { scaleY: 0 }, 0);
        tl.set(["#f15-basket", "#f15-hole", "#f15-flap", "#f15-sensor"], { opacity: 0 }, 0);
        tl.set("#f15-sensor-i", { opacity: 0 }, 0);
        tl.set(["#f15-reflab", "#f15-refnum"], { clipPath: HIDE }, 0);
        tl.set(["#f15-pf0", "#f15-pf1", "#f15-pf2"], { opacity: 0 }, 0);

        // ================= Scene 2 (4.0–10.4) =================
        // machine switches on
        tl.fromTo("#f15-btn", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 4.2);
        tl.to("#f15-lamp", { keyframes: { opacity: [0.2, 1, 0.3, 1] }, duration: 0.35, ease: "none" }, 4.25);
        tl.to("#f15-mbody", { keyframes: { x: [0, -6, 5, -3, 2, 0] }, duration: 0.35, ease: "none" }, 4.25);
        // steady hum
        var hum = [];
        for (var h = 0; h < 52; h++) hum.push(0, -2, 0, 2);
        hum.push(0);
        tl.to("#f15-mbody", { keyframes: { y: hum }, duration: D - 4.7, ease: "none" }, 4.6);
        // lamp keeps pulsing while it runs
        var lampK = [];
        for (var lk = 0; lk < 16; lk++) lampK.push(1, 0.35);
        lampK.push(1);
        tl.to("#f15-lamp", { keyframes: { opacity: lampK }, duration: D - 4.7, ease: "none" }, 4.65);
        tl.fromTo("#f15-gear", { rotation: 0 }, { rotation: 360 * 5, duration: D - 4.2, ease: "none" }, 4.2);
        tl.fromTo("#f15-strip", { x: 0 }, { x: BELT_V * (D - ON), duration: D - ON, ease: "none" }, ON);
        ["#f15-r0", "#f15-r1", "#f15-r2", "#f15-r3"].forEach(function (r) {
          tl.fromTo(r, { rotation: 0 }, { rotation: 360 * 12, duration: D - ON, ease: "none" }, ON);
        });
        // chimney puffs (square smoke)
        var pk = 0;
        for (var pt = 4.4; pt < D - 0.5; pt += 0.4) {
          tl.fromTo("#f15-pf" + (pk % 3),
            { x: 0, y: 0, scale: 0.6, rotation: 0, opacity: 0.9 },
            { x: (pk % 2 ? 16 : -12), y: -50, scale: 1.3, rotation: (pk % 2 ? 30 : -25), opacity: 0, duration: 1.15, ease: "power1.out", immediateRender: false }, pt);
          pk++;
        }

        // ----- pieces on the conveyor -----
        var pc = $("f15-pieces");
        var spawns = [];
        var s;
        for (s = 4.35; s < 12.0; s += 0.32) spawns.push(+s.toFixed(3));
        for (s = 12.0; s <= 17.3; s += 0.2) spawns.push(+s.toFixed(3));
        var X0 = 380, XG = 697, XEND = 1000;
        var TG = (XG - X0) / BELT_V;
        var drops = [];
        spawns.forEach(function (st, k) {
          var el = document.createElement("div");
          el.className = "f15-pc";
          el.innerHTML = '<b><i class="a"></i><i class="b"></i></b>';
          pc.appendChild(el);
          var bad = el.firstChild;
          var g = st + TG;
          tl.set(el, { x: X0, y: 626, opacity: 0, rotation: 0 }, 0);
          tl.set(el, { opacity: 1 }, st);
          var isBad = g >= 13.95 && g <= 16.7 && (k % 3 !== 1) && drops.length < 10;
          if (isBad) {
            var cell = CELL[drops.length];
            tl.to(el, { x: XG, duration: TG, ease: "none" }, st);
            var f = Math.max(13.9, st + 0.3, g - 0.75);
            tl.set(bad, { opacity: 1 }, f);
            tl.to(el, { keyframes: { scale: [1, 1.3, 1] }, duration: 0.25, ease: "none" }, f);
            tl.to("#f15-sensor-i", { keyframes: { opacity: [0, 1, 1, 0] }, duration: 0.3, ease: "none" }, g - 0.2);
            tl.to(el, { x: cell.x, y: cell.y, rotation: 90, duration: 0.42, ease: "power2.in" }, g);
            tl.to(el, { keyframes: { y: [cell.y, cell.y - 6, cell.y] }, duration: 0.18, ease: "none" }, g + 0.42);
            drops.push(g + 0.42);
          } else {
            tl.to(el, { x: XEND, duration: (XEND - X0) / BELT_V, ease: "none" }, st);
            tl.to(el, { opacity: 0, duration: 0.25, ease: "none" }, st + (950 - X0) / BELT_V);
          }
        });

        // PEÇAS counter: 0 → 200
        tl.fromTo("#f15-peca", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 4.55);
        var pState = { v: 0 };
        var pNum = $("f15-peca-num");
        tl.to(pState, { v: 200, duration: 0.6, ease: "power2.out", onUpdate: function () { pNum.textContent = Math.round(pState.v); } }, 5.0);
        tl.fromTo("#f15-peca-num", { scale: 0.55 }, { scale: 1, duration: 0.6, ease: "power2.out" }, 5.0);

        // square clock → 8 h
        tl.fromTo("#f15-clock", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 5.7);
        tl.fromTo("#f15-hand-m", { rotation: 0 }, { rotation: 360 * 8, duration: 0.9, ease: "power2.inOut" }, 5.9);
        tl.fromTo("#f15-hand-h", { rotation: 0 }, { rotation: 240, duration: 0.9, ease: "power2.inOut" }, 5.9);
        tl.fromTo("#f15-8h", { clipPath: HIDE, x: -16 }, { clipPath: SHOW, x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 6.25);
        // inputs pulse as P reads them
        tl.to(["#f15-peca", "#f15-clock"], { keyframes: { scale: [1, 1.07, 1] }, duration: 0.4, ease: "none", stagger: 0.15 }, 6.7);

        function lightCard(L, t) {
          tl.to("#f15-c" + L + "-on", { keyframes: { opacity: [0, 1, 0.3, 1] }, duration: 0.3, ease: "none" }, t);
          tl.set("#f15-c" + L + "-off", { opacity: 0 }, t + 0.3);
          tl.to("#f15-c" + L + "-sq", { keyframes: { scale: [1, 1.12, 1] }, duration: 0.35, ease: "none" }, t);
        }
        function countUp(numSel, wrapSel, target, t, dur) {
          var el = document.querySelector(numSel);
          var st = { v: 0 };
          tl.set(wrapSel, { opacity: 1 }, t);
          tl.to(st, { v: target, duration: dur, ease: "power3.out", onUpdate: function () { el.textContent = Math.round(st.v); } }, t);
          tl.fromTo(numSel, { scale: 0.5 }, { scale: 1, duration: dur, ease: "power3.out" }, t);
        }

        // card P
        lightCard("P", 6.7);
        tl.fromTo("#f15-p-expr", { clipPath: HIDE }, { clipPath: SHOW, duration: 0.45, ease: "power3.out", immediateRender: false }, 6.75);
        countUp("#f15-p-num", "#f15-p-big", 25, 6.95, 0.75);
        tl.fromTo("#f15-pbase", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 6.9);
        for (var b = 0; b < 8; b++) {
          tl.fromTo("#f15-pb" + b, { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 6.95 + b * 0.05);
        }
        tl.fromTo("#f15-p-suf", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.7)", immediateRender: false }, 7.7);
        tl.fromTo("#f15-p-lab", { clipPath: HIDE }, { clipPath: SHOW, duration: 0.55, ease: "power3.out", immediateRender: false }, 8.8);
        // hour bars ripple: 8 equal hours of 25
        for (var rp = 0; rp < 2; rp++) {
          for (var b2 = 0; b2 < 8; b2++) {
            tl.to("#f15-pb" + b2, { keyframes: { scaleY: [1, 0.75, 1] }, duration: 0.3, ease: "none" }, 9.2 + rp * 0.75 + b2 * 0.05);
          }
        }

        // ================= Scene 3 (10.4–13.9) =================
        tl.fromTo("#f15-axis", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 10.55);
        tl.fromTo(["#f15-ticks", "#f15-t0", "#f15-t10", "#f15-t20", "#f15-t30"], { opacity: 0, y: -8 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", stagger: 0.05, immediateRender: false }, 10.7);
        tl.fromTo("#f15-mark", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 10.65);
        tl.fromTo("#f15-padlab", { clipPath: HIDE, y: 10 }, { clipPath: SHOW, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 10.75);
        tl.fromTo("#f15-real", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out", immediateRender: false }, 11.0);
        tl.fromTo("#f15-real-t", { clipPath: HIDE }, { clipPath: SHOW, duration: 0.4, ease: "power3.out", immediateRender: false }, 11.45);
        tl.fromTo("#f15-gap", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none", immediateRender: false }, 11.75);

        // card E
        lightCard("E", 11.65);
        countUp("#f15-e-num", "#f15-e-big", 25, 11.7, 0.65);
        tl.fromTo("#f15-e-base", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 11.7);
        tl.fromTo("#f15-e-real", { scaleY: 0 }, { scaleY: 1, duration: 0.65, ease: "power3.out", immediateRender: false }, 11.75);
        tl.fromTo("#f15-e-pad", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 11.95);
        tl.fromTo(["#f15-e-vs", "#f15-e-30"], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.7)", stagger: 0.08, immediateRender: false }, 12.3);
        tl.fromTo("#f15-e-lab", { clipPath: HIDE }, { clipPath: SHOW, duration: 0.55, ease: "power3.out", immediateRender: false }, 12.4);
        // REAL keeps pushing toward the standard, never reaches it
        tl.to("#f15-real", { keyframes: { scaleX: [1, 1.04, 1, 1.04, 1, 1.04, 1] }, duration: 1.2, ease: "none" }, 12.6);
        tl.to("#f15-gap", { keyframes: { opacity: [1, 0.3, 1, 0.3, 1] }, duration: 1.0, ease: "none" }, 12.7);
        tl.to("#f15-e-real", { keyframes: { scaleY: [1, 1.06, 1, 1.06, 1] }, duration: 1.0, ease: "none" }, 12.75);

        // ================= Scene 4 (13.9–17.579) =================
        tl.fromTo("#f15-hole", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, 13.85);
        tl.set("#f15-flap", { opacity: 1 }, 13.85);
        tl.fromTo("#f15-flap", { rotation: 0 }, { rotation: 70, duration: 0.35, ease: "power2.in", immediateRender: false }, 13.9);
        tl.fromTo("#f15-sensor", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 13.85);
        tl.fromTo("#f15-basket", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)", immediateRender: false }, 13.9);
        tl.fromTo("#f15-reflab", { clipPath: HIDE }, { clipPath: SHOW, duration: 0.45, ease: "power3.out", immediateRender: false }, 14.1);
        tl.fromTo("#f15-refnum", { clipPath: HIDE }, { clipPath: SHOW, duration: 0.3, ease: "power3.out", immediateRender: false }, 14.2);

        // basket fills: dropped pieces + remaining cells pop
        var bl = $("f15-bcells");
        var lastLand = drops.length ? drops[drops.length - 1] : 14.4;
        for (var fc = drops.length; fc < 10; fc++) {
          var cEl = document.createElement("div");
          cEl.className = "f15-bcell";
          cEl.style.left = CELL[fc].x + "px";
          cEl.style.top = CELL[fc].y + "px";
          bl.appendChild(cEl);
          tl.set(cEl, { scale: 0 }, 0);
          tl.fromTo(cEl, { scale: 0, y: -60 }, { scale: 1, y: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, lastLand + 0.1 + (fc - drops.length) * 0.12);
        }
        var refEnd = lastLand + 0.4 + Math.max(0, 10 - drops.length) * 0.12;
        var firstLand = drops.length ? drops[0] : 14.3;
        var rState = { v: 0 };
        var rNum = $("f15-refnum");
        tl.to(rState, { v: 10, duration: Math.max(0.5, refEnd - firstLand), ease: "none", onUpdate: function () { rNum.textContent = Math.round(rState.v); } }, firstLand);

        // card Q
        lightCard("Q", 13.95);
        countUp("#f15-q-num", "#f15-q-big", 190, 14.0, 1.6);
        qCells.forEach(function (c, i) {
          if (i < 19) tl.fromTo(c, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, 14.0 + i * 0.075);
          else tl.fromTo(c, { scale: 0, rotation: -45 }, { scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.5)", immediateRender: false }, 15.55);
        });
        tl.fromTo("#f15-q-suf", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.7)", immediateRender: false }, 15.6);
        tl.fromTo("#f15-q-lab", { clipPath: HIDE }, { clipPath: SHOW, duration: 0.55, ease: "power3.out", immediateRender: false }, 16.4);

        // hold: the three letters pulse in a slow chase
        ["P", "E", "Q"].forEach(function (L, i) {
          tl.to("#f15-c" + L + "-sq", { keyframes: { scale: [1, 1.08, 1] }, duration: 0.4, ease: "none" }, 16.95 + i * 0.15);
        });

        window.__timelines["15-peq"] = tl;
      })();
    </script>
  </div>
</template>
