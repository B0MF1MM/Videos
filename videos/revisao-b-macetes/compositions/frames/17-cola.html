          tl.fromTo(q("#f17-rh1"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.5);
          ["#f17-q1tag", "#f17-q2tag", "#f17-q3tag", "#f17-q4tag"].forEach((s, i) => {
            tl.fromTo(q(s), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.55 + i * 0.08);
          });
          tl.fromTo(qa(".f17-ck"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", stagger: 0.05 }, 0.6);
          ["#f17-ck1", "#f17-ck2", "#f17-ck3", "#f17-ck4"].forEach((s) => tl.set(q(s), { scale: 0 }, 0));

          // pencil travels to each quadrant and scribbles
          const pen = q("#f17-pencil");
          const spots = [[760, -10], [1526, 85], [720, 402], [1626, 342]];
          tl.fromTo(pen, { x: 1760, y: -200, opacity: 0 }, { x: spots[0][0], y: spots[0][1], opacity: 1, duration: 0.7, ease: "power3.out" }, 0.4);
