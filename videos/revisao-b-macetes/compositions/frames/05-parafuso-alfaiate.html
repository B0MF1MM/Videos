              <div class="f05-garment" id="f05-g2"><svg viewBox="0 0 200 190" aria-hidden="true"><polyline class="f05-hanger" points="100,0 100,12 56,28 144,28 100,12" /><polygon class="f05-gpoly" id="f05-gp2" points="62,26 84,26 100,92 116,26 138,26 156,46 152,182 48,182 44,46" /><polyline class="f05-gline" points="100,92 100,182" /><rect class="f05-btn" x="106" y="110" width="9" height="9" /><rect class="f05-btn" x="106" y="136" width="9" height="9" /><rect class="f05-btn" x="106" y="162" width="9" height="9" /></svg></div>
              <div class="f05-sob" id="f05-sob2">SOB MEDIDA</div>
            </div>
                <div class="f05-tape" id="f05-tape"><div class="f05-seg" id="f05-seg0" style="left:46px"></div><div class="f05-seg" id="f05-seg1" style="left:295px"></div><div class="f05-seg" id="f05-seg2" style="left:544px"></div></div>
                <div class="f05-marker" id="f05-marker"></div>
                <div class="f05-table"></div>
                <div class="f05-tleg" style="left:60px"></div>
                <div class="f05-tleg" style="left:732px"></div>
              </div>
            </div>

        </div>

        <!-- conclusion tags (on the parent, never inside the tilted cards) -->
        <div class="f05-tag" id="f05-tagA" style="left:97px;top:640px"><div class="f05-gauge"><div class="f05-bar" style="height:14px"><div class="f05-bar-fill" id="f05-ga0"></div></div><div class="f05-bar" style="height:20px"><div class="f05-bar-fill" id="f05-ga1"></div></div><div class="f05-bar" style="height:26px"><div class="f05-bar-fill" id="f05-ga2"></div></div><div class="f05-bar" style="height:32px"><div class="f05-bar-fill" id="f05-ga3"></div></div><div class="f05-bar" style="height:38px"><div class="f05-bar-fill" id="f05-ga4"></div></div></div><div class="f05-tag-t">VOLUME ALTO</div></div>
        <div class="f05-tag" id="f05-tagB" style="left:97px;top:710px"><div class="f05-gauge"><div class="f05-bar" style="height:14px"><div class="f05-bar-fill" id="f05-gb0"></div></div><div class="f05-bar" style="height:20px"><div class="f05-bar-fill" id="f05-gb1"></div></div><div class="f05-bar" style="height:26px"><div class="f05-bar-fill" id="f05-gb2"></div></div><div class="f05-bar" style="height:32px"><div class="f05-bar-fill" id="f05-gb3"></div></div><div class="f05-bar" style="height:38px"><div class="f05-bar-fill" id="f05-gb4"></div></div></div><div class="f05-tag-t">VARIEDADE BAIXA</div></div>
        <div class="f05-tag" id="f05-tagC" style="right:97px;top:640px"><div class="f05-gauge"><div class="f05-bar" style="height:14px"><div class="f05-bar-fill" id="f05-gc0"></div></div><div class="f05-bar" style="height:20px"><div class="f05-bar-fill" id="f05-gc1"></div></div><div class="f05-bar" style="height:26px"><div class="f05-bar-fill" id="f05-gc2"></div></div><div class="f05-bar" style="height:32px"><div class="f05-bar-fill" id="f05-gc3"></div></div><div class="f05-bar" style="height:38px"><div class="f05-bar-fill" id="f05-gc4"></div></div></div><div class="f05-tag-t">PERSONALIZADO</div></div>
        <div class="f05-tag" id="f05-tagD" style="right:97px;top:710px"><div class="f05-gauge"><div class="f05-bar" style="height:14px"><div class="f05-bar-fill" id="f05-gd0"></div></div><div class="f05-bar" style="height:20px"><div class="f05-bar-fill" id="f05-gd1"></div></div><div class="f05-bar" style="height:26px"><div class="f05-bar-fill" id="f05-gd2"></div></div><div class="f05-bar" style="height:32px"><div class="f05-bar-fill" id="f05-gd3"></div></div><div class="f05-bar" style="height:38px"><div class="f05-bar-fill" id="f05-gd4"></div></div></div><div class="f05-tag-t">POUCA QUANTIDADE</div></div>

        <div class="f05-stamp" id="f05-stampL" style="right:1017px">PADRONIZADA</div>
        <div class="f05-stamp" id="f05-stampR" style="left:1017px">FLEXÍVEL</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 13.397;
      var tl = gsap.timeline({ paused: true });
      function q(id) { return document.getElementById(id); }
      var TXT_OPEN = "inset(-30% -4% -15% -4%)";

      // ---- belt kinematics (shared by strip, screws, rollers, piston, counter) ----
      var A0 = 2.6, A1 = 7.5, VA = 160;           // fast phase
      var VB = 50;                                 // slow phase to the end
      var DA = (A1 - A0) * VA;                     // 784px
      var DB = (D - A1) * VB;                      // ~295px
      var ROLL = 57.2958 / 12;                     // deg per px for a 24px roller

      // camera: slow push under the whole shot
      tl.fromTo("#f05-content", { scale: 1 }, { scale: 1.02, duration: D, ease: "none" }, 0);

      // ---- Scene 1 (0–2.1): title slides down, divider draws, slots appear ----
      tl.fromTo("#f05-title", { y: -46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.1);
      tl.fromTo("#f05-divider", { scaleY: 0 }, { scaleY: 1, duration: 1.0, ease: "power3.inOut" }, 0.5);
      tl.fromTo("#f05-slotL", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.9);
      tl.fromTo("#f05-slotR", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.05);

      // ---- Scene 2 (2.1–7.5): LEFT card — split-tilt entry from the left wing ----
      tl.fromTo("#f05-cardL", { x: -340, rotationY: 20, opacity: 0, scale: 0.88 },
        { x: 0, rotationY: 10, opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 2.3);

      // belt strip + screws travel together
      ["#f05-strip", "#f05-screws"].forEach(function (s) {
        tl.fromTo(s, { x: 0 }, { x: DA, duration: A1 - A0, ease: "none" }, A0);
        tl.to(s, { x: DA + DB, duration: D - A1, ease: "none" }, A1);
      });
      for (var r = 0; r < 12; r++) {
        tl.fromTo("#f05-rl" + r, { rotation: 0 }, { rotation: DA * ROLL, duration: A1 - A0, ease: "none" }, A0);
        tl.to("#f05-rl" + r, { rotation: (DA + DB) * ROLL, duration: D - A1, ease: "none" }, A1);
      }

      // screws already past the press start stamped (filled heads)
      tl.set(".f05-headfill", { opacity: 0 }, 0);
      for (var s0 = 24; s0 < 31; s0++) tl.set("#f05-hf" + s0, { opacity: 1 }, 0);

      // press stomps each screw as it passes under (x = 322 - screwLeft)
      for (var i = 0; i < 31; i++) {
        var off = 1612 - 70 * i, t;
        if (off <= 0) continue;
        if (off <= DA) t = A0 + off / VA;
        else if (off <= DA + DB) t = A1 + (off - DA) / VB;
        else continue;
        if (t - 0.1 > D - 0.05) continue;
        tl.to("#f05-piston", { y: 40, duration: 0.1, ease: "power2.in" }, t - 0.1);
        tl.to("#f05-piston", { y: 0, duration: 0.22, ease: "power2.out" }, t);
        tl.set("#f05-hf" + i, { opacity: 1 }, t);
        tl.to("#f05-sc" + i, { scaleY: 0.9, duration: 0.05, ease: "power2.out" }, t);
        tl.to("#f05-sc" + i, { scaleY: 1, duration: 0.2, ease: "power3.out" }, t + 0.05);
      }

      // counter climbs fast, then slows with the belt
      // odometer counter (transform-only): tens roll continuously, hundreds/thousands click over
      var DH = 40, VA_END = 8400, VB_END = 9600;
      function strip(id, n) { var h = ""; for (var k = 0; k < n; k++) h += (k % 10) + "<br>"; q(id).innerHTML = h; }
      strip("f05-dte", 11);
      var wrapTens = gsap.utils.unitize(gsap.utils.wrap(-10 * DH, 0));
      strip("f05-dhu", VB_END / 100 + 2);
      strip("f05-dth", 11);
      function timeAt(v) { return v <= VA_END ? A0 + (A1 - A0) * v / VA_END : A1 + (D - A1) * (v - VA_END) / (VB_END - VA_END); }
      tl.fromTo("#f05-dte", { y: 0 }, { y: -DH * VA_END / 10, duration: A1 - A0, ease: "none", modifiers: { y: wrapTens } }, A0);
      tl.to("#f05-dte", { y: -DH * VB_END / 10, duration: D - A1, ease: "none", modifiers: { y: wrapTens } }, A1);
      for (var h = 1; h <= VB_END / 100; h++) {
        tl.to("#f05-dhu", { y: -DH * h, duration: 0.04, ease: "power2.out" }, timeAt(h * 100) - 0.04);
      }
      for (var th = 1; th <= Math.floor(VB_END / 1000); th++) {
        tl.to("#f05-dth", { y: -DH * th, duration: 0.12, ease: "power2.out" }, timeAt(th * 1000) - 0.12);
      }
      tl.set(["#f05-dte", "#f05-dhu", "#f05-dth"], { y: 0 }, 0);

      // tag reveal helper: wipe from the outer side + gauge bars fill
      function tag(id, gaugePrefix, fillCount, t, fromRight) {
        tl.fromTo(id, { clipPath: fromRight ? "inset(-30% -4% -15% 100%)" : "inset(-30% 100% -15% -4%)", x: fromRight ? 30 : -30 },
          { clipPath: TXT_OPEN, x: 0, duration: 0.55, ease: "power3.out" }, t);
        for (var k = 0; k < 5; k++) {
          tl.fromTo("#" + gaugePrefix + k, { scaleY: 0 },
            { scaleY: k < fillCount ? 1 : 0, duration: 0.25, ease: "power2.out" }, t + 0.3 + k * 0.08);
        }
      }
      tag("#f05-tagA", "f05-ga", 5, 3.8, false);
      tag("#f05-tagB", "f05-gb", 1, 4.6, false);

      // PADRONIZADA stamp slams at the inner edge
      function stamp(id, card, t, rot) {
        tl.fromTo(id, { scale: 1.9, opacity: 0, rotation: rot * 3 },
          { scale: 1, opacity: 1, rotation: rot, duration: 0.26, ease: "power3.in" }, t);
        tl.to(card, { scale: 0.975, duration: 0.07, ease: "power2.out" }, t + 0.26);
        tl.to(card, { scale: 1, duration: 0.35, ease: "power3.out" }, t + 0.33);
      }
      stamp("#f05-stampL", "#f05-cardL", 6.6, -3);

      // left card idle bob (counter-phase with the right one)
      function bob(id, start, sign) {
        var y = sign * 5, t = start;
        while (t + 1.3 <= D) {
          tl.to(id, { y: y, duration: 1.3, ease: "sine.inOut" }, t);
          y = -y; t += 1.3;
        }
      }
      bob("#f05-bobL", 3.3, -1);

      // ---- Scene 3 (7.5–end): RIGHT card — mirrored entry from the right wing ----
      tl.fromTo("#f05-cardR", { x: 340, rotationY: -20, opacity: 0, scale: 0.88 },
        { x: 0, rotationY: -10, opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 7.8);
      tl.fromTo("#f05-rail", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 8.05);
      tl.fromTo("#f05-tape", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 8.15);
      tl.fromTo("#f05-marker", { opacity: 0, x: 0 }, { opacity: 1, x: 30, duration: 0.3, ease: "power2.out" }, 8.3);

      ["f05-gp0", "f05-gp1", "f05-gp2"].forEach(function (id) {
        var el = q(id);
        var len = Math.ceil(el.getTotalLength() * 1.05);
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
        el.setAttribute("data-len", len);
      });

      tl.set(["#f05-pc0", "#f05-pc1", "#f05-pc2"], { opacity: 0 }, 0);
      var GT = [8.4, 9.0, 9.6];
      GT.forEach(function (t, g) {
        var cx = 154 + 249 * g;
        tl.fromTo("#f05-g" + g, { scale: 0, opacity: 0, y: -20 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
        tl.to("#f05-gp" + g, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, t + 0.05);
        tl.fromTo("#f05-sob" + g, { scaleY: 0, opacity: 0 },
          { scaleY: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, t + 0.25);
        // tape: marker runs to the piece, its width gets measured
        tl.to("#f05-marker", { x: cx - 7, duration: 0.35, ease: "power3.inOut" }, t);
        tl.fromTo("#f05-seg" + g, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, t + 0.2);
        // header count
        if (g > 0) tl.set("#f05-pc" + (g - 1), { opacity: 0 }, t);
        tl.set("#f05-pc" + g, { opacity: 1 }, t);
        // gentle sway on the hanger (sequential, no repeat)
        var rt = t + 0.5, ang = (g % 2 ? -2.5 : 2.5);
        while (rt + 1.1 <= D) {
          tl.to("#f05-g" + g, { rotation: ang, duration: 1.1, ease: "sine.inOut" }, rt);
          ang = -ang; rt += 1.1;
        }
      });

      tag("#f05-tagC", "f05-gc", 5, 9.1, true);
      tag("#f05-tagD", "f05-gd", 1, 10.2, true);

      // marker keeps measuring while the line talks
      [[10.9, 154], [11.6, 652], [12.2, 403]].forEach(function (m) {
        tl.to("#f05-marker", { x: m[1] - 7, duration: 0.5, ease: "power3.inOut" }, m[0]);
      });

      bob("#f05-bobR", 8.8, 1);

      // FLEXÍVEL stamp
      stamp("#f05-stampR", "#f05-cardR", 12.4, 3);

      // hold to the end — no exit (root transition owns it)
      tl.set({}, {}, D);

      window.__timelines["05-parafuso-alfaiate"] = tl;
    })();
  </script>
