    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---- Camera stops (single-wrapper form: T = -offset × S). Viewport centre (960,540).
      var S = 1.5;
      var TY = -(520 - 540) * S;                 // frame boxes + rail, target world y 520
      function tx(cx) { return -(cx - 960) * S; }
      var X1 = tx(280), X2 = tx(713), X3 = tx(1146), X4 = tx(1609);

      // ---- Dash setup: straight segments, lengths from geometry.
      var LINE_LEN = 1760;
      function prepDash(id, len) {
        var el = document.getElementById(id);
        el.style.strokeDasharray = len + " " + len;
        el.style.strokeDashoffset = len;
        return len;
      }
      prepDash("r02-line", LINE_LEN);
      ["r02-stub1", "r02-stub2", "r02-stub3"].forEach(function (id) { prepDash(id, 80); });
      prepDash("r02-stub4", 40);
      var L3 = prepDash("r02-link3", 40 + 463 + 40);
      var L2 = prepDash("r02-link2", 80 + 896 + 80);
      var L1 = prepDash("r02-link1", 120 + 1329 + 120);
      function lineTo(x) { return LINE_LEN - (x - 80); }

      // ---- Seed states
      tl.set("#r02-world", { x: X1 + 140, y: TY, scale: S }, 0);

      // ===== Scene 1 (0.0–2.3): AULA 9 + title centred, then title docks top-left
      tl.fromTo("#r02-kicker",
        { xPercent: -50, x: 0, y: 24, opacity: 0 },
        { xPercent: -50, x: 0, y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#r02-title",
        { xPercent: -50, x: 0, y: 36, scale: 1, opacity: 0 },
        { xPercent: -50, x: 0, y: 0, scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.9);

      tl.to("#r02-kicker",
        { xPercent: 0, x: 80 - 960, y: 100 - 400, duration: 0.8, ease: "power3.inOut" }, 2.0);
      tl.to("#r02-title",
        { xPercent: 0, x: 80 - 960, y: 142 - 452, scale: 0.42, duration: 0.8, ease: "power3.inOut" }, 2.0);

      // camera settles onto station 1 underneath
      tl.to("#r02-world", { x: X1, duration: 3.4, ease: "power1.inOut" }, 0.2);

      // rail begins to draw, leading the camera
      tl.to("#r02-line", { strokeDashoffset: lineTo(300), duration: 1.7, ease: "power2.out" }, 2.0);
      tl.fromTo("#r02-mark1", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 3.3);

      // ===== Scene 2 (2.3–9.8): pan station to station
      function revealStation(n, t) {
        tl.to("#r02-stub" + n, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t - 0.2);
        tl.fromTo("#r02-st" + n,
          { opacity: 0, y: 40 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
        tl.fromTo("#r02-num" + n,
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t + 0.1);
        tl.fromTo("#r02-lab" + n,
          { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(-30% -4% -15% -4%)", duration: 0.55, ease: "power2.out" }, t + 0.25);
      }

      // 1ª · VAPOR (3.9)
      revealStation(1, 3.9);
      tl.to("#r02-world", { x: X1 - 30, duration: 0.6, ease: "none" }, 3.6);

      // pan → station 2, arrive for "eletricidade" (5.2)
      tl.to("#r02-world", { x: X2, duration: 0.95, ease: "power3.inOut" }, 4.2);
      tl.to("#r02-line", { strokeDashoffset: lineTo(733), duration: 0.95, ease: "power2.inOut" }, 4.2);
      tl.fromTo("#r02-mark2", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 4.85);
      revealStation(2, 5.2);
      tl.to("#r02-world", { x: X2 - 50, duration: 2.0, ease: "none" }, 5.15);

      // pan → station 3, arrive for "automação" (8.2)
      tl.to("#r02-world", { x: X3, duration: 1.0, ease: "power3.inOut" }, 7.15);
      tl.to("#r02-line", { strokeDashoffset: lineTo(1166), duration: 1.0, ease: "power2.inOut" }, 7.15);
      tl.fromTo("#r02-mark3", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 7.85);
      revealStation(3, 8.2);
      tl.to("#r02-world", { x: X3 - 30, duration: 1.15, ease: "none" }, 8.15);

      // pan → empty fourth stop while the rail finishes
      tl.to("#r02-world", { x: X4, duration: 1.1, ease: "power3.inOut" }, 9.3);
      tl.to("#r02-line", { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" }, 9.3);
      tl.fromTo("#r02-mark4", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power3.out" }, 10.15);

      tl.fromTo("#r02-num4", { y: 60 }, { y: 0, duration: 0.6, ease: "power3.out" }, 10.65);

        { opacity: 1, y: 0, duration: 0.4, ease: "power1.out" }, 12.1);

      // hold — no exit (root transition owns it)
      tl.set({}, {}, 12.821);

      window.__timelines["02-revolucoes"] = tl;
    })();
