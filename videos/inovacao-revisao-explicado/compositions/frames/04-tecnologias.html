        var len = el.getTotalLength() * 1.02;
        el.style.strokeDasharray = len + " " + len;
        el.style.strokeDashoffset = len;

        tl.fromTo(s,
          { opacity: 0, scale: 0.96 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.35 + i * 0.06);
      });

      // slow camera push-in under the whole shot
      tl.fromTo("#t04-world", { scale: 1 }, { scale: 1.015, duration: 11.9, ease: "none" }, 1.4);

      // ===== Scene 2 (1.4–7.3): cards fill on their words (spring-pop, no overshoot)

          { scale: 0, opacity: 0, y: 24 },
          { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, t);
        tl.fromTo("#t04-idx" + n,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power1.out" }, t + 0.25);
        tl.fromTo("#t04-lab" + n,
          { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(-30% -4% -15% -4%)", duration: 0.55, ease: "power2.out" }, t + 0.3);
      }
      popCard(1, 1.4);   // inteligência artificial
      popCard(2, 3.0);   // robótica colaborativa
      popCard(3, 4.6);   // manufatura aditiva

      // "impressão três D" (6.2)
      tl.fromTo("#t04-tag3",

        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 6.2);

      // ===== Scene 3 (7.3–13.333): fourth card turns inverted cobalt

      tl.to("#t04-door", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 9.6);
      tl.fromTo("#t04-copy",
        { clipPath: "inset(0% 100% 0% 0%)" },
