    <script>
      (function () {
        var GROUPS = [{"start": 0.15, "end": 3.032, "text": "Sistemas Embarcados: revisão focada no que a prova"}, {"start": 3.032, "end": 3.423, "text": "cobra."}, {"start": 3.743, "end": 5.637, "text": "Analisei a prova: são dez questões,"}, {"start": 5.637, "end": 7.983, "text": "e quase todas giram em torno de um sistema"}, {"start": 7.983, "end": 8.975, "text": "que lê um sensor,"}, {"start": 8.975, "end": 10.554, "text": "decide e aciona alguma coisa."}, {"start": 10.874, "end": 11.914, "text": "E vai cair código,"}, {"start": 11.914, "end": 13.813, "text": "provavelmente diferente do que caiu."}, {"start": 13.813, "end": 16.344, "text": "Por isso, vamos passar por todos os códigos do"}, {"start": 16.344, "end": 17.655, "text": "resumo, linha por linha."}, {"start": 17.975, "end": 21.404, "text": "No final, uma proposta completa para a questão discursiva."}, {"start": 21.904, "end": 23.621, "text": "Estes são os temas que caíram."}, {"start": 23.941, "end": 26.709, "text": "Arquitetura: entrada, processamento e saída."}, {"start": 26.709, "end": 28.979, "text": "Leitura analógica, o conversor ADC,"}, {"start": 28.979, "end": 31.083, "text": "e o LDR com divisor de tensão."}, {"start": 31.403, "end": 32.864, "text": "O código com analogRead,"}, {"start": 32.864, "end": 33.973, "text": "map e analogWrite."}, {"start": 34.293, "end": 36.415, "text": "Os protocolos UART e I2C."}, {"start": 36.415, "end": 39.495, "text": "Atuadores com driver. Dashboard e IoT."}, {"start": 39.815, "end": 43.309, "text": "ROI e Payback. E uma discursiva sobre irrigação"}, {"start": 43.309, "end": 44.12, "text": "automática."}, {"start": 44.62, "end": 47.24, "text": "Questão um: a arquitetura de um sistema embarcado."}, {"start": 47.56, "end": 49.823, "text": "Todo sistema segue o ciclo perceber,"}, {"start": 49.823, "end": 50.665, "text": "pensar, agir."}, {"start": 50.985, "end": 52.243, "text": "O sensor é a entrada:"}, {"start": 52.243, "end": 53.781, "text": "ele percebe o mundo físico,"}, {"start": 53.781, "end": 55.598, "text": "como temperatura, luz ou umidade."}, {"start": 55.918, "end": 57.883, "text": "O microcontrolador é o processamento:"}, {"start": 57.883, "end": 59.117, "text": "lê o sensor e decide,"}, {"start": 59.117, "end": 60.214, "text": "seguindo o firmware."}, {"start": 60.534, "end": 62.378, "text": "E o atuador, ou o sinalizador,"}, {"start": 62.378, "end": 63.374, "text": "é a saída: LED,"}, {"start": 63.374, "end": 64.57, "text": "buzzer, relé, motor."}, {"start": 64.89, "end": 67.384, "text": "Pegadinha: firmware é software gravado no chip,"}, {"start": 67.384, "end": 68.427, "text": "não é peça física."}, {"start": 68.427, "end": 69.516, "text": "Hardware é o corpo;"}, {"start": 69.516, "end": 70.695, "text": "firmware é o cérebro."}, {"start": 71.195, "end": 73.533, "text": "Mais três comparações que costumam cair."}, {"start": 73.853, "end": 76.45, "text": "Sistema embarcado faz uma função específica,"}, {"start": 76.45, "end": 78.385, "text": "com baixo consumo e tempo real."}, {"start": 78.385, "end": 80.829, "text": "O computador comum roda vários programas."}, {"start": 81.149, "end": 82.813, "text": "O microcontrolador junta CPU,"}, {"start": 82.813, "end": 84.966, "text": "memória e periféricos num único chip."}, {"start": 84.966, "end": 87.853, "text": "O microprocessador precisa de memória e periféricos"}, {"start": 87.853, "end": 88.391, "text": "externos."}, {"start": 88.711, "end": 91.203, "text": "Arduino e ESP32 são microcontroladores;"}, {"start": 91.203, "end": 93.473, "text": "o ESP32 já tem Wi-Fi e Bluetooth."}, {"start": 93.473, "end": 96.574, "text": "O Raspberry Pi é um computador de placa única,"}, {"start": 96.574, "end": 97.626, "text": "que roda Linux."}, {"start": 97.946, "end": 99.728, "text": "A escolha depende dos requisitos:"}, {"start": 99.728, "end": 102.286, "text": "a melhor tecnologia é a que atende ao projeto."}, {"start": 102.786, "end": 105.745, "text": "Agora o código. Todo programa de Arduino tem duas"}, {"start": 105.745, "end": 106.949, "text": "funções obrigatórias."}, {"start": 107.269, "end": 108.859, "text": "O setup roda uma única vez,"}, {"start": 108.859, "end": 110.028, "text": "quando a placa liga."}, {"start": 110.028, "end": 112.412, "text": "É onde se configuram os pinos e a serial."}, {"start": 112.732, "end": 114.334, "text": "O loop repete para sempre."}, {"start": 114.334, "end": 116.336, "text": "É onde fica a lógica do sistema."}, {"start": 116.656, "end": 119.377, "text": "pinMode define se o pino é entrada ou saída."}, {"start": 119.377, "end": 121.594, "text": "digitalWrite coloca HIGH, cinco volts,"}, {"start": 121.594, "end": 122.803, "text": "ou LOW, zero volts."}, {"start": 123.123, "end": 125.707, "text": "digitalRead lê um pino e devolve um ou zero."}, {"start": 125.707, "end": 127.477, "text": "E delay pausa em milissegundos:"}, {"start": 127.477, "end": 128.53, "text": "mil é um segundo."}, {"start": 128.85, "end": 130.622, "text": "Juntando tudo, o pisca LED:"}, {"start": 130.622, "end": 132.286, "text": "acende, espera um segundo,"}, {"start": 132.286, "end": 133.897, "text": "apaga, espera um segundo,"}, {"start": 133.897, "end": 134.541, "text": "e repete."}, {"start": 135.041, "end": 138.132, "text": "Digital ou analógico? Essa diferença está em metade"}, {"start": 138.132, "end": 138.75, "text": "da prova."}, {"start": 139.07, "end": 140.946, "text": "Digital tem só dois estados:"}, {"start": 140.946, "end": 143.208, "text": "HIGH ou LOW, cinco ou zero volts."}, {"start": 143.208, "end": 146.078, "text": "Lê com digitalRead, escreve com digitalWrite."}, {"start": 146.398, "end": 148.281, "text": "Analógico tem valores contínuos,"}, {"start": 148.281, "end": 149.706, "text": "de zero a cinco volts."}, {"start": 149.706, "end": 151.895, "text": "No Uno, entra pelos pinos A0 a A5,"}, {"start": 151.895, "end": 153.372, "text": "e se lê com analogRead."}, {"start": 153.692, "end": 155.753, "text": "Exemplos digitais: LED, relé,"}, {"start": 155.753, "end": 158.179, "text": "botão, buzzer. Exemplos analógicos:"}, {"start": 158.179, "end": 160.726, "text": "LDR, potenciômetro, umidade do solo."}, {"start": 161.046, "end": 162.861, "text": "Macete: interruptor é digital,"}, {"start": 162.861, "end": 165.09, "text": "liga ou desliga. Dimmer é analógico,"}, {"start": 165.09, "end": 166.386, "text": "tem todos os níveis."}, {"start": 166.886, "end": 169.644, "text": "Questão quatro: o conversor analógico-digital,"}, {"start": 169.644, "end": 170.121, "text": "o ADC."}, {"start": 170.441, "end": 172.415, "text": "O ADC do Arduino Uno tem dez bits."}, {"start": 172.415, "end": 174.48, "text": "Dois elevado a dez dá mil e vinte e"}, {"start": 174.48, "end": 176.684, "text": "quatro níveis: de zero a mil e vinte e"}, {"start": 176.684, "end": 177.005, "text": "três."}, {"start": 177.325, "end": 178.645, "text": "Zero volts vira zero."}, {"start": 178.645, "end": 180.93, "text": "Cinco volts vira mil e vinte e três."}, {"start": 180.93, "end": 184.281, "text": "Cada degrau vale cerca de quatro vírgula nove milivolts."}, {"start": 184.601, "end": 187.245, "text": "Então, uma leitura de oitocentos e cinquenta não"}, {"start": 187.245, "end": 189.054, "text": "são oitocentos e cinquenta volts."}, {"start": 189.054, "end": 190.26, "text": "Para voltar à tensão:"}, {"start": 190.26, "end": 192.161, "text": "oitocentos e cinquenta vezes cinco,"}, {"start": 192.161, "end": 194.016, "text": "dividido por mil e vinte e três,"}, {"start": 194.016, "end": 195.872, "text": "dá quatro vírgula um cinco volts."}, {"start": 196.192, "end": 197.526, "text": "No ESP32 é diferente:"}, {"start": 197.526, "end": 198.861, "text": "o ADC tem doze bits,"}, {"start": 198.861, "end": 201.376, "text": "de zero a quatro mil e noventa e cinco,"}, {"start": 201.376, "end": 204.148, "text": "e a tensão máxima é três vírgula três volts."}, {"start": 204.648, "end": 206.434, "text": "Questão três: o LDR."}, {"start": 206.754, "end": 208.103, "text": "O LDR é um sensor:"}, {"start": 208.103, "end": 211.474, "text": "um resistor que muda a resistência conforme a luz."}, {"start": 211.474, "end": 213.328, "text": "Mais luz, menos resistência."}, {"start": 213.648, "end": 215.972, "text": "Sozinho, o Arduino não lê resistência,"}, {"start": 215.972, "end": 218.709, "text": "só tensão. Por isso o LDR entra num divisor"}, {"start": 218.709, "end": 221.085, "text": "de tensão, junto com um resistor fixo."}, {"start": 221.405, "end": 222.499, "text": "Quando a luz muda,"}, {"start": 222.499, "end": 224.926, "text": "a resistência muda, e a tensão no meio do"}, {"start": 224.926, "end": 227.876, "text": "divisor muda. Essa tensão vai para o pino analógico,"}, {"start": 227.876, "end": 228.923, "text": "e o ADC converte."}, {"start": 229.243, "end": 230.512, "text": "No código: lê o A0,"}, {"start": 230.512, "end": 232.491, "text": "e se o valor indicar pouca luz,"}, {"start": 232.491, "end": 235.536, "text": "acende a lâmpada. Quem decide é o microcontrolador,"}, {"start": 235.536, "end": 236.247, "text": "não o LDR."}, {"start": 236.747, "end": 239.411, "text": "Agora a saída: analogWrite e o PWM."}, {"start": 239.731, "end": 242.5, "text": "O Arduino não tem saída analógica de verdade."}, {"start": 242.5, "end": 245.524, "text": "O analogWrite liga e desliga o pino muito rápido:"}, {"start": 245.524, "end": 246.447, "text": "isso é o PWM."}, {"start": 246.767, "end": 249.228, "text": "O valor vai de zero a duzentos e cinquenta"}, {"start": 249.228, "end": 250.363, "text": "e cinco, oito bits."}, {"start": 250.363, "end": 251.735, "text": "Zero é sempre desligado;"}, {"start": 251.735, "end": 253.392, "text": "duzentos e cinquenta e cinco,"}, {"start": 253.392, "end": 255.474, "text": "sempre ligado; cento e vinte e sete,"}, {"start": 255.474, "end": 256.798, "text": "ligado metade do tempo."}, {"start": 257.118, "end": 259.729, "text": "Esse percentual de tempo ligado é o ciclo de"}, {"start": 259.729, "end": 262.533, "text": "trabalho. O LED parece mais forte ou mais fraco,"}, {"start": 262.533, "end": 264.225, "text": "mas o sinal continua digital."}, {"start": 264.545, "end": 266.922, "text": "Só funciona nos pinos com til no Uno:"}, {"start": 266.922, "end": 268.421, "text": "três, cinco, seis, nove,"}, {"start": 268.421, "end": 269.196, "text": "dez e onze."}, {"start": 269.696, "end": 271.176, "text": "Questão dois junta tudo:"}, {"start": 271.176, "end": 273.524, "text": "potenciômetro no A0, LED no pino nove."}, {"start": 273.844, "end": 275.976, "text": "No setup: o pino do LED como saída,"}, {"start": 275.976, "end": 278.109, "text": "e a serial a nove mil e seiscentos."}, {"start": 278.429, "end": 280.452, "text": "No loop: analogRead lê o potenciômetro,"}, {"start": 280.452, "end": 282.124, "text": "de zero a mil e vinte e três."}, {"start": 282.444, "end": 284.882, "text": "Mas o analogWrite só aceita de zero a duzentos"}, {"start": 284.882, "end": 285.97, "text": "e cinquenta e cinco."}, {"start": 285.97, "end": 287.407, "text": "Quem faz a ponte é o map:"}, {"start": 287.407, "end": 289.715, "text": "uma regra de três que converte uma faixa na"}, {"start": 289.715, "end": 290.063, "text": "outra."}, {"start": 290.383, "end": 292.834, "text": "Leitura quinhentos e doze vira cento e vinte e"}, {"start": 292.834, "end": 294.804, "text": "sete, mais ou menos metade do brilho."}, {"start": 294.804, "end": 296.293, "text": "O map também inverte faixas:"}, {"start": 296.293, "end": 298.394, "text": "map de solo, de quatro mil e noventa e"}, {"start": 298.394, "end": 299.838, "text": "cinco até mil e quinhentos,"}, {"start": 299.838, "end": 301.283, "text": "para zero a cem por cento."}, {"start": 301.603, "end": 304.626, "text": "E o Serial.print mostra os valores no Monitor Serial."}, {"start": 304.626, "end": 305.825, "text": "A cada meio segundo,"}, {"start": 305.825, "end": 306.736, "text": "tudo se repete."}, {"start": 307.236, "end": 309.446, "text": "A comunicação serial com o computador."}, {"start": 309.766, "end": 313.024, "text": "Serial.begin de nove mil e seiscentos abre a comunicação"}, {"start": 313.024, "end": 315.493, "text": "a nove mil e seiscentos bits por segundo."}, {"start": 315.493, "end": 317.863, "text": "No ESP32, é comum cento e quinze mil e"}, {"start": 317.863, "end": 318.406, "text": "duzentos."}, {"start": 318.726, "end": 321.408, "text": "Serial.print escreve e continua na mesma linha."}, {"start": 321.408, "end": 323.602, "text": "Serial.println escreve e pula a linha."}, {"start": 323.922, "end": 326.74, "text": "O Monitor Serial precisa estar na mesma velocidade,"}, {"start": 326.74, "end": 328.665, "text": "senão aparecem caracteres estranhos."}, {"start": 328.985, "end": 331.4, "text": "E o Serial Plotter desenha os valores como um"}, {"start": 331.4, "end": 333.331, "text": "gráfico, como um osciloscópio simples."}, {"start": 333.831, "end": 336.517, "text": "Código do sensor de gás com LED e buzzer."}, {"start": 336.837, "end": 339.418, "text": "No setup, os pinos oito e nove como saída:"}, {"start": 339.418, "end": 340.559, "text": "o LED e o buzzer."}, {"start": 340.879, "end": 343.449, "text": "No loop, analogRead do A0 guarda a leitura em"}, {"start": 343.449, "end": 346.019, "text": "sensorValue, e o Serial.println mostra o valor."}, {"start": 346.339, "end": 348.472, "text": "Se a leitura passar de quinhentos,"}, {"start": 348.472, "end": 349.981, "text": "liga o LED e o buzzer."}, {"start": 349.981, "end": 351.438, "text": "Senão, desliga os dois."}, {"start": 351.438, "end": 352.635, "text": "É o padrão limiar:"}, {"start": 352.635, "end": 354.04, "text": "ler, comparar, acionar."}, {"start": 354.36, "end": 357.9, "text": "Nos sensores MQ, a resistência cai quando há gás,"}, {"start": 357.9, "end": 359.82, "text": "e a tensão de saída sobe."}, {"start": 359.82, "end": 361.681, "text": "MQ-135 é qualidade do ar,"}, {"start": 361.681, "end": 364.441, "text": "MQ-4 é metano, MQ-5 é gás de cozinha."}, {"start": 364.941, "end": 367.46, "text": "Código do sensor de temperatura com LCD."}, {"start": 367.78, "end": 369.883, "text": "Primeiro, converte a leitura em tensão:"}, {"start": 369.883, "end": 372.489, "text": "leitura vezes cinco, dividido por mil e vinte e"}, {"start": 372.489, "end": 372.809, "text": "três."}, {"start": 373.129, "end": 374.759, "text": "Depois, a tensão em graus:"}, {"start": 374.759, "end": 376.694, "text": "tensão menos zero vírgula cinco,"}, {"start": 376.694, "end": 379.648, "text": "vezes cem. Zero vírgula setenta e cinco volts dá"}, {"start": 379.648, "end": 380.922, "text": "vinte e cinco graus."}, {"start": 381.242, "end": 382.867, "text": "Mostra no LCD: Temp Atual,"}, {"start": 382.867, "end": 384.999, "text": "a temperatura com uma casa decimal,"}, {"start": 384.999, "end": 385.863, "text": "e a letra C."}, {"start": 386.183, "end": 389.092, "text": "Na segunda linha, compara com a temperatura alvo,"}, {"start": 389.092, "end": 390.748, "text": "ta. O fabs, valor absoluto,"}, {"start": 390.748, "end": 392.103, "text": "testa se estão iguais;"}, {"start": 392.103, "end": 393.357, "text": "senão, diz Acima de,"}, {"start": 393.357, "end": 394.21, "text": "ou Abaixo de."}, {"start": 394.71, "end": 396.087, "text": "Sensor de movimento PIR:"}, {"start": 396.087, "end": 397.511, "text": "ele dá um sinal digital,"}, {"start": 397.511, "end": 399.173, "text": "HIGH quando detecta movimento."}, {"start": 399.493, "end": 402.201, "text": "Versão simples: digitalRead do pino dois."}, {"start": 402.201, "end": 404.683, "text": "Se for HIGH, acende o LED da placa,"}, {"start": 404.683, "end": 406.657, "text": "o LED_BUILTIN, no pino treze."}, {"start": 406.657, "end": 407.559, "text": "Senão, apaga."}, {"start": 407.879, "end": 410.324, "text": "Versão com for: se detectar movimento,"}, {"start": 410.324, "end": 411.9, "text": "o LED pisca três vezes."}, {"start": 411.9, "end": 414.4, "text": "Um segundo aceso, meio segundo apagado."}, {"start": 414.72, "end": 416.937, "text": "O for repete um número definido de vezes:"}, {"start": 416.937, "end": 417.912, "text": "i começa em zero,"}, {"start": 417.912, "end": 419.553, "text": "vai enquanto i menor que três,"}, {"start": 419.553, "end": 420.883, "text": "e soma um a cada volta."}, {"start": 421.203, "end": 423.055, "text": "Repare na estrutura: if decide,"}, {"start": 423.055, "end": 425.707, "text": "for repete, e o loop recomeça tudo de novo."}, {"start": 426.207, "end": 428.389, "text": "PIR com LCD e contador de eventos."}, {"start": 428.709, "end": 431.872, "text": "A variável ultE guarda o estado anterior do sensor."}, {"start": 431.872, "end": 434.154, "text": "Assim o código percebe só a mudança,"}, {"start": 434.154, "end": 436.851, "text": "e não conta o mesmo movimento várias vezes."}, {"start": 437.171, "end": 439.043, "text": "Se agora é HIGH e antes era LOW,"}, {"start": 439.043, "end": 441.28, "text": "é a subida: soma um em eventos e mostra"}, {"start": 441.28, "end": 443.06, "text": "Move Detectado, total igual a n."}, {"start": 443.38, "end": 445.131, "text": "Se agora é LOW e antes era HIGH,"}, {"start": 445.131, "end": 446.754, "text": "é a descida: mostra Area Livre."}, {"start": 447.074, "end": 449.39, "text": "No fim, ultE recebe o estado atual."}, {"start": 449.39, "end": 450.845, "text": "Detalhe que pode cair:"}, {"start": 450.845, "end": 452.946, "text": "o pinMode configura o pino dois,"}, {"start": 452.946, "end": 455.048, "text": "mas a leitura é no pino quatro."}, {"start": 455.048, "end": 457.041, "text": "O correto seria pinMode de pp."}, {"start": 457.541, "end": 460.699, "text": "O LCD dezesseis por dois com módulo I2C."}, {"start": 461.019, "end": 463.175, "text": "Inclui duas bibliotecas: Wire,"}, {"start": 463.175, "end": 465.207, "text": "do I2C, e LiquidCrystal_I2C."}, {"start": 465.207, "end": 467.547, "text": "E cria o lcd com três números:"}, {"start": 467.547, "end": 470.195, "text": "o endereço, as colunas e as linhas."}, {"start": 470.515, "end": 472.12, "text": "No setup: init inicializa,"}, {"start": 472.12, "end": 474.035, "text": "backlight liga a luz de fundo."}, {"start": 474.355, "end": 476.614, "text": "setCursor recebe coluna e depois linha,"}, {"start": 476.614, "end": 478.039, "text": "começando do zero. Zero,"}, {"start": 478.039, "end": 480.101, "text": "zero é o início da primeira linha;"}, {"start": 480.101, "end": 482.016, "text": "zero, um é o início da segunda."}, {"start": 482.016, "end": 482.998, "text": "E print escreve."}, {"start": 483.318, "end": 485.751, "text": "No loop, scrollDisplayRight desloca o texto uma"}, {"start": 485.751, "end": 486.945, "text": "coluna para a direita,"}, {"start": 486.945, "end": 488.67, "text": "e o delay controla a velocidade."}, {"start": 488.99, "end": 490.832, "text": "Se o LCD acender sem texto,"}, {"start": 490.832, "end": 493.161, "text": "o endereço provavelmente está errado:"}, {"start": 493.161, "end": 495.652, "text": "zero x vinte, zero x vinte e sete ou"}, {"start": 495.652, "end": 496.681, "text": "zero x três F."}, {"start": 496.681, "end": 498.74, "text": "O scanner I2C descobre o certo."}, {"start": 499.24, "end": 501.574, "text": "Duas variações que também estão no resumo."}, {"start": 501.894, "end": 505.582, "text": "O LCD sem módulo usa a biblioteca LiquidCrystal"}, {"start": 505.582, "end": 507.031, "text": "e seis pinos: RS,"}, {"start": 507.031, "end": 509.006, "text": "E, e os dados D4 a D7."}, {"start": 509.006, "end": 511.838, "text": "E começa com lcd.begin de dezesseis,"}, {"start": 511.838, "end": 512.299, "text": "dois."}, {"start": 512.619, "end": 514.86, "text": "O DHT11 mede temperatura e umidade,"}, {"start": 514.86, "end": 516.835, "text": "usando um único pino de dados."}, {"start": 517.155, "end": 519.345, "text": "readTemperature devolve graus Celsius,"}, {"start": 519.345, "end": 521.79, "text": "e readHumidity, a umidade em porcentagem."}, {"start": 522.11, "end": 525.097, "text": "Atenção: o DHT11 precisa de pelo menos dois segundos"}, {"start": 525.097, "end": 527.747, "text": "entre leituras, por isso o delay de dois mil."}, {"start": 528.247, "end": 530.547, "text": "Questão sete: atuadores e acionamento."}, {"start": 530.867, "end": 533.571, "text": "Uma bomba, um motor ou uma lâmpada são atuadores."}, {"start": 533.571, "end": 536.414, "text": "Mas um pino do microcontrolador só fornece uns vinte"}, {"start": 536.414, "end": 537.652, "text": "a quarenta miliamperes."}, {"start": 537.972, "end": 540.22, "text": "Por isso não se liga uma carga dessas direto"}, {"start": 540.22, "end": 542.427, "text": "no pino: é preciso um circuito intermediário,"}, {"start": 542.427, "end": 544.509, "text": "como um relé, um transistor ou um driver."}, {"start": 544.829, "end": 546.098, "text": "O pino só dá o comando,"}, {"start": 546.098, "end": 547.451, "text": "e o relé, como uma chave,"}, {"start": 547.451, "end": 549.523, "text": "liga a carga com a energia de uma fonte"}, {"start": 549.523, "end": 549.946, "text": "própria."}, {"start": 550.266, "end": 551.774, "text": "Pegadinha do módulo relé:"}, {"start": 551.774, "end": 552.98, "text": "ele aciona com LOW."}, {"start": 552.98, "end": 554.387, "text": "LOW liga, HIGH desliga."}, {"start": 554.707, "end": 557.42, "text": "E cuidado: a carga pode estar na rede elétrica,"}, {"start": 557.42, "end": 559.848, "text": "de cento e dez ou duzentos e vinte volts."}, {"start": 560.348, "end": 561.522, "text": "Os códigos do relé."}, {"start": 561.842, "end": 564.074, "text": "Exemplo um: duas lâmpadas alternando."}, {"start": 564.074, "end": 565.476, "text": "Relé um no pino sete,"}, {"start": 565.476, "end": 566.982, "text": "relé dois no pino oito."}, {"start": 567.302, "end": 569.015, "text": "LOW no sete e HIGH no oito:"}, {"start": 569.015, "end": 570.141, "text": "liga a lâmpada um."}, {"start": 570.141, "end": 571.561, "text": "Depois de dois segundos,"}, {"start": 571.561, "end": 573.275, "text": "inverte: liga a lâmpada dois."}, {"start": 573.595, "end": 575.861, "text": "Exemplo dois: um botão que liga e desliga."}, {"start": 575.861, "end": 578.039, "text": "Lê o botão, espera ele ser solto com um"}, {"start": 578.039, "end": 580.261, "text": "while, e inverte o estado com o ponto de"}, {"start": 580.261, "end": 580.839, "text": "exclamação."}, {"start": 581.159, "end": 583.288, "text": "O ponto de exclamação é o não lógico:"}, {"start": 583.288, "end": 584.862, "text": "um vira zero, zero vira um."}, {"start": 584.862, "end": 586.852, "text": "Cada clique troca o estado do relé."}, {"start": 587.352, "end": 589.497, "text": "Mais dois itens rápidos do resumo."}, {"start": 589.817, "end": 592.502, "text": "tone de seis, cinquenta gera uma onda de cinquenta"}, {"start": 592.502, "end": 593.575, "text": "hertz no pino seis,"}, {"start": 593.575, "end": 596.125, "text": "para um buzzer. O osciloscópio mostra essa onda."}, {"start": 596.445, "end": 597.736, "text": "E o resistor do LED,"}, {"start": 597.736, "end": 598.779, "text": "pela Lei de Ohm:"}, {"start": 598.779, "end": 600.12, "text": "V igual a R vezes I."}, {"start": 600.44, "end": 601.808, "text": "O pino dá cinco volts,"}, {"start": 601.808, "end": 604.74, "text": "o LED vermelho usa dois volts e vinte miliamperes."}, {"start": 604.74, "end": 606.401, "text": "R igual a cinco menos dois,"}, {"start": 606.401, "end": 608.502, "text": "dividido por zero vírgula zero dois:"}, {"start": 608.502, "end": 609.87, "text": "cento e cinquenta ohms."}, {"start": 610.19, "end": 612.001, "text": "Sem resistor, o LED queima."}, {"start": 612.001, "end": 613.591, "text": "E o LED tem polaridade:"}, {"start": 613.591, "end": 615.457, "text": "a perna maior é o positivo,"}, {"start": 615.457, "end": 616.06, "text": "o anodo."}, {"start": 616.56, "end": 618.078, "text": "Questão cinco: a UART."}, {"start": 618.398, "end": 620.357, "text": "É uma comunicação serial assíncrona:"}, {"start": 620.357, "end": 621.616, "text": "não tem fio de clock."}, {"start": 621.936, "end": 623.335, "text": "Usa dois sinais: TX,"}, {"start": 623.335, "end": 624.734, "text": "que transmite, e RX,"}, {"start": 624.734, "end": 627.253, "text": "que recebe. E eles se ligam cruzados:"}, {"start": 627.253, "end": 629.211, "text": "o TX de um no RX do outro."}, {"start": 629.531, "end": 630.58, "text": "Como não há clock,"}, {"start": 630.58, "end": 632.996, "text": "os dois lados precisam combinar a velocidade:"}, {"start": 632.996, "end": 635.23, "text": "o baud rate, como nove mil e seiscentos."}, {"start": 635.55, "end": 636.632, "text": "É ponto a ponto,"}, {"start": 636.632, "end": 638.384, "text": "um dispositivo de cada lado."}, {"start": 638.384, "end": 640.651, "text": "Exemplos: o Arduino com o computador,"}, {"start": 640.651, "end": 642.814, "text": "um módulo GPS, um módulo Bluetooth."}, {"start": 643.314, "end": 645.193, "text": "Questão seis: o I2C."}, {"start": 645.513, "end": 646.744, "text": "São só dois fios:"}, {"start": 646.744, "end": 648.366, "text": "SDA, que leva os dados,"}, {"start": 648.366, "end": 650.101, "text": "e SCL, que leva o clock."}, {"start": 650.101, "end": 651.891, "text": "É uma comunicação síncrona."}, {"start": 652.211, "end": 655.093, "text": "Vários dispositivos ficam pendurados no mesmo par"}, {"start": 655.093, "end": 656.459, "text": "de fios, o barramento."}, {"start": 656.779, "end": 659.021, "text": "Cada dispositivo tem um endereço único."}, {"start": 659.021, "end": 660.678, "text": "O mestre, o microcontrolador,"}, {"start": 660.678, "end": 663.748, "text": "chama pelo endereço, e só aquele dispositivo responde."}, {"start": 664.068, "end": 666.712, "text": "Assim o LCD, no zero x vinte e sete,"}, {"start": 666.712, "end": 668.609, "text": "e um sensor de temperatura,"}, {"start": 668.609, "end": 671.828, "text": "em outro endereço, dividem os mesmos dois fios."}, {"start": 671.828, "end": 674.3, "text": "No ESP32, SDA é o GPIO vinte e um"}, {"start": 674.3, "end": 675.909, "text": "e SCL o vinte e dois."}, {"start": 676.409, "end": 678.526, "text": "Comparando os três protocolos,"}, {"start": 678.526, "end": 679.735, "text": "incluindo o SPI."}, {"start": 680.055, "end": 681.978, "text": "UART: assíncrona, TX e RX,"}, {"start": 681.978, "end": 683.84, "text": "velocidade pelo baud rate,"}, {"start": 683.84, "end": 684.921, "text": "ponto a ponto."}, {"start": 685.241, "end": 686.977, "text": "SPI: síncrona, quatro fios,"}, {"start": 686.977, "end": 689.093, "text": "MOSI, MISO, clock e chip select."}, {"start": 689.093, "end": 691.154, "text": "É rápida, mas não usa endereço:"}, {"start": 691.154, "end": 694.462, "text": "precisa de um fio de seleção para cada dispositivo."}, {"start": 694.782, "end": 696.674, "text": "I2C: síncrona, dois fios,"}, {"start": 696.674, "end": 699.954, "text": "SDA e SCL, vários dispositivos por endereço."}, {"start": 699.954, "end": 703.927, "text": "Mais lenta: cem ou quatrocentos quilobits por segundo."}, {"start": 704.247, "end": 707.176, "text": "Macete: SDA e SCL é I2C."}, {"start": 707.176, "end": 709.161, "text": "TX e RX é UART."}, {"start": 709.161, "end": 711.429, "text": "MOSI e MISO é SPI."}, {"start": 711.929, "end": 715.486, "text": "O ESP32, que aparece na discursiva e no IoT."}, {"start": 715.806, "end": 717.853, "text": "Ele tem Wi-Fi e Bluetooth integrados,"}, {"start": 717.853, "end": 720.738, "text": "dois núcleos, e trabalha em três vírgula três volts."}, {"start": 721.058, "end": 722.947, "text": "Pinos com cuidado: do seis ao onze,"}, {"start": 722.947, "end": 724.572, "text": "não use, são da memória flash."}, {"start": 724.572, "end": 726.285, "text": "Trinta e quatro, trinta e cinco,"}, {"start": 726.285, "end": 728.306, "text": "trinta e seis e trinta e nove são só"}, {"start": 728.306, "end": 728.921, "text": "de entrada."}, {"start": 729.241, "end": 730.467, "text": "Com o Wi-Fi ligado,"}, {"start": 730.467, "end": 731.744, "text": "o ADC2 não funciona:"}, {"start": 731.744, "end": 734.35, "text": "leia sensores analógicos nos pinos do ADC1,"}, {"start": 734.35, "end": 736.547, "text": "do trinta e dois ao trinta e nove."}, {"start": 736.867, "end": 739.107, "text": "E um sensor de cinco volts precisa de um"}, {"start": 739.107, "end": 740.853, "text": "divisor de tensão antes do pino,"}, {"start": 740.853, "end": 743.183, "text": "para não passar de três vírgula três volts."}, {"start": 743.682, "end": 747.244, "text": "Três recursos do ESP32 que podem cair em código."}, {"start": 747.564, "end": 750.63, "text": "Interrupção: attachInterrupt liga um pino a uma"}, {"start": 750.63, "end": 752.024, "text": "função curta, a ISR."}, {"start": 752.024, "end": 753.807, "text": "Quando o botão é apertado,"}, {"start": 753.807, "end": 755.925, "text": "o programa para, executa a ISR,"}, {"start": 755.925, "end": 756.539, "text": "e volta."}, {"start": 756.859, "end": 758.763, "text": "Timer e millis: diferente do delay,"}, {"start": 758.763, "end": 759.988, "text": "não travam o programa."}, {"start": 759.988, "end": 762.391, "text": "Com millis, o código só age quando passou o"}, {"start": 762.391, "end": 764.205, "text": "tempo, e o loop continua rodando."}, {"start": 764.525, "end": 767.297, "text": "Deep sleep: desliga quase tudo e acorda depois de"}, {"start": 767.297, "end": 769.6, "text": "um tempo. O consumo cai de cerca de cem"}, {"start": 769.6, "end": 771.197, "text": "miliamperes para microamperes."}, {"start": 771.517, "end": 773.166, "text": "Ótimo para sensores a bateria,"}, {"start": 773.166, "end": 775.135, "text": "que leem, enviam e voltam a dormir."}, {"start": 775.635, "end": 777.442, "text": "Questão oito: IoT e dashboard."}, {"start": 777.762, "end": 779.156, "text": "O caminho dos dados:"}, {"start": 779.156, "end": 782.39, "text": "os sensores medem, o ESP32 processa e envia pelo"}, {"start": 782.39, "end": 782.836, "text": "Wi-Fi."}, {"start": 783.156, "end": 786.466, "text": "Um servidor recebe, por exemplo com HTTP ou MQTT,"}, {"start": 786.466, "end": 788.43, "text": "e guarda num banco de dados."}, {"start": 788.75, "end": 790.248, "text": "O dashboard é o painel:"}, {"start": 790.248, "end": 792.004, "text": "mostra os dados em gráficos,"}, {"start": 792.004, "end": 794.277, "text": "indicadores e alertas, em tempo real."}, {"start": 794.277, "end": 796.447, "text": "Exemplos: Blynk, ThingSpeak, Grafana."}, {"start": 796.767, "end": 799.884, "text": "Pegadinha: o dashboard não mede nada e não substitui"}, {"start": 799.884, "end": 801.995, "text": "sensor nem firmware. Ele só mostra,"}, {"start": 801.995, "end": 804.308, "text": "alerta, e pode mandar comandos remotos."}, {"start": 804.808, "end": 807.07, "text": "O código de envio pelo Wi-Fi,"}, {"start": 807.07, "end": 808.453, "text": "do guia do ESP32."}, {"start": 808.773, "end": 810.46, "text": "Inclui WiFi e HTTPClient."}, {"start": 810.46, "end": 812.879, "text": "No setup, WiFi.begin conecta à rede,"}, {"start": 812.879, "end": 815.916, "text": "e o while espera até o status ser conectado."}, {"start": 816.236, "end": 818.696, "text": "No loop, monta o endereço do servidor com os"}, {"start": 818.696, "end": 820.655, "text": "valores dos sensores, e faz um GET."}, {"start": 820.975, "end": 823.545, "text": "O código duzentos significa que deu certo."}, {"start": 823.545, "end": 825.55, "text": "Depois, http.end fecha a conexão,"}, {"start": 825.55, "end": 828.224, "text": "e o delay de dez segundos espera o próximo"}, {"start": 828.224, "end": 828.635, "text": "envio."}, {"start": 829.135, "end": 831.277, "text": "Questão nove: ROI e Payback."}, {"start": 831.597, "end": 834.127, "text": "O ROI é o retorno sobre o investimento,"}, {"start": 834.127, "end": 836.814, "text": "em porcentagem: benefício menos investimento,"}, {"start": 836.814, "end": 839.133, "text": "dividido pelo investimento, vezes cem."}, {"start": 839.453, "end": 842.279, "text": "O Payback é o tempo para recuperar o investimento:"}, {"start": 842.279, "end": 845.057, "text": "investimento dividido pelo benefício líquido mensal."}, {"start": 845.377, "end": 847.887, "text": "Exemplo: investimento de oito mil reais,"}, {"start": 847.887, "end": 849.489, "text": "economia de mil por mês,"}, {"start": 849.489, "end": 851.198, "text": "custo de duzentos por mês."}, {"start": 851.198, "end": 853.281, "text": "O benefício líquido é oitocentos."}, {"start": 853.281, "end": 855.898, "text": "Payback: oito mil dividido por oitocentos,"}, {"start": 855.898, "end": 856.592, "text": "dez meses."}, {"start": 856.912, "end": 858.115, "text": "ROI em doze meses:"}, {"start": 858.115, "end": 860.469, "text": "nove mil e seiscentos menos oito mil,"}, {"start": 860.469, "end": 861.882, "text": "dividido por oito mil:"}, {"start": 861.882, "end": 862.928, "text": "vinte por cento."}, {"start": 863.248, "end": 865.086, "text": "Macete: ROI é percentual,"}, {"start": 865.086, "end": 868.578, "text": "Payback é tempo. ROI positivo não garante que o"}, {"start": 868.578, "end": 869.926, "text": "sistema não falhe."}, {"start": 870.426, "end": 872.903, "text": "Outros indicadores e conceitos do resumo."}, {"start": 873.223, "end": 875.541, "text": "Latência: soma dos tempos de detecção,"}, {"start": 875.541, "end": 877.911, "text": "processamento, comunicação e acionamento."}, {"start": 877.911, "end": 880.693, "text": "Disponibilidade: tempo funcionando dividido pelo"}, {"start": 880.693, "end": 881.466, "text": "tempo total."}, {"start": 881.786, "end": 884.088, "text": "Acurácia é estar perto do valor real."}, {"start": 884.088, "end": 886.135, "text": "Precisão é repetir o mesmo valor."}, {"start": 886.135, "end": 888.796, "text": "Um sensor pode ser preciso e pouco acurado."}, {"start": 889.116, "end": 891.843, "text": "Requisito funcional diz o que o sistema faz."}, {"start": 891.843, "end": 893.284, "text": "Não funcional diz como:"}, {"start": 893.284, "end": 895.343, "text": "consumo, custo, tempo de resposta."}, {"start": 895.663, "end": 898.188, "text": "Trade-off: melhorar uma coisa piora outra."}, {"start": 898.188, "end": 899.837, "text": "E protótipo não é produto:"}, {"start": 899.837, "end": 902.001, "text": "o produto precisa de placa própria,"}, {"start": 902.001, "end": 903.341, "text": "certificação e testes."}, {"start": 903.841, "end": 906.913, "text": "Questão dez: a proposta de irrigação automática."}, {"start": 906.913, "end": 908.449, "text": "Comece pela arquitetura."}, {"start": 908.769, "end": 911.139, "text": "Entrada: um sensor de umidade do solo."}, {"start": 911.139, "end": 913.201, "text": "Opcionalmente, temperatura e chuva."}, {"start": 913.521, "end": 916.827, "text": "Processamento: um ESP32, porque já tem Wi-Fi para"}, {"start": 916.827, "end": 918.366, "text": "o monitoramento remoto."}, {"start": 918.686, "end": 920.142, "text": "Saída: um relé, ou driver,"}, {"start": 920.142, "end": 922.461, "text": "acionando a bomba ou uma válvula solenoide,"}, {"start": 922.461, "end": 924.234, "text": "com fonte de alimentação própria."}, {"start": 924.554, "end": 927.795, "text": "Comunicação: o ESP32 envia os dados pelo Wi-Fi para"}, {"start": 927.795, "end": 929.921, "text": "uma plataforma IoT, com dashboard,"}, {"start": 929.921, "end": 932.311, "text": "alertas e botão de acionamento manual."}, {"start": 932.811, "end": 934.158, "text": "A lógica da irrigação,"}, {"start": 934.158, "end": 934.807, "text": "em código."}, {"start": 935.127, "end": 936.752, "text": "Lê o sensor de solo no ADC,"}, {"start": 936.752, "end": 939.12, "text": "e usa o map para transformar a leitura em"}, {"start": 939.12, "end": 941.721, "text": "porcentagem de umidade. Valor alto é solo seco,"}, {"start": 941.721, "end": 943.392, "text": "por isso a faixa é invertida."}, {"start": 943.712, "end": 946.392, "text": "Se a umidade cair abaixo de trinta por cento,"}, {"start": 946.392, "end": 948.535, "text": "liga a bomba. Se passar de sessenta,"}, {"start": 948.535, "end": 949.022, "text": "desliga."}, {"start": 949.342, "end": 950.605, "text": "Entre os dois limites,"}, {"start": 950.605, "end": 952.429, "text": "não muda nada. Isso é histerese:"}, {"start": 952.429, "end": 955.142, "text": "evita que a bomba fique ligando e desligando sem"}, {"start": 955.142, "end": 955.516, "text": "parar."}, {"start": 955.836, "end": 957.753, "text": "Lembrando: o relé liga com LOW."}, {"start": 957.753, "end": 958.863, "text": "E a cada leitura,"}, {"start": 958.863, "end": 961.234, "text": "o ESP32 envia a umidade e o estado da"}, {"start": 961.234, "end": 962.646, "text": "bomba para o dashboard."}, {"start": 963.146, "end": 965.385, "text": "Como escrever a resposta da discursiva."}, {"start": 965.705, "end": 968.04, "text": "Um: o objetivo do sistema e os requisitos,"}, {"start": 968.04, "end": 969.414, "text": "o que ele precisa fazer."}, {"start": 969.734, "end": 972.06, "text": "Dois: a arquitetura com os componentes:"}, {"start": 972.06, "end": 974.537, "text": "sensor, microcontrolador, atuador com relé,"}, {"start": 974.537, "end": 976.054, "text": "alimentação e comunicação."}, {"start": 976.374, "end": 978.824, "text": "Três: o funcionamento: os limites de umidade,"}, {"start": 978.824, "end": 979.887, "text": "o envio dos dados,"}, {"start": 979.887, "end": 981.644, "text": "o dashboard e o comando remoto."}, {"start": 981.964, "end": 984.356, "text": "Quatro: testes, calibração do sensor,"}, {"start": 984.356, "end": 987.081, "text": "e a análise de custo com ROI e Payback."}, {"start": 987.581, "end": 988.781, "text": "Para levar para a prova."}, {"start": 989.101, "end": 992.131, "text": "Sensor é entrada, microcontrolador é processamento,"}, {"start": 992.131, "end": 993.176, "text": "atuador é saída."}, {"start": 993.496, "end": 995.578, "text": "analogRead vai de zero a mil e vinte e"}, {"start": 995.578, "end": 998.268, "text": "três. analogWrite vai de zero a duzentos e cinquenta"}, {"start": 998.268, "end": 1000.568, "text": "e cinco. O map converte uma faixa na outra."}, {"start": 1000.888, "end": 1003.8, "text": "UART: TX, RX e baud rate."}, {"start": 1003.8, "end": 1006.621, "text": "I2C: SDA, SCL e endereço."}, {"start": 1006.941, "end": 1009.419, "text": "Carga pesada precisa de relé ou driver,"}, {"start": 1009.419, "end": 1010.949, "text": "e o relé liga com LOW."}, {"start": 1010.949, "end": 1013.111, "text": "ROI é percentual; Payback é tempo."}, {"start": 1013.431, "end": 1014.725, "text": "Agora é com você."}, {"start": 1014.725, "end": 1015.49, "text": "Boa prova!"}];
