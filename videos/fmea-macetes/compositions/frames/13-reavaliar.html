        // ---------- ambient: deterministic, driven by the timeline ----------
        var rnum = $("rnum"), bnum = $("bnum");
        var tr1 = $("tr1"), tr2 = $("tr2");
        var pencil = $("pencil"), smk0 = $("smk0"), smk1 = $("smk1"), wrench = $("wrench"), tscan = $("tscan");
        function valueAt(t) {
          return FROM - (FROM - TO) * e3(cl((t - T_COUNT) / COUNT_DUR));
        }
        function ambient(t) {
          var v = valueAt(t);
          rnum.textContent = String(Math.round(v));

          // 336 trembles (warning) until it gets struck
          var shake = t < T_STRIKE ? Math.sin(t * 31) * 2.2 * cl((t - 0.6) / 0.4) : 0;
          bnum.style.translate = shake.toFixed(2) + "px 0px";

          // risk meter: 1 cell = 50 NPR; cells switch off as the NPR falls
          var lit = Math.round(v / 50);
          var blink = t < T_COUNT && Math.floor(t * 3) % 2 === 1;
          for (var i = 0; i < 20; i++) {
            var s = i < lit ? e3(cl((t - (T_METER + 0.2 + i * 0.06)) / 0.16)) : 0;
            cells[i].style.transform = "scale(" + s.toFixed(3) + ")";
            cells[i].style.opacity = (i === lit - 1 && blink) ? "0.35" : "1";
          }

          // arrow speed-trail dashes above the arrow while it falls
          var falling = t > T_COUNT && t < T_COUNT + COUNT_DUR;
          var ph = (t * 2.2) % 1;
          tr1.style.transform = "translateY(" + (-70 + ph * 50).toFixed(1) + "px)";
          tr2.style.transform = "translateY(" + (-110 + ((ph + 0.5) % 1) * 50).toFixed(1) + "px)";
          tr1.style.opacity = falling ? "1" : "0";
          tr2.style.opacity = falling ? "1" : "0";

          // badges: icons alive + gentle bob once arrived
          for (var b = 0; b < 4; b++) {
            var a = cl((t - T_BADGE[b] - 0.5) / 0.4);
            badges[b].style.translate = "0px " + (Math.sin(t * 2.6 + b * 1.6) * 4 * a).toFixed(2) + "px";
            // pulses run along each line toward the table
            var st = T_BADGE[b] + 0.45;
            if (t > st) {
              var p = ((t - st) * 0.9) % 1;
              var x = BC[b][0] + (TC[0] - BC[b][0]) * p, y = BC[b][1] + (TC[1] - BC[b][1]) * p;
              pulses[b].style.transform = "translate(" + (x - 8).toFixed(1) + "px," + (y - 8).toFixed(1) + "px)";
              pulses[b].style.opacity = "1";
            } else {
              pulses[b].style.opacity = "0";
            }
          }
          // PROJETO: pencil slides along the drafting edge
          var pp = (Math.sin(t * 2.4) + 1) / 2;
          pencil.setAttribute("transform", "translate(" + (-10 + pp * 20).toFixed(1) + "," + (-10 + pp * 20).toFixed(1) + ")");
          // PRODUÇÃO: chimney smoke squares rise
          var s0 = (t * 0.9) % 1, s1 = (t * 0.9 + 0.5) % 1;
          smk0.setAttribute("y", (6 - s0 * 30).toFixed(1)); smk0.setAttribute("opacity", (1 - s0).toFixed(2));
          smk1.setAttribute("y", (6 - s1 * 30).toFixed(1)); smk1.setAttribute("opacity", (1 - s1).toFixed(2));
          // MANUTENÇÃO: wrench turns back and forth
          wrench.setAttribute("transform", "rotate(" + (-30 + Math.sin(t * 3.2) * 14).toFixed(1) + " 50 60)");
          // table: scan bar sweeps across the analysis sheet
          var sc = ((t - T_TABLE) * 0.6) % 1;
          tscan.style.transform = "translateX(" + (sc < 0 ? 0 : sc * 360).toFixed(1) + "px)";
        }
        ambient(0);
        tl.to({ v: 0 }, { v: 1, duration: D, ease: "none", onUpdate: function () { ambient(this.progress() * D); } }, 0);

        // ---------- camera: slow continuous drift ----------
        tl.fromTo($("cam"), { scale: 1 }, { scale: 1.02, duration: D, ease: "none" }, 0);

        // ---------- Scene 1 (0.0–2.3): NPR ANTES 336, headline, EXEMPLO ----------
        tl.fromTo($("bmove"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.15);
        tl.fromTo($("strike"), { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
        tl.fromTo($("head"), { clipPath: HIDE_R, y: 24 }, { clipPath: SHOW, y: 0, duration: 0.7, ease: "power3.out" }, T_HEAD);
        tl.fromTo($("tag"), { scale: 1.5, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" }, T_TAG);
        tl.fromTo($("meter"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T_METER - 0.1);

        // ---------- Scene 2 (2.3–5.2): 8 × ... 3 ... × 2 ----------
        tl.fromTo($("f8"), { y: -70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, T_8);
        tl.fromTo($("l8"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, T_8 + 0.12);
        tl.fromTo($("fx1"), { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: "power3.out" }, T_8 + 0.25);
        // the 3 falls from higher: occurrence dropped
        tl.fromTo($("f3"), { y: -160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, T_3);
        tl.fromTo($("l3"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, T_3 + 0.12);
        tl.fromTo($("e3"), { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, T_3 + 0.3);
        tl.fromTo($("fx2"), { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: "power3.out" }, T_2);
        tl.fromTo($("f2"), { y: -160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, T_2 + 0.12);
        tl.fromTo($("l2"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, T_2 + 0.22);
        tl.fromTo($("e2"), { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, T_2 + 0.4);

        // ---------- Scene 3 (5.2–8.8): 336 counts down to 48, arrow falls ----------
        tl.fromTo($("rmove"), { clipPath: HIDE_R }, { clipPath: SHOW, duration: 0.45, ease: "power3.out" }, T_RBOX);
        tl.fromTo($("arrow"), { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power3.out" }, T_RBOX + 0.1);
        tl.to($("arrow"), { y: 300, duration: COUNT_DUR, ease: "power3.out" }, T_COUNT);
        // counting-dynamic-scale: value + scale share window and ease
        tl.fromTo($("rnum"), { scale: 0.62 }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, T_COUNT);
        tl.to($("strike"), { scaleX: 1, duration: 0.4, ease: "power3.out" }, T_STRIKE);
        tl.to($("bbox"), { scale: 0.97, duration: 0.12, ease: "power2.out" }, T_STRIKE + 0.05);
        tl.to($("bbox"), { scale: 1, duration: 0.35, ease: "power3.out" }, T_STRIKE + 0.17);
        // inverted block: ink fill + cream copy rise together from the bottom
        tl.fromTo([$("rfill"), $("rcream")], { clipPath: HIDE_UP }, { clipPath: SHOW, duration: FLIP_DUR, ease: "power3.out" }, T_FLIP);
        tl.set($("rink"), { opacity: 0 }, T_FLIP + FLIP_DUR);
        tl.fromTo($("rul"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, T_FLIP + FLIP_DUR);
        tl.to($("rpop"), { scale: 1.05, duration: 0.14, ease: "power2.out" }, T_FLIP + FLIP_DUR);
        tl.to($("rpop"), { scale: 1, duration: 0.4, ease: "power3.out" }, T_FLIP + FLIP_DUR + 0.14);

        // ---------- Scene 4 (8.8–13.547): clear the math, gather the team ----------
        tl.to([$("f8"), $("fx1"), $("f3"), $("fx2"), $("f2"), $("l8"), $("l3"), $("l2"), $("e3"), $("e2"), $("meter"), $("arrow")],
          { opacity: 0, y: "+=26", duration: 0.4, ease: "power2.in", stagger: 0.025 }, T_B);
        tl.to($("bmove"), { scale: 0.7, duration: 0.85, ease: "power3.inOut" }, T_B + 0.2);
        tl.to($("rmove"), { x: -1300, y: 255, scale: 0.7, duration: 0.95, ease: "power3.inOut" }, T_B + 0.25);
        tl.fromTo($("sarrow"), { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power3.out" }, T_B + 1.05);

        // table "ANÁLISE FMEA"
        tl.fromTo($("table"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, T_TABLE);
        // badges: spring-pop, lines draw from badge into the table
        for (var q = 0; q < 4; q++) {
          tl.fromTo(badges[q], { scale: 0, opacity: 0, y: 24 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T_BADGE[q]);
          tl.fromTo(lines[q], { attr: { "stroke-dashoffset": LEN[q] } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.4, ease: "power2.out" }, T_BADGE[q] + 0.05);
          tl.to($("table"), { scale: 1.03, duration: 0.1, ease: "power2.out" }, T_BADGE[q] + 0.42);
          tl.to($("table"), { scale: 1, duration: 0.25, ease: "power3.out" }, T_BADGE[q] + 0.52);
        }
        tl.fromTo($("check"), { attr: { "stroke-dashoffset": 72 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.4, ease: "power2.out" }, T_BADGE[2] + 0.3);
      })();
    </script>
  </div>
</template>
