    <script>
      (function () {
        var D = 8.171;
        var $ = function (id) { return document.getElementById("03-evita-" + id); };
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["03-evita"] = tl;

        var CLIP_HIDE = "inset(-30% 100% -15% -4%)";
        var CLIP_SHOW = "inset(-30% -4% -15% -4%)";

        // ---------- ambient (deterministic, driven by timeline time) ----------
        var S = 260;
        function beltPos(t) {
          var p = 0, dt;
          if (t <= 6.2) return 0;
          p += (Math.min(t, 6.35) - 6.2) * S; if (t <= 6.35) return p;
          dt = Math.min(t, 6.5) - 6.35; p += S * dt - (S * dt * dt) / (2 * 0.15); if (t <= 6.5) return p;
          if (t <= 6.95) return p;
          dt = Math.min(t, 7.2) - 6.95; p += (S * dt * dt) / (2 * 0.25); if (t <= 7.2) return p;
          return p + (t - 7.2) * S;
        }
        var stripes = $("stripes"), boxes = $("boxes"), shake = $("p1-shake"), brk = $("p1-break"), magin = $("magin");
        var rollers = [0, 1, 2, 3, 4].map(function (i) { return $("rl-" + i); });
        var RX = [80, 170, 260, 350, 440];
        function ambient(t) {
          var pos = beltPos(t);
          stripes.setAttribute("transform", "translate(" + (pos % 40).toFixed(2) + " 0)");
          boxes.setAttribute("transform", "translate(" + (pos % 160).toFixed(2) + " 0)");
          var rot = (pos * 1.6) % 360;
          for (var i = 0; i < 5; i++) rollers[i].setAttribute("transform", "rotate(" + rot.toFixed(2) + " " + RX[i] + " 322)");
          // angry face shakes until the X lands
          var sx = (t > 5.2 && t < 5.8) ? Math.sin(t * 70) * 4 : Math.sin(t * 3) * 1.5;
          shake.setAttribute("transform", "translate(" + sx.toFixed(2) + " 0)");
          // broken halves drift / tremble before being fixed
          var by = (t > 5.2 && t < 5.85) ? Math.sin(t * 9) * 5 : 0;
          brk.setAttribute("transform", "translate(0 " + by.toFixed(2) + ")");
          // magnifier bob while sweeping
          gsap.set(magin, { y: Math.sin(t * 6) * 22 });
        }
        ambient(0);
        tl.to({ v: 0 }, { v: 1, duration: D, ease: "none", onUpdate: function () { ambient(this.progress() * D); } }, 0);

        // camera: slow push-in under everything
        tl.fromTo($("cam"), { scale: 1 }, { scale: 1.03, duration: D, ease: "none" }, 0);

        // ---------- Scene 1 : title + magnifier sweep + band ----------
        [0, 1, 2].forEach(function (i) {
          tl.fromTo($("tw-" + i), { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.05 + i * 0.12);
        });

        // panel frames draw in as the search begins
        [0, 1, 2].forEach(function (i) {
          tl.fromTo($("frr-" + i), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 1.15 + i * 0.15);
          tl.fromTo($("ord-" + i), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.35 + i * 0.15);
        });

        // square magnifier sweeps left -> right
        tl.fromTo($("magbody"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.2);
        tl.fromTo($("mag"), { x: 30 }, { x: 1700, duration: 2.7, ease: "none" }, 1.2);
        tl.to($("magbody"), { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.95);

        // a potential problem is found under the lens in each panel
        var WARN_AT = [1.58, 2.58, 3.58];
        [0, 1, 2].forEach(function (i) {
          tl.fromTo($("warn-" + i), { scale: 0, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" }, WARN_AT[i]);
        });

        // "3 ESTRAGOS EVITADOS" band wipes in, warnings count 1-2-3
        tl.fromTo($("band"), { clipPath: CLIP_HIDE }, { clipPath: CLIP_SHOW, duration: 0.5, ease: "power3.out" }, 4.0);
        tl.fromTo($("pip"), { scale: 0 }, { scale: 1, duration: 0.35, ease: "power3.out" }, 4.25);
        [0, 1, 2].forEach(function (i) {
          tl.to($("warn-" + i), { scale: 1.14, duration: 0.15, ease: "power2.out" }, 4.15 + i * 0.16);
          tl.to($("warn-" + i), { scale: 1, duration: 0.25, ease: "power2.inOut" }, 4.3 + i * 0.16);
        });

        // ---------- Scene 2 : dano ao cliente ----------
        tl.to($("warn-0"), { scale: 0, opacity: 0, duration: 0.25, ease: "power2.in" }, 5.1);
        tl.fromTo($("p1"), { scale: 0.5, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 5.2);
        tl.fromTo($("div-0"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 5.2);
        tl.fromTo($("lab-0"), { clipPath: CLIP_HIDE }, { clipPath: CLIP_SHOW, duration: 0.45, ease: "power3.out" }, 5.25);
