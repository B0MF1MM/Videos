    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var D = 10.56;
        var $ = function (id) { return document.getElementById("05-corrente-" + id); };
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["05-corrente"] = tl;

        var CLIP_HIDE = "inset(-30% 100% -15% -4%)";
        var CLIP_SHOW = "inset(-30% -4% -15% -4%)";

        // ---------- ambient (deterministic, driven by timeline time) ----------
        var nut = $("nut"), motion = $("motion"), bar = $("bar"), needle = $("needle"), gauge = $("gauge"), chain = $("chain");
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
        function ambient(t) {
          // CAUSA: square nut unscrews (spins + climbs the shaft)
          var a = t < 3.6 ? 0 : (t - 3.6) * 140;
          var ny = -clamp((t - 3.6) * 7, 0, 26);
          nut.setAttribute("transform", "translate(0 " + ny.toFixed(2) + ") rotate(" + a.toFixed(2) + " 150 90)");
          var mo = t < 3.7 ? 0 : (Math.sin(t * 12) > 0 ? 1 : 0.25);
          motion.setAttribute("opacity", mo);
          // MODO DE FALHA: part trembles under load before it cracks
          var bx = (t > 5.1 && t < 5.65) ? Math.sin(t * 80) * 3 : 0;
          bar.setAttribute("transform", "translate(" + bx.toFixed(2) + " 0)");
          // EFEITO: gauge needle swings to the red zone and jitters there
          var ang;
          if (t < 8.0) ang = -70;
          else if (t < 8.6) { var p = (t - 8.0) / 0.6; p = 1 - Math.pow(1 - p, 3); ang = -70 + 132 * p; }
          else ang = 62 + Math.sin(t * 26) * 5;
          needle.setAttribute("transform", "rotate(" + ang.toFixed(2) + " 150 144)");
          var gx = t > 8.6 ? Math.sin(t * 45) * 2.5 : 0;
          gauge.setAttribute("transform", "translate(" + gx.toFixed(2) + " 0)");
          // whole chain hangs and sways gently once assembled
          var sw = t < 3.6 ? 0 : Math.sin((t - 3.6) * 1.7) * 5;
          gsap.set(chain, { y: sw });
        }
        ambient(0);
        tl.to({ v: 0 }, { v: 1, duration: D, ease: "none", onUpdate: function () { ambient(this.progress() * D); } }, 0);

        // camera: slow push-in under everything
        tl.fromTo($("cam"), { scale: 1 }, { scale: 1.03, duration: D, ease: "none" }, 0);

        // ---------- Scene 1 : title, three empty links, connectors draw, chain pull ----------
        for (var w = 0; w < 4; w++) {
          tl.fromTo($("tw-" + w), { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.05 + w * 0.08);
        }
        var SPREAD = [-50, 0, 50];
        for (var i = 0; i < 3; i++) {
          tl.fromTo($("link-" + i), { scale: 0, opacity: 0, x: SPREAD[i], y: 24 }, { scale: 1, opacity: 1, x: SPREAD[i], y: 0, duration: 0.55, ease: "power3.out" }, 2.0 + i * 0.12);
          // contents hidden until each link's cue
          tl.fromTo($("fill-" + i), { scaleY: 0 }, { scaleY: 0, duration: 0.01 }, 0);
          tl.fromTo($("icon-" + i), { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 0, opacity: 0, duration: 0.01 }, 0);
          tl.fromTo($("lab-" + i), { clipPath: CLIP_HIDE }, { clipPath: CLIP_HIDE, duration: 0.01 }, 0);
          tl.fromTo($("q-" + i), { scale: 0, y: 20 }, { scale: 0, y: 20, duration: 0.01 }, 0);
          tl.fromTo($("stub-" + i), { scaleY: 0 }, { scaleY: 0, duration: 0.01 }, 0);
        }
        tl.fromTo($("conn-0"), { x: -25 }, { x: -25, duration: 0.01 }, 0);
        tl.fromTo($("conn-1"), { x: 25 }, { x: 25, duration: 0.01 }, 0);
        tl.fromTo($("connr-0"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 2.45);
        tl.fromTo($("connr-1"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 2.78);
        // the pull: links yank inward, overshoot, settle
        tl.to($("link-0"), { x: 10, duration: 0.2, ease: "power2.in" }, 3.0);
        tl.to($("link-2"), { x: -10, duration: 0.2, ease: "power2.in" }, 3.0);
        tl.to($("conn-0"), { x: 5, duration: 0.2, ease: "power2.in" }, 3.0);
        tl.to($("conn-1"), { x: -5, duration: 0.2, ease: "power2.in" }, 3.0);
        tl.to([$("link-0"), $("link-2"), $("conn-0"), $("conn-1")], { x: 0, duration: 0.35, ease: "power3.out" }, 3.2);
        tl.to($("link-1"), { scale: 1.05, duration: 0.2, ease: "power2.in" }, 3.0);
        tl.to($("link-1"), { scale: 1, duration: 0.35, ease: "power3.out" }, 3.2);

        // ---------- helper: a link gets filled on its cue ----------
        function fillLink(i, at) {
          tl.to($("fill-" + i), { scaleY: 1, duration: 0.4, ease: "power3.out" }, at);
          tl.to($("link-" + i), { scale: 1.06, duration: 0.18, ease: "power2.out" }, at);
          tl.to($("link-" + i), { scale: 1, duration: 0.4, ease: "power3.out" }, at + 0.18);
          tl.to($("icon-" + i), { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, at + 0.1);
          tl.to($("lab-" + i), { clipPath: CLIP_SHOW, duration: 0.5, ease: "power3.out" }, at + 0.15);
        }
        function popQuestion(i, at) {
          tl.to($("stub-" + i), { scaleY: 1, duration: 0.25, ease: "power2.out" }, at - 0.1);
          tl.to($("q-" + i), { scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, at);
        }

        // ---------- Scene 2 : CAUSA / POR QUÊ? ----------
        fillLink(0, 3.5);
        popQuestion(0, 4.5);

        // ---------- Scene 3 : MODO DE FALHA / O QUÊ? ----------
        fillLink(1, 5.1);
        // the part cracks in two, fragments fall
        tl.fromTo($("half-l"), { x: 0, rotation: 0, svgOrigin: "50 116" }, { x: -14, rotation: -9, svgOrigin: "50 116", duration: 0.4, ease: "power3.out" }, 5.7);
        tl.fromTo($("half-r"), { x: 0, rotation: 0, svgOrigin: "250 116" }, { x: 14, rotation: 9, svgOrigin: "250 116", duration: 0.4, ease: "power3.out" }, 5.7);
        tl.fromTo($("frag-0"), { y: 0, rotation: 0, opacity: 0, transformOrigin: "50% 50%" }, { y: 98, rotation: 90, opacity: 1, duration: 0.5, ease: "power2.in" }, 5.72);
        tl.fromTo($("frag-1"), { y: 0, rotation: 0, opacity: 0, transformOrigin: "50% 50%" }, { y: 110, rotation: -120, opacity: 1, duration: 0.55, ease: "power2.in" }, 5.76);
        tl.fromTo($("frag-2"), { y: 0, rotation: 0, opacity: 0, transformOrigin: "50% 50%" }, { y: 98, rotation: 160, opacity: 1, duration: 0.5, ease: "power2.in" }, 5.8);
        popQuestion(1, 6.4);

        // ---------- Scene 4 : EFEITO / E DAÍ? + direction + pulse ----------
        fillLink(2, 7.8);
        popQuestion(2, 8.9);
        tl.fromTo($("ar-0"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 9.15);
        tl.fromTo($("ah-0"), { scale: 0, opacity: 0, transformOrigin: "50% 100%" }, { scale: 1, opacity: 1, duration: 0.2, ease: "power3.out" }, 9.5);
        tl.fromTo($("ar-1"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 9.45);
        tl.fromTo($("ah-1"), { scale: 0, opacity: 0, transformOrigin: "50% 100%" }, { scale: 1, opacity: 1, duration: 0.2, ease: "power3.out" }, 9.8);
        // pulse travels CAUSA -> MODO -> EFEITO
        tl.fromTo($("pulse"), { x: 0, scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { x: 0, scale: 1, opacity: 1, duration: 0.15, ease: "power3.out" }, 9.5);
        tl.to($("pulse"), { x: 1160, duration: 0.55, ease: "none" }, 9.6);
        var HIT = [9.6, 9.875, 10.15];
        for (var k = 0; k < 3; k++) {
          tl.to($("link-" + k), { scale: 1.07, duration: 0.12, ease: "power2.out" }, HIT[k]);
          tl.to($("link-" + k), { scale: 1, duration: 0.28, ease: "power3.out" }, HIT[k] + 0.12);
          tl.to($("q-" + k), { y: -14, duration: 0.12, ease: "power2.out" }, HIT[k]);
          tl.to($("q-" + k), { y: 0, duration: 0.28, ease: "power3.out" }, HIT[k] + 0.12);
        }
      })();
    </script>
