    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var D = 8.555;
        var $ = function (id) { return document.getElementById("14-ciclo-" + id); };
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["14-ciclo"] = tl;

        var CLIP_HIDE = "inset(-30% 100% -15% -4%)";
        var CLIP_SHOW = "inset(-30% -4% -15% -4%)";
        var FILL_HIDE = "inset(0% 100% 0% 0%)";
        var FILL_SHOW = "inset(0% 0% 0% 0%)";

        // block centers (300 x 170)
        var C = [[960, 300], [1440, 480], [1250, 760], [670, 760], [480, 480]];
        var HW = 150 + 18, HH = 85 + 18;
        var LIGHT = [1.9, 3.0, 4.3, 5.8, 6.2];

        // build ring arrows i -> i+1 (clipped to block edges, chevron head)
        function arrowD(a, b) {
          var dx = b[0] - a[0], dy = b[1] - a[1];
          var t = Math.min(HW / Math.abs(dx || 1e-6), HH / Math.abs(dy || 1e-6));
          var sx = a[0] + dx * t, sy = a[1] + dy * t;
          var ex = b[0] - dx * t, ey = b[1] - dy * t;
          var L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L;
          var h1x = ex - ux * 20 - uy * 13, h1y = ey - uy * 20 + ux * 13;
          var h2x = ex - ux * 20 + uy * 13, h2y = ey - uy * 20 - ux * 13;
          var f = function (n) { return n.toFixed(1); };
          return "M " + f(sx) + " " + f(sy) + " L " + f(ex) + " " + f(ey) +
                 " M " + f(h1x) + " " + f(h1y) + " L " + f(ex) + " " + f(ey) + " L " + f(h2x) + " " + f(h2y);
        }
        for (var i = 0; i < 5; i++) $("a" + i).setAttribute("d", arrowD(C[i], C[(i + 1) % 5]));

        // measure every drawn stroke
        var drawIds = ["a0", "a1", "a2", "a3", "a4", "t0", "t1", "t2", "t3", "tloop", "l-l0", "l-l1", "l-l2", "r-loop"];
        var LEN = {};
        drawIds.forEach(function (id) {
          var p = $(id), len = Math.ceil(p.getTotalLength() * 1.05) + 2;
          LEN[id] = len;
          p.style.strokeDasharray = len + " " + len;
        });
        function draw(id, at, dur, ease) {
          tl.fromTo($(id), { strokeDashoffset: LEN[id] }, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" }, at);
        }
        // pre-hide all strokes at t=0
        drawIds.forEach(function (id) { tl.set($(id), { strokeDashoffset: LEN[id] }, 0); });

        // ---------- camera: slow push across the shot ----------
        tl.fromTo($("cam"), { scale: 0.965 }, { scale: 1.0, duration: 7.1, ease: "sine.inOut" }, 0);
        tl.to($("cam"), { scale: 1.02, duration: 1.3, ease: "power2.out" }, 7.15);

        // ---------- Scene 1: title + five outlined squares ----------
        tl.fromTo($("title"), { clipPath: CLIP_HIDE, y: 14 }, { clipPath: CLIP_SHOW, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);
        for (var b = 0; b < 5; b++) {
          tl.fromTo($("b" + b), { scale: 0, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.15 + b * 0.08);
          tl.fromTo($("b" + b + "-fill"), { clipPath: FILL_HIDE }, { clipPath: FILL_HIDE, duration: 0.01 }, 0);
          tl.fromTo($("b" + b + "-lit"), { scale: 0.5, opacity: 0 }, { scale: 0.5, opacity: 0, duration: 0.01 }, 0);
        }
        // empty slots of the trail
        for (var s = 0; s < 5; s++) {
          tl.fromTo($("slot-" + s), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.9 + s * 0.07);
          tl.fromTo($("let-" + s), { opacity: 0, scale: 0, y: 20 }, { opacity: 0, scale: 0, y: 20, duration: 0.01 }, 0);
        }
        // waiting beat: the first square breathes, inviting the first verb
        tl.fromTo($("b0"), { scale: 1 }, { scale: 1.04, duration: 0.35, ease: "sine.inOut", immediateRender: false }, 1.3);
        tl.to($("b0"), { scale: 1, duration: 0.3, ease: "sine.inOut" }, 1.65);

        // ---------- Scene 2: each block lights on its verb ----------
        function light(k, at) {
          tl.to($("b" + k + "-fill"), { clipPath: FILL_SHOW, duration: 0.32, ease: "power2.inOut" }, at);
          tl.set($("b" + k + "-idx"), { opacity: 0 }, at + 0.32);
          tl.to($("b" + k + "-lit"), { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, at + 0.18);
          tl.fromTo($("b" + k), { scale: 1 }, { scale: 1.07, duration: 0.14, ease: "power2.out", immediateRender: false }, at);
          tl.to($("b" + k), { scale: 1, duration: 0.4, ease: "power3.out" }, at + 0.14);
          // initial lands in the trail
          tl.to($("let-" + k), { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, at + 0.2);
          if (k > 0) draw("t" + (k - 1), at + 0.05, 0.3);
        }
        // arrow from previous block draws into each block just before it lights
        draw("a0", 2.6, 0.4);
        draw("a1", 3.9, 0.4);
        draw("a2", 5.35, 0.45);
        draw("a3", 5.82, 0.36);
        for (var k = 0; k < 5; k++) light(k, LIGHT[k]);

        // --- icon 0: LISTAR — lines write, a marker walks down the list
        tl.fromTo([$("l-b0"), $("l-b1"), $("l-b2")], { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "power3.out", stagger: 0.12 }, 2.05);
        draw("l-l0", 2.1, 0.3);
        draw("l-l1", 2.25, 0.3);
        draw("l-l2", 2.4, 0.3);
        tl.fromTo($("l-mk"), { opacity: 0, y: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 2.7);
        var rows = [0, 23, 46];
        var mt = 3.1, r = 1;
        while (mt < 8.3) {
          tl.to($("l-mk"), { y: rows[r % 3], duration: 0.25, ease: "power3.inOut" }, mt);
          r++; mt += 0.62;
        }

        // --- icon 1: AVALIAR — three mini-rulers fill to S / O / D levels and keep re-scoring
        var gv = [$("g-v0"), $("g-v1"), $("g-v2")];
        gv.forEach(function (el) { tl.fromTo(el, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 0, duration: 0.01 }, 0); });
        var levels = [[0.8, 0.5, 0.3], [0.6, 0.9, 0.4], [0.9, 0.4, 0.7], [0.7, 0.7, 0.2], [0.8, 0.5, 0.3]];
        var gt = 3.2;
        levels.forEach(function (lv, li) {
          gv.forEach(function (el, gi) {
            tl.to(el, { scaleY: lv[gi], duration: 0.45, ease: "power3.out" }, gt + gi * 0.1);
          });
          gt += li === 0 ? 1.1 : 0.95;
        });

        // --- icon 2: PRIORIZAR — podium rises, the top square drops on the winner
        tl.fromTo($("p-c1"), { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 4.5);
        tl.fromTo($("p-c2"), { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 4.58);
        tl.fromTo($("p-c0"), { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 4.66);
        tl.fromTo($("p-top"), { y: -40, opacity: 0 }, { y: 6, opacity: 1, duration: 0.35, ease: "power2.in" }, 5.05);
        tl.to($("p-top"), { y: 0, duration: 0.3, ease: "power3.out" }, 5.4);
        var pt = 5.95;
        while (pt < 8.2) {
          tl.to($("p-top"), { y: -10, duration: 0.18, ease: "power2.out" }, pt);
          tl.to($("p-top"), { y: 0, duration: 0.22, ease: "power2.in" }, pt + 0.18);
          pt += 0.7;
        }

        // --- icon 3: AGIR — the square wrench turns the square bolt
        tl.fromTo($("w-tool"), { rotation: -40, svgOrigin: "76 35" }, { rotation: -40, svgOrigin: "76 35", duration: 0.01 }, 0);
        tl.fromTo($("w-bolt"), { rotation: 0, svgOrigin: "76 35" }, { rotation: 0, svgOrigin: "76 35", duration: 0.01 }, 0);
        var wt = 6.0, rot = -40, brot = 0;
        while (wt < 8.3) {
          rot += 45; brot += 45;
          tl.to($("w-tool"), { rotation: rot, duration: 0.3, ease: "power2.inOut" }, wt);
          tl.to($("w-bolt"), { rotation: brot, duration: 0.3, ease: "power2.inOut" }, wt);
          rot -= 45;
          tl.to($("w-tool"), { rotation: rot, duration: 0.22, ease: "power2.inOut" }, wt + 0.34);
          wt += 0.62;
        }

        // --- icon 4: REAVALIAR — square loop arrow draws, then turns in quarter steps
        draw("r-loop", 6.3, 0.5, "none");
        tl.fromTo($("r-g"), { rotation: 0, svgOrigin: "50 35" }, { rotation: 0, svgOrigin: "50 35", duration: 0.01 }, 0);
        tl.to($("r-g"), { rotation: 90, duration: 0.35, ease: "power3.inOut" }, 6.95);
        tl.to($("r-g"), { rotation: 180, duration: 0.35, ease: "power3.inOut" }, 7.55);
        tl.to($("r-g"), { rotation: 270, duration: 0.35, ease: "power3.inOut" }, 8.1);

        // ---------- Scene 3: "o ciclo recomeça" — close the ring, pulse runs once ----------
        draw("a4", 7.2, 0.4);
        draw("tloop", 7.2, 0.55, "power2.inOut");

        var P = $("pulse");
        var PH = 17;
        tl.fromTo(P, { x: C[0][0] - PH, y: C[0][1] - PH, scale: 0, opacity: 0 }, { scale: 0, opacity: 0, duration: 0.01 }, 0);
        tl.to(P, { scale: 1, opacity: 1, duration: 0.15, ease: "power3.out" }, 7.42);
        var seq = [1, 2, 3, 4, 0];
        var st = 7.5, SEG = 0.17;
        seq.forEach(function (bi, n) {
          var at = st + n * SEG;
          tl.to(P, { x: C[bi][0] - PH, y: C[bi][1] - PH, duration: SEG, ease: "none" }, at);
          // each block and its initial kick as the pulse arrives
          tl.fromTo($("b" + bi), { scale: 1 }, { scale: 1.06, duration: 0.08, ease: "power2.out", immediateRender: false }, at + SEG - 0.02);
          tl.to($("b" + bi), { scale: 1, duration: 0.28, ease: "power3.out" }, at + SEG + 0.06);
          tl.fromTo($("let-" + bi), { y: 0 }, { y: -14, duration: 0.08, ease: "power2.out", immediateRender: false }, at + SEG - 0.02);
          tl.to($("let-" + bi), { y: 0, duration: 0.28, ease: "power3.out" }, at + SEG + 0.06);
        });
        // pulse sinks into LISTAR: the cycle starts again, then hold
        tl.to(P, { scale: 0, duration: 0.12, ease: "power2.in" }, st + 5 * SEG + 0.02);
      })();
    </script>
  </div>
</template>
