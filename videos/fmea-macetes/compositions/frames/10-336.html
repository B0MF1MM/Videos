    <script>
      (function () {
        var D = 9.6;
        var $ = function (id) { return document.getElementById("10-336-" + id); };
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["10-336"] = tl;

        var CLIP_HIDE = "inset(-30% 100% -15% -4%)";
        var CLIP_SHOW = "inset(-30% -4% -15% -4%)";
        function e3(p) { return 1 - Math.pow(1 - p, 3); }
        function cl(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

        // ---------- timing (voiceover cues) ----------
        var FLIP = { s: 1.9, o: 3.0, d: 3.9 };
        var VAL = { s: 8, o: 7, d: 6 };
        var T_S1 = 4.4, T_C1 = 4.85, C1_DUR = 0.75;     // 8 × 7 → 56
        var T_S2 = 6.5;                                   // × 6
        var T_MINI = 6.95;
        var T_C2 = 7.45, C2_DUR = 1.2;                    // 336 counts, ~323 at 8.2

        // ---------- build: meters ----------
        var meters = {};
        ["s", "o", "d"].forEach(function (k) {
          var me = $("me-" + k), arr = [];
          for (var i = 0; i < 10; i++) {
            var c = document.createElement("div");
            c.id = "10-336-mc-" + k + "-" + i;
            c.className = "10-336-mc";
            c.style.left = (i * 22) + "px";
            var on = document.createElement("div");
            on.id = "10-336-mo-" + k + "-" + i;
            on.className = "10-336-mon";
            c.appendChild(on);
            me.appendChild(c);
            arr.push(on);
          }
          meters[k] = arr;
        });

        // ---------- build: 8 × 7 grid (56 cells) ----------
        var g1 = $("grid1"), g1on = [];
        for (var r = 0; r < 7; r++) {
          for (var c8 = 0; c8 < 8; c8++) {
            var cell = document.createElement("div");
            cell.id = "10-336-g1-" + r + "-" + c8;
            cell.className = "10-336-c1";
            cell.style.left = (c8 * 17) + "px";
            cell.style.top = (r * 17) + "px";
            var on1 = document.createElement("div");
            on1.id = "10-336-g1on-" + r + "-" + c8;
            on1.className = "10-336-c1on";
            cell.appendChild(on1);
            g1.appendChild(cell);
            g1on.push(on1);
          }
        }

        // ---------- build: six mini-grids of 56 = 336 cells ----------
        var minis = $("minis"), miniEls = [];
        for (var m = 0; m < 6; m++) {
          var mg = document.createElement("div");
          mg.id = "10-336-mini-" + m;
          mg.className = "10-336-mini";
          mg.style.left = (740 + m * 62) + "px";
          for (var rr = 0; rr < 7; rr++) {
            for (var cc = 0; cc < 8; cc++) {
              var c2 = document.createElement("div");
              c2.id = "10-336-c2-" + m + "-" + rr + "-" + cc;
              c2.className = "10-336-c2";
              c2.style.left = (cc * 7) + "px";
              c2.style.top = (rr * 7) + "px";
              mg.appendChild(c2);
            }
          }
          minis.appendChild(mg);
          miniEls.push(mg);
        }

        // ---------- ambient: deterministic, timeline-driven ----------
        var drop = $("pdrop"), pud = $("ppud"), imp = $("pimp");
        var nums = [$("n-s"), $("n-o"), $("n-d")];
        var b1r = $("b1-r"), heroNum = $("heronum"), heroIn = $("heroin");
        var ar1h = $("ar1h"), ar2h = $("ar2h");
        function ambient(t) {
          // pump: impeller spins, seal drips, puddle grows
          imp.style.transform = "rotate(" + (t * 270).toFixed(1) + "deg)";
          var ph = (t % 0.8) / 0.8;
          drop.style.transform = "translateY(" + (ph * ph * 34).toFixed(2) + "px) scaleY(" + (1 + ph * 0.4).toFixed(2) + ")";
          drop.style.opacity = ph < 0.92 ? "1" : "0";
          pud.style.transform = "scaleX(" + (0.5 + 0.5 * cl(t / D) + 0.06 * Math.max(0, Math.sin(t * 7.85))).toFixed(3) + ")";

          // flipped numbers idle-bob
          var ks = ["s", "o", "d"];
          for (var j = 0; j < 3; j++) {
            var a = cl((t - FLIP[ks[j]] - 0.55) / 0.5);
            nums[j].style.translate = "0px " + (Math.sin(t * 3 + j * 1.4) * 5 * a).toFixed(2) + "px";
            // meters fill to the value, one cell per beat
            var arr = meters[ks[j]];
            for (var i = 0; i < 10; i++) {
              var st = FLIP[ks[j]] + 0.25 + i * 0.045;
              var s = i < VAL[ks[j]] ? e3(cl((t - st) / 0.16)) : 0;
              arr[i].style.transform = "scale(" + s.toFixed(3) + ")";
            }
          }

          // 56 count + grid lit cell by cell, in lockstep
          var v1 = Math.round(56 * e3(cl((t - T_C1) / C1_DUR)));
          b1r.textContent = String(v1);
          for (var g = 0; g < g1on.length; g++) g1on[g].style.transform = g < v1 ? "scale(1)" : "scale(0)";

          // six slabs of 56 stamp in
          for (var q = 0; q < 6; q++) {
            var sq = e3(cl((t - (T_MINI + q * 0.1)) / 0.22));
            var wob = t > 8.3 ? 0.06 * Math.max(0, Math.sin((t - 8.3) * 6 - q * 0.7)) : 0;
            miniEls[q].style.transform = "scale(" + (sq * (1 + wob)).toFixed(3) + ")";
            miniEls[q].style.opacity = sq > 0 ? "1" : "0";
          }

          // 336 count
          var v2 = Math.round(336 * e3(cl((t - T_C2) / C2_DUR)));
          heroNum.textContent = String(v2);

          // hero breathe after landing
          var br = t > 8.9 ? 1 + 0.008 * Math.sin((t - 8.9) * 4) : 1;
          heroIn.style.scale = br.toFixed(4);

          // arrow heads nudge forward
          ar1h.style.translate = (t > 6.9 ? 4 * Math.max(0, Math.sin((t - 6.9) * 6)) : 0).toFixed(2) + "px 0px";
          ar2h.style.translate = (t > 7.7 ? 4 * Math.max(0, Math.sin((t - 7.7) * 6)) : 0).toFixed(2) + "px 0px";
        }
        ambient(0);
        tl.to({ v: 0 }, { v: 1, duration: D, ease: "none", onUpdate: function () { ambient(this.progress() * D); } }, 0);

        // ---------- camera: slow drift, then a push toward the hero ----------
        tl.fromTo($("cam"), { scale: 1 }, { scale: 1.015, duration: 8.1, ease: "none" }, 0);
        tl.to($("cam"), { scale: 1.07, duration: 1.5, ease: "power2.out" }, 8.1);

        // ---------- initial hidden states ----------
        tl.fromTo([$("n-s"), $("n-o"), $("n-d")], { opacity: 0, scaleY: 0 }, { opacity: 0, scaleY: 0, duration: 0.01 }, 0);
        tl.fromTo([$("lab-s"), $("lab-o"), $("lab-d")], { opacity: 0, y: 20 }, { opacity: 0, y: 20, duration: 0.01 }, 0);
        tl.fromTo([$("br1"), $("br2")], { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
        tl.fromTo([$("box1"), $("box2")], { clipPath: CLIP_HIDE }, { clipPath: CLIP_HIDE, duration: 0.01 }, 0);
        tl.fromTo([$("b1-8"), $("b1-7"), $("b1-x"), $("b1-eq"), $("b1-r"), $("b2-56"), $("b2-6"), $("b2-x"), $("b2-eq")], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        tl.fromTo([$("ar1"), $("ar2")], { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
        tl.fromTo([$("ar1h"), $("ar2h")], { scale: 0 }, { scale: 0, duration: 0.01 }, 0);
        tl.fromTo([$("step1"), $("step2"), $("grid1")], { opacity: 0, y: 16 }, { opacity: 0, y: 16, duration: 0.01 }, 0);
        tl.fromTo($("hero"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 100% 0% 0%)", duration: 0.01 }, 0);
        tl.fromTo($("heronum"), { scale: 0.5 }, { scale: 0.5, duration: 0.01 }, 0);
        tl.fromTo($("heroul"), { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);

        // ---------- Scene 1 (0.0–4.4): formula settles, letters flip to numbers ----------
        var TOKS = ["t-npr", "t-eq", "t-s", "op1", "t-o", "op2", "t-d"];
        TOKS.forEach(function (id, i) {
