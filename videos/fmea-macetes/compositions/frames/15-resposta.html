        tl.to($("paper"), { y: 6, duration: 0.08, ease: "power2.out" }, T_STAMP + 0.32);
        tl.to($("paper"), { y: 0, duration: 0.3, ease: "power3.out" }, T_STAMP + 0.4);
        tl.to($("stamp"), { scale: 1.04, duration: 0.6, ease: "sine.inOut" }, T_STAMP + 0.8);

        // ---------- pen: one seek-safe driver ----------
        var pen = $("pen");
        var segs = STROKES.map(function (s) {
          var y = s[4] + 36;
          return { t0: s[1], t1: s[2], x0: X0 + 2, x1: X0 + s[3] * CHAR, y: y };
        });
        var REST = { x: 1600, y: 800 };
        function penAt(t) {
          // entry from off-canvas right
          if (t < segs[0].t0) {
            var p0 = e3(cl((t - 0.9) / (segs[0].t0 - 0.9)));
            return { x: lerp(2080, segs[0].x0, p0), y: lerp(420, segs[0].y, p0) - Math.sin(p0 * Math.PI) * 40 };
          }
          for (var i = 0; i < segs.length; i++) {
            var s = segs[i];
            if (t >= s.t0 && t <= s.t1) {
              var p = (t - s.t0) / (s.t1 - s.t0);
              return { x: lerp(s.x0, s.x1, p), y: s.y + Math.sin((t - s.t0) * 38) * 5 - Math.abs(Math.sin((t - s.t0) * 11)) * 4 };
            }
            var n = segs[i + 1];
            if (t > s.t1 && (!n || t < n.t0)) {
              var target = n ? { x: n.x0, y: n.y } : REST;
              var gap = n ? (n.t0 - s.t1) : 0.6;
              var mv = Math.min(gap, 0.5);
              var startMove = n ? (n.t0 - mv) : s.t1;
              var q = e3(cl((t - startMove) / mv));
              var lift = Math.sin(q * Math.PI) * 26;
              var hx = lerp(s.x1, target.x, q);
              var hy = lerp(s.y, target.y, q) - lift;
              if (!n && q >= 1) {
                hy = REST.y + Math.sin((t - s.t1) * 2.2) * 6;
                hx = REST.x;
              }
              return { x: hx, y: hy };
            }
          }
          return REST;
        }
        var drv = { t: 0 };
        tl.to(drv, {
          t: D, duration: D, ease: "none",
          onUpdate: function () {
            var p = penAt(drv.t);
            gsap.set(pen, { x: p.x, y: p.y });
          }
        }, 0);
        gsap.set(pen, { x: 2080, y: 420 });
      })();
    </script>
  </div>
</template>
