    <script>
      (function () {
        var D = 11.349;
        var $ = function (id) { return document.getElementById("08-pegadinha-" + id); };
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["08-pegadinha"] = tl;

        var CLIP_HIDE = "inset(-30% 100% -15% -4%)";
        var CLIP_SHOW = "inset(-30% -4% -15% -4%)";
        var CLIP_HIDE_R = "inset(-30% -4% -15% 100%)";

        // build ruler cells 1..10
        var ruler = $("ruler"), cells = [];
        for (var i = 0; i < 10; i++) {
          var c = document.createElement("div");
          c.id = "08-pegadinha-cell-" + (i + 1);
          c.className = "08-pegadinha-cell" + (i === 9 ? " 08-pegadinha-cell-hot" : "");
          c.style.left = (i * 152) + "px";
          c.textContent = String(i + 1);
          ruler.appendChild(c);
          cells.push(c);
        }

        // ---------- ambient, deterministic (driven by timeline time) ----------
        var signIn = $("sign-in"), signBang = $("sign-bang");
        var lamp = $("lamp"), wIn = $("wave-in"), wOut = $("wave-out");
        var failL = $("fail-l-in"), failR = $("fail-r-in");
        var arrowLine = $("arrow-line"), bangIn = $("bang-in"), clientIn = $("client-in");
        var A_AT = 4.05, CAUGHT = 4.6, HID = 7.0, BANG = 7.75;
        function ambient(t) {
          // warning sign wobbles, its "!" blinks
          var amp = t < 3.9 ? 7 : 2.5;
          signIn.setAttribute("transform", "rotate(" + (Math.sin(t * 8) * amp).toFixed(2) + " 48 48)");
          signBang.setAttribute("opacity", (t > 0.4 && t < 3.9) ? (Math.floor(t * 4) % 2 === 0 ? 1 : 0.15) : 1);

          // alarm: lamp flashes, straight-line waves pulse in/out
          if (t >= A_AT) {
            var on = Math.floor((t - A_AT) / 0.18) % 2 === 0;
            lamp.style.fill = on ? "#1F2BE0" : "#F0EBDE";
            var p = ((t - A_AT) % 0.54) / 0.54;
            wIn.setAttribute("opacity", p < 0.62 ? 1 : 0);
            wOut.setAttribute("opacity", p > 0.31 ? 1 : 0);
          } else {
            lamp.style.fill = "#F0EBDE";
            wIn.setAttribute("opacity", 0);
            wOut.setAttribute("opacity", 0);
          }

          // caught failure trembles inside the brackets
          var fx = t >= CAUGHT ? Math.sin(t * 44) * 3 : 0;
          failL.setAttribute("transform", "translate(" + fx.toFixed(2) + " 0)");

          // hidden failure peeks over the wall (only the tip shows)
          var px = 0, py = 0;
          if (t >= HID) { px = Math.sin((t - HID) * 2.4) * 8; py = Math.sin((t - HID) * 5.2) * 5; }
          failR.setAttribute("transform", "translate(" + px.toFixed(2) + " " + py.toFixed(2) + ")");

          // arrow dashes march toward the client
          arrowLine.setAttribute("stroke-dashoffset", (-(Math.max(0, t - 6.9)) * 70).toFixed(2));

          // client: "!" and body hop
          var hop = t >= BANG + 0.3 ? -Math.abs(Math.sin((t - BANG - 0.3) * 6.5)) : 0;
          bangIn.setAttribute("transform", "translate(0 " + (hop * 10).toFixed(2) + ")");
          clientIn.setAttribute("transform", "translate(0 " + (hop * 5).toFixed(2) + ")");
        }
        ambient(0);
        tl.to({ v: 0 }, { v: 1, duration: D, ease: "none", onUpdate: function () { ambient(this.progress() * D); } }, 0);

        // camera: slow push-in under everything
        tl.fromTo($("cam"), { scale: 1 }, { scale: 1.03, duration: D, ease: "none" }, 0);

        // ---------- Scene 1 (0.0–3.9): PEGADINHA + ruler 1..10 ----------
        tl.fromTo($("sign"), { scale: 0, rotation: -25, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, duration: 0.5, ease: "power3.out" }, 0.1);
        tl.fromTo($("banner"), { clipPath: CLIP_HIDE }, { clipPath: CLIP_SHOW, duration: 0.55, ease: "expo.out" }, 0.4);
        tl.to($("banner"), { x: 10, duration: 0.06, ease: "power2.out" }, 1.0);
        tl.to($("banner"), { x: -8, duration: 0.08, ease: "power2.inOut" }, 1.06);
        tl.to($("banner"), { x: 0, duration: 0.2, ease: "power3.out" }, 1.14);

        tl.fromTo($("rbase"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 2.6);
        for (var k = 0; k < 10; k++) {
          var at = 2.65 + k * 0.05;
          if (k < 9) {
            tl.fromTo(cells[k], { scale: 0, opacity: 0, y: 24 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at);
          } else {
            // the 10: inverted block lands last, heavier
            tl.fromTo(cells[k], { scale: 0, y: -40 }, { scale: 1, y: 0, duration: 0.5, ease: "power4.out" }, at + 0.15);
            tl.to(cells[k], { scale: 1.18, duration: 0.14, ease: "power2.out" }, at + 0.7);
            tl.to(cells[k], { scale: 1, duration: 0.35, ease: "power3.out" }, at + 0.84);
          }
        }

        // ---------- Scene 2 (3.9–5.8): nota 1 — falha + alarme, PEGA NA HORA ----------
        tl.fromTo($("mk1"), { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 3.9);
        tl.to(cells[0], { scale: 1.16, duration: 0.14, ease: "power2.out" }, 3.9);
        tl.to(cells[0], { scale: 1, duration: 0.35, ease: "power3.out" }, 4.04);
