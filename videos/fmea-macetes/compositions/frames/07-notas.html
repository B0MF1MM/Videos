    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var D = 10.432;
        var $ = function (id) { return document.getElementById("07-notas-" + id); };
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["07-notas"] = tl;

        var CLIP_HIDE = "inset(-30% 100% -15% -4%)";
        var CLIP_SHOW = "inset(-30% -4% -15% -4%)";
        var CELL_H = 38, CELL_GAP = 7, CELLS = 10;

        // build the 10 cells of each ruler (index 0 = bottom = nota 1)
        var on = [[], [], []];
        for (var c = 0; c < 3; c++) {
          var ruler = $("ruler-" + c);
          for (var k = 0; k < CELLS; k++) {
            var cell = document.createElement("div");
            cell.id = "07-notas-cell-" + c + "-" + k;
            cell.className = "07-notas-cell";
            cell.style.top = (472 - 14 - CELL_H - k * (CELL_H + CELL_GAP)) + "px";
            var fill = document.createElement("div");
            fill.id = "07-notas-on-" + c + "-" + k;
            fill.className = "07-notas-on";
            cell.appendChild(fill);
            ruler.appendChild(cell);
            on[c].push(fill);
          }
        }

        // ---------- ambient mini-scenes (deterministic, driven by timeline time) ----------
        var weight = $("weight"), base = $("base"), crack = $("crack"), impact = $("impact");
        var handM = $("hand-m"), handH = $("hand-h");
        var lens = $("lens"), alert = $("alert"), defect = $("defect");
        var S_AT = 3.35, O_AT = 5.25, D_AT = 7.25, D_FIND = 8.1;
        function ease3(p) { return 1 - Math.pow(1 - p, 3); }
        function ambient(t) {
          // SEVERIDADE: a heavy square weight slams the part again and again
          var wy = -26, by = 0, hit = 0;
          if (t >= S_AT) {
            var ph = ((t - S_AT) % 0.9) / 0.9;
            if (ph < 0.22) { var p = ph / 0.22; wy = -26 + 48 * p * p; }
            else if (ph < 0.32) { wy = 22; hit = 1; by = Math.sin((ph - 0.22) / 0.1 * Math.PI * 3) * 4; }
            else { var r = (ph - 0.32) / 0.68; wy = 22 - 48 * ease3(r); }
          }
          weight.setAttribute("transform", "translate(0 " + wy.toFixed(2) + ")");
          base.setAttribute("transform", "translate(" + by.toFixed(2) + " 0)");
          impact.setAttribute("opacity", hit);
          crack.setAttribute("opacity", t >= S_AT + 0.25 ? 1 : 0);

          // OCORRÊNCIA: clock hands race, tally marks pile up
          var spin = t < O_AT ? 0 : (t - O_AT) * 720;
          handM.setAttribute("transform", "rotate(" + spin.toFixed(2) + " 75 88)");
          handH.setAttribute("transform", "rotate(" + (spin / 12).toFixed(2) + " 75 88)");
          var n = t < O_AT ? 0 : Math.min(10, Math.floor((t - O_AT) / 0.28) + 1);
          for (var i = 0; i < 10; i++) $("tl-" + i).setAttribute("opacity", i < n ? 1 : 0);

          // DETECÇÃO: square magnifier sweeps the line, then locks on the defect
          var lx = -100, found = 0;
          if (t >= D_AT && t < D_FIND) {
            lx = Math.sin(((t - D_AT) / (D_FIND - D_AT)) * Math.PI * 2.5 - Math.PI / 2) * 100;
          } else if (t >= D_FIND) {
            var q = Math.min(1, (t - D_FIND) / 0.35);
            var from = Math.sin(Math.PI * 2.5 - Math.PI / 2) * 100;
            lx = from + (0 - from) * ease3(q);
            found = q >= 1 ? 1 : 0;
          }
          lens.setAttribute("transform", "translate(" + lx.toFixed(2) + " 0)");
          alert.setAttribute("opacity", found ? (Math.sin((t - D_FIND) * 14) > -0.4 ? 1 : 0) : 0);
          defect.setAttribute("transform", found ? "translate(0 " + (Math.sin((t - D_FIND) * 22) * 2).toFixed(2) + ")" : "translate(0 0)");
        }
        ambient(0);
        tl.to({ v: 0 }, { v: 1, duration: D, ease: "none", onUpdate: function () { ambient(this.progress() * D); } }, 0);

        // camera: slow push-in under everything
        tl.fromTo($("cam"), { scale: 1 }, { scale: 1.03, duration: D, ease: "none" }, 0);

        // ---------- Scene 1 : title, then three empty rulers "de 1 a 10" ----------
        tl.fromTo($("tw-0"), { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.05);
        tl.fromTo($("tw-1"), { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.15);
        tl.fromTo($("scale"), { clipPath: CLIP_HIDE }, { clipPath: CLIP_SHOW, duration: 0.5, ease: "power3.out" }, 2.0);

        for (var c2 = 0; c2 < 3; c2++) {
          var at = 2.05 + c2 * 0.14;
          tl.fromTo($("ruler-" + c2), { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, at);
          tl.fromTo($("t1-" + c2), { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, at + 0.2);
          tl.fromTo($("t10-" + c2), { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, at + 0.35);
          // a quick 1→10 tick sweep on each empty ruler (reads "de 1 a 10")
          for (var k2 = 0; k2 < CELLS; k2++) {
            tl.fromTo(on[c2][k2], { scaleY: 0 }, { scaleY: 0.25, duration: 0.08, ease: "power2.out" }, at + 0.3 + k2 * 0.035);
            tl.to(on[c2][k2], { scaleY: 0, duration: 0.12, ease: "power2.in" }, at + 0.42 + k2 * 0.035);
          }
          // hidden until each column's cue
          tl.fromTo($("letter-" + c2), { scale: 0, opacity: 0 }, { scale: 0, opacity: 0, duration: 0.01 }, 0);
          tl.fromTo($("name-" + c2), { clipPath: CLIP_HIDE }, { clipPath: CLIP_HIDE, duration: 0.01 }, 0);
          tl.fromTo($("under-" + c2), { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
          tl.fromTo($("icon-" + c2), { scale: 0, opacity: 0, transformOrigin: "50% 100%" }, { scale: 0, opacity: 0, duration: 0.01 }, 0);
          tl.fromTo($("q-" + c2), { scale: 0, y: 20 }, { scale: 0, y: 20, duration: 0.01 }, 0);
        }

        // ---------- helpers ----------
        function revealColumn(c, at) {
          tl.to($("letter-" + c), { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, at);
          tl.to($("name-" + c), { clipPath: CLIP_SHOW, duration: 0.5, ease: "power3.out" }, at + 0.15);
          tl.to($("under-" + c), { scaleX: 1, duration: 0.45, ease: "power3.out" }, at + 0.25);
          tl.to($("icon-" + c), { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, at + 0.3);
          tl.to($("ruler-" + c), { scale: 1.04, duration: 0.18, ease: "power2.out" }, at);
          tl.to($("ruler-" + c), { scale: 1, duration: 0.35, ease: "power3.out" }, at + 0.18);
        }
        // thermometer: fill bottom->top to 10, then drain back down
        function thermo(c, up, down) {
          for (var k = 0; k < CELLS; k++) {
            tl.to(on[c][k], { scaleY: 1, duration: 0.1, ease: "power2.out" }, up + k * 0.075);
            tl.to(on[c][CELLS - 1 - k], { scaleY: 0, duration: 0.1, ease: "power2.in" }, down + k * 0.06);
          }
          tl.to($("t10-" + c), { scale: 1.3, duration: 0.12, ease: "power2.out", transformOrigin: "100% 50%" }, up + 0.7);
          tl.to($("t10-" + c), { scale: 1, duration: 0.3, ease: "power3.out" }, up + 0.82);
        }
        function popQuestion(c, at) {
          tl.to($("q-" + c), { scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, at);
        }

        // ---------- Scene 2 : S / SEVERIDADE / É SÉRIO? ----------
        revealColumn(0, 3.0);
        thermo(0, 3.3, 4.25);
        popQuestion(0, 4.4);

        // ---------- Scene 3 : O / OCORRÊNCIA / OCORRE MUITO? ----------

        // final hold: the three questions nod in sequence, letters bounce with them
