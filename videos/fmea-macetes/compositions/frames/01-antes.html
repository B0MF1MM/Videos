      var tl = gsap.timeline({ paused: true });

      // voiceover cues
      var T_PROC = 2.0, T_FAIL = 2.6, T_FREEZE = 3.1, T_UNDO = 4.6, T_FMEA = 5.6;

      ["a01an-br1", "a01an-br2", "a01an-br3", "a01an-br4"].forEach(function (id) {

        p.style.strokeDashoffset = l;

      // "processo": conveyor wipes in under the gear and runs

      tl.fromTo(rollers, { rotation: 0 }, { rotation: 360, duration: T_FREEZE - T_PROC, ease: "none" }, T_PROC);

      // ---------- Scene 2: crack starts, everything freezes ----------

      tl.fromTo("#a01an-lens", { scale: 1 }, { scale: 1.12, duration: 0.25, ease: "power2.out" }, T_FAIL);

      // freeze: brackets snap around the frozen gear

        tl.to("#" + id, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, T_FREEZE + i * 0.05);
      });
      // ANTES inverted block wipes in
      tl.fromTo("#a01an-block", { clipPath: "inset(0% 100% 0% 0%)", x: 40 }, { clipPath: "inset(-30% -4% -15% -4%)", x: 0, duration: 0.4, ease: "expo.out" }, T_FREEZE + 0.1);
      // square clock slams in, hands swing then stop (paused)
      tl.fromTo("#a01an-clock", { scale: 1.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power4.out" }, T_FREEZE + 0.15);
      tl.fromTo("#a01an-hand-m", { rotation: -200, svgOrigin: "110 110" }, { rotation: 0, svgOrigin: "110 110", duration: 0.5, ease: "power4.out" }, T_FREEZE + 0.15);
      tl.fromTo("#a01an-hand-h", { rotation: -60, svgOrigin: "110 110" }, { rotation: 90, svgOrigin: "110 110", duration: 0.5, ease: "power4.out" }, T_FREEZE + 0.15);
      tl.fromTo("#a01an-pause", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, T_FREEZE + 0.55);

      tl.to([crack, halo], { strokeDashoffset: LEN, duration: 0.6, ease: "power2.inOut" }, T_UNDO);
      tl.to("#a01an-gear", { rotation: 115, duration: 0.6, ease: "power2.inOut" }, T_UNDO);
      tl.to("#a01an-hand-m", { rotation: -360, svgOrigin: "110 110", duration: 0.6, ease: "power2.inOut" }, T_UNDO);
      tl.to("#a01an-hand-h", { rotation: 60, svgOrigin: "110 110", duration: 0.6, ease: "power2.inOut" }, T_UNDO);
      tl.to("#a01an-boxes", { x: 170, duration: 0.6, ease: "power2.inOut" }, T_UNDO);
      tl.to(rollers, { rotation: 250, duration: 0.6, ease: "power2.inOut" }, T_UNDO);
      tl.to("#a01an-lens", { x: -140, y: -80, opacity: 0, duration: 0.4, ease: "power2.in" }, T_UNDO);
