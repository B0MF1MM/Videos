        var strip = $("strip");

        var PUFF_T = [];
        for (var t0 = 1.9; t0 < 7.5; t0 += 0.55) PUFF_T.push(t0);
        for (var p = 0; p < PUFF_T.length; p++) {
          mk(puffs, "04-viagem-ink", "puff-" + p, "left:226px; top:668px; width:16px; height:16px; opacity:0;");
        }
        // belt ticks
        var ticks = $("ticks");
        for (var q = 0; q < 52; q++) mk(ticks, "04-viagem-tick", "tick-" + q, "left:" + (q * 40) + "px;");
        // rollers
        var rollers = $("rollers");
        for (var q2 = 0; q2 < 9; q2++) mk(rollers, "04-viagem-roller", "rol-" + q2, "left:" + (138 + q2 * 120) + "px;");
        // blocks on the line
        var lane = $("lane");
        var BASES = [-360, -160, 40, 240, 440, 640, 840];
        for (var b = 0; b < BASES.length; b++) {
          var blk = mk(lane, "04-viagem-blk", "blk-" + b, "left:" + BASES[b] + "px;");
          var bin = mk(blk, "04-viagem-blkin", "bin-" + b, "");
          mk(bin, "04-viagem-blkf", "bf-" + b, "");
        }
        // table rows
        var trows = $("trows");
        var BARW = [[300, 210], [250, 280], [320, 170], [230, 260]];
        for (var tr = 0; tr < 4; tr++) {
          var row = mk(trows, "04-viagem-trow", "tr-" + tr, "top:" + (140 + tr * 132) + "px;");
          var num = mk(row, "04-viagem-tnum", "tn-" + tr, "");
          num.textContent = "0" + (tr + 1);
          mk(row, "04-viagem-tbarbg", "tbg1-" + tr, "top:42px; width:" + BARW[tr][0] + "px;");
          mk(row, "04-viagem-tbarbg", "tbg2-" + tr, "top:76px; width:" + BARW[tr][1] + "px;");
          mk(row, "04-viagem-tbar", "tb1-" + tr, "top:42px; width:" + BARW[tr][0] + "px;");
          mk(row, "04-viagem-tbar", "tb2-" + tr, "top:76px; width:" + BARW[tr][1] + "px;");
          var sq = mk(row, "04-viagem-tsq", "ts-" + tr, "");
          mk(sq, "04-viagem-tsqf", "tsf-" + tr, "");
          mk(row, "04-viagem-tdiv", "td-" + tr, "");
        }

        // ---------- initial states ----------
        gsap.set($("sb"), { opacity: 0 });
        gsap.set($("table"), { opacity: 0 });
        gsap.set($("mag"), { x: 1150, y: 200, opacity: 0, scale: 0 });

        // ================= SCENE 1 (0.0-2.9): road draws, car arrives =================
        tl.fromTo($("cam"), { scale: 1 }, { scale: 1.04, duration: 7.6, ease: "none" }, 0);

        tl.fromTo($("rd-top"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.05);
        tl.fromTo($("rd-bot"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.2);
        for (var i2 = 0; i2 < NDASH; i2++) {
          tl.fromTo($("dash-" + i2), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 0.35 + i2 * 0.06);
        }
        tl.fromTo($("strip"), { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 0.6);
        tl.fromTo($("largada"), { clipPath: "inset(-30% 100% -15% -4%)" }, { clipPath: "inset(-30% -4% -15% -4%)", duration: 0.5, ease: "power3.out" }, 0.9);

        // car drives in and stops at LARGADA
        tl.fromTo($("car"), { x: -700 }, { x: 0, duration: 1.45, ease: "power3.out" }, 0.15);
        tl.fromTo([$("wheel-r"), $("wheel-f")], { rotation: -900 }, { rotation: 0, duration: 1.45, ease: "power3.out" }, 0.15);
        tl.fromTo($("carrock"), { rotation: 0 }, { rotation: 1.6, duration: 0.18, ease: "power2.out" }, 1.45);
        tl.to($("carrock"), { rotation: 0, duration: 0.4, ease: "power3.out" }, 1.63);
        // headlight blink on arrival
        tl.set($("light"), { opacity: 0 }, 1.7); tl.set($("light"), { opacity: 1 }, 1.82);
        tl.set($("light"), { opacity: 0 }, 1.94); tl.set($("light"), { opacity: 1 }, 2.06);

        tl.fromTo($("tagpip"), { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: "power3.out" }, 1.6);
        tl.fromTo($("tagtxt"), { clipPath: "inset(-30% 100% -15% -4%)" }, { clipPath: "inset(-30% -4% -15% -4%)", duration: 0.6, ease: "power3.out" }, 1.7);

        // idle: engine shiver + exhaust puffs while the car waits
        var flip = 1;
        for (var it = 1.9; it < 7.5; it += 0.14) {
          tl.to($("caridle"), { y: flip * 1.6, duration: 0.07, ease: "sine.inOut" }, it);
          flip = -flip;
        }
        for (var p2 = 0; p2 < PUFF_T.length; p2++) {
          tl.fromTo($("puff-" + p2),
            { x: 0, y: 0, scale: 0.6, opacity: 1 },
            { x: -90, y: -34, scale: 2, opacity: 0, duration: 0.9, ease: "power1.out" }, PUFF_T[p2]);
        }

        // ================= SCENE 2 (2.9-5.0): clipboard + checks =================
        tl.fromTo($("board"), { x: 720, rotation: 4 }, { x: 0, rotation: 0, duration: 0.55, ease: "power3.out" }, 2.9);
        for (var rr = 0; rr < 3; rr++) {
          tl.fromTo($("row-" + rr), { scale: 0, opacity: 0, y: 24 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.0 + rr * 0.07);
        }
        var CK = [3.4, 3.8, 4.4];
        for (var c2 = 0; c2 < 3; c2++) {
          tl.fromTo($("ck-" + c2), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, CK[c2]);
          tl.fromTo($("cb-" + c2), { scale: 1.18 }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, CK[c2]);
          tl.fromTo($("rl-" + c2), { x: 14 }, { x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, CK[c2]);
        }

        // magnifier flies to the front tyre (PNEU 3.4)
        tl.fromTo($("mag"), { x: 1150, y: 200, opacity: 0, scale: 0 }, { x: 487, y: 627, opacity: 1, scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 3.05);
        for (var f = 0; f < 4; f++) {
          tl.set($("ring-f"), { opacity: 1 }, 3.4 + f * 0.12);
          tl.set($("ring-f"), { opacity: 0 }, 3.46 + f * 0.12);
          tl.set($("wheel-f"), { opacity: 0.25 }, 3.4 + f * 0.12);
          tl.set($("wheel-f"), { opacity: 1 }, 3.46 + f * 0.12);
        }
        tl.set($("ring-f"), { opacity: 1 }, 3.9);
        // FREIO 3.8: magnifier to rear wheel, brake pad clamps, car dips
        tl.to($("mag"), { x: 263, y: 627, duration: 0.3, ease: "power3.inOut" }, 3.52);
        tl.fromTo($("pad"), { x: 20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.18, ease: "power3.out" }, 3.8);
        tl.fromTo($("ring-r"), { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 3.8);
        tl.to($("carrock"), { rotation: 1.4, duration: 0.12, ease: "power2.out" }, 3.8);
        tl.to($("carrock"), { rotation: 0, duration: 0.35, ease: "power3.out" }, 3.92);
        // OLEO 4.4: magnifier to hood, dipstick rises, square drop climbs
        tl.to($("mag"), { x: 489, y: 470, duration: 0.3, ease: "power3.inOut" }, 4.0);
        tl.fromTo($("stick"), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power3.out" }, 4.1);
        tl.fromTo($("drop"), { y: 0, opacity: 0 }, { y: -78, opacity: 1, duration: 0.4, ease: "power2.out" }, 4.25);
        tl.fromTo($("drop"), { scale: 1 }, { scale: 1.35, duration: 0.15, ease: "power2.out", immediateRender: false }, 4.65);
        tl.to($("drop"), { scale: 1, duration: 0.2, ease: "power2.in" }, 4.8);
        tl.to($("stick"), { scaleY: 0, duration: 0.3, ease: "power2.in" }, 5.05);
        tl.to($("drop"), { y: 0, opacity: 0, duration: 0.3, ease: "power2.in" }, 5.05);

        // ================= SCENE 3 (5.0-7.4): hazards ahead, car waits =================
        tl.fromTo($("sign-a"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 5.5);
        tl.fromTo($("sign-b"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 5.68);
        tl.fromTo($("hole"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 5.6);
        tl.fromTo($("rainbox"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 5.75);
        tl.fromTo($("rain"), { y: -350 }, { y: 0, duration: 0.9, ease: "none" }, 5.75);
        tl.fromTo($("rain"), { y: -350 }, { y: 0, duration: 0.9, ease: "none", immediateRender: false }, 6.65);
        tl.fromTo($("rain"), { y: -350 }, { y: 0, duration: 0.9, ease: "none", immediateRender: false }, 7.55);
        // magnifier scouts the road ahead
        tl.to($("mag"), { x: 750, y: 380, duration: 0.4, ease: "power3.inOut" }, 5.35);
        tl.to($("mag"), { x: 992, y: 380, duration: 0.4, ease: "power3.inOut" }, 6.3);
        // signs wobble as they are inspected
        tl.fromTo($("plate-a"), { rotation: -3 }, { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 5.8);
        tl.fromTo($("plate-b"), { rotation: 3 }, { rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 6.7);
        // car inches forward then holds back
        tl.to($("car"), { x: -14, duration: 0.25, ease: "power2.out" }, 6.0);
        tl.to($("car"), { x: 0, duration: 0.35, ease: "power3.out" }, 6.25);
        tl.set($("light"), { opacity: 0 }, 6.9); tl.set($("light"), { opacity: 1 }, 7.02);

        // ================= SCENE 4 (7.4-12.352): process + table + band =================
        // zoom-through swap: road scene pushes past camera, production line settles in
        tl.fromTo($("sa"), { scale: 1, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.45, ease: "power2.in" }, 7.5);
        tl.fromTo($("sb"), { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 7.75);

        // conveyor runs to the end
        var T0 = 7.6, RUN = D - T0, DIST = 950;
        tl.fromTo($("ticks"), { x: 0 }, { x: -DIST, duration: RUN, ease: "none" }, T0);
        for (var q3 = 0; q3 < 9; q3++) {
          tl.fromTo($("rol-" + q3), { rotation: 0 }, { rotation: 720, duration: RUN, ease: "none" }, T0);
        }
        var PRESS_X = 540; // press centre in lane coords
        var stampN = 0;
        for (var b2 = 0; b2 < BASES.length; b2++) {
          tl.fromTo($("blk-" + b2), { x: 0 }, { x: DIST, duration: RUN, ease: "none" }, T0);
          var centre = BASES[b2] + 35;
          if (centre > PRESS_X) {
            gsap.set($("bf-" + b2), { scaleY: 1 });
            continue;
          }
          tl.fromTo($("bf-" + b2), { scaleY: 0 }, { scaleY: 0, duration: 0.01 }, 0);
          var T = T0 + (PRESS_X - centre) / (DIST / RUN);
          if (T > D - 0.3) continue;
          tl.fromTo($("ram"), { y: 0 }, { y: 54, duration: 0.18, ease: "power2.in", immediateRender: false }, T - 0.18);
          tl.to($("ram"), { y: 0, duration: 0.3, ease: "power2.out" }, T + 0.04);
          tl.fromTo($("bin-" + b2), { scaleY: 0.86, scaleX: 1.08 }, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, T);
          tl.fromTo($("bf-" + b2), { scaleY: 0 }, { scaleY: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, T);
          tl.set($("ml1"), { opacity: 0 }, T); tl.set($("ml1"), { opacity: 1 }, T + 0.12);
          // each stamped block writes one row in the table
          if (stampN < 4) {
            var RT = Math.max(T + 0.1, 8.3);
            tl.fromTo($("tb1-" + stampN), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, RT);
            tl.fromTo($("tb2-" + stampN), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, RT + 0.15);
            tl.fromTo($("tsf-" + stampN), { scale: 0 }, { scale: 1, duration: 0.35, ease: "power3.out" }, RT + 0.3);
          }
          stampN++;
        }

        // clipboard flips into the table
        tl.fromTo($("board"), { rotationY: 0 }, { rotationY: 90, transformPerspective: 1400, duration: 0.25, ease: "power2.in", immediateRender: false }, 7.6);
        tl.set($("check"), { opacity: 0 }, 7.85);
        tl.set($("table"), { opacity: 1 }, 7.85);
        tl.fromTo($("board"), { rotationY: -90 }, { rotationY: 0, transformPerspective: 1400, duration: 0.35, ease: "power3.out", immediateRender: false }, 7.85);
        tl.fromTo($("thead"), { clipPath: "inset(-30% 100% -15% -4%)" }, { clipPath: "inset(-30% -4% -15% -4%)", duration: 0.5, ease: "power3.out" }, 8.0);
        tl.fromTo($("trule"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 8.05);
        for (var tr2 = 0; tr2 < 4; tr2++) {
          tl.fromTo($("tr-" + tr2), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 8.1 + tr2 * 0.07);
        }

        // band: PENSAR NAS FALHAS ANTES (10.9) then hold
        tl.fromTo($("band"), { clipPath: "inset(-30% 100% -15% -4%)" }, { clipPath: "inset(-30% -4% -15% -4%)", duration: 0.55, ease: "power3.inOut" }, 10.9);
        tl.fromTo($("bandtxt"), { x: 40 }, { x: 0, duration: 0.6, ease: "power3.out" }, 11.0);
        tl.fromTo([$("bp1"), $("bp2")], { rotation: -90, scale: 0 }, { rotation: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 11.15);

        // pad the timeline to the full duration
        tl.set({}, {}, D);
      })();
    </script>
  </div>
</template>
