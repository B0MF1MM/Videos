    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        var D = 8.448;
        var $ = function (id) { return document.getElementById("11-ranking-" + id); };
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["11-ranking"] = tl;

        var CLIP_HIDE = "inset(-30% 100% -15% -4%)";
        var CLIP_SHOW = "inset(-30% -4% -15% -4%)";
        var MAX = 336;
        var PITCH = 170;

        // ---------- camera: slow continuous push ----------
        tl.fromTo($("cam"), { scale: 1 }, { scale: 1.03, duration: D, ease: "none" }, 0);

        // ---------- Scene 1 (0.0–2.2): header + headline ----------
        tl.fromTo($("hdrule"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, 0.05);
        ["hd-falha", "hd-npr"].forEach(function (k, i) {
          tl.fromTo($(k), { clipPath: CLIP_HIDE, y: 14 }, { clipPath: CLIP_SHOW, y: 0, duration: 0.5, ease: "power3.out" }, 0.15 + i * 0.08);
        });
        tl.fromTo($("tag"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.35);
        [0, 1, 2].forEach(function (i) {
          tl.fromTo($("div-" + i), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.25 + i * 0.1);
          tl.fromTo($("rk-" + i), { scale: 0, opacity: 0, rotation: -45 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "power3.out" }, 0.35 + i * 0.08);
        });
        // rank labels + fill wait for the sort
        tl.set([$("rkt-0"), $("rkt-1"), $("rkt-2")], { opacity: 0, scale: 0.4 }, 0);
        tl.set($("rkfill-0"), { scaleY: 0 }, 0);

        tl.fromTo($("w1"), { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 0.3);
        tl.fromTo($("w2"), { yPercent: 110 }, { yPercent: 0, duration: 0.65, ease: "power3.out" }, 1.3);
        tl.fromTo($("hlul"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 1.75);

        // "calcula o NPR" — NPR header flexes
        tl.to($("hd-npr"), { scale: 1.18, duration: 0.18, ease: "power2.out" }, 2.6);
        tl.to($("hd-npr"), { scale: 1, duration: 0.3, ease: "power2.inOut" }, 2.78);

        // ---------- Scene 2 (2.2–5.2): rows enter out of order, count + bars grow ----------
        var rows = [
          { k: "a", v: 120, at: 2.9 },
          { k: "b", v: 336, at: 3.4 },
          { k: "c", v: 45,  at: 3.9 }
        ];
        rows.forEach(function (r) {
          tl.fromTo($("row-" + r.k), { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, r.at);
          var right = (1 - r.v / MAX) * 100;
          tl.fromTo($("fill-" + r.k), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% " + right.toFixed(2) + "% 0% 0%)", duration: 0.8, ease: "power2.out" }, r.at + 0.15);
          var numEl = $("num-" + r.k);
          var proxy = { v: 0 };
          tl.fromTo(proxy, { v: 0 }, {
            v: r.v, duration: 0.8, ease: "power2.out",
            onUpdate: function () { var s = String(Math.round(proxy.v)); if (numEl.textContent !== s) numEl.textContent = s; }
          }, r.at + 0.15);
          tl.fromTo(numEl, { scale: 0.8 }, { scale: 1, duration: 0.8, ease: "power2.out", transformOrigin: "100% 60%" }, r.at + 0.15);
        });
        // lit copy bar already at full length (336/336)
        tl.set($("fill-bi"), { clipPath: "inset(-30% -4% -15% -4%)" }, 0);

        // comparison scanner sweeps the NPR column bottom → top
        tl.fromTo($("scan"), { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 4.45);
        tl.to($("scan"), { y: -PITCH, duration: 0.22, ease: "power3.inOut" }, 4.72);
        tl.to($("scan"), { y: -2 * PITCH, duration: 0.22, ease: "power3.inOut" }, 4.94);
        tl.fromTo($("scantick"), { x: 0 }, { x: -10, duration: 0.15, ease: "power2.out" }, 4.94);
        tl.to($("scan"), { opacity: 0, scale: 1.12, duration: 0.25, ease: "power2.in" }, 5.16);

        // ---------- Scene 3 (5.2–end): sort, invert, seal ----------
        // VAZAMENTO lifts right and climbs; RUÍDO ducks left and drops
        tl.to($("row-b"), { x: 70, scale: 1.03, duration: 0.18, ease: "power2.out" }, 5.2);
        tl.to($("row-b"), { y: -PITCH, duration: 0.42, ease: "power3.inOut" }, 5.26);
        tl.to($("row-b"), { x: 0, scale: 1, duration: 0.24, ease: "power3.out" }, 5.56);
        tl.to($("row-a"), { x: -40, scale: 0.97, duration: 0.18, ease: "power2.out" }, 5.2);
        tl.to($("row-a"), { y: PITCH, duration: 0.42, ease: "power3.inOut" }, 5.26);
        tl.to($("row-a"), { x: 0, scale: 1, duration: 0.24, ease: "power3.out" }, 5.56);
        // PINTURA confirms its place with a small nudge
        tl.to($("row-c"), { x: 18, duration: 0.14, ease: "power2.out" }, 5.4);
        tl.to($("row-c"), { x: 0, duration: 0.3, ease: "power3.out" }, 5.54);

        // podium ranks 1º 2º 3º
        [0, 1, 2].forEach(function (i) {
          tl.to($("rkt-" + i), { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 5.55 + i * 0.08);
        });
        tl.to($("rkfill-0"), { scaleY: 1, duration: 0.3, ease: "power3.out" }, 5.5);

        // "ataca primeiro" — VAZAMENTO row turns into an inverted block
        tl.fromTo($("inv"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(-30% -4% -15% -4%)", duration: 0.4, ease: "power3.inOut" }, 5.8);
        tl.set($("face-b"), { opacity: 0 }, 6.2);
        tl.fromTo($("num-bi"), { scale: 1 }, { scale: 1.12, duration: 0.16, ease: "power2.out", transformOrigin: "100% 60%" }, 6.2);
        tl.to($("num-bi"), { scale: 1, duration: 0.3, ease: "power2.inOut" }, 6.36);

        // seal springs in beside it
        tl.fromTo($("seal"), { scale: 0, opacity: 0, rotation: -24 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.55, ease: "back.out(1.7)" }, 6.0);
        tl.fromTo($("ring"), { scale: 1, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.05, ease: "none" }, 6.35);
        tl.to($("ring"), { scale: 1.4, opacity: 0, duration: 0.6, ease: "power2.out" }, 6.4);
        tl.fromTo($("arrow"), { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 6.25);

        // 1º square thumps
        tl.to($("rk-0"), { scale: 1.12, duration: 0.15, ease: "power2.out" }, 6.3);
        tl.to($("rk-0"), { scale: 1, duration: 0.35, ease: "power2.inOut" }, 6.45);

        // hold — keep the payoff alive (finite, deterministic nudges)
        var nudges = [6.9, 7.5, 8.05];
        nudges.forEach(function (t) {
          tl.to($("arrow"), { x: -12, duration: 0.18, ease: "power2.out" }, t);
          tl.to($("arrow"), { x: 0, duration: 0.3, ease: "power2.inOut" }, t + 0.18);
        });
        tl.to($("seal"), { rotation: -3, y: -6, duration: D - 6.6, ease: "sine.inOut" }, 6.6);
      })();
    </script>
