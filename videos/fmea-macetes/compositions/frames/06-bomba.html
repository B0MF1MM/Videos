    <script>
      (function () {
        var P = "06-bomba-";
        var $ = function (id) { return document.getElementById(P + id); };
        var D = 12.48;
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["06-bomba"] = tl;

        function mk(parent, id, css) {
          var d = document.createElement("div");
          d.id = P + id;
          d.className = "06-bomba-ink";
          d.setAttribute("style", css);
          parent.appendChild(d);
          return d;
        }

        // ---------- generated geometry ----------
        // flow squares in outlet (vertical) and inlet (horizontal)
        for (var i = 0; i < 37; i++) {
          mk($("outflow"), "of-" + i, "left:3px; top:" + (i * 40 + 12) + "px; width:14px; height:14px;");
          mk($("inflow"), "if-" + i, "left:" + (i * 40 + 12) + "px; top:3px; width:14px; height:14px;");
        }
        // leak drop schedule (pump): fast at first, then slow
        var DROPS = [6.8, 7.12, 7.44, 7.76, 8.45, 9.2, 9.95, 10.7, 11.45];
        for (var d1 = 0; d1 < DROPS.length; d1++) {
          mk($("drops"), "dr-" + d1, "left:341px; top:540px; width:16px; height:16px; transform-origin:50% 0%;");
        }
        // mini drops inside EFEITO link
        var MINI = [];
        for (var m = 6.95; m < D - 0.3; m += 0.55) MINI.push(m);
        for (var d2 = 0; d2 < MINI.length; d2++) {
          mk($("mdrops"), "md-" + d2, "left:92px; top:44px; width:16px; height:16px;");
        }

        // ---------- initial hidden states (seek-safe) ----------
        gsap.set($("callout"), { opacity: 0 });
        gsap.set($("puddle"), { scaleX: 0, opacity: 0 });
        gsap.set($("mpud"), { scaleX: 0 });
        gsap.set(["lt0a","lt0b","lt1a","lt1b","lt2a"].map($), { opacity: 0 });
        gsap.set(["man","book","miniseal"].map($), { opacity: 0 });
        gsap.set(["band","marker","w0","w1","w2","tempo","tk0","tk1","tk2"].map($), { opacity: 0 });

        // SVG transform origins (viewBox coords)
        gsap.set($("man"), { svgOrigin: "70 150" });
        gsap.set($("book"), { svgOrigin: "152 116" });
        gsap.set($("miniseal"), { svgOrigin: "96 78" });
        gsap.set($("tk0"), { svgOrigin: "920 740" });
        gsap.set($("tk1"), { svgOrigin: "1300 740" });
        gsap.set($("tk2"), { svgOrigin: "1680 740" });

        // macro camera push under everything
        tl.fromTo($("cam"), { scale: 1 }, { scale: 1.025, duration: D, ease: "none" }, 0);

        // ================= SCENE 1 (0-1.8): pump assembles =================
        tl.to($("floorline"), { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.0);
        tl.fromTo($("motor"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.05);
        tl.fromTo($("footm"), { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.1);
        tl.fromTo($("casing"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.fromTo($("footc"), { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.25);
        for (var f = 0; f < 5; f++) {
          tl.fromTo($("fin" + f), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 0.35 + f * 0.05);
        }
        tl.fromTo($("shaft"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.45);
        tl.fromTo($("seal"), { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power3.out" }, 0.55);
        tl.fromTo($("rotor"), { scale: 0 }, { scale: 1, duration: 0.45, ease: "power3.out" }, 0.55);
        tl.fromTo($("outlet"), { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.65);
        tl.fromTo($("outflange"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 0.95);
        tl.fromTo($("inlet"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.75);
        tl.fromTo($("inflange"), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power3.out" }, 1.05);
        // label (0.8)
        tl.fromTo($("labpip"), { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: "power3.out" }, 0.8);
        tl.fromTo($("labtxt"), { clipPath: "inset(-30% 100% -15% -4%)" }, { clipPath: "inset(-30% -4% -15% -4%)", duration: 0.55, ease: "power3.out" }, 0.85);
        // machine running: rotor spins, water flows, LED blinks
        tl.fromTo($("rotor"), { rotation: 0 }, { rotation: 360 * 12, duration: D - 0.9, ease: "none" }, 0.9);
        tl.fromTo($("outflow"), { y: 0 }, { y: -1200, duration: D - 1.0, ease: "none" }, 1.0);
        tl.fromTo($("inflow"), { x: 0 }, { x: -1200, duration: D - 1.0, ease: "none" }, 1.0);
