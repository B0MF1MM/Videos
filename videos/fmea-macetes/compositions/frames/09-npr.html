            cell.style.top = (gy * 21) + "px";
            var on = document.createElement("div");
            on.id = "09-npr-go-" + gy + "-" + gx;

        var letters = [$("l-s"), $("l-o"), $("l-d")];
        var marker = $("marker");
        function ambient(t) {
          // name types itself char by char, block caret blinks
          var n = t < T_TYPE0 ? 0 : Math.min(NAME.length, Math.floor((t - T_TYPE0) / (T_TYPE1 - T_TYPE0) * NAME.length) + 1);
          for (var i = 0; i < chars.length; i++) chars[i].style.opacity = i < n ? "1" : "0";

          // S O D idle bob once landed
          for (var k = 0; k < 3; k++) {
            var land = 0.85 + k * 0.3;
            var a = t < land ? 0 : Math.min(1, (t - land) / 0.6);

          }

          for (var g = 0; g < gOn.length; g++) {
            var cg = gOn[g];
            var start = T_GRID + cg.d * 0.045;
            var s = t < start ? 0 : Math.min(1, (t - start) / 0.18);
            var wave = t > T_GRID + 1.1 ? 0.12 * Math.max(0, Math.sin((t - T_GRID) * 5 - cg.d * 0.5)) : 0;

        tl.to($("plus-1"), { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 4.4);
        tl.to($("plus-2"), { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 4.52);

        tl.to($("strike-2"), { scaleX: 1, duration: 0.25, ease: "power2.out" }, 5.2);

        tl.set([$("plus-1"), $("strike-1")], { opacity: 0 }, 5.5);
        tl.set([$("plus-2"), $("strike-2")], { opacity: 0 }, 5.62);

        tl.fromTo($("times-2"), { scale: 0, opacity: 0, rotation: -90 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 5.62);

          tl.fromTo($("sq-" + q), { scale: 0, opacity: 0, x: SQX[q] }, { scale: 1, opacity: 1, x: SQX[q], duration: 0.4, ease: "power3.out" }, 4.5 + q * 0.07);

          tl.to($("sq-" + q), { opacity: 0.3, duration: 0.3, ease: "power2.out" }, 5.4);
        }
        tl.fromTo($("pl-slash"), { scaleX: 0, rotation: -18 }, { scaleX: 1, rotation: -18, duration: 0.28, ease: "power2.out" }, 5.15);
        tl.to($("pl-icon"), { opacity: 0.3, duration: 0.3, ease: "power2.out" }, 5.4);

        // right panel: multiplica -> grid area explodes (driven in ambient)
        tl.fromTo($("pr-icon"), { scale: 0, opacity: 0, rotation: -90 }, { scale: 0.5, opacity: 1, rotation: 0, duration: 0.45, ease: "power3.out" }, 5.45);

        // ---------- Scene 4 (6.6–8.427): scale 1 → 1.000 draws under the formula ----------
        tl.fromTo($("base"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 6.75);
        for (var sb = 0; sb < sBars.length; sb++) {
          tl.fromTo(sBars[sb], { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power3.out" }, T_SCALE + sb * 0.03);
        }
        tl.fromTo($("one"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 7.5);
        tl.fromTo($("mil"), { scale: 0, opacity: 0, transformOrigin: "0% 80%" }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 7.95);
        tl.fromTo($("mono"), { clipPath: CLIP_HIDE }, { clipPath: CLIP_SHOW, duration: 0.4, ease: "power3.out" }, 8.05);
      })();
