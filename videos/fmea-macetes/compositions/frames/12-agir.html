    <script>
      (function () {
        var D = 11.328;
        var $ = function (id) { return document.getElementById("12-agir-" + id); };
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["12-agir"] = tl;

        var CLIP_HIDE = "inset(-30% 100% -15% -4%)";
        var CLIP_SHOW = "inset(-30% -4% -15% -4%)";
        var CELLS = 10, VALS = [8, 7, 6];

        // build the 10 horizontal cells of each bar
        var on = [[], [], []];
        for (var r = 0; r < 3; r++) {
          var bar = $("bar-" + r);
          for (var k = 0; k < CELLS; k++) {
            var cell = document.createElement("div");
            cell.id = "12-agir-cell-" + r + "-" + k;
            cell.className = "12-agir-cell";
            cell.style.left = (10 + k * 80) + "px";
            var fill = document.createElement("div");
            fill.id = "12-agir-on-" + r + "-" + k;
            fill.className = "12-agir-on";
            cell.appendChild(fill);
            bar.appendChild(cell);
            on[r].push(fill);
          }
        }

        // number counter helper (O(1) onUpdate)
        function count(el, from, to, at, dur) {
          var proxy = { v: from };
          tl.fromTo(proxy, { v: from }, {
            v: to, duration: dur, ease: "power2.out", immediateRender: false,
            onUpdate: function () { var s = String(Math.round(proxy.v)); if (el.textContent !== s) el.textContent = s; }
          }, at);
        }

        // ---------- ambient life (deterministic, driven by timeline time) ----------
        var posterBob = $("poster-bob"), lensBob = $("lens-amb"), check = $("check");
        function ambient(t) {
          var py = 0, pr = 0;
          if (t >= 4.6) { py = Math.sin((t - 4.6) * 2.6) * 5; pr = Math.sin((t - 4.6) * 1.9) * 1.5; }
          posterBob.style.transform = "translate(0px," + py.toFixed(2) + "px) rotate(" + pr.toFixed(2) + "deg)";
          var ly = 0, lr = 0;
          if (t >= 7.5) { ly = Math.sin((t - 7.5) * 2.2) * 5; lr = Math.sin((t - 7.5) * 1.6) * 2; }
          lensBob.style.transform = "translate(0px," + ly.toFixed(2) + "px) rotate(" + lr.toFixed(2) + "deg)";
          // check mark ticks while scanning (5.4–6.6), steady afterwards
          var cy = (t >= 5.4 && t < 6.6) ? Math.sin((t - 5.4) * 18) * 2 : 0;
          check.setAttribute("transform", "translate(0 " + cy.toFixed(2) + ")");
        }
        ambient(0);
        tl.to({ v: 0 }, { v: 1, duration: D, ease: "none", onUpdate: function () { ambient(this.progress() * D); } }, 0);

        // camera: slow push-in under everything
        tl.fromTo($("cam"), { scale: 1 }, { scale: 1.025, duration: D, ease: "none" }, 0);

        // ---------- initial hidden states for later reveals ----------
        tl.fromTo($("poster"), { scale: 0, opacity: 0 }, { scale: 0, opacity: 0, duration: 0.01 }, 0);
        tl.fromTo($("lens"), { scale: 0, opacity: 0 }, { scale: 0, opacity: 0, duration: 0.01 }, 0);
        tl.fromTo($("hammer"), { scale: 0, opacity: 0, rotation: 12 }, { scale: 0, opacity: 0, rotation: 12, duration: 0.01 }, 0);
        tl.fromTo($("lock"), { scale: 0, opacity: 0 }, { scale: 0, opacity: 0, duration: 0.01 }, 0);
        tl.fromTo($("shackle"), { y: -36 }, { y: -36, duration: 0.01 }, 0);
        tl.fromTo($("stamp"), { scale: 0, rotation: -16 }, { scale: 0, rotation: -16, duration: 0.01 }, 0);
        tl.fromTo([$("label-o"), $("label-d"), $("cap")], { clipPath: CLIP_HIDE }, { clipPath: CLIP_HIDE, duration: 0.01 }, 0);
        tl.fromTo([$("lrule-o"), $("lrule-d")], { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
        tl.fromTo($("capsq"), { scale: 0 }, { scale: 0, duration: 0.01 }, 0);

        // ---------- Scene 1 (0.0–2.6): three bars fill to 8 / 7 / 6, title "Agir" ----------
        for (var r1 = 0; r1 < 3; r1++) {
          var at = 0.1 + r1 * 0.14;
          tl.fromTo($("letter-" + r1), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, at);
          tl.fromTo($("sep-" + r1), { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, at + 0.1);
          tl.fromTo($("val-" + r1), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, at + 0.15);
          tl.fromTo($("bar-" + r1), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, at);
          for (var k1 = 0; k1 < CELLS; k1++) {
            if (k1 < VALS[r1]) {
              tl.fromTo(on[r1][k1], { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power2.out" }, 0.55 + r1 * 0.14 + k1 * 0.09);
            } else {
              tl.fromTo(on[r1][k1], { scaleX: 0 }, { scaleX: 0, duration: 0.01 }, 0);
            }
          }
          count($("val-" + r1), 0, VALS[r1], 0.55 + r1 * 0.14, VALS[r1] * 0.09 + 0.16);
        }
        tl.fromTo($("title"), { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 1.4);

        // ---------- Scene 2 (2.6–5.0): poster 1-2-3 slams bar O, 7 → 3 ----------
        tl.to($("poster"), { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.9);
        tl.to($("poster"), { y: -16, rotation: -7, duration: 0.45, ease: "power2.out" }, 3.45);   // wind-up
        tl.to($("poster"), { y: 72, rotation: 0, duration: 0.14, ease: "power4.in" }, 3.9);        // slam
        tl.fromTo($("spark-o"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.08, ease: "power2.out", immediateRender: false }, 4.04);
        tl.to($("spark-o"), { opacity: 0, duration: 0.25, ease: "power2.in" }, 4.3);
        tl.fromTo($("bar-1"), { y: 0 }, { y: 8, duration: 0.06, ease: "power2.out", immediateRender: false }, 4.04);
        tl.to($("bar-1"), { y: 0, duration: 0.35, ease: "power3.out" }, 4.1);
        for (var i = 0; i < 4; i++) {

            { x: 26 + i * 16, y: 96 + i * 10, rotation: 24 + i * 12, opacity: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, 4.04 + i * 0.05);
        }
        count($("val-1"), 7, 3, 4.04, 0.36);
        tl.fromTo($("val-1"), { scale: 1 }, { scale: 1.28, duration: 0.12, ease: "power2.out", immediateRender: false }, 4.1);
        tl.to($("val-1"), { scale: 1, duration: 0.4, ease: "power3.out" }, 4.22);
        tl.to($("poster"), { y: 0, rotation: 0, duration: 0.5, ease: "power3.out" }, 4.2);         // lifts back to its lane
        tl.to($("label-o"), { clipPath: CLIP_SHOW, duration: 0.5, ease: "power3.out" }, 4.4);
        tl.to($("lrule-o"), { scaleX: 1, duration: 0.45, ease: "power3.out" }, 4.5);

        // ---------- Scene 3 (5.0–7.5): square magnifier scans bar D, 6 → 2 ----------
        tl.to($("lens"), { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 5.2);
        tl.fromTo($("lens-bob"), { x: 0, y: 0 }, { x: 400, duration: 0.8, ease: "sine.inOut", immediateRender: false }, 5.45);
        tl.to($("lens-bob"), { x: 245, duration: 0.45, ease: "power3.out" }, 6.25);
        tl.to($("lens"), { scale: 1.18, duration: 0.12, ease: "power2.out" }, 6.7);
        tl.to($("lens"), { scale: 1, duration: 0.3, ease: "power3.out" }, 6.82);
        for (var j = 0; j < 4; j++) {
          var kd = 5 - j; // cells 6,5,4,3 detected and removed
          tl.fromTo(on[2][kd], { y: 0, scale: 1, opacity: 1 },
            { y: -34, scale: 0.2, opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, 6.72 + j * 0.06);
        }
        count($("val-2"), 6, 2, 6.74, 0.34);
