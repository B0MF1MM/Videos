    <script>
      (function () {
        var D = 9.536;
        var $ = function (id) { return document.getElementById("02-nome-" + id); };
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["02-nome"] = tl;

        var CX = [660, 1010, 1360, 1710];
        // letter index -> phrase word index (F->Falha, M->Modos, E->Efeitos, A->Análise)
        var MAP = [4, 2, 7, 0];

        function placeLines() {
          var phrase = $("phrase");
          for (var i = 0; i < 4; i++) {
            var w = $("pw-" + MAP[i]);
            var x2 = 80 + w.offsetLeft + w.offsetWidth / 2;
            var y2 = 548 + 10;
            var ln = $("ln-" + i);
            ln.setAttribute("x1", CX[i]);
            ln.setAttribute("y1", 420);
            ln.setAttribute("x2", x2);
            ln.setAttribute("y2", y2);
            var tip = $("tip-" + i);
            tip.setAttribute("x", x2 - 5);
            tip.setAttribute("y", y2 - 5);
          }
        }
        placeLines();
        // keep line geometry exact every frame (fonts may settle after build)
        tl.to({ v: 0 }, { v: 1, duration: D, ease: "none", onUpdate: placeLines }, 0);

        // initial hidden states (set synchronously, deterministic)
        for (var k = 0; k < 4; k++) {
          gsap.set($("lit-" + k), { opacity: 0 });
          gsap.set($("pt-" + k), { opacity: 0 });
        }

        // slow camera push underneath everything
        tl.fromTo($("cam"), { scale: 1 }, { scale: 1.025, duration: D, ease: "none" }, 0);

        // ---------- Scene 1: blocks fall (0.0-0.9) ----------

          tl.fromTo($("blk-" + i),
            { y: -470, rotation: i % 2 ? 7 : -7 },
            { y: 0, rotation: 0, duration: 0.62, ease: "bounce.out" }, i * 0.09);
          tl.fromTo($("in-" + i),
            { scaleY: 0.9, scaleX: 1.06 },
            { scaleY: 1, scaleX: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, i * 0.09 + 0.3);
        }

        // english words + label (1.2)
        tl.fromTo($("lab-en"), { clipPath: "inset(-30% 100% -15% -4%)" }, { clipPath: "inset(-30% -4% -15% -4%)", duration: 0.5, ease: "power3.out" }, 1.2);
        for (var i = 0; i < 4; i++) {
          tl.fromTo($("wb-" + i), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.2 + i * 0.08);
          tl.fromTo($("en-" + i), { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.36 + i * 0.08);

        // ---------- Scene 2: phrase assembles word by word (2.2-4.6) ----------

        for (var j = 0; j < 8; j++) {
          tl.fromTo($("pw-" + j), { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, PT[j]);
        }
        // lines tie each letter to its word: A 2.2, M 2.7, F 3.2, E 3.9
        var LT = [3.2, 2.7, 3.9, 2.2];
        for (var i = 0; i < 4; i++) {
          tl.fromTo($("ln-" + i), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, LT[i]);
          tl.fromTo($("tip-" + i), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, LT[i] + 0.4);
          // the source letter nods as its line leaves
          tl.fromTo($("in-" + i), { y: 0 }, { y: -14, duration: 0.18, ease: "power2.out", immediateRender: false }, LT[i]);
          tl.fromTo($("in-" + i), { y: -14 }, { y: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, LT[i] + 0.18);

        // ---------- Scene 3: macete band + scan + swaps (4.6-9.536) ----------
        tl.fromTo($("band"), { clipPath: "inset(-30% 100% -15% -4%)" }, { clipPath: "inset(-30% -4% -15% -4%)", duration: 0.55, ease: "power3.inOut" }, 4.6);
        tl.fromTo($("bandtxt"), { x: 40 }, { x: 0, duration: 0.6, ease: "power3.out" }, 4.7);
        tl.fromTo($("pip"), { rotation: -90, scale: 0 }, { rotation: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 4.85);

        // scan marker visits F, M, E, A then returns to F
        tl.fromTo($("marker"), { scale: 1.35, opacity: 0, x: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 4.9);

        // left label: english struck, portuguese appears

        var ST = [7.6, 8.2, 8.6, 9.0];
        var MX = [0, 350, 700, 1050];

          var T = ST[i];
          if (i > 0) tl.to($("marker"), { x: MX[i], duration: 0.2, ease: "power3.inOut" }, T - 0.22);
